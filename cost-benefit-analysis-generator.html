<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Cost-Benefit Analysis & ROI Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap" rel="stylesheet">
<style>
/* ===== Talent Workspace UI (talent-ui.css) ===== */
:root{
  --font-sans:Inter, system-ui, -apple-system, sans-serif;
  --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:22px;--space-6:28px;--space-7:32px;--space-8:56px;
  --radius-sm:8px;--radius-md:10px;--radius-lg:12px;--radius-xl:14px;--radius-pill:999px;
  --bg:#F7F8FA;--surface:#FFFFFF;--surface-alt:#F1F3F5;--ink:#111827;--ink-soft:#5B6472;--line:#E5E7EB;--line-strong:#8A9099;
  --accent:#0F766E;--accent-hover:#0B5F58;--on-accent:#FFFFFF;--accent-soft:#E6F4F2;--focus-ring:rgba(15,118,110,0.25);
  --info:#1D4ED8;--info-soft:#EEF3FF;--warning:#B54708;--warning-soft:#FEF3E2;--error:#B42318;--error-soft:#FEECEB;
  --shadow-sm:0 1px 2px rgba(16,24,40,0.05);
  --shadow-card:0 1px 2px rgba(16,24,40,0.04), 0 6px 20px -4px rgba(16,24,40,0.07);
  --shadow-lift:0 2px 4px rgba(16,24,40,0.06), 0 10px 28px -6px rgba(16,24,40,0.12);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1113;--surface:#171B1F;--surface-alt:#1F2429;--ink:#ECEEF0;--ink-soft:#9AA3AD;--line:#2A3036;--line-strong:#6B747E;
    --accent:#3CC4B4;--accent-hover:#62D3C6;--on-accent:#04201C;--accent-soft:rgba(60,196,180,0.13);--focus-ring:rgba(60,196,180,0.3);
    --info:#8AB4F8;--info-soft:rgba(138,180,248,0.13);--warning:#F5B45C;--warning-soft:rgba(245,180,92,0.13);--error:#F28B82;--error-soft:rgba(242,139,130,0.13);
    --shadow-sm:0 1px 2px rgba(0,0,0,0.4);
    --shadow-card:0 1px 2px rgba(0,0,0,0.4), 0 8px 24px -6px rgba(0,0,0,0.5);
    --shadow-lift:0 2px 4px rgba(0,0,0,0.45), 0 12px 30px -6px rgba(0,0,0,0.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1113;--surface:#171B1F;--surface-alt:#1F2429;--ink:#ECEEF0;--ink-soft:#9AA3AD;--line:#2A3036;--line-strong:#6B747E;
  --accent:#3CC4B4;--accent-hover:#62D3C6;--on-accent:#04201C;--accent-soft:rgba(60,196,180,0.13);--focus-ring:rgba(60,196,180,0.3);
  --info:#8AB4F8;--info-soft:rgba(138,180,248,0.13);--warning:#F5B45C;--warning-soft:rgba(245,180,92,0.13);--error:#F28B82;--error-soft:rgba(242,139,130,0.13);
  --shadow-sm:0 1px 2px rgba(0,0,0,0.4);
  --shadow-card:0 1px 2px rgba(0,0,0,0.4), 0 8px 24px -6px rgba(0,0,0,0.5);
  --shadow-lift:0 2px 4px rgba(0,0,0,0.45), 0 12px 30px -6px rgba(0,0,0,0.6);
  color-scheme:dark;
}
*{box-sizing:border-box;}
.tw, body{background:var(--bg);color:var(--ink);font-family:var(--font-sans);-webkit-font-smoothing:antialiased;}
.tw h1,.tw h2,.tw h3{font-weight:650;letter-spacing:-.022em;margin:0;}
.eyebrow{display:inline-flex;align-items:center;gap:6px;color:var(--accent);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;margin-bottom:12px;}
.page-title{font-size:32px;line-height:1.15;font-weight:650;letter-spacing:-.022em;margin:0 0 12px;text-wrap:balance;}
.page-desc{color:var(--ink-soft);font-size:15.5px;line-height:1.6;max-width:620px;margin:0 0 36px;}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-xl);padding:var(--space-7);margin-bottom:20px;box-shadow:var(--shadow-card);color:var(--ink);}
.field{margin-bottom:var(--space-5);}
.field:last-child{margin-bottom:0;}
.field label{display:block;font-size:13px;font-weight:600;color:var(--ink);margin-bottom:var(--space-2);line-height:1.45;}
.hint{font-size:12.5px;color:var(--ink-soft);margin-top:6px;}
.tw input[type=text], .tw input[type=number], .tw textarea{
  width:100%;min-height:44px;font:400 14.5px var(--font-sans);color:var(--ink);
  background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--radius-md);
  padding:11px 14px;outline:none;transition:border-color .15s, box-shadow .15s;}
.tw input:hover, .tw textarea:hover{border-color:var(--ink-soft);}
.tw input:focus, .tw textarea:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--focus-ring);}
.tw ::placeholder{color:var(--ink-soft);opacity:1;}
.tw textarea{resize:vertical;min-height:96px;line-height:1.55;}
.tw input[type=number]{font-variant-numeric:tabular-nums;}
.btn{font:600 14px var(--font-sans);border-radius:var(--radius-md);padding:11px 20px;min-height:44px;
  border:1px solid transparent;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  transition:background .15s, box-shadow .15s, transform .15s, border-color .15s, color .15s;}
.btn-primary{background:var(--accent);color:var(--on-accent);box-shadow:var(--shadow-sm);}
.btn-primary:hover:not(:disabled){background:var(--accent-hover);transform:translateY(-1px);box-shadow:var(--shadow-lift);}
.btn-primary:active:not(:disabled){transform:none;}
.btn-secondary{background:var(--surface);color:var(--ink);border-color:var(--line-strong);box-shadow:var(--shadow-sm);}
.btn-secondary:hover:not(:disabled){background:var(--surface-alt);}
.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none;}
.btn:focus-visible{outline:none;box-shadow:0 0 0 4px var(--focus-ring);}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px 3px 8px;border-radius:var(--radius-pill);background:var(--surface-alt);color:var(--ink-soft);}
.badge::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;}
.badge.info{background:var(--info-soft);color:var(--info);}
.progress{padding:14px;border-radius:var(--radius-lg);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-sm);}
.progress-top{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:9px;}
.progress-top span:first-child{color:var(--ink-soft);font-weight:500;}
.progress-top span:last-child{color:var(--ink);font-weight:600;}
.progress-track{height:6px;border-radius:var(--radius-pill);background:var(--surface-alt);overflow:hidden;}
.progress-fill{height:100%;border-radius:var(--radius-pill);background:var(--accent);transition:width .5s cubic-bezier(.2,.8,.2,1);}
.steps{list-style:none;margin:0;padding:0;}
.step{display:flex;gap:12px;align-items:center;padding:9px 10px;border-radius:var(--radius-md);margin-bottom:2px;transition:background .15s, box-shadow .15s;}
.step.clickable{cursor:pointer;}
.step.clickable:hover{background:var(--surface-alt);}
.step.clickable:focus-visible{outline:none;box-shadow:0 0 0 4px var(--focus-ring);}
.step-num{width:24px;height:24px;border-radius:50%;flex-shrink:0;border:1.5px solid var(--line-strong);color:var(--ink-soft);font-size:11.5px;font-weight:600;display:flex;align-items:center;justify-content:center;}
.step-label{font-size:13.5px;color:var(--ink-soft);line-height:1.35;}
.step.active, .step.active.clickable:hover{background:var(--surface);box-shadow:var(--shadow-sm), inset 0 0 0 1px var(--line);}
.step.active .step-num{background:var(--accent);border-color:var(--accent);color:var(--on-accent);}
.step.active .step-label{color:var(--ink);font-weight:600;}
.step.done .step-num{background:var(--accent-soft);border-color:transparent;color:var(--accent);}
.step.done .step-label{color:var(--ink);}
.mobile-toggle{display:flex;align-items:center;gap:12px;flex:1;min-width:0;background:none;border:none;border-radius:var(--radius-md);padding:6px 8px 10px;text-align:left;cursor:pointer;color:var(--ink);font-family:var(--font-sans);}
.mobile-toggle:focus-visible{outline:none;box-shadow:0 0 0 4px var(--focus-ring);}
.mb-text{flex:1;min-width:0;display:flex;flex-direction:column;}
.mb-step{font-size:11.5px;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:.06em;}
.mb-label{font-size:15px;font-weight:600;letter-spacing:-.01em;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mb-chev{width:34px;height:34px;border-radius:var(--radius-md);flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--surface-alt);color:var(--ink-soft);transition:transform .2s;}
.mobile-toggle[aria-expanded="true"] .mb-chev svg{transform:rotate(180deg);}
.mb-progress{height:3px;background:var(--surface-alt);}
.mb-fill{height:100%;background:var(--accent);transition:width .5s cubic-bezier(.2,.8,.2,1);}

/* ===== Tool layout: 280px sticky sidebar + main column up to 940px ===== */
body{margin:0;}
.shell{display:grid;grid-template-columns:280px minmax(0,940px);gap:48px;max-width:1280px;margin:0 auto;padding-inline:32px;}
.sidebar{position:sticky;top:0;align-self:start;max-height:100vh;overflow-y:auto;padding-block:32px;display:flex;flex-direction:column;gap:20px;}
.main{padding-block:var(--space-8) 100px;min-width:0;}

.brand{display:flex;align-items:center;gap:10px;padding:0 4px 0 10px;}
.brand-tile{width:32px;height:32px;border-radius:var(--radius-md);background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.brand-name{flex:1;min-width:0;font-size:14px;font-weight:650;letter-spacing:-.01em;line-height:1.3;}
.icon-btn{width:34px;height:34px;border-radius:var(--radius-md);border:none;background:transparent;color:var(--ink-soft);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .15s,color .15s;}
.icon-btn:hover{background:var(--surface-alt);color:var(--ink);}
.icon-btn:focus-visible{outline:none;box-shadow:0 0 0 4px var(--focus-ring);}

/* Running total */
.total-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-xl);box-shadow:var(--shadow-card);padding:18px 18px 16px;}
.total-head{display:flex;justify-content:space-between;align-items:center;gap:10px;}
.total-title{font-size:14px;font-weight:650;letter-spacing:-.01em;}
.total-caption{font-size:12.5px;color:var(--ink-soft);margin:4px 0 12px;line-height:1.45;}
.total-line{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:8px 8px;margin:0 -8px;border-radius:var(--radius-sm);color:var(--ink-soft);}
.total-line .tl-amt{font-variant-numeric:tabular-nums;white-space:nowrap;}
.total-line.filled{color:var(--ink);cursor:pointer;}
.total-line.filled .tl-amt{font-weight:600;}
.total-line.filled:hover{background:var(--surface-alt);}
.total-line.filled:focus-visible{outline:none;box-shadow:0 0 0 4px var(--focus-ring);}
.total-line.active{color:var(--ink);font-weight:600;}
.total-net{display:flex;justify-content:space-between;align-items:baseline;gap:10px;border-top:1px solid var(--line);margin-top:10px;padding-top:12px;}
.total-net .tn-label{font-size:12.5px;font-weight:600;color:var(--ink-soft);}
.total-net .tn-amt{font-size:20px;font-weight:650;letter-spacing:-.01em;font-variant-numeric:tabular-nums;}
.neg{color:var(--error);}

/* Mobile header */
.mobile-header{display:none;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:var(--shadow-sm);}
.mh-row{display:flex;align-items:center;gap:6px;padding:8px 10px 0;}
.mh-row .icon-btn{margin-bottom:4px;}
.mb-menu{padding:4px 12px 12px;border-top:1px solid var(--line);}
.total-mobile{display:none;margin-top:24px;}

/* Step card */
.step-card{min-height:340px;display:flex;flex-direction:column;}
.enter{animation:fadeUp .32s ease-out both;}
@keyframes fadeUp{from{opacity:.001;transform:translateY(6px);}to{opacity:1;transform:none;}}
.card-eyebrow{color:var(--accent);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;margin-bottom:10px;}
.card-title{font-size:22px;line-height:1.25;margin:0 0 8px !important;text-wrap:balance;}
.card-help{color:var(--ink-soft);font-size:14.5px;line-height:1.6;margin:0 0 26px;max-width:620px;}
.gate-question{font-size:22px;font-weight:650;letter-spacing:-.022em;line-height:1.3;margin:0 0 10px;max-width:600px;text-wrap:balance;}
.gate-context{color:var(--ink-soft);font-size:14.5px;line-height:1.6;margin:0 0 26px;max-width:600px;}
.gate-question + .gate-buttons{margin-top:16px;}

.fields-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-5) 18px;}
.fields-grid .field{margin-bottom:0;}
.field.full,.field-note{grid-column:1 / -1;}
.field-note{font-size:13px;line-height:1.55;color:var(--ink-soft);background:var(--surface-alt);border-radius:var(--radius-md);padding:11px 14px;}
.unit{color:var(--ink-soft);font-weight:400;}
.input-wrap{position:relative;}
.input-wrap .prefix{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--ink-soft);font-size:14.5px;pointer-events:none;}
.tw .input-wrap.has-prefix input{padding-left:28px;}
.field .error{display:none;color:var(--error);font-size:12.5px;font-weight:500;margin-top:6px;}
.field.invalid .error{display:block;}
.tw .field.invalid input,.tw .field.invalid textarea{border-color:var(--error);}

.live-preview{margin-top:auto;padding-top:28px;}
.lp-box{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:var(--surface-alt);border-radius:var(--radius-md);padding:14px 16px;}
.lp-label{font-size:13px;font-weight:600;color:var(--ink-soft);}
.lp-value{font-size:20px;font-weight:650;letter-spacing:-.01em;font-variant-numeric:tabular-nums;color:var(--ink);}

/* Yes/no choices */
.gate-buttons{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;max-width:620px;}
.choice{display:flex;align-items:center;gap:14px;text-align:left;background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--radius-lg);padding:18px 18px 18px 20px;cursor:pointer;color:var(--ink);font-family:var(--font-sans);box-shadow:var(--shadow-sm);transition:border-color .15s, box-shadow .15s, transform .15s;}
.choice:hover{border-color:var(--accent);box-shadow:var(--shadow-card);transform:translateY(-1px);}
.choice:focus-visible{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--focus-ring);}
.choice .c-text{flex:1;min-width:0;}
.choice .c-title{display:block;font-size:15px;font-weight:600;letter-spacing:-.01em;}
.choice .c-sub{display:block;font-size:13px;color:var(--ink-soft);margin-top:3px;line-height:1.45;}
.choice .c-arrow{color:var(--ink-soft);flex-shrink:0;transition:color .15s;}
.choice:hover .c-arrow{color:var(--accent);}

/* Method cards */
.method-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:10px;}
.method-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:22px;display:flex;flex-direction:column;box-shadow:var(--shadow-sm);transition:box-shadow .2s;}
.method-card:hover{box-shadow:var(--shadow-card);}
.method-card h3{font-size:17px;margin:0 0 16px !important;}
.mc-label{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);margin-bottom:6px;}
.mc-text{font-size:13.5px;color:var(--ink);line-height:1.55;margin:0 0 16px;}
.mc-examples{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px;}
.mc-chip{font-size:12px;font-weight:500;background:var(--surface-alt);border-radius:var(--radius-pill);padding:4px 10px;color:var(--ink-soft);}
.method-card .btn{margin-top:auto;width:100%;}

/* Segmented choices */
.seg{display:flex;gap:8px;flex-wrap:wrap;}
.seg-btn{min-height:40px;padding:8px 16px;border-radius:var(--radius-pill);border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);font:500 13.5px var(--font-sans);cursor:pointer;transition:background .15s,border-color .15s,color .15s;}
.seg-btn:hover{background:var(--surface-alt);}
.seg-btn:focus-visible{outline:none;box-shadow:0 0 0 4px var(--focus-ring);}
.seg-btn.selected{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600;}
.period-custom-input{margin-top:10px;max-width:320px;}

/* Recap */
.recap-list{display:flex;flex-direction:column;}
.recap-row{display:flex;justify-content:space-between;gap:16px;padding:13px 0;border-bottom:1px solid var(--line);font-size:14.5px;}
.recap-row .rr-label{color:var(--ink-soft);}
.recap-row .rr-amt{font-variant-numeric:tabular-nums;font-weight:500;white-space:nowrap;}
.recap-total{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap;margin-top:18px;background:var(--surface-alt);border-radius:var(--radius-md);padding:16px 18px;}
.recap-total .rc-label{font-size:15px;font-weight:650;}
.recap-total .rc-amt{font-size:26px;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums;}

/* Task list */
.task-entry{border:1px solid var(--line);background:var(--surface);border-radius:var(--radius-lg);padding:18px 20px 20px;margin-bottom:12px;box-shadow:var(--shadow-sm);transition:box-shadow .2s,border-color .15s;}
.task-entry:hover{box-shadow:var(--shadow-card);}
.task-entry.invalid{border-color:var(--error);}
.task-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.task-num{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);}
.tl-remove{background:none;border:none;border-radius:var(--radius-sm);color:var(--ink-soft);font:600 13px var(--font-sans);cursor:pointer;padding:6px 10px;display:inline-flex;align-items:center;gap:6px;}
.tl-remove:hover,.tl-remove:focus-visible{color:var(--error);background:var(--error-soft);outline:none;}
.task-fields{display:grid;gap:16px;}
.task-fields .field{margin-bottom:0;}
.tf-row2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.add-task-btn{width:100%;padding:14px;border:1.5px dashed var(--line-strong);border-radius:var(--radius-lg);background:transparent;color:var(--ink-soft);font:600 14px var(--font-sans);cursor:pointer;transition:border-color .15s,color .15s,background .15s;}
.add-task-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);}
.add-task-btn:focus-visible{outline:none;box-shadow:0 0 0 4px var(--focus-ring);}
.optional{color:var(--ink-soft);font-weight:400;}

/* Summary */
.metric-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.metric{background:var(--surface-alt);border-radius:var(--radius-lg);padding:18px 20px;display:flex;flex-direction:column;gap:4px;}
.metric-label{font-size:13px;font-weight:600;color:var(--ink-soft);}
.metric-value{font-size:28px;font-weight:650;letter-spacing:-.022em;font-variant-numeric:tabular-nums;line-height:1.2;}
.metric-desc{font-size:13px;color:var(--ink-soft);line-height:1.5;margin:6px 0 0;}
.scope-note{margin-top:16px;padding:14px 16px;border:1px solid var(--line);border-radius:var(--radius-md);font-size:13.5px;color:var(--ink-soft);line-height:1.6;}
.scope-note + .scope-note{margin-top:8px;}

.nav-row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:var(--space-6);}
.nav-row [hidden]{display:none !important;}
.nav-spacer{flex:1;}

@media (max-width:800px){
  .shell{grid-template-columns:1fr;padding-inline:16px;gap:0;}
  .sidebar{display:none;}
  .mobile-header{display:block;}
  .main{padding-block:28px 64px;}
  .total-mobile{display:block;}
  .page-title{font-size:26px;}
  .page-desc{margin-bottom:24px;}
  .card{padding:22px 18px;}
  .fields-grid,.tf-row2,.method-grid,.metric-grid{grid-template-columns:1fr;}
  .tw input, .tw textarea{font-size:16px;min-height:48px;}
  .tw textarea{min-height:120px;}
  .btn{min-height:48px;}
  .nav-row .btn{flex:1 1 auto;}
  .card-title,.gate-question{font-size:20px;}
  .step-card{min-height:0;}
}
@media (prefers-reduced-motion:reduce){
  .tw *, .tw *::before, .tw *::after{animation:none !important;transition:none !important;}
}
</style>
</head>
<body>
<div class="tw" id="app">
  <header class="mobile-header" id="mobileHeader">
    <div class="mh-row">
      <button type="button" class="mobile-toggle" id="mbToggle" aria-expanded="false" aria-controls="mbMenu">
        <span class="mb-text"><span class="mb-step" id="mbStep"></span><span class="mb-label" id="mbLabel"></span></span>
        <span class="mb-chev"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></span>
      </button>
      <button type="button" class="icon-btn theme-toggle" aria-label="Switch theme"></button>
    </div>
    <div class="mb-menu" id="mbMenu" hidden><ul class="steps" id="mbSteps"></ul></div>
    <div class="mb-progress"><div class="mb-fill" id="mbFill" style="width:0%"></div></div>
  </header>

  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-tile"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></span>
        <span class="brand-name">Cost-Benefit &amp; ROI</span>
        <button type="button" class="icon-btn theme-toggle" aria-label="Switch theme"></button>
      </div>
      <div class="progress">
        <div class="progress-top"><span>Progress</span><span id="progressCount"></span></div>
        <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
      </div>
      <ul class="steps" id="sideSteps"></ul>
      <div class="total-card" id="receipt"></div>
    </aside>

    <main class="main">
      <span class="eyebrow">Cost Ledger &middot; Learning &amp; Development</span>
      <h1 class="page-title">Cost-Benefit Analysis &amp; ROI Generator</h1>
      <p class="page-desc">Answer a few questions about your learning solution, and we'll calculate the costs and benefits as you go.</p>

      <section class="card step-card" id="card"></section>
      <div class="nav-row">
        <button type="button" class="btn btn-secondary" id="backBtn">Back</button>
        <span class="nav-spacer"></span>
        <button type="button" class="btn btn-primary" id="nextBtn">Continue</button>
      </div>

      <div class="total-card total-mobile" id="receiptMobile"></div>
    </main>
  </div>
</div>

<script>
const ICON_SUN = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const ICON_MOON = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
const ICON_CHECK = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const ICON_ARROW = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';
const ICON_X = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';

/* Theme toggle */
function isDark(){
  const t = document.documentElement.getAttribute('data-theme');
  if(t) return t==='dark';
  return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
}
function paintThemeButtons(){
  const dark = isDark();
  document.querySelectorAll('.theme-toggle').forEach(b=>{
    b.innerHTML = dark ? ICON_SUN : ICON_MOON;
    b.setAttribute('aria-label', dark ? 'Switch to light mode' : 'Switch to dark mode');
    b.title = b.getAttribute('aria-label');
  });
}
document.querySelectorAll('.theme-toggle').forEach(b=> b.addEventListener('click', ()=>{
  document.documentElement.setAttribute('data-theme', isDark() ? 'light' : 'dark');
  paintThemeButtons();
}));
if(window.matchMedia){ try{ window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', paintThemeButtons); }catch(e){} }
paintThemeButtons();

const esc = (s) => String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const money = (n) => new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',minimumFractionDigits:2}).format(n||0);

const sectionOrder = ['background','delivery','dd','totalcost','benefits','roi'];
const sectionLabels = {
  background:'Background', delivery:'Delivery', dd:'Design & dev',
  totalcost:'Total cost', benefits:'Benefits', roi:'ROI'
};
const receiptLabels = { delivery:'Delivery cost', dd:'Design & development cost', totalcost:'Total cost', benefits:'Total benefits' };

let state = {
  values: {},
  costs: { delivery:null, dd:null, totalBenefits:null },
  calc: { hourlyRate:null, length:null, numParticipants:null },
  delivery: { salaryCost:0, benefits:0, lostProd:0, travel:0, otherAmt:0, otherName:'' },
  benefitMethod: null,
  history: ['bg']
};

function currentStep(){ return state.history[state.history.length-1]; }
function goTo(id){ state.history.push(id); render(true); }
function goBack(){ if(state.history.length>1){ state.history.pop(); render(true); } }

const sectionJumpTarget = {
  background:'bg', delivery:'delivery_benefits_gate', dd:'dd',
  totalcost:'total_cost_recap', benefits:'benefit_method_gate', roi:'roi_summary'
};
function jumpToSection(sec){
  const target = sectionJumpTarget[sec];
  if(!target) return;
  if(currentStep()===target) return;
  goTo(target);
}

function rate(salary, hrsWk, wksYr){
  const s=parseFloat(salary), h=parseFloat(hrsWk), w=parseFloat(wksYr);
  if(!s || !h || !w) return null;
  return s/(h*w);
}
function baseSalaryCost(){
  const v = state.values.bg || {};
  const r = rate(v.salary, v.hrsWk, v.wksYr);
  if(r==null || !v.length || !v.numParticipants) return 0;
  return r * parseFloat(v.numParticipants) * parseFloat(v.length);
}
function totalCostSoFar(){ return (state.costs.delivery||0) + (state.costs.dd||0); }

const STEPS = {
  bg: {
    section:'background', type:'calc',
    eyebrow:'Section 1 of 5',
    title:'Background data',
    help:"Tell us about the learning solution and who's completing it. We'll work out an hourly rate to use throughout the rest of this analysis.",
    fields:[
      {key:'length', label:'How long does it take a participant to complete the learning?', hintUnit:'hours', placeholder:'1'},
      {key:'numParticipants', label:'How many participants are targeted to complete the learning?', placeholder:'20'},
      {key:'salary', label:"Average annual salary of the participants (include the facilitator's salary in the average, if one is required)", prefix:'$', placeholder:'40000', full:true},
      {key:'hrsWk', label:'Hours participants typically work per week', placeholder:'40', note:'This isn’t related to the learning itself. We use this information to calculate an accurate hourly rate.'},
      {key:'wksYr', label:'Weeks participants typically work per year', placeholder:'50'}
    ],
    preview(v){
      const r = rate(v.salary, v.hrsWk, v.wksYr);
      return { label:'Participant hourly rate', display: r!=null ? `${money(r)}/hr` : '····' };
    },
    onSubmit(v){
      const r = rate(v.salary, v.hrsWk, v.wksYr);
      state.calc.hourlyRate = r;
      state.calc.length = parseFloat(v.length);
      state.calc.numParticipants = parseFloat(v.numParticipants);
    },
    next:'delivery_benefits_gate'
  },

  delivery_benefits_gate: {
    section:'delivery', type:'gate',
    eyebrow:'Section 2 of 5 · Delivery cost',
    question:'Do you want to include employee benefit costs?',
    context:'Employee benefits are estimated at 33% of salary costs and calculated automatically.',
    yesLabel:'Yes, include benefits', yesSub:'Adds 33% of salary costs',
    noLabel:'No', noSub:'Skip employee benefit costs',
    onYes(){ state.delivery.benefits = 0.33 * baseSalaryCost(); },
    onNo(){ state.delivery.benefits = 0; },
    yesNext:'delivery_lostprod_gate', noNext:'delivery_lostprod_gate'
  },
  delivery_lostprod_gate: {
    section:'delivery', type:'gate',
    eyebrow:'Section 2 of 5 · Delivery cost',
    question:'Do you want to include the cost of lost productivity while participants complete the learning?',
    context:'Lost productivity is estimated at 150% of salary costs and calculated automatically.',
    yesLabel:'Yes, include it', yesSub:'Adds 150% of salary costs',
    noLabel:'No', noSub:'Skip lost productivity costs',
    onYes(){ state.delivery.lostProd = 1.5 * baseSalaryCost(); },
    onNo(){ state.delivery.lostProd = 0; },
    yesNext:'delivery_travel_gate', noNext:'delivery_travel_gate'
  },
  delivery_travel_gate: {
    section:'delivery', type:'gate',
    eyebrow:'Section 2 of 5 · Delivery cost',
    question:'Do you want to include travel expenses?',
    yesLabel:'Yes, there was travel', yesSub:"We'll ask for the total",
    noLabel:'No travel expenses', noSub:'Skip to other expenses',
    onNo(){ state.delivery.travel = 0; },
    yesNext:'delivery_travel_fields', noNext:'delivery_other_gate'
  },
  delivery_travel_fields: {
    section:'delivery', type:'calc',
    eyebrow:'Section 2 of 5 · Delivery cost',
    title:'Travel expenses',
    help:'Enter the total travel cost for this learning solution.',
    fields:[ {key:'total', label:'Total travel expenses', prefix:'$', placeholder:'0', full:true} ],
    preview(v){ return { label:'Total travel expenses', display: v.total ? money(parseFloat(v.total)) : '····' }; },
    onSubmit(v){ state.delivery.travel = parseFloat(v.total); },
    next:'delivery_other_gate'
  },
  delivery_other_gate: {
    section:'delivery', type:'gate',
    eyebrow:'Section 2 of 5 · Delivery cost',
    question:'Are there any other expenses you would like to include?',
    yesLabel:'Yes, there are others', yesSub:"We'll ask for the details",
    noLabel:'No other expenses', noSub:'Review delivery cost total',
    onNo(){ state.delivery.otherAmt = 0; state.delivery.otherName=''; },
    yesNext:'delivery_other_fields', noNext:'delivery_recap'
  },
  delivery_other_fields: {
    section:'delivery', type:'calc',
    eyebrow:'Section 2 of 5 · Delivery cost',
    title:'Other expenses',
    help:'Tell us what the expense is and its total cost.',
    fields:[
      {key:'name', label:'Expense name', type:'text', placeholder:'e.g., Printed workbooks', full:true},
      {key:'cost', label:'Total cost', prefix:'$', placeholder:'0', full:true}
    ],
    preview(v){ return { label:'Other expenses', display: v.cost ? money(parseFloat(v.cost)) : '····' }; },
    onSubmit(v){ state.delivery.otherAmt = parseFloat(v.cost); state.delivery.otherName = v.name||''; },
    next:'delivery_recap'
  },

  delivery_recap: {
    section:'delivery', type:'recap',
    eyebrow:'Section 2 of 5 · Delivery cost',
    title:'Delivery cost',
    help:"Here's how the total delivery cost breaks down, calculated automatically from your answers.",
    rows(){
      const d = state.delivery;
      return [
        ['Salary of employees to be trained', d.salaryCost],
        ['Employee benefit costs', d.benefits],
        ['Lost production / replacement cost', d.lostProd],
        ['Travel expenses', d.travel],
        [d.otherName ? `Other expenses (${esc(d.otherName)})` : 'Other expenses', d.otherAmt]
      ];
    },
    totalLabel:'Total delivery cost',
    onEnter(){ state.delivery.salaryCost = baseSalaryCost(); },
    total(){ const d=state.delivery; return d.salaryCost+d.benefits+d.lostProd+d.travel+d.otherAmt; },
    onSubmit(){ state.costs.delivery = STEPS.delivery_recap.total(); },
    next:'dd'
  },

  dd: {
    section:'dd', type:'calc',
    eyebrow:'Section 3 of 5',
    title:'Design & development cost',
    help:"Enter what it cost to design and develop this learning solution. If you need help calculating this, the Learning Development Cost Generator can walk you through it.",
    fields:[ {key:'cost', label:'Design & development cost', prefix:'$', placeholder:'13000', full:true} ],
    preview(v){ return { label:'Design & development cost', display: v.cost ? money(parseFloat(v.cost)) : '····' }; },
    onSubmit(v){ state.costs.dd = parseFloat(v.cost); },
    next:'total_cost_recap'
  },

  total_cost_recap: {
    section:'totalcost', type:'recap',
    eyebrow:'Section 3 of 5',
    title:'Total cost of design, development & delivery',
    help:"This is the full investment required for this learning solution so far.",
    rows(){
      return [
        ['Delivery cost', state.costs.delivery],
        ['Design & development cost', state.costs.dd]
      ];
    },
    totalLabel:'Total cost',
    total(){ return totalCostSoFar(); },
    onSubmit(){},
    next:'benefit_method_gate'
  },

  benefit_method_gate: {
    section:'benefits', type:'method_select',
    eyebrow:'Section 4 of 5 · Benefits',
    question:'How would you like to calculate the benefits of this learning solution?',
    options:[
      {
        key:'participant', label:'Benefits by participant',
        bestFor:'Learning where the financial impact can be attributed to each participant who applies what they learned.',
        examples:['Time saved','Productivity gains','Error reductions','Sales performance','Onboarding'],
        useWhen:'You can estimate the financial benefit generated by one participant and determine how many participants successfully applied the learning.',
        onSelect(){ state.benefitMethod = 'participant'; },
        next:'task_list'
      },
      {
        key:'overall', label:'Overall benefits',
        bestFor:'Learning where the business impact is measured at the team, department, program, or organizational level and cannot reasonably be attributed to individual participants.',
        examples:['Turnover reduction','Revenue growth','Customer outcomes','Compliance','Large-scale change','Leadership development'],
        useWhen:'You know the total financial impact associated with the learning solution, but it would be difficult or misleading to assign that benefit to individual participants.',
        onSelect(){ state.benefitMethod = 'overall'; },
        next:'overall_fields'
      }
    ]
  },

  task_list: {
    section:'benefits', type:'tasklist',
    eyebrow:'Section 4 of 5 · Benefits by participant',
    title:'What tasks were taught?',
    help:'Add each task taught through the learning, the measurable business benefit it produced, and its estimated dollar value per participant. Add as many tasks as apply. We’ll add up the values.',
    next:'bp_fields'
  },
  bp_fields: {
    section:'benefits', type:'calc',
    eyebrow:'Section 4 of 5 · Benefits by participant',
    title:'Participants',
    help:'Tell us how many participants were involved, and over what period these benefits are measured.',
    fields:[
      {key:'completed', label:'How many participants completed the learning?', placeholder:'50'},
      {key:'applied', label:'How many participants successfully applied what they learned?', placeholder:'40'},
      {key:'period', label:'Over what period were or will these benefits be measured?', type:'period', full:true}
    ],
    preview(v){
      const perParticipant = (state.values.task_list && state.values.task_list.tasks || []).reduce((s,t)=> s + (parseFloat(t.value)||0), 0);
      const applied = parseFloat(v.applied);
      const total = (applied && perParticipant) ? perParticipant*applied : null;
      return { label:'Total benefits of training', display: total!=null ? money(total) : '····' };
    },
    onSubmit(v){
      const tasks = (state.values.task_list && state.values.task_list.tasks) || [];
      const perParticipant = tasks.reduce((s,t)=> s + (parseFloat(t.value)||0), 0);
      const savedPerParticipant = tasks.filter(t=>t.valueType==='saved').reduce((s,t)=> s + (parseFloat(t.value)||0), 0);
      const generatedPerParticipant = tasks.filter(t=>t.valueType==='generated').reduce((s,t)=> s + (parseFloat(t.value)||0), 0);
      const applied = parseFloat(v.applied);
      state.benefitPerParticipant = perParticipant;
      state.costs.totalBenefits = perParticipant * applied;
      state.benefitBreakdown = { saved: savedPerParticipant*applied, generated: generatedPerParticipant*applied };
      state.benefitPeriod = v.period==='custom' ? (v.periodCustom||'Custom') : v.period;
    },
    next:'roi_summary'
  },

  overall_fields: {
    section:'benefits', type:'calc',
    eyebrow:'Section 4 of 5 · Overall benefits',
    title:'Overall benefits',
    help:'Tell us about the measurable business benefit this learning solution produced across the organization.',
    fields:[
      {key:'tasks', label:'What task(s) were taught through the learning?', type:'textarea', full:true},
      {key:'benefit', label:'What measurable business benefit resulted from the learning solution?', type:'textarea', full:true},
      {key:'valueType', label:'This value is…', type:'valuetype', full:true},
      {key:'value', label:'What is the total estimated dollar value of the benefit?', prefix:'$', placeholder:'18000', full:true},
      {key:'period', label:'Over what period were or will these benefits be measured?', type:'period', full:true}
    ],
    preview(v){ return { label:'Total benefits of training', display: v.value ? money(parseFloat(v.value)) : '····' }; },
    onSubmit(v){
      const total = parseFloat(v.value);
      state.costs.totalBenefits = total;
      state.benefitBreakdown = {
        saved: v.valueType==='generated' ? 0 : total,
        generated: v.valueType==='generated' ? total : 0
      };
      state.benefitPeriod = v.period==='custom' ? (v.periodCustom||'Custom') : v.period;
    },
    next:'roi_summary'
  },

  roi_summary: { section:'roi', type:'summary' }
};

function sectionResolved(sec){
  if(sec==='background') return state.calc.hourlyRate!=null;
  if(sec==='delivery') return state.costs.delivery!=null;
  if(sec==='dd') return state.costs.dd!=null;
  if(sec==='totalcost') return sectionResolved('delivery') && sectionResolved('dd');
  if(sec==='benefits') return state.costs.totalBenefits!=null;
  if(sec==='roi') return sectionResolved('totalcost') && sectionResolved('benefits');
  return false;
}

/* Sidebar steps, progress bar and mobile header */
function stepsHTML(curSection){
  return sectionOrder.map((sec,i)=>{
    const active = sec===curSection;
    const done = !active && sectionResolved(sec);
    const cls = active ? 'active' : (done ? 'done clickable' : '');
    const mark = done ? ICON_CHECK : (sec==='roi' ? '★' : (i+1));
    const attrs = done ? ` tabindex="0" role="button"` : (active ? ' aria-current="step"' : '');
    return `<li class="step ${cls}" data-section="${sec}"${attrs}><span class="step-num">${mark}</span><span class="step-label">${sectionLabels[sec]}</span></li>`;
  }).join('');
}
function wireSteps(root){
  root.querySelectorAll('.step.clickable').forEach(node=>{
    const go = ()=>{ closeMobileMenu(); jumpToSection(node.getAttribute('data-section')); };
    node.addEventListener('click', go);
    node.addEventListener('keydown', e=>{ if(e.key==='Enter' || e.key===' '){ e.preventDefault(); go(); } });
  });
}
function renderProgress(){
  const curSection = STEPS[currentStep()].section;
  const side = document.getElementById('sideSteps');
  const mb = document.getElementById('mbSteps');
  side.innerHTML = stepsHTML(curSection); wireSteps(side);
  mb.innerHTML = stepsHTML(curSection); wireSteps(mb);
  const doneCount = sectionOrder.filter(s=> sectionResolved(s)).length;
  const pct = Math.round(doneCount/sectionOrder.length*100);
  document.getElementById('progressCount').textContent = `${doneCount} of ${sectionOrder.length} complete`;
  document.getElementById('progressFill').style.width = pct+'%';
  document.getElementById('mbFill').style.width = pct+'%';
  const idx = sectionOrder.indexOf(curSection);
  document.getElementById('mbStep').textContent = `Step ${idx+1} of ${sectionOrder.length}`;
  document.getElementById('mbLabel').textContent = sectionLabels[curSection];
}
const mbToggle = document.getElementById('mbToggle');
const mbMenu = document.getElementById('mbMenu');
function closeMobileMenu(){ mbMenu.hidden = true; mbToggle.setAttribute('aria-expanded','false'); }
mbToggle.addEventListener('click', ()=>{
  const open = mbMenu.hidden;
  mbMenu.hidden = !open;
  mbToggle.setAttribute('aria-expanded', open ? 'true' : 'false');
});

/* Running total */
function renderReceipt(){
  const totalCostVal = sectionResolved('totalcost') ? totalCostSoFar() : null;
  const combined = { delivery: state.costs.delivery, dd: state.costs.dd, totalcost: totalCostVal, benefits: state.costs.totalBenefits };
  const curSection = STEPS[currentStep()].section;
  const allDone = sectionResolved('roi');
  const runningCost = totalCostVal!=null ? totalCostVal : ((state.costs.delivery||0)+(state.costs.dd||0));
  const net = (state.costs.totalBenefits||0) - runningCost;
  const lines = Object.keys(receiptLabels).map(k=>{
    const val = combined[k];
    const filled = val!=null;
    const activeCls = (k===curSection && !filled) ? 'active' : '';
    const amt = filled ? money(val) : '····';
    return `<div class="total-line ${filled?'filled':''} ${activeCls}" data-section="${k}"${filled?' tabindex="0" role="button"':''}><span>${receiptLabels[k]}</span><span class="tl-amt">${amt}</span></div>`;
  }).join('');
  const html = `
    <div class="total-head"><span class="total-title">Running total</span><span class="badge ${allDone?'info':''}">${allDone?'Complete':'In progress'}</span></div>
    <div class="total-caption">Design, development, delivery &amp; benefits</div>
    ${lines}
    <div class="total-net"><span class="tn-label">${allDone?'Net benefit':'Net position so far'}</span><span class="tn-amt ${net<0?'neg':''}">${money(net)}</span></div>
  `;
  ['receipt','receiptMobile'].forEach(id=>{
    const el = document.getElementById(id);
    el.hidden = (curSection==='roi');
    el.innerHTML = html;
    el.querySelectorAll('.total-line.filled').forEach(node=>{
      const go = ()=> jumpToSection(node.getAttribute('data-section'));
      node.addEventListener('click', go);
      node.addEventListener('keydown', e=>{ if(e.key==='Enter' || e.key===' '){ e.preventDefault(); go(); } });
    });
  });
}

const PERIODS = [ ['3','3 months'], ['6','6 months'], ['12','12 months'], ['custom','Custom'] ];
const VALUE_TYPES = [ ['saved','Dollars saved'], ['generated','Dollars generated'] ];

function renderValueTypeField(f, v){
  const cur = v[f.key] || 'saved';
  return `
    <div class="field full" data-key="${f.key}">
      <label>${f.label}</label>
      <div class="seg" role="group" aria-label="${esc(f.label)}">
        ${VALUE_TYPES.map(p=>`<button type="button" class="seg-btn vt-btn ${cur===p[0]?'selected':''}" aria-pressed="${cur===p[0]}" data-key="${f.key}" data-value="${p[0]}">${p[1]}</button>`).join('')}
      </div>
    </div>`;
}
function renderPeriodField(f, v){
  const cur = v.period || '';
  return `
    <div class="field full" data-key="${f.key}">
      <label>${f.label}</label>
      <div class="seg" id="periodSelect" role="group" aria-label="${esc(f.label)}">
        ${PERIODS.map(p=>`<button type="button" class="seg-btn ${cur===p[0]?'selected':''}" aria-pressed="${cur===p[0]}" data-period="${p[0]}">${p[1]}</button>`).join('')}
      </div>
      ${cur==='custom' ? `<div class="period-custom-input"><input type="text" id="f-periodCustom" placeholder="e.g., 18 months" value="${esc(v.periodCustom||'')}"></div>` : ''}
      <div class="error">Select a time period.</div>
    </div>`;
}
function renderFieldHTML(f, v){
  if(f.type==='period') return renderPeriodField(f, v);
  if(f.type==='valuetype'){ if(v[f.key]===undefined) v[f.key]='saved'; return renderValueTypeField(f, v); }
  const val = v[f.key]!==undefined ? v[f.key] : '';
  let inputHTML;
  if(f.type==='text'){
    inputHTML = `<input type="text" id="f-${f.key}" placeholder="${esc(f.placeholder||'')}" value="${esc(val)}">`;
  } else if(f.type==='textarea'){
    inputHTML = `<textarea id="f-${f.key}" placeholder="${esc(f.placeholder||'')}">${esc(val)}</textarea>`;
  } else {
    inputHTML = `
      <div class="input-wrap ${f.prefix?'has-prefix':''}">
        ${f.prefix?`<span class="prefix">${f.prefix}</span>`:''}
        <input type="number" inputmode="decimal" min="0" step="any" id="f-${f.key}" placeholder="${esc(f.placeholder||'')}" value="${esc(val)}">
      </div>`;
  }
  return `
    ${f.note?`<div class="field-note">${f.note}</div>`:''}
    <div class="field ${f.full?'full':''}" data-key="${f.key}">
      <label for="f-${f.key}">${f.label}${f.hintUnit?` <span class="unit">(${f.hintUnit})</span>`:''}</label>
      ${inputHTML}
      ${f.hint?`<div class="hint">${f.hint}</div>`:''}
      <div class="error">Enter a value of 0 or more.</div>
    </div>`;
}

function wirePeriodButtons(id){
  const container = document.getElementById('periodSelect');
  if(!container) return;
  container.querySelectorAll('.seg-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const cur = state.values[id] || {};
      cur.period = btn.getAttribute('data-period');
      state.values[id] = cur;
      renderCard(false);
    });
  });
}
function wireValueTypeButtons(id){
  document.querySelectorAll('.vt-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const cur = state.values[id] || {};
      cur[btn.getAttribute('data-key')] = btn.getAttribute('data-value');
      state.values[id] = cur;
      renderCard(false);
    });
  });
}

let taskIdCounter = 1;
function renderCard(animate){
  const id = currentStep();
  const step = STEPS[id];
  const card = document.getElementById('card');
  const nextBtn = document.getElementById('nextBtn');
  const backBtn = document.getElementById('backBtn');
  backBtn.style.visibility = state.history.length>1 ? 'visible' : 'hidden';
  nextBtn.hidden = false;
  nextBtn.textContent = 'Continue';
  card.classList.remove('enter');
  if(animate){ void card.offsetWidth; card.classList.add('enter'); }

  if(step.type==='method_select'){
    card.innerHTML = `
      <div class="card-eyebrow">${step.eyebrow}</div>
      <p class="gate-question">${step.question}</p>
      <div class="method-grid">
        ${step.options.map(opt=>`
          <div class="method-card" data-key="${opt.key}">
            <h3>${opt.label}</h3>
            <div class="mc-label">Best for</div>
            <p class="mc-text">${opt.bestFor}</p>
            <div class="mc-examples">${opt.examples.map(ex=>`<span class="mc-chip">${ex}</span>`).join('')}</div>
            <div class="mc-label">Use this method when</div>
            <p class="mc-text">${opt.useWhen}</p>
            <button type="button" class="btn btn-secondary mc-select" data-key="${opt.key}">Choose this method</button>
          </div>`).join('')}
      </div>`;
    nextBtn.hidden = true;
    card.querySelectorAll('.mc-select').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const opt = step.options.find(o=> o.key === btn.getAttribute('data-key'));
        opt.onSelect();
        goTo(opt.next);
      });
    });
    renderProgress(); renderReceipt();
    return;
  }

  if(step.type==='gate'){
    card.innerHTML = `
      <div class="card-eyebrow">${step.eyebrow}</div>
      <p class="gate-question">${step.question}</p>
      ${step.context?`<p class="gate-context">${step.context}</p>`:''}
      <div class="gate-buttons">
        <button type="button" class="choice" id="gYes"><span class="c-text"><span class="c-title">${step.yesLabel}</span><span class="c-sub">${step.yesSub}</span></span><span class="c-arrow">${ICON_ARROW}</span></button>
        <button type="button" class="choice" id="gNo"><span class="c-text"><span class="c-title">${step.noLabel}</span><span class="c-sub">${step.noSub}</span></span><span class="c-arrow">${ICON_ARROW}</span></button>
      </div>`;
    nextBtn.hidden = true;
    document.getElementById('gYes').onclick = ()=>{ if(step.onYes) step.onYes(); goTo(step.yesNext); };
    document.getElementById('gNo').onclick = ()=>{ if(step.onNo) step.onNo(); goTo(step.noNext); };
    renderProgress(); renderReceipt();
    return;
  }

  if(step.type==='recap'){
    if(step.onEnter) step.onEnter();
    const rows = step.rows();
    const total = step.total();
    card.innerHTML = `
      <div class="card-eyebrow">${step.eyebrow}</div>
      <h2 class="card-title">${step.title}</h2>
      <p class="card-help">${step.help}</p>
      <div class="recap-list">
        ${rows.map(r=>`<div class="recap-row"><span class="rr-label">${r[0]}</span><span class="rr-amt">${money(r[1])}</span></div>`).join('')}
      </div>
      <div class="recap-total">
        <span class="rc-label">${step.totalLabel}</span>
        <span class="rc-amt">${money(total)}</span>
      </div>`;
    nextBtn.onclick = ()=>{ step.onSubmit(); goTo(step.next); };
    renderProgress(); renderReceipt();
    return;
  }

  if(step.type==='tasklist'){
    if(!state.values.task_list) state.values.task_list = { tasks:[{id:taskIdCounter++, name:'', benefit:'', value:'', valueType:'saved'}] };
    const tasks = state.values.task_list.tasks;
    const sum = tasks.reduce((s,t)=> s + (parseFloat(t.value)||0), 0);
    card.innerHTML = `
      <div class="card-eyebrow">${step.eyebrow}</div>
      <h2 class="card-title">${step.title}</h2>
      <p class="card-help">${step.help}</p>
      <div id="taskRows">
        ${tasks.map((t,i)=>`
          <div class="task-entry" data-id="${t.id}">
            <div class="task-top">
              <span class="task-num">Task ${i+1}</span>
              ${tasks.length>1?`<button type="button" class="tl-remove" data-remove="${t.id}" aria-label="Remove task ${i+1}">${ICON_X} Remove</button>`:''}
            </div>
            <div class="task-fields">
              <div class="field">
                <label for="tl-name-${t.id}">Task taught</label>
                <input type="text" id="tl-name-${t.id}" class="tl-name" data-id="${t.id}" placeholder="e.g., Handling refund requests" value="${esc(t.name)}">
              </div>
              <div class="field">
                <label for="tl-benefit-${t.id}">Measurable business benefit <span class="optional">(optional)</span></label>
                <input type="text" id="tl-benefit-${t.id}" class="tl-benefit" data-id="${t.id}" placeholder="e.g., Fewer escalations" value="${esc(t.benefit)}">
              </div>
              <div class="tf-row2">
                <div class="field">
                  <label>This value is&hellip;</label>
                  <div class="seg">
                    <button type="button" class="seg-btn tl-type-btn ${t.valueType==='saved'?'selected':''}" aria-pressed="${t.valueType==='saved'}" data-id="${t.id}" data-type="saved">Dollars saved</button>
                    <button type="button" class="seg-btn tl-type-btn ${t.valueType==='generated'?'selected':''}" aria-pressed="${t.valueType==='generated'}" data-id="${t.id}" data-type="generated">Dollars generated</button>
                  </div>
                </div>
                <div class="field">
                  <label for="tl-value-${t.id}">Dollar value per participant</label>
                  <div class="input-wrap has-prefix"><span class="prefix">$</span>
                    <input type="number" inputmode="decimal" min="0" step="any" id="tl-value-${t.id}" class="tl-value" data-id="${t.id}" placeholder="450" value="${esc(t.value)}">
                  </div>
                </div>
              </div>
            </div>
          </div>`).join('')}
      </div>
      <button type="button" class="add-task-btn" id="addTaskBtn">+ Add another task</button>
      <div class="live-preview">
        <div class="lp-box"><span class="lp-label">Benefit per participant</span><span class="lp-value" id="tlSum">${money(sum)}</span></div>
      </div>`;

    function syncFromDOM(){
      document.querySelectorAll('.tl-name').forEach(inp=>{ const t = tasks.find(x=>x.id==inp.getAttribute('data-id')); if(t) t.name = inp.value; });
      document.querySelectorAll('.tl-benefit').forEach(inp=>{ const t = tasks.find(x=>x.id==inp.getAttribute('data-id')); if(t) t.benefit = inp.value; });
      document.querySelectorAll('.tl-value').forEach(inp=>{ const t = tasks.find(x=>x.id==inp.getAttribute('data-id')); if(t) t.value = inp.value; });
    }
    card.querySelectorAll('.tl-type-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        syncFromDOM();
        const t = tasks.find(x=> String(x.id)===btn.getAttribute('data-id'));
        if(t) t.valueType = btn.getAttribute('data-type');
        renderCard(false);
      });
    });
    card.querySelectorAll('.tl-name,.tl-benefit,.tl-value').forEach(inp=>{
      inp.addEventListener('input', ()=>{
        syncFromDOM();
        const row = inp.closest('.task-entry'); if(row) row.classList.remove('invalid');
        const s = tasks.reduce((s,t)=> s + (parseFloat(t.value)||0), 0);
        document.getElementById('tlSum').textContent = money(s);
      });
    });
    card.querySelectorAll('[data-remove]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        syncFromDOM();
        const rid = btn.getAttribute('data-remove');
        state.values.task_list.tasks = tasks.filter(t=> String(t.id)!==rid);
        renderCard(false);
      });
    });
    document.getElementById('addTaskBtn').onclick = ()=>{
      syncFromDOM();
      tasks.push({id:taskIdCounter++, name:'', benefit:'', value:'', valueType:'saved'});
      renderCard(false);
      const last = tasks[tasks.length-1];
      const inp = document.getElementById('tl-name-'+last.id); if(inp) inp.focus();
    };

    nextBtn.onclick = ()=>{
      syncFromDOM();
      let ok = true;
      tasks.forEach(t=>{
        const row = card.querySelector(`.task-entry[data-id="${t.id}"]`);
        const nameOk = t.name && t.name.trim()!=='';
        const valOk = t.value!=='' && !isNaN(parseFloat(t.value)) && parseFloat(t.value)>=0;
        if(!nameOk || !valOk){ ok=false; row.classList.add('invalid'); }
        else{ row.classList.remove('invalid'); }
      });
      if(!ok) return;
      goTo(step.next);
    };
    renderProgress(); renderReceipt();
    return;
  }

  if(step.type==='summary'){
    const totalCost = totalCostSoFar();
    const totalBenefits = state.costs.totalBenefits;
    const net = totalBenefits - totalCost;
    const cbRatio = totalCost>0 ? (totalBenefits/totalCost) : 0;
    const roi = totalCost>0 ? (net/totalCost*100) : 0;
    card.innerHTML = `
      <div class="card-eyebrow">Complete</div>
      <h2 class="card-title">Cost-benefit analysis &amp; ROI</h2>
      <p class="card-help">Calculated automatically from your entries. Click any line to go back and make changes.</p>
      <div class="metric-grid">
        <div class="metric">
          <span class="metric-label">Net benefits</span>
          <span class="metric-value ${net<0?'neg':''}">${money(net)}</span>
          <p class="metric-desc">The financial benefit remaining after subtracting the total cost of the learning solution.</p>
        </div>
        <div class="metric">
          <span class="metric-label">Total costs</span>
          <span class="metric-value">${money(totalCost)}</span>
          <p class="metric-desc">The total investment required to design, develop, and deliver the learning solution.</p>
        </div>
        <div class="metric">
          <span class="metric-label">Cost-benefit ratio</span>
          <span class="metric-value">${cbRatio.toFixed(2)} : 1</span>
          <p class="metric-desc">The amount of financial benefit generated for every $1 invested.</p>
        </div>
        <div class="metric">
          <span class="metric-label">ROI</span>
          <span class="metric-value ${roi<0?'neg':''}">${roi.toFixed(2)}%</span>
          <p class="metric-desc">The percentage return generated after accounting for the total investment.</p>
        </div>
      </div>
      <div class="scope-note">Total benefits: ${money(totalBenefits)} &middot; Total costs: ${money(totalCost)} (delivery ${money(state.costs.delivery)} + design &amp; development ${money(state.costs.dd)})${state.benefitBreakdown ? ` &middot; Of the total benefits, ${money(state.benefitBreakdown.saved)} is from dollars saved and ${money(state.benefitBreakdown.generated)} is from dollars generated.` : ''}</div>
      ${state.benefitBreakdown ? '<div class="scope-note">Both types count equally toward total benefits and ROI. This breakdown is shown for reporting only.</div>' : ''}`;
    nextBtn.hidden = true;
    renderProgress(); renderReceipt();
    return;
  }

  // calc type
  const v = state.values[id] || {};
  card.innerHTML = `
    <div class="card-eyebrow">${step.eyebrow}</div>
    <h2 class="card-title">${step.title}</h2>
    <p class="card-help">${step.help}</p>
    <div class="fields-grid">
      ${step.fields.map(f=> renderFieldHTML(f, v)).join('')}
    </div>
    <div class="live-preview">
      <div class="lp-box"><span class="lp-label" id="lpLabel">${step.preview(v).label}</span><span class="lp-value" id="lpValue">${step.preview(v).display}</span></div>
    </div>`;

  wirePeriodButtons(id);
  wireValueTypeButtons(id);
  const periodCustomInput = document.getElementById('f-periodCustom');
  if(periodCustomInput){
    periodCustomInput.addEventListener('input', ()=>{
      const cur = state.values[id] || {};
      cur.periodCustom = periodCustomInput.value;
      state.values[id] = cur;
    });
  }

  function updatePreview(){
    const cur = state.values[id] || {};
    step.fields.forEach(f=>{
      if(f.type==='period' || f.type==='valuetype') return;
      const el = document.getElementById('f-'+f.key);
      if(el) cur[f.key] = el.value;
    });
    state.values[id] = cur;
    document.getElementById('lpValue').textContent = step.preview(cur).display;
  }
  step.fields.forEach(f=>{
    if(f.type==='period' || f.type==='valuetype') return;
    const el = document.getElementById('f-'+f.key);
    if(el){
      el.addEventListener('input', ()=>{
        document.querySelector(`.field[data-key="${f.key}"]`).classList.remove('invalid');
        updatePreview();
      });
    }
  });
  updatePreview();

  nextBtn.onclick = ()=>{
    const cur = state.values[id] || {};
    let ok = true;
    step.fields.forEach(f=>{
      const fieldEl = document.querySelector(`.field[data-key="${f.key}"]`);
      let valid;
      if(f.type==='text' || f.type==='textarea'){
        valid = cur[f.key]!==undefined && cur[f.key].trim()!=='';
      } else if(f.type==='period'){
        valid = cur.period && (cur.period!=='custom' || (cur.periodCustom && cur.periodCustom.trim()!==''));
      } else if(f.type==='valuetype'){
        valid = !!cur[f.key];
      } else {
        valid = cur[f.key]!==undefined && cur[f.key]!=='' && !isNaN(parseFloat(cur[f.key])) && parseFloat(cur[f.key])>=0;
      }
      if(!valid){ fieldEl.classList.add('invalid'); ok=false; }
      else{ fieldEl.classList.remove('invalid'); }
    });
    if(!ok){
      const first = card.querySelector('.field.invalid input, .field.invalid textarea, .field.invalid .seg-btn');
      if(first) first.focus();
      return;
    }
    step.onSubmit(cur);
    goTo(step.next);
  };

  renderProgress(); renderReceipt();
}

document.getElementById('backBtn').onclick = goBack;
function render(animate){
  renderCard(animate);
  if(animate && window.innerWidth<=800){ try{ window.scrollTo({top:0}); }catch(e){} }
}
render(false);
</script>
</body>
</html>
