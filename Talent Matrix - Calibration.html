<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Talent Matrix: Calibration</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap" rel="stylesheet">
<style>
/* ===== Talent Workspace UI (talent-ui.css) ===== */
/* Layout: brand row, page header, then grid card (main) beside a 300px tools rail; stacks at 800px. */
:root{
  --font-sans:Inter, system-ui, -apple-system, sans-serif;
  --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:22px;--space-6:28px;--space-7:32px;--space-8:56px;
  --radius-sm:8px;--radius-md:10px;--radius-lg:12px;--radius-xl:14px;--radius-pill:999px;
  --bg:#F7F8FA;--surface:#FFFFFF;--surface-alt:#F1F3F5;--ink:#111827;--ink-soft:#5B6472;--line:#E5E7EB;--line-strong:#8A9099;
  --accent:#0F766E;--accent-hover:#0B5F58;--on-accent:#FFFFFF;--accent-soft:#E6F4F2;--focus-ring:rgba(15,118,110,0.25);
  --info:#1D4ED8;--info-soft:#EEF3FF;--warning:#B54708;--warning-soft:#FEF3E2;--error:#B42318;--error-soft:#FEECEB;
  --shadow-sm:0 1px 2px rgba(16,24,40,0.05);
  --shadow-card:0 1px 2px rgba(16,24,40,0.04), 0 6px 20px -4px rgba(16,24,40,0.07);
  --shadow-lift:0 2px 4px rgba(16,24,40,0.06), 0 10px 28px -6px rgba(16,24,40,0.12);
  /* Tool tokens: person markers (white initials on each) */
  --dot-ring:#FFFFFF;--on-dot:#FFFFFF;
  --person-0:#2455B0;--person-1:#7A3EA8;--person-2:#1B7F79;--person-3:#B0271E;--person-4:#4A4A48;--person-5:#A8286B;
  --person-6:#B5661A;--person-7:#2F6B2F;--person-8:#0E7490;--person-9:#946200;--person-10:#5B3A87;--person-11:#8A3324;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1113;--surface:#171B1F;--surface-alt:#1F2429;--ink:#ECEEF0;--ink-soft:#9AA3AD;--line:#2A3036;--line-strong:#6B747E;
    --accent:#3CC4B4;--accent-hover:#62D3C6;--on-accent:#04201C;--accent-soft:rgba(60,196,180,0.13);--focus-ring:rgba(60,196,180,0.3);
    --info:#8AB4F8;--info-soft:rgba(138,180,248,0.13);--warning:#F5B45C;--warning-soft:rgba(245,180,92,0.13);--error:#F28B82;--error-soft:rgba(242,139,130,0.13);
    --shadow-sm:0 1px 2px rgba(0,0,0,0.4);
    --shadow-card:0 1px 2px rgba(0,0,0,0.4), 0 8px 24px -6px rgba(0,0,0,0.5);
    --shadow-lift:0 2px 4px rgba(0,0,0,0.45), 0 12px 30px -6px rgba(0,0,0,0.6);
    --dot-ring:#ECEEF0;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1113;--surface:#171B1F;--surface-alt:#1F2429;--ink:#ECEEF0;--ink-soft:#9AA3AD;--line:#2A3036;--line-strong:#6B747E;
  --accent:#3CC4B4;--accent-hover:#62D3C6;--on-accent:#04201C;--accent-soft:rgba(60,196,180,0.13);--focus-ring:rgba(60,196,180,0.3);
  --info:#8AB4F8;--info-soft:rgba(138,180,248,0.13);--warning:#F5B45C;--warning-soft:rgba(245,180,92,0.13);--error:#F28B82;--error-soft:rgba(242,139,130,0.13);
  --shadow-sm:0 1px 2px rgba(0,0,0,0.4);
  --shadow-card:0 1px 2px rgba(0,0,0,0.4), 0 8px 24px -6px rgba(0,0,0,0.5);
  --shadow-lift:0 2px 4px rgba(0,0,0,0.45), 0 12px 30px -6px rgba(0,0,0,0.6);
  --dot-ring:#ECEEF0;
  color-scheme:dark;
}
/* Nine-box tiers, derived from the status tokens: lowest box (error) through top box (info) */
:root{
  --box-1:color-mix(in srgb, var(--error) 14%, var(--surface));
  --box-2:color-mix(in srgb, var(--warning) 16%, var(--surface));
  --box-3:var(--surface-alt);
  --box-4:color-mix(in srgb, var(--info) 14%, var(--surface));
  --box-5:color-mix(in srgb, var(--info) 30%, var(--surface));
}
*{box-sizing:border-box;}
body{margin:0;}
.tw, body{background:var(--bg);color:var(--ink);font-family:var(--font-sans);-webkit-font-smoothing:antialiased;}
.tw h1,.tw h2,.tw h3{font-weight:650;letter-spacing:-.022em;margin:0;}
.eyebrow{display:inline-flex;align-items:center;gap:6px;color:var(--accent);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;margin-bottom:12px;}
.page-title{font-size:32px;line-height:1.15;font-weight:650;letter-spacing:-.022em;margin:0 0 10px;text-wrap:balance;}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-xl);padding:var(--space-7);box-shadow:var(--shadow-card);color:var(--ink);}
.field{margin-bottom:var(--space-4);}
.field label,.field .label{display:block;font-size:13px;font-weight:600;color:var(--ink);margin-bottom:var(--space-2);}
.hint{font-size:12.5px;color:var(--ink-soft);margin-top:6px;line-height:1.45;}
.tw input[type=text], .tw select, .tw textarea{
  width:100%;min-height:44px;font:400 14.5px var(--font-sans);color:var(--ink);
  background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--radius-md);
  padding:11px 14px;outline:none;transition:border-color .15s, box-shadow .15s;}
.tw input:hover, .tw select:hover, .tw textarea:hover{border-color:var(--ink-soft);}
.tw input:focus, .tw select:focus, .tw textarea:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--focus-ring);}
.tw ::placeholder{color:var(--ink-soft);opacity:1;}
.tw select:invalid{color:var(--ink-soft);}
.tw textarea{resize:vertical;min-height:80px;line-height:1.55;}
.tw select{appearance:none;cursor:pointer;padding-right:40px;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' stroke='%238A9099' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>");
  background-repeat:no-repeat;background-position:right 15px center;}
.btn{font:600 14px var(--font-sans);border-radius:var(--radius-md);padding:11px 20px;min-height:44px;
  border:1px solid transparent;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  transition:background .15s, box-shadow .15s, transform .15s, border-color .15s, color .15s;}
.btn-primary{background:var(--accent);color:var(--on-accent);box-shadow:var(--shadow-sm);}
.btn-primary:hover:not(:disabled){background:var(--accent-hover);transform:translateY(-1px);box-shadow:var(--shadow-lift);}
.btn-primary:active:not(:disabled){transform:none;}
.btn-text{background:transparent;color:var(--ink-soft);border:none;padding:8px 10px;}
.btn-text:hover{color:var(--ink);background:var(--surface-alt);}
.btn:focus-visible{outline:none;box-shadow:0 0 0 4px var(--focus-ring);}
.btn-sm{min-height:36px;padding:7px 14px;font-size:13px;}
.empty-state{border:1.5px dashed var(--line);border-radius:var(--radius-xl);padding:28px 22px;text-align:center;color:var(--ink-soft);font-size:14px;}


.btn-secondary{background:var(--surface);color:var(--ink);border-color:var(--line-strong);box-shadow:var(--shadow-sm);}
.btn-secondary:hover:not(:disabled){background:var(--surface-alt);}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px 3px 8px;border-radius:var(--radius-pill);background:var(--surface-alt);color:var(--ink-soft);white-space:nowrap;}
.badge::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;}
.badge.medium{background:var(--warning-soft);color:var(--warning);}
.badge.info{background:var(--info-soft);color:var(--info);}
.badge.sm{font-size:11px;padding:2px 8px 2px 7px;gap:5px;}

/* ===== Page shell ===== */
.shell{max-width:1200px;margin:0 auto;padding-inline:32px;padding-block:28px 80px;}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:var(--space-7);}
.brand-tile{width:32px;height:32px;border-radius:var(--radius-md);background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.brand-name{flex:1;min-width:0;font-size:14px;font-weight:650;letter-spacing:-.01em;}
.icon-btn{width:34px;height:34px;border-radius:var(--radius-md);border:none;background:transparent;color:var(--ink-soft);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .15s,color .15s;}
.icon-btn:hover{background:var(--surface-alt);color:var(--ink);}
.icon-btn:focus-visible{outline:none;box-shadow:0 0 0 4px var(--focus-ring);}

.page-head{margin-bottom:var(--space-6);max-width:620px;}
.session-title{width:100%;max-width:440px;font:400 15.5px var(--font-sans);color:var(--ink);background:transparent;border:none;border-bottom:1px solid var(--line-strong);border-radius:0;padding:6px 0;outline:none;transition:border-color .15s, box-shadow .15s;}
.session-title:hover{border-bottom-color:var(--ink-soft);}
.session-title:focus{border-bottom-color:var(--accent);box-shadow:0 2px 0 0 var(--accent);}
.session-title::placeholder{color:var(--ink-soft);opacity:1;}
.page-desc{color:var(--ink-soft);font-size:14px;line-height:1.6;margin:10px 0 0;}

.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:start;}
.rail{display:flex;flex-direction:column;gap:20px;min-width:0;}
.rail .card{padding:var(--space-5);}
.card-title{font-size:15px;font-weight:650;letter-spacing:-.01em;margin:0 0 4px;}
.card-sub{font-size:12.5px;color:var(--ink-soft);line-height:1.45;margin:0 0 14px;}
.section{margin-top:28px;border-top:1px solid var(--line);padding-top:22px;}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px;}
.section-title{font-size:15px;font-weight:650;letter-spacing:-.01em;margin:0;}
.section-count{font-size:12.5px;color:var(--ink-soft);font-weight:500;margin-left:8px;font-variant-numeric:tabular-nums;}

/* ===== Grid with axes ===== */
.axis-row{display:flex;gap:12px;align-items:stretch;}
.pot-axis{display:flex;gap:8px;align-items:stretch;}
.axis-title{font-size:12px;font-weight:600;color:var(--ink-soft);letter-spacing:.02em;}
.pot-axis .axis-title{writing-mode:vertical-rl;transform:rotate(180deg);display:flex;align-items:center;justify-content:center;}
.axis-bar{display:flex;gap:3px;}
.axis-bar.vertical{flex-direction:column;width:24px;}
.axis-seg{flex:1;background:var(--surface-alt);color:var(--ink-soft);font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;border-radius:6px;}
.axis-bar.vertical .axis-seg{writing-mode:vertical-rl;transform:rotate(180deg);}
.axis-bar.horizontal .axis-seg{padding:6px 0;}
.axis-arrow{color:var(--line-strong);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.axis-bar.vertical .axis-arrow{height:18px;}
.axis-bar.horizontal .axis-arrow{width:18px;}
.grid-col{flex:1;min-width:0;}
.perf-title{text-align:center;margin-top:8px;}

#big-grid{position:relative;width:100%;max-width:100%;aspect-ratio:1.35;touch-action:none;}
.cell{position:absolute;border:3px solid var(--surface);border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;text-align:center;padding:8px;pointer-events:none;}
.cell span{font-size:12.5px;color:var(--ink-soft);line-height:1.45;font-weight:600;}
.dot{position:absolute;transform:translate(-50%,-50%);width:28px;height:28px;border-radius:50%;border:2px solid var(--dot-ring);box-shadow:0 1px 3px rgba(16,24,40,0.3);cursor:grab;display:flex;align-items:center;justify-content:center;touch-action:none;user-select:none;-webkit-user-select:none;}
.dot.open{border-style:dashed;}
.dot span{font-size:10px;font-weight:650;color:var(--on-dot);letter-spacing:.01em;pointer-events:none;}
.dot.selected{box-shadow:0 0 0 3px var(--accent), 0 1px 3px rgba(16,24,40,0.3);z-index:2;}
.dot .flag-mark{position:absolute;top:-7px;right:-8px;width:16px;height:16px;border-radius:50%;background:var(--surface);color:var(--error);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-sm);pointer-events:none;}

/* Parking lot */
.lot{border:1.5px dashed var(--line-strong);border-radius:var(--radius-lg);padding:12px;display:flex;flex-wrap:wrap;gap:8px;min-height:64px;align-items:flex-start;background:var(--surface-alt);}
.lot-empty{color:var(--ink-soft);font-size:13.5px;padding:8px 6px;line-height:1.5;}
.chip{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-md);padding:6px 6px 6px 10px;box-shadow:var(--shadow-sm);max-width:100%;}
.chip.selected{box-shadow:0 0 0 2px var(--accent);}
.chip-name{border:none;background:none;padding:0;font:600 13px var(--font-sans);color:var(--ink);cursor:pointer;text-align:left;min-width:0;}
.chip-name:focus-visible{outline:none;box-shadow:0 0 0 4px var(--focus-ring);border-radius:4px;}
.chip-from{display:block;font-weight:400;font-size:11.5px;color:var(--ink-soft);}

/* Cases */
.case-list{display:flex;flex-direction:column;gap:12px;}
.case{background:var(--surface-alt);border-radius:var(--radius-lg);padding:16px 18px;font-size:14px;line-height:1.55;border:1px solid transparent;}
.case.selected{border-color:var(--accent);}
.case.flagged{background:color-mix(in srgb, var(--error) 6%, var(--surface-alt));}
.case-top{display:flex;gap:12px;align-items:flex-start;}
.swatch{width:12px;height:12px;border-radius:50%;flex-shrink:0;margin-top:5px;}
.case-head{flex:1;min-width:0;}
.case-name{border:none;background:none;padding:0;font:650 14.5px var(--font-sans);letter-spacing:-.01em;color:var(--ink);cursor:pointer;text-align:left;}
.case-name:hover{text-decoration:underline;text-underline-offset:3px;}
.case-name:focus-visible{outline:none;box-shadow:0 0 0 4px var(--focus-ring);border-radius:4px;}
.case-meta{color:var(--ink-soft);font-size:13px;}
.case-ev{color:var(--ink);margin-top:10px;}
.case-note{color:var(--ink-soft);margin-top:6px;font-style:italic;font-size:13.5px;}
.case-foot{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px;}
.case-foot .foot-label{font-size:12.5px;font-weight:600;color:var(--ink-soft);}
.flag-btn{width:34px;height:34px;flex-shrink:0;border:none;background:none;border-radius:var(--radius-sm);color:var(--ink-soft);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s,color .15s;}
.flag-btn:hover{background:var(--error-soft);color:var(--error);}
.flag-btn.on{color:var(--error);}
.flag-btn.on svg{fill:currentColor;}
.flag-btn:focus-visible{outline:none;box-shadow:0 0 0 4px var(--focus-ring);}
.link-btn{border:none;background:none;color:var(--accent);font:600 13px var(--font-sans);cursor:pointer;padding:2px 6px;border-radius:6px;margin-left:2px;}
.link-btn:hover{background:var(--accent-soft);}
.link-btn:focus-visible{outline:none;box-shadow:0 0 0 4px var(--focus-ring);}
.edit-actions{display:flex;gap:8px;margin-top:10px;align-items:center;}
.case textarea{margin-top:10px;}

/* Status control */
.seg{display:inline-flex;gap:2px;padding:3px;background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--radius-md);}
.seg button{border:none;background:none;font:600 12.5px var(--font-sans);color:var(--ink-soft);padding:6px 12px;min-height:32px;border-radius:7px;cursor:pointer;transition:background .15s,color .15s;}
.seg button:hover{background:var(--surface-alt);color:var(--ink);}
.seg button:focus-visible{outline:none;box-shadow:0 0 0 4px var(--focus-ring);}
.seg button[aria-pressed="true"][data-status="confirmed"]{background:var(--info-soft);color:var(--info);}
.seg button[aria-pressed="true"][data-status="adjusted"]{background:var(--warning-soft);color:var(--warning);}
.seg button[aria-pressed="true"][data-status="parked"]{background:var(--surface-alt);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line-strong);}

/* Definitions */
.def-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;}
.def{border-radius:var(--radius-md);padding:12px 13px;}
.def-title{font-size:12.5px;font-weight:650;color:var(--ink);margin-bottom:4px;line-height:1.35;}
.def-text{font-size:12px;color:var(--ink);opacity:.82;line-height:1.5;}

/* Add form */
.mini-picker{position:relative;width:96px;height:96px;}
.mini-cell{position:absolute;border:2px solid var(--surface);border-radius:6px;cursor:pointer;padding:0;}
.mini-cell:hover{outline:1px solid var(--line-strong);outline-offset:-3px;}
.mini-cell.selected{box-shadow:inset 0 0 0 2px var(--ink);}
.mini-cell:focus-visible{outline:none;box-shadow:inset 0 0 0 2px var(--ink), 0 0 0 4px var(--focus-ring);}
.form-error{font-size:12.5px;color:var(--error);font-weight:500;margin:-4px 0 12px;}
.full{width:100%;}

/* Team list */
.person{display:flex;align-items:center;gap:8px;padding:8px 0;font-size:13.5px;border-bottom:1px solid var(--line);}
.person:last-child{border-bottom:none;}
.p-main{flex:1;min-width:0;}
.p-name{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500;}
.p-meta{display:block;color:var(--ink-soft);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.swatch.sm{width:10px;height:10px;margin-top:0;}
.open-toggle{width:28px;height:28px;flex-shrink:0;border:none;background:none;border-radius:6px;padding:0;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.open-toggle::before{content:'';width:15px;height:15px;border-radius:4px;border:1.5px solid var(--line-strong);}
.open-toggle.on::before{border-style:dashed;border-color:var(--ink-soft);}
.open-toggle:hover{background:var(--surface-alt);}
.remove-btn{width:28px;height:28px;flex-shrink:0;border:none;background:none;border-radius:6px;color:var(--ink-soft);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;}
.remove-btn:hover{color:var(--error);background:var(--error-soft);}
.open-toggle:focus-visible,.remove-btn:focus-visible{outline:none;box-shadow:0 0 0 4px var(--focus-ring);}
.clear-all{margin-top:8px;margin-left:-10px;font-size:13px;min-height:36px;}

/* Stats */
.stat{display:flex;justify-content:space-between;align-items:baseline;font-size:13.5px;padding:9px 0;border-bottom:1px solid var(--line);}
.stat:last-child{border-bottom:none;}
.stat .s-label{color:var(--ink-soft);}
.stat .s-val{font-weight:650;font-variant-numeric:tabular-nums;}
.stat-gap{height:10px;border-bottom:1px solid var(--line);}

/* Log */
#log{font-size:12.5px;line-height:1.6;color:var(--ink-soft);max-height:260px;overflow:auto;font-variant-numeric:tabular-nums;display:flex;flex-direction:column;gap:6px;}
#log .log-empty{font-style:italic;}

@media (max-width:800px){
  .shell{padding-inline:16px;padding-block:16px 64px;}
  .brand{margin-bottom:var(--space-5);}
  .page-title{font-size:26px;}
  .layout{grid-template-columns:1fr;gap:20px;}
  .card{padding:22px 18px;}
  .rail .card{padding:20px 18px;}
  .tw input[type=text], .tw select, .tw textarea{font-size:16px;min-height:48px;}
  .session-title{font-size:16px;max-width:none;}
  .btn{min-height:48px;}
  .btn-sm{min-height:40px;}
  .section-head .btn{flex:1 1 100%;}
  .def-grid{grid-template-columns:1fr;}
  #big-grid{aspect-ratio:1;}
  .cell span{font-size:10.5px;line-height:1.35;}
  .cell{padding:4px;}
  .axis-row{gap:6px;}
  .pot-axis{gap:4px;}
  .axis-bar.vertical{width:20px;}
  .axis-seg{font-size:10px;}
  .open-toggle,.remove-btn{width:36px;height:36px;}
  .case{padding:14px;}
  .seg{display:flex;width:100%;}
  .seg button{flex:1;min-height:40px;padding:6px 8px;}
  .case-foot .foot-label{width:100%;}
}
@media (prefers-reduced-motion:reduce){
  .tw *, .tw *::before, .tw *::after{animation:none !important;transition:none !important;}
}
</style>
</head>
<body>

<div class="tw">
<div class="shell">

  <div class="brand">
    <span class="brand-tile"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></span>
    <span class="brand-name">Talent Matrix: Calibration</span>
    <button type="button" class="icon-btn theme-toggle" aria-label="Switch theme"></button>
  </div>

  <header class="page-head">
    <input id="session-title" class="session-title" type="text" aria-label="Session name" placeholder="Name this session — e.g. Engineering, Q3 review cycle">
    <p class="page-desc">Drag dots to recalibrate as a group.</p>
  </header>

  <div class="layout">
    <section class="card">
      <div class="axis-row">
        <div class="pot-axis">
          <div class="axis-title">Potential</div>
          <div class="axis-bar vertical">
            <div class="axis-arrow"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg></div>
            <div class="axis-seg">High</div>
            <div class="axis-seg">Moderate</div>
            <div class="axis-seg">Low</div>
          </div>
        </div>
        <div class="grid-col">
          <div id="big-grid"></div>
          <div class="axis-bar horizontal" style="margin-top:8px;">
            <div class="axis-seg">Low</div>
            <div class="axis-seg">Moderate</div>
            <div class="axis-seg">High</div>
            <div class="axis-arrow"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></div>
          </div>
          <div class="axis-title perf-title">Performance</div>
        </div>
      </div>

      <div class="section">
        <div class="section-head">
          <h2 class="section-title">Parking lot<span class="section-count" id="lot-count"></span></h2>
        </div>
        <div id="parking-lot" class="lot"></div>
      </div>

      <div class="section">
        <div class="section-head">
          <h2 class="section-title">Cases<span class="section-count" id="case-count"></span></h2>
          <button id="cases-toggle" type="button" class="btn btn-secondary btn-sm" aria-expanded="false"></button>
        </div>
        <div id="cases"></div>
      </div>

      <div class="section">
        <div class="section-head"><h2 class="section-title">What each box means</h2></div>
        <div id="definitions" class="def-grid"></div>
      </div>
    </section>

    <aside class="rail">
      <div class="card">
        <h2 class="card-title" style="margin-bottom:14px;">Add team member</h2>
        <div class="field"><input id="new-name" type="text" aria-label="Name" placeholder="Name"></div>
        <div class="field"><input id="new-role" type="text" aria-label="Role" placeholder="Role"></div>
        <div class="field"><input id="new-dept" type="text" aria-label="Department" placeholder="Department"></div>
        <div class="field">
          <select id="new-level" aria-label="Level" required>
            <option value="">Level (optional)</option>
            <option>P1</option><option>P2</option><option>P3</option><option>P4</option><option>P5</option>
            <option>M1</option><option>M2</option><option>M3</option><option>M4</option><option>M5</option><option>M6</option>
          </select>
        </div>
        <div class="field">
          <span class="label">Starting placement</span>
          <div id="mini-picker" class="mini-picker" role="group" aria-label="Starting placement"></div>
        </div>
        <div class="field"><textarea id="new-ev" rows="2" aria-label="Evidence" placeholder="One line of evidence to support your case"></textarea></div>
        <div id="new-error" class="form-error" hidden></div>
        <button id="add-btn" type="button" class="btn btn-primary full">Add to grid</button>
      </div>

      <div class="card">
        <h2 class="card-title">Team</h2>
        <p class="card-sub">Dashed ring = open to adjusting. Click the box to toggle.</p>
        <div id="legend"></div>
        <button id="clear-all" type="button" class="btn btn-text clear-all">Clear all</button>
      </div>

      <div class="card">
        <h2 class="card-title" style="margin-bottom:6px;">Distribution</h2>
        <div id="stats"></div>
      </div>

      <div class="card">
        <h2 class="card-title" style="margin-bottom:10px;">Change log</h2>
        <div id="log"></div>
      </div>
    </aside>
  </div>

</div>
</div>

<script>
const ICON_SUN = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const ICON_MOON = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
const ICON_X = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';
const ICON_FLAG = (size)=> `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4"/><path d="M5 4h12l-2.5 4.5L17 13H5"/></svg>`;
const ICON_CHEV = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
const ICON_CHEV_UP = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg>';

/* Theme toggle (opens in light mode; the toggle switches to dark) */
function isDark(){
  const t = document.documentElement.getAttribute('data-theme');
  if(t) return t==='dark';
  return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
}
function paintThemeButtons(){
  const dark = isDark();
  document.querySelectorAll('.theme-toggle').forEach(b=>{
    b.innerHTML = dark ? ICON_SUN : ICON_MOON;
    b.setAttribute('aria-label', dark ? 'Switch to light mode' : 'Switch to dark mode');
    b.title = b.getAttribute('aria-label');
  });
}
document.querySelectorAll('.theme-toggle').forEach(b=> b.addEventListener('click', ()=>{
  document.documentElement.setAttribute('data-theme', isDark() ? 'light' : 'dark');
  paintThemeButtons();
}));
paintThemeButtons();

const potWord=["Low","Moderate","High"], perfWordAxis=["Low","Moderate","High"];
const cellTitle = (p,q) => `${potWord[q]} Potential / ${perfWordAxis[p]} Performance`;
const cellDef = (p,q)=>[
 ["Does not consistently meet expectations in the current role and demonstrates limited evidence of capacity for broader or more complex responsibilities. Requires performance improvement and evaluation of role fit.",
  "Reliably meets the core expectations of the current role but demonstrates limited potential for substantially broader or more complex responsibilities. Development may focus on strengthening effectiveness and expertise within the current scope.",
  "Consistently delivers strong results in the current role but demonstrates limited capacity or aspiration for substantially broader or more complex responsibilities. May continue to provide significant value through expertise and strong performance in their current scope."],
 ["Currently performs below expectations while demonstrating some capacity for future growth. Requires focused development and sustained performance improvement before taking on additional responsibilities.",
  "Reliably meets expectations and demonstrates some capacity for additional responsibility. May progress into broader or more complex work with continued development and demonstrated growth.",
  "Consistently delivers strong results and demonstrates some capacity to take on additional scope or responsibility, though potential for significantly broader or more complex roles may currently be limited."],
 ["Demonstrates potential for broader or more complex responsibilities, but current performance is below expectations. Performance gaps should be understood and addressed before advancement is considered.",
  "Demonstrates strong potential for broader or more complex responsibilities but is not yet consistently performing at a high level in the current role. May benefit from additional experience, development, or support.",
  "Consistently delivers strong results and demonstrates the capability and capacity to take on significantly broader, more complex, or higher-level responsibilities."]
][q][p];
function colorFor(p,q){
  const map={
    '2,0':'var(--box-3)','2,1':'var(--box-4)','2,2':'var(--box-5)',
    '1,0':'var(--box-2)','1,1':'var(--box-3)','1,2':'var(--box-4)',
    '0,0':'var(--box-1)','0,1':'var(--box-2)','0,2':'var(--box-3)'
  };
  return map[q+','+p];
}

const STATUS = {
  confirmed:{label:'Confirmed', badge:'info'},
  adjusted:{label:'Adjusted', badge:'medium'},
  parked:{label:'Parked', badge:'neutral'}
};
const PALETTE_SIZE = 12;
const personColor = i => `var(--person-${i % PALETTE_SIZE})`;
/* Example team so the grid opens in a working state */
const team=[
 {name:"Priya Nandan", role:"Senior software engineer", dept:"Backend", level:"P4", p:1, q:2, ev:"Led payments-retry migration; owning cross-team architecture work.", color:0, open:false, status:null, flagged:false},
 {name:"Marcus Cole", role:"Software engineer", dept:"Backend", level:"P3", p:2, q:1, ev:"Consistently ships high-quality work; comfortable in current scope.", color:1, open:true, status:null, flagged:false},
 {name:"Elena Ruiz", role:"Senior frontend engineer", dept:"Frontend", level:"P4", p:2, q:2, ev:"Shipped the design-system rewrite; already mentoring two teams.", color:2, open:false, status:'confirmed', flagged:false},
 {name:"Dev Patel", role:"Frontend engineer", dept:"Frontend", level:"P2", p:0, q:1, ev:"Missed two milestones; unclear on ownership of the outage last month.", color:3, open:true, status:null, flagged:true},
 {name:"Sam Okafor", role:"Site reliability engineer", dept:"Platform", level:"P3", p:1, q:1, ev:"Reliable on-call, steady output, hasn't sought stretch work.", color:4, open:false, status:'confirmed', flagged:false},
 {name:"Ana Vidal", role:"Staff infrastructure engineer", dept:"Platform", level:"P5", p:2, q:0, ev:"Deep infra expertise, prefers narrow scope, not seeking growth.", color:5, open:false, status:null, flagged:false},
 {name:"Jon Reyes", role:"Software engineer", dept:"Backend", level:"P2", p:1, q:0, ev:"Solid delivery, several attempts to grow scope haven't landed.", color:6, open:true, status:'parked', flagged:false},
 {name:"Tara Singh", role:"Associate frontend engineer", dept:"Frontend", level:"P1", p:0, q:2, ev:"Rough quarter output-wise, but peers flag strong systems thinking.", color:7, open:false, status:null, flagged:false},
];
const esc = s => String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initials = name => name.split(' ').filter(Boolean).map(w=>w[0]).join('').toUpperCase().slice(0,2);
const onGrid = () => team.filter(e=>e.status!=='parked');
const parked = () => team.filter(e=>e.status==='parked');
const stamp = () => new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
let colorSeq = team.length;
let newP=1, newQ=1;
let selected=team[0];
let editing=null;
let showAll=false;
const log=[];

function renderAll(){ renderGrid(); renderLot(); renderCases(); renderLegend(); renderStats(); renderLog(); }
function select(e){ selected=e; editing=null; renderGrid(); renderLot(); renderCases(); }

function setStatus(e, status){
  const next = e.status===status ? null : status;
  if(next===e.status) return;
  const prev = e.status;
  e.status = next;
  if(next==='parked') log.unshift(`${stamp()}  ${e.name}: moved to parking lot from ${cellTitle(e.p,e.q)}`);
  else if(prev==='parked') log.unshift(`${stamp()}  ${e.name}: returned to grid at ${cellTitle(e.p,e.q)}${next?` · ${STATUS[next].label.toLowerCase()}`:''}`);
  else if(next) log.unshift(`${stamp()}  ${e.name}: marked ${STATUS[next].label.toLowerCase()}`);
  else log.unshift(`${stamp()}  ${e.name}: status cleared`);
  renderAll();
}
function toggleFlag(e){ e.flagged=!e.flagged; renderGrid(); renderLot(); renderCases(); renderStats(); }

function renderMiniPicker(){
  const box=document.getElementById('mini-picker');
  box.innerHTML='';
  for(let q=2;q>=0;q--) for(let p=0;p<3;p++){
    const cell=document.createElement('button');
    cell.type='button';
    const isSel = p===newP && q===newQ;
    cell.className='mini-cell'+(isSel?' selected':'');
    cell.style.cssText=`left:${p/3*100}%;top:${(2-q)/3*100}%;width:33.333%;height:33.333%;background:${colorFor(p,q)};`;
    cell.setAttribute('aria-label', cellTitle(p,q));
    cell.setAttribute('aria-pressed', isSel ? 'true' : 'false');
    cell.addEventListener('click',()=>{ newP=p; newQ=q; renderMiniPicker(); box.querySelector('[aria-pressed="true"]').focus(); });
    box.appendChild(cell);
  }
}
document.getElementById('add-btn').addEventListener('click',()=>{
  const nameInput=document.getElementById('new-name');
  const roleInput=document.getElementById('new-role');
  const deptInput=document.getElementById('new-dept');
  const levelInput=document.getElementById('new-level');
  const evInput=document.getElementById('new-ev');
  const errBox=document.getElementById('new-error');
  const name=nameInput.value.trim();
  const ev=evInput.value.trim();
  if(!name){
    errBox.textContent='Enter a name first';
    errBox.hidden=false; nameInput.focus(); return;
  }
  if(!ev){
    errBox.textContent='Enter one line of evidence to support your case';
    errBox.hidden=false; evInput.focus(); return;
  }
  errBox.hidden=true;
  const person={
    name, role: roleInput.value.trim() || '—', dept: deptInput.value.trim() || '—', level: levelInput.value || '—', p:newP, q:newQ,
    ev, color: (colorSeq++) % PALETTE_SIZE, open:false, status:null, flagged:false
  };
  team.push(person);
  nameInput.value=''; roleInput.value=''; deptInput.value=''; evInput.value=''; levelInput.value='';
  newP=1; newQ=1; renderMiniPicker();
  selected=person; editing=null;
  renderAll();
});
document.getElementById('clear-all').addEventListener('click',()=>{
  team.length=0; log.length=0; selected=null; editing=null;
  renderAll();
});

function renderGrid(){
  const grid=document.getElementById('big-grid');
  grid.innerHTML='';
  for(let q=0;q<3;q++) for(let p=0;p<3;p++){
    const cell=document.createElement('div');
    cell.className='cell';
    cell.style.cssText=`left:${p/3*100}%;top:${(2-q)/3*100}%;width:33.333%;height:33.333%;background:${colorFor(p,q)};`;
    cell.innerHTML=`<span>${potWord[q]} Potential<br>${perfWordAxis[p]} Performance</span>`;
    grid.appendChild(cell);
  }
  onGrid().forEach((e)=>{
    const dot=document.createElement('div');
    const jx=(e._jx??(e._jx=(Math.random()*40-20)));
    const jy=(e._jy??(e._jy=(Math.random()*40-20)));
    const x=(e.p+0.5)/3*100, y=100-(e.q+0.5)/3*100;
    dot.className='dot'+(e.open?' open':'')+(e===selected?' selected':'');
    dot.style.cssText=`left:calc(${x}% + ${jx}px);top:calc(${y}% + ${jy}px);background:${personColor(e.color)};`;
    dot.innerHTML=`<span>${esc(initials(e.name))}</span>${e.flagged?`<span class="flag-mark">${ICON_FLAG(10)}</span>`:''}`;
    dot.title=e.name+(e.flagged?' (flagged)':'');
    let dragging=false;
    dot.addEventListener('pointerdown',ev=>{
      dragging=true; dot.setPointerCapture(ev.pointerId); dot.style.cursor='grabbing';
      if(selected!==e){ selected=e; editing=null; }
      grid.querySelectorAll('.dot.selected').forEach(d=>d.classList.remove('selected')); dot.classList.add('selected');
      renderLot(); renderCases();
    });
    dot.addEventListener('pointerup',ev=>{
      if(!dragging)return; dragging=false; dot.style.cursor='grab';
      const r=grid.getBoundingClientRect();
      const nx=Math.min(Math.max((ev.clientX-r.left)/r.width,0),0.999);
      const ny=Math.min(Math.max((ev.clientY-r.top)/r.height,0),0.999);
      const np=Math.floor(nx*3), nq=2-Math.floor(ny*3);
      if(np!==e.p||nq!==e.q){
        log.unshift(`${stamp()}  ${e.name}: ${cellTitle(e.p,e.q)} → ${cellTitle(np,nq)}`);
        e.p=np; e.q=nq; e._jx=(Math.random()*40-20); e._jy=(Math.random()*40-20);
        e.status='adjusted';
        renderAll();
      } else {
        renderGrid();
      }
    });
    dot.addEventListener('pointercancel',()=>{ dragging=false; renderGrid(); });
    dot.addEventListener('pointermove',ev=>{
      if(!dragging)return;
      const r=grid.getBoundingClientRect();
      dot.style.left=(ev.clientX-r.left)+'px'; dot.style.top=(ev.clientY-r.top)+'px';
    });
    grid.appendChild(dot);
  });
}

function renderLot(){
  const list=parked();
  document.getElementById('lot-count').textContent = list.length ? `${list.length} parked` : '';
  const box=document.getElementById('parking-lot');
  if(!list.length){
    box.innerHTML='<div class="lot-empty">No one is parked. Mark an employee as parked to move them here until the group comes back to them.</div>';
    return;
  }
  box.innerHTML = list.map(e=>`
    <div class="chip${e===selected?' selected':''}">
      <span class="swatch sm" style="background:${personColor(e.color)};"></span>
      <button type="button" class="chip-name" data-act="select" data-i="${team.indexOf(e)}">${esc(e.name)}<span class="chip-from">${cellTitle(e.p,e.q)}</span></button>
      ${e.flagged?`<span class="flag-btn on" style="width:22px;height:22px;cursor:default;" title="Flagged">${ICON_FLAG(13)}</span>`:''}
      <button type="button" class="link-btn" data-act="unpark" data-i="${team.indexOf(e)}">Return to grid</button>
    </div>`).join('');
}

function caseHTML(e){
  const i=team.indexOf(e);
  const where = e.status==='parked' ? `Parking lot (${cellTitle(e.p,e.q)})` : cellTitle(e.p,e.q);
  const meta=[e.role,e.level,e.dept].map(esc).join(' · ');
  const evBlock = editing===e
    ? `<textarea id="edit-ev-input" rows="2" aria-label="Evidence for ${esc(e.name)}" placeholder="One line of evidence to support your case">${esc(e.ev)}</textarea>
       <div class="edit-actions">
         <button type="button" class="btn btn-primary btn-sm" data-act="save" data-i="${i}">Save</button>
         <button type="button" class="btn btn-text btn-sm" data-act="cancel" data-i="${i}">Cancel</button>
       </div>`
    : `<div class="case-ev">${esc(e.ev)} <button type="button" class="link-btn" data-act="edit" data-i="${i}">Edit</button></div>`;
  const seg = Object.keys(STATUS).map(k=>`<button type="button" data-act="status" data-status="${k}" data-i="${i}" aria-pressed="${e.status===k?'true':'false'}">${STATUS[k].label}</button>`).join('');
  return `<article class="case${e===selected&&showAll?' selected':''}${e.flagged?' flagged':''}">
    <div class="case-top">
      <span class="swatch" style="background:${personColor(e.color)};"></span>
      <div class="case-head">
        <button type="button" class="case-name" data-act="select" data-i="${i}">${esc(e.name)}</button>
        <div class="case-meta">${meta} · ${where}</div>
      </div>
      <button type="button" class="flag-btn${e.flagged?' on':''}" data-act="flag" data-i="${i}" aria-pressed="${e.flagged?'true':'false'}" title="${e.flagged?'Remove flag':'Flag this case'}" aria-label="${e.flagged?'Remove flag from':'Flag'} ${esc(e.name)}'s case">${ICON_FLAG(17)}</button>
    </div>
    ${evBlock}
    ${e.open?'<div class="case-note">Manager is open to adjusting this rating with stronger peer evidence.</div>':''}
    <div class="case-foot"><span class="foot-label">Status</span><div class="seg" role="group" aria-label="Status for ${esc(e.name)}">${seg}</div></div>
  </article>`;
}
function renderCases(){
  const flagged=team.filter(e=>e.flagged).length;
  document.getElementById('case-count').textContent = team.length ? `${team.length} ${team.length===1?'case':'cases'}${flagged?` · ${flagged} flagged`:''}` : '';
  const toggle=document.getElementById('cases-toggle');
  toggle.hidden = team.length<2;
  toggle.setAttribute('aria-expanded', showAll?'true':'false');
  toggle.innerHTML = showAll ? `Show one employee ${ICON_CHEV_UP}` : `Expand all cases ${ICON_CHEV}`;
  const box=document.getElementById('cases');
  if(!team.length){
    box.innerHTML='<div class="empty-state">No one on the grid yet. Add a team member to begin.</div>';
    return;
  }
  if(showAll){
    box.innerHTML=`<div class="case-list">${team.map(caseHTML).join('')}</div>`;
  } else if(selected && team.includes(selected)){
    box.innerHTML=caseHTML(selected);
  } else {
    box.innerHTML='<div class="empty-state">Select a dot on the grid to see that employee\'s case.</div>';
  }
  const ta=document.getElementById('edit-ev-input');
  if(ta) ta.focus();
}
document.getElementById('cases-toggle').addEventListener('click',()=>{ showAll=!showAll; editing=null; renderCases(); });

/* One handler for every action inside the cases and parking lot */
function handleAction(ev){
  const btn=ev.target.closest('[data-act]');
  if(!btn) return;
  const e=team[+btn.dataset.i];
  if(!e) return;
  switch(btn.dataset.act){
    case 'select': select(e); break;
    case 'flag': toggleFlag(e); break;
    case 'status': setStatus(e, btn.dataset.status); break;
    case 'unpark': setStatus(e, 'parked'); break;
    case 'edit': editing=e; renderCases(); break;
    case 'cancel': editing=null; renderCases(); break;
    case 'save': {
      const val=document.getElementById('edit-ev-input').value.trim();
      if(val) e.ev=val;
      editing=null; renderCases(); break;
    }
  }
}
document.getElementById('cases').addEventListener('click', handleAction);
document.getElementById('parking-lot').addEventListener('click', handleAction);

function renderDefinitions(){
  const box=document.getElementById('definitions');
  let html='';
  for(let q=2;q>=0;q--){
    for(let p=0;p<3;p++){
      html+=`<div class="def" style="background:${colorFor(p,q)};">
        <div class="def-title">${cellTitle(p,q)}</div>
        <div class="def-text">${cellDef(p,q)}</div>
      </div>`;
    }
  }
  box.innerHTML=html;
}
function renderLegend(){
  document.getElementById('legend').innerHTML = team.map((e,i)=>`
    <div class="person">
      <span class="swatch sm" style="background:${personColor(e.color)};"></span>
      <span class="p-main"><span class="p-name">${esc(e.name)}</span><span class="p-meta">${esc(e.level)} · ${esc(e.dept)}</span></span>
      ${e.status?`<span class="badge sm ${STATUS[e.status].badge}">${STATUS[e.status].label}</span>`:''}
      <button type="button" data-i="${i}" class="open-toggle${e.open?' on':''}" title="Toggle: open to adjusting this rating" aria-label="Open to adjusting ${esc(e.name)}'s rating" aria-pressed="${e.open?'true':'false'}"></button>
      <button type="button" data-i="${i}" class="remove-btn" title="Remove from grid" aria-label="Remove ${esc(e.name)} from grid">${ICON_X}</button>
    </div>`).join('');
  document.querySelectorAll('.open-toggle').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const e=team[+btn.dataset.i];
      e.open=!e.open;
      renderGrid(); renderLegend(); renderCases();
    });
  });
  document.querySelectorAll('.remove-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const [gone]=team.splice(+btn.dataset.i,1);
      if(selected===gone) selected=onGrid()[0]||team[0]||null;
      if(editing===gone) editing=null;
      renderAll();
    });
  });
}
function renderStats(){
  const grid=onGrid();
  const total=grid.length;
  const high=grid.filter(e=>e.p===2&&e.q===2).length;
  const risk=grid.filter(e=>e.p===0||e.q===0).length;
  const avgPot= total ? (grid.reduce((s,e)=>s+e.q,0)/total).toFixed(1) : '0.0';
  const count = s => team.filter(e=>e.status===s).length;
  document.getElementById('stats').innerHTML=`
    <div class="stat"><span class="s-label">Top talent</span><span class="s-val">${high}/${total}</span></div>
    <div class="stat"><span class="s-label">Flagged / low box</span><span class="s-val">${risk}/${total}</span></div>
    <div class="stat"><span class="s-label">Avg. potential score</span><span class="s-val">${avgPot}/2.0</span></div>
    <div class="stat-gap"></div>
    <div class="stat"><span class="s-label">Confirmed</span><span class="s-val">${count('confirmed')}/${team.length}</span></div>
    <div class="stat"><span class="s-label">Adjusted</span><span class="s-val">${count('adjusted')}/${team.length}</span></div>
    <div class="stat"><span class="s-label">Parked</span><span class="s-val">${count('parked')}/${team.length}</span></div>
    <div class="stat"><span class="s-label">Cases flagged</span><span class="s-val">${team.filter(e=>e.flagged).length}/${team.length}</span></div>`;
}
function renderLog(){
  document.getElementById('log').innerHTML = log.length ? log.map(l=>`<div>${esc(l)}</div>`).join('') : '<div class="log-empty">No moves yet — drag a dot to recalibrate.</div>';
}
renderDefinitions(); renderMiniPicker(); renderAll();
</script>
</body>
</html>
