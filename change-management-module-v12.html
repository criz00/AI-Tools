function Eyebrow({ children }) {
  return (
    <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, letterSpacing: "0.12em", color: C.teal, textTransform: "uppercase", fontWeight: 500, marginBottom: 8 }}>

}

/* Textarea that grows automatically as the person types, instead of relying
   on a manual drag-handle nobody notices. Still keeps resize:vertical as a
   fallback in case someone wants to shrink it back down. */
function AutoTextarea({ value, onChange, placeholder, style, minHeight = 76 }) {
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    el.style.height = "auto";
    el.style.height = Math.max(el.scrollHeight, minHeight) + "px";
  }, [value, minHeight]);
  return (
    <textarea
      ref={ref}
      value={value || ""}
      onChange={onChange}
      placeholder={placeholder || ""}
      style={{ width: "100%", ...style, overflow: "hidden", resize: "vertical", minHeight, boxSizing: "border-box" }}
    />
  );
}

function Field({ label, value, onChange, placeholder, area, rows = 4, type = "text", help, required }) {
  const shared = {
    value: value || "",
    onChange: (e) => onChange(e.target.value),
    placeholder: placeholder || "",
    style: {
      width: "100%",
      boxSizing: "border-box",
      fontFamily: "'IBM Plex Sans', sans-serif",
      fontSize: 14.5,
      color: C.ink,
      background: C.card,
      border: `1px solid ${C.line}`,
      borderRadius: 8,
      padding: "12px 14px",
      outline: "none",
    },
  };
  return (
    <div style={{ marginBottom: 32 }}>
      {label && <label style={{ display: "block", fontSize: 13.5, fontWeight: 500, color: C.ink, marginBottom: 6 }}>{label}{required && <span style={{ color: C.red }}> *</span>}</label>}
      {help && <div style={{ fontSize: 12, color: C.inkSoft, marginBottom: 6, lineHeight: 1.4 }}>{help}</div>}
      {area ? <AutoTextarea value={shared.value} onChange={shared.onChange} placeholder={shared.placeholder} style={shared.style} minHeight={96} /> : <input type={type} {...shared} />}
    </div>
  );
}

function YesNo({ label, value, onChange, detailLabel = "Tell us more", area = true }) {
  const v = value || { yes: null, detail: "" };
  return (
    <div style={{ marginBottom: 32 }}>
      <label style={{ display: "block", fontSize: 13.5, fontWeight: 500, color: C.ink, marginBottom: 8 }}>{label}</label>
      <div style={{ display: "flex", gap: 8, marginBottom: v.yes === true ? 10 : 0 }}>
        {["Yes", "No", "N/A"].map((opt) => {
          const optVal = opt === "Yes" ? true : opt === "No" ? false : "na";
          const active = v.yes === optVal;
          return (
            <button
              key={opt}
              onClick={() => onChange({ ...v, yes: optVal })}
              style={{
                fontFamily: "'IBM Plex Sans', sans-serif",
                fontSize: 13.5,
                fontWeight: 500,
                padding: "7px 18px",
                borderRadius: 999,
                border: `1px solid ${active ? (opt === "N/A" ? C.inkSoft : C.teal) : C.line}`,
                background: active ? (opt === "N/A" ? C.inkSoft : C.teal) : C.card,
                color: active ? "#fff" : C.inkSoft,
                cursor: "pointer",
              }}
            >
              {opt}
            </button>
          );
        })}
      </div>
      {v.yes === true && (
        area ? (
          <AutoTextarea
            value={v.detail}
            onChange={(e) => onChange({ ...v, detail: e.target.value })}
            placeholder={detailLabel}
            minHeight={80}
            style={{ width: "100%", fontFamily: "'IBM Plex Sans', sans-serif", fontSize: 14, color: C.ink, background: C.card, border: `1px solid ${C.line}`, borderRadius: 8, padding: "12px 14px", outline: "none" }}
          />
        ) : (
          <input
            type="text"
            value={v.detail}
            onChange={(e) => onChange({ ...v, detail: e.target.value })}
            placeholder={detailLabel}
            style={{ width: "100%", fontFamily: "'IBM Plex Sans', sans-serif", fontSize: 14, color: C.ink, background: C.card, border: `1px solid ${C.line}`, borderRadius: 8, padding: "12px 14px", outline: "none" }}
          />
        )
      )}
    </div>
  );
}

/* Add-a-line list, used for Start / Stop / Continue */
function LineList({ label, items, onChange, placeholder }) {
  const add = () => onChange([...items, { id: uid(), text: "" }]);
  const remove = (id) => onChange(items.length > 1 ? items.filter((i) => i.id !== id) : items);
  const set = (id, text) => {
    if (items.some((i) => i.id === id)) {
      onChange(items.map((i) => (i.id === id ? { ...i, text } : i)));
    } else {
      onChange([...items, { id, text }]);
    }
  };
  const list = items.length ? items : [{ id: uid(), text: "" }];

  return (
    <div>
      <div style={{ fontSize: 11, fontWeight: 600, color: C.inkSoft, marginBottom: 8, textTransform: "uppercase", letterSpacing: "0.04em" }}>{label}</div>
      <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 8 }}>
        {list.map((item) => (
          <div key={item.id} style={{ display: "flex", gap: 6 }}>
            <input
              value={item.text}
              onChange={(e) => set(item.id, e.target.value)}
              placeholder={placeholder}
              style={{ flex: 1, fontFamily: "'IBM Plex Sans', sans-serif", fontSize: 13.5, color: C.ink, background: C.card, border: `1px solid ${C.line}`, borderRadius: 7, padding: "8px 10px", outline: "none" }}
            />
            {list.length > 1 && (
              <IconBtn onClick={() => remove(item.id)} danger><Trash2 size={13} /></IconBtn>
            )}
          </div>
        ))}
      </div>
      <GhostBtn onClick={add}><Plus size={14} /> Add another</GhostBtn>
    </div>
  );
}

      onClick={onClick}
      style={{
        display: "inline-flex", alignItems: "center", justifyContent: "center",
        width: 30, height: 30, borderRadius: 7, border: `1px solid ${C.line}`,
        background: C.card, color: danger ? C.red : C.inkSoft, cursor: "pointer", flexShrink: 0,
      }}
    >
      {children}
    </button>
  );
}

/* Delete button that requires a second click within a few seconds to confirm,
   instead of deleting instantly or interrupting with a modal for every row. */
function DeleteButton({ onDelete }) {
  const [confirming, setConfirming] = useState(false);
  const timer = useRef(null);
  useEffect(() => () => { if (timer.current) clearTimeout(timer.current); }, []);
  const handleClick = () => {
    if (confirming) {
      if (timer.current) clearTimeout(timer.current);
      setConfirming(false);
      onDelete();
    } else {
      setConfirming(true);
      timer.current = setTimeout(() => setConfirming(false), 2500);
    }
  };
  return (
    <button
      onClick={handleClick}
      title={confirming ? "Click again to confirm delete" : "Delete"}
      style={{
        display: "inline-flex", alignItems: "center", justifyContent: "center", gap: 6,
        height: 30, padding: confirming ? "0 12px" : 0, width: confirming ? "auto" : 30,
        borderRadius: 7, border: `1px solid ${confirming ? C.red : C.line}`,
        background: confirming ? C.red : C.card, color: confirming ? "#fff" : C.red, cursor: "pointer", flexShrink: 0,
        fontSize: 12, fontWeight: 600, fontFamily: "'IBM Plex Sans', sans-serif", whiteSpace: "nowrap",
      }}
    >
      <Trash2 size={14} />
      {confirming && "Confirm?"}
    </button>
  );
}

function Select({ value, onChange, options, placeholder }) {
  return (
    <select
      value={value || ""}
      onChange={(e) => onChange(e.target.value)}
      style={{
        fontFamily: "'IBM Plex Sans', sans-serif", fontSize: 13.5, color: C.ink,
        background: C.card, border: `1px solid ${C.line}`, borderRadius: 8,
        padding: "8px 10px", outline: "none", width: "100%",
      }}
    >
      <option value="">{placeholder || "Select..."}</option>
      {options.map((o) => (
        <option key={o} value={o}>{o}</option>
      ))}
    </select>
  );
}

/* Multi-select rendered as toggleable chips */
function MultiSelect({ value, onChange, options, placeholder }) {
  const v = value || [];
  if (options.length === 0) {
    return <div style={{ fontSize: 12.5, color: C.inkSoft, fontStyle: "italic", padding: "8px 0" }}>{placeholder || "No options yet"}</div>;
  }
  const toggle = (opt) => onChange(v.includes(opt) ? v.filter((x) => x !== opt) : [...v, opt]);
  return (
    <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
      {options.map((opt) => {
        const active = v.includes(opt);
        return (
          <button
            key={opt}
            onClick={() => toggle(opt)}
            style={{
              fontFamily: "'IBM Plex Sans', sans-serif", fontSize: 12.5, fontWeight: 500,
              padding: "5px 11px", borderRadius: 999, cursor: "pointer",
              border: `1px solid ${active ? C.teal : C.line}`,
              background: active ? C.teal : C.card, color: active ? "#fff" : C.inkSoft,
            }}
          >
            {opt}
          </button>
        );
      })}
    </div>
  );
}

/* Checklist of "which of these apply" items sharing one detail box, replacing
   a stack of near-identical Yes/No-plus-detail questions. */
function ChecklistBlock({ items, checked, onChangeChecked, detail, onChangeDetail, detailLabel = "Tell us more about what's checked above" }) {
  const toggle = (key) => onChangeChecked(checked.includes(key) ? checked.filter((k) => k !== key) : [...checked, key]);
  return (
    <div style={{ marginBottom: 8 }}>
      <div style={{ display: "flex", flexDirection: "column", gap: 10, marginBottom: checked.length ? 16 : 0 }}>
        {items.map((item) => {
          const active = checked.includes(item.key);
          return (
            <button
              key={item.key}
              onClick={() => toggle(item.key)}
              style={{
                display: "flex", alignItems: "center", gap: 10, textAlign: "left",
                padding: "12px 14px", borderRadius: 9, cursor: "pointer",
                border: `1.5px solid ${active ? C.teal : C.line}`, background: active ? C.tealSoft : C.card,
                fontFamily: "'IBM Plex Sans', sans-serif",
              }}
            >
              <span style={{
                width: 18, height: 18, borderRadius: 5, flexShrink: 0, display: "flex", alignItems: "center", justifyContent: "center",
                border: `1.5px solid ${active ? C.teal : C.inkSoft}`, background: active ? C.teal : "transparent",
              }}>
                {active && <CheckCircle2 size={13} color="#fff" style={{ margin: -1 }} />}
              </span>
              <span style={{ fontSize: 13.5, color: C.ink }}>{item.label}</span>
            </button>
          );
        })}
      </div>
      {checked.length > 0 && (
        <AutoTextarea
          value={detail}
          onChange={(e) => onChangeDetail(e.target.value)}
          placeholder={detailLabel}
          minHeight={90}
          style={{ width: "100%", fontFamily: "'IBM Plex Sans', sans-serif", fontSize: 14, color: C.ink, background: C.card, border: `1px solid ${C.line}`, borderRadius: 8, padding: "12px 14px", outline: "none" }}
        />
      )}
    </div>
  );
}

/* generic repeater for simple multi-field rows */
function Repeater({ items, onChange, fields, addLabel, empty }) {
  const add = () => {
    const row = { id: uid() };
    fields.forEach((f) => (row[f.key] = ""));
    onChange([...items, row]);
  };
  const remove = (id) => onChange(items.filter((r) => r.id !== id));
  const set = (id, key, val) => onChange(items.map((r) => (r.id === id ? { ...r, [key]: val } : r)));

  return (
    <div>
      {items.length === 0 && (
        <div style={{ fontSize: 13.5, color: C.inkSoft, fontStyle: "italic", marginBottom: 12 }}>{empty}</div>
      )}
      <div style={{ display: "flex", flexDirection: "column", gap: 16, marginBottom: 14 }}>
        {items.map((row) => (
          <div key={row.id} style={{ border: `1px solid ${C.line}`, borderRadius: 10, padding: 18, background: C.cardAlt, display: "flex", gap: 12, alignItems: "flex-start" }}>
            <div style={{ display: "flex", flexDirection: "column", gap: 14, flex: 1 }}>
              {fields.map((f) => (
                <div key={f.key}>
                  <div style={{ fontSize: 11, fontWeight: 500, color: C.inkSoft, marginBottom: 5, textTransform: "uppercase", letterSpacing: "0.04em" }}>{f.label}</div>
                  {f.type === "select" ? (
                    <Select value={row[f.key]} onChange={(v) => set(row.id, f.key, v)} options={f.options} />
                  ) : f.type === "textarea" ? (
                    <AutoTextarea
                      value={row[f.key]}
                      onChange={(e) => set(row.id, f.key, e.target.value)}
                      minHeight={76}
                      style={{ width: "100%", fontFamily: "'IBM Plex Sans', sans-serif", fontSize: 13.5, color: C.ink, background: C.card, border: `1px solid ${C.line}`, borderRadius: 7, padding: "10px 12px", outline: "none" }}
                    />
                  ) : (
                    <input
                      type={f.type === "number" ? "number" : "text"}
                      value={row[f.key]}
                      onChange={(e) => set(row.id, f.key, e.target.value)}
                      style={{ width: "100%", fontFamily: "'IBM Plex Sans', sans-serif", fontSize: 13.5, color: C.ink, background: C.card, border: `1px solid ${C.line}`, borderRadius: 7, padding: "10px 12px", outline: "none" }}
                    />
                  )}
                </div>
              ))}
            </div>
            <DeleteButton onDelete={() => remove(row.id)} />
          </div>
        ))}
      </div>
      <GhostBtn onClick={add}><Plus size={15} /> {addLabel}</GhostBtn>
    </div>
  );
}

/* ---------------------------------------------------------------- */
/* impact / readiness helpers                                        */
/* ---------------------------------------------------------------- */

function overallLevel(dims) {
  const vals = Object.values(dims).filter(Boolean);
  if (vals.length < 4) return null;
  const score = { Low: 1, Medium: 2, High: 3 };
  const avg = vals.reduce((s, v) => s + score[v], 0) / vals.length;
  if (avg >= 2.4) return "High";
  if (avg >= 1.6) return "Medium";
  return "Low";
}

function computeOverallImpact(groups, ratings) {
  const levels = groups.map((g) => overallLevel(ratings[g.id] || {})).filter(Boolean);
  if (levels.length === 0) return null;
  const score = { Low: 1, Medium: 2, High: 3 };
  const avg = levels.reduce((s, l) => s + score[l], 0) / levels.length;
  if (avg >= 2.4) return "High";
  if (avg >= 1.6) return "Medium";
  return "Low";
}

function catAverage(readinessRatings, key, len) {
  const rows = readinessRatings[key];
  if (!rows) return null;
  const scored = rows.filter((r) => r && r.score);
  if (scored.length < len) return null;
  return scored.reduce((s, r) => s + r.score, 0) / scored.length;
}

function overallReadiness(readinessRatings) {
  const avgs = READINESS_CATS.map((c) => catAverage(readinessRatings, c.key, c.statements.length)).filter((v) => v !== null);
  if (avgs.length === 0) return null;
  return avgs.reduce((a, b) => a + b, 0) / avgs.length;
}

function readinessFullyScored(readinessRatings) {
  return READINESS_CATS.every((c) => catAverage(readinessRatings, c.key, c.statements.length) !== null);
}

function readinessLevel(avg) {
  if (avg === null) return null;
  if (avg >= 3.75) return "High";
  if (avg >= 2.5) return "Medium";
  return "Low";
}

function phaseComplete(data, index) {
  if (index === 0) {
    const s = data.setup;
    return !!(data.setup.initiativeName && s.sponsor.name && s.accountable.name && s.cmLead.name && s.projectLead.name);
  }
  if (index === 1) {
    const im = data.impact;
    if (!(im.whatChanging && im.why && im.urgency && im.outcome && im.groups.length > 0)) return false;
    return im.groups.every((g) => overallLevel(im.ratings[g.id] || {}) !== null);
  }
  if (index === 2) {
    return readinessFullyScored(data.readiness.ratings);
  }
  if (index === 3) {
    return PLAN_SECTIONS.every((sec) => data.plan.actions.some((a) => a.section === sec.key && a.action));
  }
  if (index === 4) {
    const actions = data.plan.actions.filter((a) => a.action);
    return actions.length > 0 && actions.every((a) => a.status !== "Not Started");
  }
  if (index === 5) {
    const actions = data.plan.actions.filter((a) => a.action);
    return actions.length > 0 && actions.every((a) => a.status === "Complete");
  }
  return false;
}

const PHASE_REQUIREMENTS = [
  [
    { label: "Initiative is named", check: (d) => !!d.setup.initiativeName, stepKey: "ownership" },
    { label: "Executive sponsor named", check: (d) => !!d.setup.sponsor.name, stepKey: "ownership" },
    { label: "Accountable owner named", check: (d) => !!d.setup.accountable.name, stepKey: "ownership" },
    { label: "Change management lead named", check: (d) => !!d.setup.cmLead.name, stepKey: "ownership" },
    { label: "Project/implementation lead named", check: (d) => !!d.setup.projectLead.name, stepKey: "ownership" },
  ],
  [
    { label: "What's changing, why, why now, and the outcome are described", check: (d) => !!(d.impact.whatChanging && d.impact.why && d.impact.urgency && d.impact.outcome), stepKey: "overview" },
    { label: "At least one affected group added", check: (d) => d.impact.groups.length > 0, stepKey: "stakeholders" },
    { label: "Every affected group has an Impact Level rating", check: (d) => d.impact.groups.length > 0 && d.impact.groups.every((g) => overallLevel(d.impact.ratings[g.id] || {}) !== null), stepKey: "impactLevel" },
  ],
  [
    { label: "All 8 readiness categories fully scored", check: (d) => readinessFullyScored(d.readiness.ratings), stepKey: "awareness" },
  ],
  [
    { label: "Every one of the 7 plan sections has at least one action", check: (d) => PLAN_SECTIONS.every((sec) => d.plan.actions.some((a) => a.section === sec.key && a.action)), stepKey: "stakeholder" },
  ],
  [
    { label: "Every action has been triaged (status set beyond Not Started)", check: (d) => { const a = d.plan.actions.filter((x) => x.action); return a.length > 0 && a.every((x) => x.status !== "Not Started"); }, stepKey: "planactions" },
  ],
  [
    { label: "Every action marked Complete", check: (d) => { const a = d.plan.actions.filter((x) => x.action); return a.length > 0 && a.every((x) => x.status === "Complete"); }, stepKey: "planactions" },
  ],
];

/* ---------------------------------------------------------------- */
/* App                                                                */
/* ---------------------------------------------------------------- */

function App() {
  const [data, setData] = useState(initialData());
  const [mode, setMode] = useState("full"); // 'quick' | 'full'
  const [phase, setPhase] = useState(0);
  const [step, setStep] = useState(0);
  const [loaded, setLoaded] = useState(false);
  const [showWelcome, setShowWelcome] = useState(true);
  const [infoPhase, setInfoPhase] = useState(null);
  const [confirmModal, setConfirmModal] = useState(null); // { message, onConfirm }
  const [showSummary, setShowSummary] = useState(false);
  const [saveStatus, setSaveStatus] = useState("idle"); // 'idle' | 'saving' | 'saved'
  const saveTimer = useRef(null);
  const savedFlashTimer = useRef(null);

  useEffect(() => {
    (async () => {
      try {
        const raw = localStorage.getItem("cm-module-draft");
        const res = raw ? { value: raw } : null;
        if (res && res.value) {
          const parsed = JSON.parse(res.value);
          if (parsed && parsed.data) setData(parsed.data);
          if (parsed && parsed.mode) setMode(parsed.mode);
          if (parsed && parsed.data && parsed.data.setup.initiativeName) setShowWelcome(false);
        }
      } catch (e) { /* nothing saved yet */ }
      setLoaded(true);
    })();
  }, []);

  useEffect(() => {
    if (!loaded) return;
    setSaveStatus("saving");
    if (saveTimer.current) clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(async () => {
      try {
        localStorage.setItem("cm-module-draft", JSON.stringify({ data, mode }));
        setSaveStatus("saved");
        if (savedFlashTimer.current) clearTimeout(savedFlashTimer.current);
        savedFlashTimer.current = setTimeout(() => setSaveStatus("idle"), 2500);
      } catch (e) { console.error("save failed", e); setSaveStatus("idle"); }
    }, 700);
    return () => clearTimeout(saveTimer.current);
  }, [data, mode, loaded]);

  const update = (section, patch) => setData((d) => ({ ...d, [section]: { ...d[section], ...patch } }));

  const resetAll = () => {
    setConfirmModal({
      message: "Clear all entries and start over? This can't be undone.",
      onConfirm: async () => {
        setData(initialData());
        setMode("full");
        setShowWelcome(true);
        setPhase(0);
        setStep(0);
        try { localStorage.removeItem("cm-module-draft"); } catch (e) {}
      },
    });
  };

  const phaseStepsAll = getPhaseSteps(mode);
  const stepKeys = phaseStepsAll[phase];
  const stepKey = stepKeys[step];

  const goNext = () => {
    if (step < stepKeys.length - 1) setStep(step + 1);
    else if (phase < PHASES.length - 1) { setPhase(phase + 1); setStep(0); }
  };
  const goBack = () => {
    if (step > 0) setStep(step - 1);
    else if (phase > 0) { setPhase(phase - 1); setStep(phaseStepsAll[phase - 1].length - 1); }
  };
  const jump = (p, s) => { setPhase(p); setStep(s); };
  const jumpToRequirement = (p, reqStepKey) => {
    const keys = phaseStepsAll[p];
    const idx = keys.indexOf(reqStepKey);
    jump(p, idx >= 0 ? idx : 0);
  };

  useEffect(() => {
    if (step >= stepKeys.length) setStep(Math.max(0, stepKeys.length - 1));
  }, [mode, phase, stepKeys.length, step]);

  const isLast = phase === PHASES.length - 1 && step === stepKeys.length - 1;

  const overallImpact = computeOverallImpact(data.impact.groups, data.impact.ratings);
  const readyAvg = overallReadiness(data.readiness.ratings);
  const overallReady = readinessLevel(readyAvg);

  const totalSteps = phaseStepsAll.reduce((s, arr) => s + arr.length, 0);
  const doneSteps = phaseStepsAll.slice(0, phase).reduce((s, arr) => s + arr.length, 0) + step;
  const progressPct = Math.round((doneSteps / (totalSteps - 1)) * 100);
  const completablePhases = PHASES.filter((p) => p.completable);
  const phasesComplete = PHASES.map((p, i) => p.completable && phaseComplete(data, i)).filter(Boolean).length;

  return (
    <div style={{ minHeight: "100vh", background: C.paper, fontFamily: "'IBM Plex Sans', sans-serif" }}>
      <style>{`
        ${FONT_IMPORT}
        * { box-sizing: border-box; }
        ::placeholder { color: #A8A192; }
        input:focus, textarea:focus, select:focus { border-color: ${C.teal} !important; }
        @media (prefers-reduced-motion: no-preference) {
          .cm-fade { animation: cmFade .25s ease; }
        }
        @keyframes cmFade { from { opacity: 0; transform: translateY(4px);} to {opacity:1; transform:none;} }
        @media print {
          body * { visibility: hidden; }
          #cm-print-area, #cm-print-area * { visibility: visible; }
          #cm-print-area { position: absolute; top: 0; left: 0; width: 100%; }
          .cm-no-print { display: none !important; }
          .cm-print-only { display: block !important; }
        }
      `}</style>

      {/* header */}
      <div style={{ borderBottom: `1px solid ${C.line}`, background: C.card, position: "sticky", top: 0, zIndex: 10 }}>
        <div style={{ maxWidth: 1180, margin: "0 auto", padding: "16px 24px 0" }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 20, marginBottom: 14 }}>
            <div>
              <Eyebrow>Change Management Module</Eyebrow>
              <input
                value={data.setup.initiativeName}
                onChange={(e) => update("setup", { initiativeName: e.target.value })}
                placeholder="Name this initiative..."
                style={{
                  fontFamily: "'Fraunces', serif", fontWeight: 500, fontSize: 26, color: C.ink,
                  border: "none", outline: "none", background: "transparent", padding: 0, width: 420, maxWidth: "60vw",
                }}
              />
            </div>
            <div style={{ display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap" }}>
              <SaveIndicator status={saveStatus} />
              <Badge label="Sections" value={`${phasesComplete}/${completablePhases.length}`} color={phasesComplete === completablePhases.length ? C.teal : C.inkSoft} />
              {overallImpact && (
                <Badge label="Impact" value={overallImpact} color={LEVEL_COLOR[overallImpact]} />
              )}
              {overallReady && (
                <Badge label="Readiness" value={overallReady} color={LEVEL_COLOR[overallReady]} />
              )}
              <ModeToggle mode={mode} onChange={setMode} />
              <button onClick={() => setShowSummary(true)} title="View full summary" style={{ width: 34, height: 34, borderRadius: 8, border: `1px solid ${C.line}`, background: "transparent", color: C.inkSoft, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center" }}>
                <ListChecks size={15} />
              </button>
              <button onClick={() => setShowWelcome(true)} title="About this tool" style={{ width: 34, height: 34, borderRadius: 8, border: `1px solid ${C.line}`, background: "transparent", color: C.inkSoft, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", fontFamily: "'IBM Plex Serif', serif", fontStyle: "italic", fontWeight: 600, fontSize: 15 }}>
                ?
              </button>
              <button onClick={resetAll} title="Start over" style={{ width: 34, height: 34, borderRadius: 8, border: `1px solid ${C.line}`, background: "transparent", color: C.inkSoft, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center" }}>
                <RotateCcw size={15} />
              </button>
            </div>
          </div>

          {/* legend */}
          <div style={{ display: "flex", gap: 16, alignItems: "center", flexWrap: "wrap", marginBottom: 10 }}>
            <span style={{ fontSize: 11, color: C.inkSoft, fontFamily: "'IBM Plex Mono', monospace", textTransform: "uppercase", letterSpacing: "0.05em" }}>Section status:</span>
            <LegendItem swatch={{ background: "transparent", border: `1.5px solid ${C.line}` }} label="Not started" />
            <LegendItem swatch={{ background: C.tealSoft, border: `1.5px solid ${C.teal}` }} label="In progress" />
            <LegendItem swatch={{ background: C.teal, border: `1.5px solid ${C.teal}` }} label="Complete" />
          </div>

          {/* phase buttons */}
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
            {PHASES.map((p, i) => {
              const Icon = p.icon;
              const active = i === phase;
              const complete = p.completable && phaseComplete(data, i);
              const bg = complete ? C.teal : active ? C.tealSoft : "transparent";
              const color = complete ? "#fff" : active ? C.tealDark : C.inkSoft;
              const border = complete ? C.teal : active ? C.teal : C.line;
              return (
                <div key={p.label} style={{ display: "flex", alignItems: "center", border: `1.5px solid ${border}`, borderRadius: 999, background: bg, overflow: "hidden" }}>
                  <button
                    onClick={() => jump(i, 0)}
                    title={complete ? `${p.label} — complete` : p.label}
                    style={{
                      display: "flex", alignItems: "center", gap: 7,
                      padding: p.completable ? "9px 6px 9px 15px" : "9px 15px", border: "none",
                      background: "transparent", cursor: "pointer",
                      color, fontSize: 13.5, fontWeight: 500,
                    }}
                  >
                    {complete ? <CheckCircle2 size={15} /> : <Icon size={15} />} {p.label}
                  </button>
                  {p.completable && (
                    <button
                      onClick={() => setInfoPhase(infoPhase === i ? null : i)}
                      title="What's needed to complete this section"
                      style={{
                        border: "none", background: "transparent", cursor: "pointer",
                        color, opacity: 0.75, padding: "9px 13px 9px 4px", fontSize: 12, fontWeight: 700,
                      }}
                    >
                      {infoPhase === i ? "▲" : "▾"}
                    </button>
                  )}
                </div>
              );
            })}
          </div>

          {infoPhase !== null && (
            <div style={{ marginTop: 10, marginBottom: 4, background: C.cardAlt, border: `1px solid ${C.line}`, borderRadius: 10, padding: "14px 16px", maxWidth: 480 }}>
              <div style={{ fontSize: 12, fontWeight: 600, color: C.ink, marginBottom: 8 }}>To mark "{PHASES[infoPhase].label}" complete:</div>
              <div style={{ display: "flex", flexDirection: "column", gap: 2 }}>
                {PHASE_REQUIREMENTS[infoPhase].map((req, ri) => {
                  const done = req.check(data);
                  return (
                    <button
                      key={ri}
                      onClick={() => { if (!done) { jumpToRequirement(infoPhase, req.stepKey); setInfoPhase(null); } }}
                      disabled={done}
                      style={{
                        display: "flex", gap: 8, alignItems: "flex-start", fontSize: 13, color: done ? C.teal : C.ink,
                        background: "transparent", border: "none", padding: "5px 6px", borderRadius: 6,
                        cursor: done ? "default" : "pointer", textAlign: "left", fontFamily: "'IBM Plex Sans', sans-serif",
                      }}
                    >
                      {done ? <CheckCircle2 size={14} style={{ marginTop: 2, flexShrink: 0 }} /> : <span style={{ width: 14, height: 14, borderRadius: 99, border: `1.5px solid ${C.inkSoft}`, marginTop: 2, flexShrink: 0, display: "inline-block" }} />}
                      <span style={{ textDecoration: done ? "line-through" : "none" }}>{req.label}</span>
                    </button>
                  );
                })}
              </div>
            </div>
          )}
        </div>
        <div style={{ height: 3, background: C.cardAlt }}>
          <div style={{ height: "100%", width: `${progressPct}%`, background: C.teal, transition: "width .3s ease" }} />
        </div>
      </div>

      {showSummary && <SummaryOverlay data={data} overallImpact={overallImpact} overallReady={overallReady} onClose={() => setShowSummary(false)} />}
      {showWelcome && <WelcomeOverlay mode={mode} onStart={(m) => { setMode(m); setShowWelcome(false); }} />}
      {confirmModal && (
        <ConfirmModal
          message={confirmModal.message}
          onCancel={() => setConfirmModal(null)}
          onConfirm={() => { confirmModal.onConfirm(); setConfirmModal(null); }}
        />
      )}

      {/* body */}
      <div style={{ maxWidth: 1180, margin: "0 auto", padding: "34px 24px 120px" }} className="cm-fade" key={phase + "-" + step}>
        {step === 0 && (
          <div style={{ display: "flex", gap: 10, alignItems: "flex-start", background: C.tealSoft, border: `1px solid ${C.teal}33`, borderRadius: 12, padding: "14px 16px", marginBottom: 20 }}>
            <Compass size={16} color={C.teal} style={{ marginTop: 2, flexShrink: 0 }} />
            <p style={{ fontSize: 13.5, color: C.ink, lineHeight: 1.55, margin: 0 }}>{PHASE_DESCRIPTIONS[phase]}</p>
          </div>
        )}

        <StepDots steps={stepKeys} current={step} onJump={(s) => setStep(s)} labels={stepLabels(phase, stepKeys)} />

        <div style={{ marginTop: 22 }}>
          {phase === 0 && <SetupScreen stepKey={stepKey} data={data} update={update} />}
          {phase === 1 && <ImpactScreen stepKey={stepKey} data={data} update={update} />}
          {phase === 2 && <ReadinessScreen stepKey={stepKey} data={data} update={update} overallImpact={overallImpact} readyAvg={readyAvg} overallReady={overallReady} />}
          {phase === 3 && <PlanScreen stepKey={stepKey} data={data} update={update} overallImpact={overallImpact} overallReady={overallReady} />}
          {phase === 4 && <ActionPlanScreen stepKey={stepKey} data={data} update={update} />}
          {phase === 5 && <MonitoringDashboardScreen data={data} overallReady={overallReady} />}
        </div>
      </div>

      {/* footer nav */}
      <div style={{ position: "fixed", bottom: 0, left: 0, right: 0, background: C.card, borderTop: `1px solid ${C.line}` }}>
        <div style={{ maxWidth: 1180, margin: "0 auto", padding: "14px 24px", display: "flex", justifyContent: "space-between" }}>
          <GhostBtn onClick={goBack}><ChevronLeft size={16} /> Back</GhostBtn>
          {!isLast ? (
            <PrimaryBtn onClick={goNext}>Continue <ChevronRight size={16} /></PrimaryBtn>
          ) : (
            <div style={{ display: "flex", alignItems: "center", gap: 8, color: C.teal, fontWeight: 500, fontSize: 14 }}>
              <CheckCircle2 size={17} /> You're all caught up
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

function LegendItem({ swatch, label }) {

                </div>

        </div>
        <p style={{ fontSize: 12.5, color: C.inkSoft, lineHeight: 1.5, margin: "0 0 22px", display: "flex", gap: 8, alignItems: "flex-start" }}>
          <CheckCircle2 size={14} color={C.teal} style={{ marginTop: 2, flexShrink: 0 }} />

          <GhostBtn onClick={onCancel}>Cancel</GhostBtn>
          <button

    <div style={{ marginBottom: 26, breakInside: "avoid" }}>
      <div style={{ fontFamily: "'Fraunces', serif", fontWeight: 500, fontSize: 18, color: C.ink, marginBottom: 12, paddingBottom: 8, borderBottom: `2px solid ${C.ink}` }}>{title}</div>
      {children}
    </div>
  );
}

function SumRow({ label, value }) {
  return (
    <div style={{ marginBottom: 10 }}>
      <div style={{ fontSize: 11, fontWeight: 600, color: C.teal, textTransform: "uppercase", letterSpacing: "0.03em", marginBottom: 2 }}>{label}</div>

}

function SummaryOverlay({ data, overallImpact, overallReady, onClose }) {

  const actions = pl.actions.filter((a) => a.action);

      <div

      >
        <div id="cm-print-area">
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 26 }} className="cm-no-print">

              <h1 style={{ fontFamily: "'Fraunces', serif", fontWeight: 500, fontSize: 24, color: C.ink, margin: 0 }}>{s.initiativeName || "Untitled Initiative"}</h1>
            </div>
            <div style={{ display: "flex", gap: 8 }}>
              <GhostBtn onClick={() => window.print()}><ListChecks size={15} /> Print / Save as PDF</GhostBtn>
              <IconBtn onClick={onClose}><ChevronLeft size={15} /></IconBtn>

          <h1 className="cm-print-only" style={{ display: "none", fontFamily: "'Fraunces', serif", fontWeight: 500, fontSize: 24, color: C.ink, margin: "0 0 24px" }}>{s.initiativeName || "Untitled Initiative"} — Change Plan Summary</h1>

          <SumSection title="Setup & Governance">
            <SumRow label="Executive Sponsor" value={`${s.sponsor.name}${s.sponsor.title ? ", " + s.sponsor.title : ""}`} />
            <SumRow label="Accountable Owner" value={`${s.accountable.name}${s.accountable.title ? ", " + s.accountable.title : ""}`} />
            <SumRow label="Change Management Lead" value={`${s.cmLead.name}${s.cmLead.title ? ", " + s.cmLead.title : ""}`} />
            <SumRow label="Project Lead" value={`${s.projectLead.name}${s.projectLead.title ? ", " + s.projectLead.title : ""}`} />
            <SumRow label="Change Team" value={s.team.map((t) => `${t.name || "—"} (${t.role || "—"})`).join("; ")} />

            <SumRow label="Escalation Process" value={s.escalation} />

          <SumSection title="Organizational Impact">

            <SumRow label="Why" value={im.why} />

            <SumRow label="Effective Date" value={im.effectiveDate} />

          <SumSection title="Change Readiness">
            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(180px, 1fr))", gap: 10, marginBottom: 10 }}>
              {READINESS_CATS.map((c) => {
                const avg = catAverage(rr, c.key, c.statements.length);
                return <SumRow key={c.key} label={c.title} value={avg !== null ? `${avg.toFixed(1)} / 5` : "Not scored"} />;
              })}
            </div>
            <SumRow label="Overall Impact × Readiness" value={overallImpact && overallReady ? `${overallImpact} impact, ${overallReady} readiness` : "Incomplete"} />

          <SumSection title="Action Plan">
            {actions.length === 0 ? (
              <div style={{ fontSize: 13.5, color: C.inkSoft, fontStyle: "italic" }}>No actions documented yet.</div>
            ) : (
              <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 12.5 }}>

                  {actions.map((a) => (

                      <td style={{ padding: "6px 8px" }}>{a.owner || "—"}</td>
