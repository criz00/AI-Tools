function stepLabels(phase, keys) {
  const maps = [
    { ownership: "Ownership", team: "Change Team", governance: "Governance" },
    { overview: "Overview", stakeholders: "Stakeholders", roles: "Roles", processes: "Processes", technology: "Technology", skills: "Skills", policies: "Policies", impactLevel: "Impact Level", summary: "Summary" },
    Object.fromEntries(READINESS_CATS.map((c) => [c.key, c.title.split(" ")[0]]).concat([["pairing", "Impact × Readiness"]])),
    Object.fromEntries(PLAN_SECTIONS.map((s) => [s.key, s.title])),
    { planactions: "Change Management Plan Actions" },
    { dashboard: "Dashboard" },
  ];
  return keys.map((k) => maps[phase][k] || k);
}

function StepDots({ steps, current, onJump, labels }) {
  if (steps.length <= 1) return null;
  return (
    <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
      {steps.map((s, i) => {
        const active = i === current;
        const done = i < current;
        return (
          <button
            key={s}
            onClick={() => onJump(i)}
            style={{
              fontSize: 12, fontFamily: "'IBM Plex Sans', sans-serif", fontWeight: 500,
              padding: "5px 11px", borderRadius: 999, cursor: "pointer",
              border: `1px solid ${active ? C.teal : C.line}`,
              background: active ? C.teal : done ? C.tealSoft : "transparent",
              color: active ? "#fff" : done ? C.tealDark : C.inkSoft,
            }}
          >
            {labels[i]}
          </button>
        );
      })}
    </div>
  );
}

/* ---------------------------------------------------------------- */
/* Phase 1 — Setup & Governance                                      */
/* ---------------------------------------------------------------- */

function RequiredLegend() {
  return (
    <div style={{ fontSize: 12, color: C.inkSoft, marginBottom: 18, marginTop: -6 }}>
      <span style={{ color: C.red }}>*</span> Required for this section to be marked complete
    </div>
  );
}

function PersonFields({ label, value, onChange, required }) {
  return (
    <div style={{ marginBottom: 32 }}>
      <label style={{ display: "block", fontSize: 13.5, fontWeight: 500, color: C.ink, marginBottom: 6 }}>{label}{required && <span style={{ color: C.red }}> *</span>}</label>
      <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
        <input value={value.name} onChange={(e) => onChange({ ...value, name: e.target.value })} placeholder="Name"
          style={{ width: "100%", fontFamily: "'IBM Plex Sans', sans-serif", fontSize: 14.5, color: C.ink, background: C.card, border: `1px solid ${C.line}`, borderRadius: 8, padding: "12px 14px", outline: "none" }} />
        <input value={value.title} onChange={(e) => onChange({ ...value, title: e.target.value })} placeholder="Job title"
          style={{ width: "100%", fontFamily: "'IBM Plex Sans', sans-serif", fontSize: 14.5, color: C.ink, background: C.card, border: `1px solid ${C.line}`, borderRadius: 8, padding: "12px 14px", outline: "none" }} />
      </div>
    </div>
  );
}

function SetupScreen({ stepKey, data, update }) {
  const s = data.setup;
  const set = (patch) => update("setup", patch);

  if (stepKey === "ownership") {
    return (
      <Card>
        <Eyebrow>Change Ownership</Eyebrow>
        <RequiredLegend />
        <PersonFields label="Executive sponsor" value={s.sponsor} onChange={(v) => set({ sponsor: v })} required />
        <PersonFields label="Who is accountable for the overall success of the change?" value={s.accountable} onChange={(v) => set({ accountable: v })} required />
        <PersonFields label="Who is leading the change management effort?" value={s.cmLead} onChange={(v) => set({ cmLead: v })} required />
        <PersonFields label="Who is leading the overall project or implementation?" value={s.projectLead} onChange={(v) => set({ projectLead: v })} required />
      </Card>
    );
  }
  if (stepKey === "team") {
    return (
      <>
        <Card style={{ marginBottom: 20 }}>
          <Eyebrow>Change Team</Eyebrow>
          <p style={{ fontSize: 14, color: C.inkSoft, marginTop: -4, marginBottom: 14 }}>Who's on the core change team, and what each person will do.</p>
          <Repeater
            items={s.team}
            onChange={(v) => set({ team: v })}
            addLabel="Add team member"
            empty="No team members added yet."
            fields={[
              { key: "name", label: "Name" },
              { key: "function", label: "Business Function" },
              { key: "role", label: "Role on Change Team" },
              { key: "roleDescription", label: "Role Description", type: "textarea", wide: true },
              { key: "contact", label: "Contact Info" },
            ]}
          />
        </Card>
        <Card>
          <Eyebrow>Extended Contributors</Eyebrow>
          <p style={{ fontSize: 14, color: C.inkSoft, marginTop: -4, marginBottom: 14 }}>Anyone who needs to be involved but isn't on the core team.</p>
          <Repeater
            items={s.smes}
            onChange={(v) => set({ smes: v })}
            addLabel="Add contributor"
            empty="None yet — add if applicable."
            fields={[
              { key: "name", label: "Name" },
              { key: "function", label: "Business Function" },
              { key: "role", label: "Role in the Change" },
            ]}
          />
        </Card>
      </>
    );
  }
  if (stepKey === "governance") {
    return (
      <Card>
        <Eyebrow>Governance</Eyebrow>
        <Field label="Who has final decision-making authority for the change?" value={s.decisionAuthority} onChange={(v) => set({ decisionAuthority: v })} area rows={2} />
        <Field label="How will major issues, risks, or decisions be escalated?" value={s.escalation} onChange={(v) => set({ escalation: v })} area />
      </Card>
    );
  }
  return null;
}

/* ---------------------------------------------------------------- */
/* Phase 2 — Organizational Impact Assessment                        */
/* ---------------------------------------------------------------- */

function ImpactScreen({ stepKey, data, update }) {
  const im = data.impact;
  const set = (patch) => update("impact", patch);

  if (stepKey === "overview") {
    return (
      <Card>
        <Eyebrow>Change Overview</Eyebrow>
        <RequiredLegend />
        <Field label="What is changing?" value={im.whatChanging} onChange={(v) => set({ whatChanging: v })} area rows={5} required />
        <Field label="Why is the change being made?" value={im.why} onChange={(v) => set({ why: v })} area rows={5} required />
        <Field label="Why now? What happens if this waits?" value={im.urgency} onChange={(v) => set({ urgency: v })} area rows={4} required help="This is what a sponsor points to when someone asks 'why can't this wait until next quarter?'" />
        <Field label="What business outcome is the change intended to achieve?" value={im.outcome} onChange={(v) => set({ outcome: v })} area rows={5} required />
        <Field label="When will the change take effect?" value={im.effectiveDate} onChange={(v) => set({ effectiveDate: v })} type="date" />
      </Card>
    );
  }

  if (stepKey === "stakeholders") {
    return (
      <>
        <Card style={{ marginBottom: 20 }}>
          <Eyebrow>Stakeholders</Eyebrow>
          <p style={{ fontSize: 14, color: C.inkSoft, marginTop: -4, marginBottom: 14 }}>List every group affected by this change — a team, department, or location. You'll rate each one's impact next, and they'll carry forward automatically into Readiness and the Change Management Plan.</p>
          <Repeater
            items={im.groups}
            onChange={(v) => set({ groups: v })}
            addLabel="Add affected group"
            empty="No groups added yet."
            fields={[
              { key: "name", label: "Group" },
              { key: "count", label: "# People Affected", type: "number" },
              { key: "effect", label: "How They're Affected", type: "textarea", wide: true },
            ]}
          />
        </Card>
        <Card style={{ marginBottom: 20 }}>
          <YesNo label="Are any groups affected significantly more than others?" value={im.sigMore} onChange={(v) => set({ sigMore: v })} detailLabel="Which groups, and how?" />
          <YesNo label="Are customers, vendors, or external partners affected?" value={im.external} onChange={(v) => set({ external: v })} detailLabel="Which external groups, and how?" />
        </Card>
      </>
    );
  }

  if (stepKey === "roles") {
    return (
      <Card>
        <Eyebrow>Roles & Responsibilities</Eyebrow>
        <YesNoSimple
          label="Will any roles or responsibilities change?"
          value={im.rolesChange.yes}
          onChange={(v) => set({ rolesChange: { ...im.rolesChange, yes: v } })}
        />
        {im.rolesChange.yes === true && (
          <div style={{ marginTop: 16, marginBottom: 28 }}>
            <Repeater
              items={im.rolesChange.list}
              onChange={(v) => set({ rolesChange: { ...im.rolesChange, list: v } })}
              addLabel="Add role change"
              empty="No role changes added yet."
              fields={[{ key: "role", label: "Role / Responsibility" }, { key: "detail", label: "What Changes", type: "textarea", wide: true }]}
            />
          </div>
        )}
        <div style={{ marginBottom: 10, marginTop: 4 }}>
          <label style={{ display: "block", fontSize: 13.5, fontWeight: 500, color: C.ink, marginBottom: 8 }}>What will people need to start, stop, or continue doing?</label>
        </div>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 16, marginBottom: 8 }}>
          <LineList label="Start" items={im.start} onChange={(v) => set({ start: v })} placeholder="Something to start doing" />
          <LineList label="Stop" items={im.stop} onChange={(v) => set({ stop: v })} placeholder="Something to stop doing" />
          <LineList label="Continue" items={im.cont} onChange={(v) => set({ cont: v })} placeholder="Something to keep doing" />
        </div>
        <div style={{ height: 8 }} />
        <YesNo label="Will decision-making authority or accountability change?" value={im.authorityChange} onChange={(v) => set({ authorityChange: v })} />
        <YesNo label="Will reporting relationships or team structures change?" value={im.reportingChange} onChange={(v) => set({ reportingChange: v })} />
      </Card>
    );
  }

  if (stepKey === "processes") {
    return (
      <Card>
        <Eyebrow>Processes & Ways of Working</Eyebrow>
        <p style={{ fontSize: 14, color: C.inkSoft, marginTop: -4, marginBottom: 14 }}>List any existing processes or workflows this change affects.</p>
        <Repeater
          items={im.processes}
          onChange={(v) => set({ processes: v })}
          addLabel="Add process"
          empty="No processes added yet."
          fields={[
            { key: "name", label: "Process / Workflow" },
            { key: "whatChanges", label: "What Will Change", type: "textarea", wide: true },
            { key: "significance", label: "Significance", type: "select", options: ["Low", "Medium", "High"] },
          ]}
        />
        <div style={{ height: 18 }} />
        <YesNoSimple
          label="Are any new processes, outside of what was listed above, being introduced?"
          value={im.newProcesses.yes}
          onChange={(v) => set({ newProcesses: { ...im.newProcesses, yes: v } })}
        />
        {im.newProcesses.yes === true && (
          <Repeater
            items={im.newProcesses.list}
            onChange={(v) => set({ newProcesses: { ...im.newProcesses, list: v } })}
            addLabel="Add new process"
            empty="None added yet."
            fields={[{ key: "name", label: "New Process" }, { key: "significance", label: "Significance", type: "select", options: ["Low", "Medium", "High"] }]}
          />
        )}
        <div style={{ height: 10 }} />
        <YesNo label="Will the change affect how teams work together or depend on one another?" value={im.handoffs} onChange={(v) => set({ handoffs: v })} />
      </Card>
    );
  }

  if (stepKey === "technology") {
    return (
      <Card>
        <Eyebrow>Technology & Tools</Eyebrow>
        <p style={{ fontSize: 13.5, color: C.inkSoft, marginTop: -4, marginBottom: 18 }}>Check anything that applies, then add detail once below.</p>
        <ChecklistBlock
          items={[
            { key: "newSystems", label: "Employees will use new or different systems, tools, or technology" },
            { key: "retiredSystems", label: "Existing systems or tools will be retired" },
            { key: "accessChange", label: "Workflows, permissions, or system access will change" },
            { key: "infoHandling", label: "Employees will need to enter, update, or manage information differently" },
          ]}
          checked={im.techChecklist}
          onChangeChecked={(v) => set({ techChecklist: v })}
          detail={im.techDetail}
          onChangeDetail={(v) => set({ techDetail: v })}
          detailLabel="What's changing — which systems, what access, what's different?"
        />
      </Card>
    );
  }

  if (stepKey === "skills") {
    return (
      <Card>
        <Eyebrow>Skills & Behaviors</Eyebrow>
        <Field label="What new knowledge or skills will employees need?" value={im.newSkills} onChange={(v) => set({ newSkills: v })} area rows={5} />
        <Field label="What existing skills will become less important or obsolete?" value={im.obsoleteSkills} onChange={(v) => set({ obsoleteSkills: v })} area rows={5} />
        <Field label="What behaviors will need to change?" value={im.behaviorChange} onChange={(v) => set({ behaviorChange: v })} area rows={5} />
        <YesNo label="Will managers need new capabilities to support the change?" value={im.managerCapability} onChange={(v) => set({ managerCapability: v })} />
      </Card>
    );
  }

  if (stepKey === "policies") {
    return (
      <Card>
        <Eyebrow>Policies & Structure</Eyebrow>
        <p style={{ fontSize: 13.5, color: C.inkSoft, marginTop: -4, marginBottom: 18 }}>Check anything that applies, then add detail once below.</p>
        <ChecklistBlock
          items={[
            { key: "policyChange", label: "Policies, procedures, governance, or controls will change" },
            { key: "structureChange", label: "Organizational structures or reporting relationships will change" },
            { key: "performanceChange", label: "Performance expectations or measures will change" },
            { key: "incentiveChange", label: "Incentives or rewards will change" },
          ]}
          checked={im.policyChecklist}
          onChangeChecked={(v) => set({ policyChecklist: v })}
          detail={im.policyDetail}
          onChangeDetail={(v) => set({ policyDetail: v })}
          detailLabel="What's changing about policy, structure, performance, or incentives?"
        />
      </Card>
    );
  }

  if (stepKey === "impactLevel") {
    if (im.groups.length === 0) {
      return <Card><p style={{ fontSize: 14, color: C.inkSoft }}>Add affected groups on the Stakeholders step to rate their impact level here.</p></Card>;
    }
    return (
      <Card>
        <Eyebrow>Impact Level</Eyebrow>
        <p style={{ fontSize: 14, color: C.inkSoft, marginTop: -4, marginBottom: 18 }}>Rate each group below. Their overall impact level is calculated automatically and determines which groups get flagged as priorities later in your Change Management Plan.</p>
        <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
          {im.groups.map((g) => {
            const dims = im.ratings[g.id] || {};
            const level = overallLevel(dims);
            const setDim = (dim, val) => set({ ratings: { ...im.ratings, [g.id]: { ...dims, [dim]: val } } });
            return (
              <div key={g.id} style={{ border: `1px solid ${C.line}`, borderRadius: 10, padding: 18, background: C.cardAlt }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: g.effect ? 4 : 10, gap: 10 }}>
                  <div style={{ fontWeight: 600, fontSize: 14.5 }}>{g.name || "Unnamed group"}</div>
                  {level && <Badge label="Overall" value={level} color={LEVEL_COLOR[level]} />}
                </div>
                {g.effect && (
                  <div style={{ fontSize: 12.5, color: C.inkSoft, lineHeight: 1.5, marginBottom: 14, maxWidth: 640 }}>{g.effect}</div>
                )}
                <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(180px, 1fr))", gap: 16 }}>
                  {[
                    ["degree", "Degree of Change", "How different the future state is from how things work today."],
                    ["frequency", "Frequency", "How often this group will encounter or use the change."],
                    ["complexity", "Complexity", "How difficult the change will be to learn or carry out."],
                    ["disruption", "Disruption", "How much the change will interrupt current work or routines."],
                  ].map(([key, label, def]) => (
                    <div key={key}>
                      <div style={{ fontSize: 11, fontWeight: 500, color: C.inkSoft, marginBottom: 4, textTransform: "uppercase" }}>{label}</div>
                      <div style={{ fontSize: 11, color: C.inkSoft, marginBottom: 6, lineHeight: 1.4 }}>{def}</div>
                      <Select value={dims[key]} onChange={(v) => setDim(key, v)} options={["Low", "Medium", "High"]} />
                    </div>
                  ))}
                </div>
              </div>
            );
          })}
        </div>
      </Card>
    );
  }

  if (stepKey === "summary") {
    return (
      <Card>
        <Eyebrow>Organizational Impact — Summary</Eyebrow>
        <SummaryBlock label="What's changing" text={im.whatChanging} />
        <SummaryBlock label="Why" text={im.why} />
        <SummaryBlock label="Why now" text={im.urgency} />
        <SummaryBlock label="Target outcome" text={im.outcome} />
        <SummaryBlock label="Effective date" text={im.effectiveDate} />
        <SummaryBlock label="Affected groups" text={im.groups.map((g) => `${g.name || "—"} (${g.count || "?"} people): ${g.effect || "—"}`).join("\n") || "None entered."} />
        <SummaryBlock label="Start / Stop / Continue" text={`Start: ${im.start.map((i) => i.text).filter(Boolean).join("; ") || "—"}\nStop: ${im.stop.map((i) => i.text).filter(Boolean).join("; ") || "—"}\nContinue: ${im.cont.map((i) => i.text).filter(Boolean).join("; ") || "—"}`} />
        <SummaryBlock label="Process changes" text={im.processes.map((p) => `${p.name || "—"} — ${p.whatChanges || "—"} (${p.significance || "unrated"})`).join("\n") || "None entered."} />
        <SummaryBlock label="Technology changes" text={im.techChecklist.length > 0 ? `${im.techChecklist.length} area(s) flagged: ${im.techDetail || "no detail yet"}` : "No system changes flagged."} />
        <SummaryBlock label="Skills & behaviors" text={`New skills: ${im.newSkills || "—"}\nBehavior change: ${im.behaviorChange || "—"}`} />
        <SummaryBlock label="Impact levels" text={im.groups.map((g) => `${g.name || "—"}: ${overallLevel(im.ratings[g.id] || {}) || "not yet rated"}`).join("\n") || "None entered."} last />
      </Card>
    );
  }

  return null;
}

function SummaryBlock({ label, text, last }) {
  return (
    <div style={{ marginBottom: last ? 0 : 16, paddingBottom: last ? 0 : 16, borderBottom: last ? "none" : `1px solid ${C.line}` }}>
      <div style={{ fontSize: 12, fontWeight: 600, color: C.teal, marginBottom: 4, textTransform: "uppercase", letterSpacing: "0.04em" }}>{label}</div>
      <div style={{ fontSize: 14, color: C.ink, whiteSpace: "pre-line", lineHeight: 1.5 }}>{text || "Not yet entered."}</div>
    </div>
  );
}

/* ---------------------------------------------------------------- */
/* Phase 3 — Change Readiness Assessment                             */
/* ---------------------------------------------------------------- */

function ReadinessScreen({ stepKey, data, update, overallImpact, readyAvg, overallReady }) {
  const rr = data.readiness.ratings;

  const setRow = (catKey, idx, patch, len) => {
    const rows = rr[catKey] ? [...rr[catKey]] : Array(len).fill(null);
    rows[idx] = { ...(rows[idx] || {}), ...patch };
    update("readiness", { ratings: { ...rr, [catKey]: rows } });
  };

  const cat = READINESS_CATS.find((c) => c.key === stepKey);

  if (cat) {
    const avg = catAverage(rr, cat.key, cat.statements.length);
    return (
      <Card>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 4 }}>
          <Eyebrow>{cat.title}</Eyebrow>
          {avg !== null && <Badge label="Section avg" value={avg.toFixed(1)} color={RATING[Math.round(avg)].color} />}
        </div>
        <p style={{ fontSize: 13.5, color: C.inkSoft, marginTop: -2, marginBottom: 16, lineHeight: 1.5 }}>
          Rate each statement from 1–5, where 1 = Strongly Disagree and 5 = Strongly Agree. For each statement, identify the actions needed to improve readiness.
        </p>
        <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
          {cat.statements.map((stmt, idx) => {
            const row = (rr[cat.key] || [])[idx] || {};
            return (
              <div key={idx} style={{ border: `1px solid ${C.line}`, borderRadius: 10, padding: 14, background: C.cardAlt }}>
                <div style={{ fontSize: 14, color: C.ink, marginBottom: 10 }}>{stmt}</div>
                <div style={{ display: "flex", gap: 6, marginBottom: row.score ? 10 : 0 }}>
                  {[1, 2, 3, 4, 5].map((n) => {
                    const active = row.score === n;
                    return (
                      <button
                        key={n}
                        onClick={() => setRow(cat.key, idx, { score: n }, cat.statements.length)}
                        title={RATING[n].label}
                        style={{
                          width: 36, height: 36, borderRadius: 8, border: `1.5px solid ${active ? RATING[n].color : C.line}`,
                          background: active ? RATING[n].color : "#fff", color: active ? "#fff" : C.inkSoft,
                          fontWeight: 600, fontSize: 14, cursor: "pointer",
                        }}
                      >
                        {n}
                      </button>
                    );
                  })}
                  {row.score && <span style={{ fontSize: 12.5, color: C.inkSoft, alignSelf: "center", marginLeft: 4 }}>{RATING[row.score].label}</span>}
                </div>
                <input
                  value={row.action || ""}
                  onChange={(e) => setRow(cat.key, idx, { action: e.target.value }, cat.statements.length)}
                  placeholder="Action step to close the gap (optional)"
                  style={{ width: "100%", fontFamily: "'IBM Plex Sans', sans-serif", fontSize: 13.5, color: C.ink, background: C.card, border: `1px solid ${C.line}`, borderRadius: 7, padding: "8px 10px", outline: "none" }}
                />
              </div>
            );
          })}
        </div>
      </Card>
    );
  }

  if (stepKey === "pairing") {
    const px = overallReady === "Low" ? 0 : overallReady === "Medium" ? 1 : overallReady === "High" ? 2 : null;
    const py = overallImpact === "Low" ? 0 : overallImpact === "Medium" ? 1 : overallImpact === "High" ? 2 : null;
    return (
      <Card>
        <Eyebrow>Overall Readiness</Eyebrow>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(220px, 1fr))", gap: 14, marginBottom: 24 }}>
          {READINESS_CATS.map((c) => {
            const a = catAverage(rr, c.key, c.statements.length);
            const rows = rr[c.key] || [];
            const actionTexts = rows.map((r) => r && r.action).filter((t) => t && t.trim());
            return (
              <div key={c.key} style={{ border: `1px solid ${C.line}`, borderRadius: 10, padding: 14, background: C.cardAlt }}>
                <div style={{ fontSize: 12, fontWeight: 600, color: C.ink, marginBottom: 4 }}>{c.title}</div>
                <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 18, fontWeight: 500, color: a !== null ? RATING[Math.round(a)].color : C.line, marginBottom: actionTexts.length ? 8 : 0 }}>
                  {a !== null ? a.toFixed(1) : "—"}
                </div>
                {actionTexts.length > 0 && (
                  <ul style={{ margin: 0, paddingLeft: 16, display: "flex", flexDirection: "column", gap: 3 }}>
                    {actionTexts.map((t, i) => (
                      <li key={i} style={{ fontSize: 12, color: C.inkSoft, lineHeight: 1.45 }}>{t}</li>
                    ))}
                  </ul>
                )}
              </div>
            );
          })}
        </div>

        <div style={{ display: "flex", gap: 10, marginBottom: 24 }}>
          <Badge label="Overall readiness" value={readyAvg !== null ? `${readyAvg.toFixed(1)} · ${overallReady}` : "Not yet scored"} color={overallReady ? LEVEL_COLOR[overallReady] : C.inkSoft} />
          <Badge label="Overall impact" value={overallImpact || "Not yet rated"} color={overallImpact ? LEVEL_COLOR[overallImpact] : C.inkSoft} />
        </div>

        <Eyebrow>Impact × Readiness</Eyebrow>
        <div style={{ display: "flex", gap: 20, alignItems: "flex-start", marginTop: 10 }}>
          <div style={{ position: "relative", width: 240, height: 240 }}>
            <div style={{ position: "absolute", inset: 0, display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gridTemplateRows: "1fr 1fr 1fr", border: `1px solid ${C.line}`, borderRadius: 10, overflow: "hidden" }}>
              {Array.from({ length: 9 }).map((_, i) => {
                const col = i % 3, row = Math.floor(i / 3);
                const highlight = px !== null && py !== null && col === px && row === 2 - py;
                return <div key={i} style={{ background: highlight ? C.amberSoft : i % 2 === 0 ? "#FBF9F4" : "#F3EEE2", border: `1px solid ${C.line}` }} />;
              })}
            </div>
            {px !== null && py !== null && (
              <div style={{
                position: "absolute", width: 16, height: 16, borderRadius: 99, background: C.amber, border: "2px solid #fff", boxShadow: "0 0 0 2px " + C.amber,
                left: `${(px / 2) * 100}%`, top: `${((2 - py) / 2) * 100}%`, transform: "translate(-50%,-50%) translate(40px,40px)",
              }} />
            )}
            <div style={{ position: "absolute", left: -6, top: "50%", transform: "translate(-100%,-50%) rotate(-90deg)", fontSize: 11, color: C.inkSoft, fontFamily: "'IBM Plex Mono', monospace" }}>IMPACT →</div>
            <div style={{ position: "absolute", bottom: -22, left: "50%", transform: "translateX(-50%)", fontSize: 11, color: C.inkSoft, fontFamily: "'IBM Plex Mono', monospace" }}>READINESS →</div>
          </div>
          <div style={{ flex: 1, paddingTop: 6 }}>
            <div style={{ fontSize: 15, fontWeight: 600, marginBottom: 6, color: C.ink }}>
              {overallImpact && overallReady ? `${overallImpact} impact, ${overallReady.toLowerCase()} readiness` : "Complete both assessments to see the full picture"}
            </div>
            <p style={{ fontSize: 13.5, color: C.inkSoft, lineHeight: 1.6 }}>
              {overallImpact === "High" && overallReady === "Low" && "Largest gap on the board — the Change Management Plan will prioritize stakeholder engagement, leadership visibility, and resistance planning."}
              {overallImpact === "High" && overallReady !== "Low" && "Significant change with a reasonable foundation — the plan will focus on sustaining momentum and reinforcing new behaviors."}
              {overallImpact !== "High" && overallReady === "Low" && "Modest change, but low readiness signals a communication or awareness gap worth closing early."}
              {overallImpact !== "High" && overallReady !== "Low" && overallImpact !== null && overallReady !== null && "Favorable position — lighter-touch engagement should be enough to sustain adoption."}
              {(!overallImpact || !overallReady) && "This quadrant fills in automatically from your Impact Level and Readiness scores."}
            </p>
          </div>
        </div>
      </Card>
    );
  }

  return null;
}

/* ---------------------------------------------------------------- */
/* Phase 4 — Change Management Plan                                  */
/* ---------------------------------------------------------------- */

function ActionsRepeater({ sectionKey, data, update, groups }) {
  const all = data.plan.actions;
  const items = all.filter((a) => a.section === sectionKey);
  const owners = [
    data.setup.sponsor.name, data.setup.accountable.name, data.setup.cmLead.name, data.setup.projectLead.name,
    ...data.setup.team.map((t) => t.name),
  ].filter(Boolean);
  const groupNames = groups.map((g) => g.name).filter(Boolean);

  const add = () => update("plan", { actions: [...all, { id: uid(), section: sectionKey, action: "", group: [], owner: "", dueDate: "", measure: "", status: "Not Started", trend: "Not Yet Determined", issues: "", comments: "" }] });
  const remove = (id) => update("plan", { actions: all.filter((a) => a.id !== id) });
  const set = (id, key, val) => update("plan", { actions: all.map((a) => (a.id === id ? { ...a, [key]: val } : a)) });

  return (
    <div>
      <Eyebrow>Actions</Eyebrow>
      <p style={{ fontSize: 13.5, color: C.inkSoft, marginTop: -4, marginBottom: 16, lineHeight: 1.55 }}>
        Turn the answers above into specific actions — who owns each one, when it's due, and what success looks like. Status, issues, and comments are tracked separately in the Action Plan section.
      </p>
      {items.length === 0 && <div style={{ fontSize: 13.5, color: C.inkSoft, fontStyle: "italic", marginBottom: 12 }}>No actions added yet. These roll up automatically into the Action Plan and the Monitoring Dashboard.</div>}
      <div style={{ display: "flex", flexDirection: "column", gap: 14, marginBottom: 14 }}>
        {items.map((row) => (
          <div key={row.id} style={{ border: `1px solid ${C.line}`, borderRadius: 10, padding: 18, background: C.cardAlt }}>
            <div style={{ marginBottom: 14 }}>
              <div style={{ fontSize: 11, fontWeight: 500, color: C.inkSoft, marginBottom: 5, textTransform: "uppercase" }}>Action</div>
              <AutoTextarea value={row.action} onChange={(e) => set(row.id, "action", e.target.value)} minHeight={56} style={inputStyle} />
            </div>
            <div style={{ marginBottom: 14 }}>
              <div style={{ fontSize: 11, fontWeight: 500, color: C.inkSoft, marginBottom: 5, textTransform: "uppercase" }}>Stakeholder Group(s)</div>
              <MultiSelect value={row.group} onChange={(v) => set(row.id, "group", v)} options={groupNames} placeholder="Add stakeholder groups on the Stakeholders step first" />
            </div>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 14, marginBottom: 14 }}>
              <div>
                <div style={{ fontSize: 11, fontWeight: 500, color: C.inkSoft, marginBottom: 5, textTransform: "uppercase" }}>Owner</div>
                <Select value={row.owner} onChange={(v) => set(row.id, "owner", v)} options={owners} />
              </div>
              <div>
                <div style={{ fontSize: 11, fontWeight: 500, color: C.inkSoft, marginBottom: 5, textTransform: "uppercase" }}>Due Date</div>
                <input type="date" value={row.dueDate} onChange={(e) => set(row.id, "dueDate", e.target.value)} style={inputStyle} />
              </div>
            </div>
            <div style={{ display: "flex", gap: 10, alignItems: "flex-end" }}>
              <div style={{ flex: 1 }}>
                <div style={{ fontSize: 11, fontWeight: 500, color: C.inkSoft, marginBottom: 5, textTransform: "uppercase" }}>Success Measure</div>
                <input value={row.measure} onChange={(e) => set(row.id, "measure", e.target.value)} style={inputStyle} />
              </div>
              <DeleteButton onDelete={() => remove(row.id)} />
            </div>
          </div>
        ))}
      </div>
      <GhostBtn onClick={add}><Plus size={15} /> Add action</GhostBtn>
    </div>
  );
}

const inputStyle = { width: "100%", fontFamily: "'IBM Plex Sans', sans-serif", fontSize: 13.5, color: C.ink, background: C.card, border: `1px solid ${C.line}`, borderRadius: 7, padding: "10px 12px", outline: "none" };

function GapBanner({ section, data }) {
  const rr = data.readiness.ratings;
  if (section.key === "stakeholder") return null;
  const gaps = section.related.map((key) => {
    const cat = READINESS_CATS.find((c) => c.key === key);
    const avg = catAverage(rr, key, cat.statements.length);
    return { title: cat.title, avg };
  }).filter((g) => g.avg !== null && g.avg < 3.5);

  if (section.related.length === 0) return null;
  if (gaps.length > 0) {
    return (
      <div style={{ display: "flex", gap: 10, alignItems: "flex-start", background: C.amberSoft, border: `1px solid ${C.amber}55`, borderRadius: 10, padding: "12px 14px", marginBottom: 18 }}>
        <AlertTriangle size={16} color={C.amber} style={{ marginTop: 2, flexShrink: 0 }} />
        <div style={{ fontSize: 13.5, color: C.ink, lineHeight: 1.5 }}>
          <strong>Priority — </strong>flagged from Readiness: {gaps.map((g) => `${g.title} scored ${g.avg.toFixed(1)}/5`).join("; ")}.
        </div>
      </div>
    );
  }
  const scored = section.related.every((key) => {
    const cat = READINESS_CATS.find((c) => c.key === key);
    return catAverage(rr, key, cat.statements.length) !== null;
  });
  if (scored) {
    return (
      <div style={{ display: "flex", gap: 10, alignItems: "flex-start", background: C.tealSoft, border: `1px solid ${C.teal}44`, borderRadius: 10, padding: "12px 14px", marginBottom: 18 }}>
        <CheckCircle2 size={16} color={C.teal} style={{ marginTop: 2, flexShrink: 0 }} />
        <div style={{ fontSize: 13.5, color: C.ink, lineHeight: 1.5 }}>
          <strong>Light touch — </strong>related readiness scores are healthy. Keep this section brief.
        </div>
      </div>
    );
  }
  return null;
}

function ChangeContextCard({ data }) {
  const im = data.impact;
  if (im.groups.length === 0) return null;
  return (
    <div style={{ border: `1px solid ${C.teal}44`, background: C.tealSoft, borderRadius: 12, padding: "16px 20px", marginBottom: 20 }}>
      <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
        {im.groups.map((g) => {
          const lvl = overallLevel(im.ratings[g.id] || {});
          return <Badge key={g.id} label={g.name || "Group"} value={lvl || "unrated"} color={lvl ? LEVEL_COLOR[lvl] : C.inkSoft} />;
        })}
      </div>
    </div>
  );
}

function PlanScreen({ stepKey, data, update, overallImpact, overallReady }) {
  const section = PLAN_SECTIONS.find((s) => s.key === stepKey);
  const notes = data.plan.notes;

  if (section) {
    const setNote = (idx, val) => {
      const arr = notes[section.key] ? [...notes[section.key]] : Array(section.questions.length).fill("");
      arr[idx] = val;
      update("plan", { notes: { ...notes, [section.key]: arr } });
    };
    return (
      <>
        <ChangeContextCard data={data} />
        {section.key === "stakeholder" && (
          <div style={{ display: "flex", gap: 10, alignItems: "flex-start", background: C.tealSoft, border: `1px solid ${C.teal}33`, borderRadius: 10, padding: "12px 14px", marginBottom: 18 }}>
            <ListChecks size={15} color={C.teal} style={{ marginTop: 2, flexShrink: 0 }} />
            <p style={{ fontSize: 12.5, color: C.ink, lineHeight: 1.5, margin: 0 }}>
              Think of this whole phase as gap-to-action: sections flagged "Priority" below are pulled directly from low scores back in Change Readiness — that's what tells you where to focus first.
            </p>
          </div>
        )}
        <Card>
          <Eyebrow>{section.title}</Eyebrow>
          <GapBanner section={section} data={data} />
          {section.questions.map((q, idx) => (
            <Field key={idx} label={q} value={(notes[section.key] || [])[idx]} onChange={(v) => setNote(idx, v)} area rows={4} />
          ))}
          <div style={{ height: 6 }} />
          <ActionsRepeater sectionKey={section.key} data={data} update={update} groups={data.impact.groups} />
        </Card>
      </>
    );
  }

  return null;
}

/* ---------------------------------------------------------------- */
/* Phase 5 — Action Plan                                             */
/* ---------------------------------------------------------------- */

function ActionPlanScreen({ stepKey, data, update }) {
  if (stepKey === "planactions") {
    const actions = data.plan.actions.filter((a) => a.action);
    const set = (id, key, val) => update("plan", { actions: data.plan.actions.map((a) => (a.id === id ? { ...a, [key]: val } : a)) });
    return (
      <Card>
        <Eyebrow>Change Management Plan Actions</Eyebrow>
        {actions.length > 0 && (
          <p style={{ fontSize: 12.5, color: C.inkSoft, marginTop: -4, marginBottom: 18, lineHeight: 1.5 }}>
            Status and Trend here feed the Monitoring Dashboard's calculations automatically — keep them current as work progresses.
          </p>
        )}
        {actions.length === 0 ? (
          <div style={{ fontSize: 14, color: C.inkSoft, fontStyle: "italic" }}>No actions added yet — go to the Change Management Plan section and use "Add action" within any section.</div>
        ) : (
          <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
            {actions.map((a) => {
              const sec = PLAN_SECTIONS.find((s) => s.key === a.section);
              return (
                <div key={a.id} style={{ border: `1px solid ${C.line}`, borderRadius: 12, padding: 18, background: C.cardAlt }}>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 12, marginBottom: 12 }}>
                    <div style={{ fontSize: 15, fontWeight: 600, color: C.ink, lineHeight: 1.4 }}>{a.action}</div>
                    <Badge label="Category" value={sec ? sec.title : a.section} color={C.teal} />
                  </div>

                  <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(160px, 1fr))", gap: 10, marginBottom: 16, paddingBottom: 16, borderBottom: `1px solid ${C.line}` }}>
                    <ReadField label="Stakeholder Group(s)" value={(a.group || []).join(", ")} />
                    <ReadField label="Owner" value={a.owner} />
                    <ReadField label="Success Measure" value={a.measure} />
                    <ReadField label="Due Date" value={a.dueDate} />
                  </div>

                  <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(180px, 1fr))", gap: 14, marginBottom: 14 }}>
                    <div>
                      <div style={{ fontSize: 11, fontWeight: 500, color: C.inkSoft, marginBottom: 5, textTransform: "uppercase" }}>Status</div>
                      <Select value={a.status} onChange={(v) => set(a.id, "status", v)} options={STATUS_OPTIONS} />
                    </div>
                    <div>
                      <div style={{ fontSize: 11, fontWeight: 500, color: C.inkSoft, marginBottom: 5, textTransform: "uppercase" }}>Trend</div>
                      <Select value={a.trend} onChange={(v) => set(a.id, "trend", v)} options={TREND_OPTIONS} />
                    </div>
                  </div>

                  <div style={{ marginBottom: 14 }}>
                    <div style={{ fontSize: 11, fontWeight: 500, color: C.inkSoft, marginBottom: 5, textTransform: "uppercase" }}>Emerging Issues / Roadblocks</div>
                    <AutoTextarea value={a.issues || ""} onChange={(e) => set(a.id, "issues", e.target.value)} placeholder="None logged" minHeight={56} style={inputStyle} />
                  </div>

                  <div>
                    <div style={{ fontSize: 11, fontWeight: 500, color: C.inkSoft, marginBottom: 5, textTransform: "uppercase" }}>Comments</div>
                    <AutoTextarea value={a.comments || ""} onChange={(e) => set(a.id, "comments", e.target.value)} placeholder="Optional" minHeight={56} style={inputStyle} />
                  </div>
                </div>
              );
            })}
          </div>
        )}
      </Card>
    );
  }

  return null;
}

function ReadField({ label, value }) {
  return (
    <div>
      <div style={{ fontSize: 11, fontWeight: 500, color: C.inkSoft, marginBottom: 3, textTransform: "uppercase" }}>{label}</div>
      <div style={{ fontSize: 13.5, color: C.ink }}>{value || "—"}</div>
    </div>
  );
}

/* ---------------------------------------------------------------- */
/* Phase 6 — Monitoring Dashboard                                    */
/* ---------------------------------------------------------------- */

function isOverdue(a) {
  if (!a.dueDate || a.status === "Complete") return false;
  const today = new Date().toISOString().slice(0, 10);
  return a.dueDate < today;
}

function computeOverallStatus(actions) {
  if (actions.length === 0) return "Not Started";
  if (actions.every((a) => a.status === "Complete")) return "Complete";
  const severity = { Blocked: 5, "Off Track": 4, "At Risk": 3, "Not Started": 2, "On Track": 1, Complete: 0 };
  let worst = null;
  actions.forEach((a) => {
    if (a.status === "Complete") return;
    if (worst === null || severity[a.status] > severity[worst]) worst = a.status;
  });
  return worst || "Complete";
}

function computeOverallTrend(actions) {
  const counts = {};
  actions.forEach((a) => { const t = a.trend || "Not Yet Determined"; counts[t] = (counts[t] || 0) + 1; });
  if (Object.keys(counts).length === 0) return "Not Yet Determined";
  const priority = ["Declining", "Stable", "Improving", "Not Yet Determined"];
  let best = null, bestCount = -1;
  priority.forEach((t) => {
    const c = counts[t] || 0;
    if (c > bestCount) { bestCount = c; best = t; }
  });
  return best;
}

function leadershipSupportFor(status) {
  if (status === "Blocked") return "Immediate senior leadership intervention to remove the blocker";
  if (status === "Off Track") return "Senior leadership visibility and additional resourcing";
  if (status === "At Risk") return "Manager check-in and closer monitoring";
  return "Standard monitoring";
}

function MonitoringDashboardScreen({ data, overallReady }) {
  const actions = data.plan.actions.filter((a) => a.action);
  const complete = actions.filter((a) => a.status === "Complete").length;
  const pctComplete = actions.length > 0 ? Math.round((complete / actions.length) * 100) : 0;
  const overallStatus = computeOverallStatus(actions);
  const overallTrend = computeOverallTrend(actions);
  const attention = actions.filter((a) => ["At Risk", "Off Track", "Blocked"].includes(a.status));

  if (actions.length === 0) {
    return (
      <Card>
        <Eyebrow>Monitoring Dashboard</Eyebrow>
        <p style={{ fontSize: 14, color: C.inkSoft }}>Add actions in the Change Management Plan first — this dashboard fills in automatically once you do.</p>
      </Card>
    );
  }

  return (
    <>
      <Card style={{ marginBottom: 20 }}>
        <Eyebrow>Executive Overview</Eyebrow>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(180px, 1fr))", gap: 14, marginTop: 8 }}>
          <StatTile label="Overall Status" value={overallStatus} color={STATUS_COLOR[overallStatus] || C.inkSoft} text />
          <StatTile label="Overall Trend" value={overallTrend} color={TREND_COLOR[overallTrend] || C.inkSoft} text />
          <StatTile label="Overall Readiness" value={overallReady || "Not yet scored"} color={overallReady ? LEVEL_COLOR[overallReady] : C.inkSoft} text />
          <StatTile label="Actions Completed" value={`${pctComplete}%`} color={C.teal} />
        </div>
      </Card>

      <Card style={{ marginBottom: 20 }}>
        <Eyebrow>Actions Requiring Attention</Eyebrow>
        {attention.length === 0 ? (
          <div style={{ fontSize: 13.5, color: C.inkSoft, fontStyle: "italic" }}>No actions currently At Risk, Off Track, or Blocked.</div>
        ) : (
          <div style={{ overflowX: "auto" }}>
            <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13 }}>
              <thead>
                <tr>
                  {["Area", "Current Condition", "Leadership Support Needed"].map((h) => (
                    <th key={h} style={{ textAlign: "left", padding: "8px 10px", borderBottom: `2px solid ${C.ink}`, fontSize: 11, textTransform: "uppercase", letterSpacing: "0.03em", color: C.inkSoft }}>{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {attention.map((a) => (
                  <tr key={a.id} style={{ borderBottom: `1px solid ${C.line}` }}>
                    <td style={{ padding: "9px 10px", fontWeight: 500 }}>{a.action}</td>
                    <td style={{ padding: "9px 10px" }}>
                      <span style={{ color: STATUS_COLOR[a.status], fontWeight: 600 }}>{a.status}</span>
                      {a.issues ? ` — ${a.issues}` : ""}
                      {isOverdue(a) ? " (overdue)" : ""}
                    </td>
                    <td style={{ padding: "9px 10px" }}>{leadershipSupportFor(a.status)}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </Card>

      <Card>
        <Eyebrow>All Actions</Eyebrow>
        <p style={{ fontSize: 13.5, color: C.inkSoft, marginTop: -4, marginBottom: 16 }}>This list is read-only. Update status, issues, trend, and comments from the Action Plan section.</p>
        <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          {actions.map((a) => {
            const sec = PLAN_SECTIONS.find((s) => s.key === a.section);
            const overdueRow = isOverdue(a);
            return (
              <div key={a.id} style={{ border: `1px solid ${overdueRow ? C.red + "66" : C.line}`, background: overdueRow ? C.redSoft : C.cardAlt, borderRadius: 10, padding: 14 }}>
                <div style={{ display: "flex", justifyContent: "space-between", gap: 10, marginBottom: 8 }}>
                  <div style={{ fontSize: 14, fontWeight: 600, color: C.ink }}>{a.action}</div>
                  <div style={{ fontSize: 11.5, color: C.inkSoft, whiteSpace: "nowrap" }}>{sec ? sec.title : a.section}</div>
                </div>
                <div style={{ fontSize: 12.5, color: C.inkSoft, marginBottom: 8 }}>
                  {(a.group || []).join(", ") || "No group"} · Owner: {a.owner || "Unassigned"} · Due: {a.dueDate || "—"} · Success: {a.measure || "—"}
                </div>
                <div style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center" }}>
                  <Badge label="Status" value={a.status} color={STATUS_COLOR[a.status] || C.inkSoft} />
                  <Badge label="Trend" value={a.trend || "Not Yet Determined"} color={TREND_COLOR[a.trend] || C.inkSoft} />
                  {overdueRow && <Badge label="Due" value="Overdue" color={C.red} />}
                </div>
                {a.issues && <div style={{ fontSize: 12.5, color: C.ink, marginTop: 8 }}><strong>Issues:</strong> {a.issues}</div>}
                {a.comments && <div style={{ fontSize: 12.5, color: C.inkSoft, marginTop: 4 }}><strong>Comments:</strong> {a.comments}</div>}
              </div>
            );
          })}
        </div>
      </Card>
    </>
  );
}

function StatTile({ label, value, color, text }) {
  return (
    <div style={{ border: `1px solid ${C.line}`, borderRadius: 10, padding: "14px 12px", textAlign: "center" }}>
      <div style={{ fontFamily: text ? "'IBM Plex Sans', sans-serif" : "'IBM Plex Mono', monospace", fontSize: text ? 16 : 26, fontWeight: text ? 600 : 500, color }}>{value}</div>
      <div style={{ fontSize: 11, color: C.inkSoft, marginTop: 4, textTransform: "uppercase", letterSpacing: "0.03em" }}>{label}</div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);

</script>
</body>
