<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Learning Outline Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap" rel="stylesheet">
<style>
/* ===== Talent Workspace UI (talent-ui.css) ===== */
/* Layout: one-screen app — question chat panel left, live outline document right; at 800px a segmented switch toggles between them. */
:root{
  --font-sans:Inter, system-ui, -apple-system, sans-serif;
  --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:22px;--space-6:28px;--space-7:32px;--space-8:56px;
  --radius-sm:8px;--radius-md:10px;--radius-lg:12px;--radius-xl:14px;--radius-pill:999px;
  --bg:#F7F8FA;--surface:#FFFFFF;--surface-alt:#F1F3F5;--ink:#111827;--ink-soft:#5B6472;--line:#E5E7EB;--line-strong:#8A9099;
  --accent:#0F766E;--accent-hover:#0B5F58;--on-accent:#FFFFFF;--accent-soft:#E6F4F2;--focus-ring:rgba(15,118,110,0.25);
  --info:#1D4ED8;--info-soft:#EEF3FF;--warning:#B54708;--warning-soft:#FEF3E2;--error:#B42318;--error-soft:#FEECEB;
  --shadow-sm:0 1px 2px rgba(16,24,40,0.05);
  --shadow-card:0 1px 2px rgba(16,24,40,0.04), 0 6px 20px -4px rgba(16,24,40,0.07);
  --shadow-lift:0 2px 4px rgba(16,24,40,0.06), 0 10px 28px -6px rgba(16,24,40,0.12);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1113;--surface:#171B1F;--surface-alt:#1F2429;--ink:#ECEEF0;--ink-soft:#9AA3AD;--line:#2A3036;--line-strong:#6B747E;
    --accent:#3CC4B4;--accent-hover:#62D3C6;--on-accent:#04201C;--accent-soft:rgba(60,196,180,0.13);--focus-ring:rgba(60,196,180,0.3);
    --info:#8AB4F8;--info-soft:rgba(138,180,248,0.13);--warning:#F5B45C;--warning-soft:rgba(245,180,92,0.13);--error:#F28B82;--error-soft:rgba(242,139,130,0.13);
    --shadow-sm:0 1px 2px rgba(0,0,0,0.4);
    --shadow-card:0 1px 2px rgba(0,0,0,0.4), 0 8px 24px -6px rgba(0,0,0,0.5);
    --shadow-lift:0 2px 4px rgba(0,0,0,0.45), 0 12px 30px -6px rgba(0,0,0,0.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1113;--surface:#171B1F;--surface-alt:#1F2429;--ink:#ECEEF0;--ink-soft:#9AA3AD;--line:#2A3036;--line-strong:#6B747E;
  --accent:#3CC4B4;--accent-hover:#62D3C6;--on-accent:#04201C;--accent-soft:rgba(60,196,180,0.13);--focus-ring:rgba(60,196,180,0.3);
  --info:#8AB4F8;--info-soft:rgba(138,180,248,0.13);--warning:#F5B45C;--warning-soft:rgba(245,180,92,0.13);--error:#F28B82;--error-soft:rgba(242,139,130,0.13);
  --shadow-sm:0 1px 2px rgba(0,0,0,0.4);
  --shadow-card:0 1px 2px rgba(0,0,0,0.4), 0 8px 24px -6px rgba(0,0,0,0.5);
  --shadow-lift:0 2px 4px rgba(0,0,0,0.45), 0 12px 30px -6px rgba(0,0,0,0.6);
  color-scheme:dark;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-sans);-webkit-font-smoothing:antialiased;overflow:hidden;}
.tw h1,.tw h2,.tw h3{font-weight:650;letter-spacing:-.022em;margin:0;}

.app{display:grid;grid-template-columns:minmax(340px,440px) minmax(0,1fr);height:100%;}

/* ---------- Shared bits ---------- */
.eyebrow{display:inline-flex;align-items:center;gap:6px;color:var(--accent);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;}
.icon-btn{width:38px;height:38px;border-radius:var(--radius-md);border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:var(--shadow-sm);transition:background .15s,color .15s;}
.icon-btn:hover{background:var(--surface-alt);color:var(--ink);}
.icon-btn:focus-visible{outline:none;box-shadow:0 0 0 4px var(--focus-ring);}
.btn{font:600 14px var(--font-sans);border-radius:var(--radius-md);padding:9px 16px;min-height:40px;border:1px solid transparent;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:background .15s, box-shadow .15s, transform .15s, border-color .15s, color .15s;}
.btn-primary{background:var(--accent);color:var(--on-accent);box-shadow:var(--shadow-sm);}
.btn-primary:hover:not(:disabled){background:var(--accent-hover);transform:translateY(-1px);box-shadow:var(--shadow-lift);}
.btn-secondary{background:var(--surface);color:var(--ink);border-color:var(--line-strong);box-shadow:var(--shadow-sm);}
.btn-secondary:hover:not(:disabled){background:var(--surface-alt);}
.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none;}
.btn:focus-visible{outline:none;box-shadow:0 0 0 4px var(--focus-ring);}

/* ---------- Mobile switch ---------- */
.view-switch{display:none;}

/* ---------- LEFT: CHAT ---------- */
.chat-panel{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0;}
.chat-header{padding:22px 24px 16px;border-bottom:1px solid var(--line);flex-shrink:0;}
.chat-header h1{font-size:21px;line-height:1.2;margin-top:8px !important;text-wrap:balance;}

/* Level stepper (Course → Assessment) */
.levels{display:flex;align-items:flex-start;margin-top:18px;}
.rail-item{display:flex;flex-direction:column;align-items:center;gap:6px;flex:0 0 auto;width:52px;}
.rail-dot{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line-strong);background:var(--surface);color:var(--ink-soft);font-size:11px;font-weight:600;font-variant-numeric:tabular-nums;display:flex;align-items:center;justify-content:center;transition:background .25s,border-color .25s,color .25s,box-shadow .25s;}
.rail-dot.active{background:var(--accent);border-color:var(--accent);color:var(--on-accent);box-shadow:0 0 0 4px var(--focus-ring);}
.rail-dot.done{background:var(--accent-soft);border-color:transparent;color:var(--accent);}
.rail-label{font-size:11px;color:var(--ink-soft);font-weight:500;white-space:nowrap;}
.rail-item.is-active .rail-label{color:var(--ink);font-weight:600;}
.rail-line{flex:1;height:1.5px;background:var(--line);margin-top:10px;min-width:4px;}
.rail-line.done{background:var(--accent);opacity:.45;}

.chat-log{flex:1;overflow-y:auto;padding:20px 24px;display:flex;flex-direction:column;gap:14px;background:var(--bg);min-height:0;}
.msg{max-width:92%;font-size:14.5px;line-height:1.55;animation:rise .28s ease-out both;}
@keyframes rise{from{opacity:.001;transform:translateY(6px);}to{opacity:1;transform:none;}}
.msg.bot{align-self:flex-start;}
.msg .bubble{background:var(--surface);border:1px solid var(--line);padding:12px 15px;border-radius:4px var(--radius-xl) var(--radius-xl) var(--radius-xl);color:var(--ink);box-shadow:var(--shadow-sm);}
.msg .bubble strong{color:var(--ink);font-weight:650;}
.msg.user{align-self:flex-end;}
.msg.user .bubble{background:var(--accent);border-color:var(--accent);color:var(--on-accent);border-radius:var(--radius-xl) 4px var(--radius-xl) var(--radius-xl);font-weight:500;}
.field-tag{display:inline-flex;align-items:center;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);border-radius:var(--radius-pill);padding:3px 10px;margin-bottom:8px;}

.choice-row{display:flex;flex-wrap:wrap;gap:8px;align-self:flex-start;max-width:92%;animation:rise .28s ease-out both;}
.choice-btn{background:var(--surface);border:1px solid var(--accent);color:var(--accent);padding:8px 15px;min-height:40px;border-radius:var(--radius-pill);font:600 13.5px var(--font-sans);cursor:pointer;text-align:left;transition:background .15s,color .15s,transform .15s;}
.choice-btn:hover{background:var(--accent);color:var(--on-accent);transform:translateY(-1px);}
.choice-btn:active{transform:none;}
.choice-btn.primary{background:var(--accent);color:var(--on-accent);padding:10px 28px;min-height:44px;font-size:14px;box-shadow:var(--shadow-sm);}
.choice-btn.primary:hover{background:var(--accent-hover);box-shadow:var(--shadow-lift);}
.choice-btn:focus-visible{outline:none;box-shadow:0 0 0 4px var(--focus-ring);}

.chat-input-row{flex-shrink:0;border-top:1px solid var(--line);padding:14px 24px calc(18px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:flex-end;background:var(--surface);}
.input-wrap{flex:1;min-width:0;}
.chat-input-row textarea{width:100%;display:block;resize:none;min-height:44px;max-height:120px;background:var(--surface);border:1px solid var(--line-strong);color:var(--ink);font:400 14.5px var(--font-sans);line-height:1.45;padding:11px 14px;border-radius:var(--radius-md);outline:none;transition:border-color .15s, box-shadow .15s;}
.chat-input-row textarea:hover{border-color:var(--ink-soft);}
.chat-input-row textarea:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--focus-ring);}
.chat-input-row textarea::placeholder{color:var(--ink-soft);opacity:1;}
.chat-input-row textarea:disabled{opacity:.5;background:var(--surface-alt);}
.list-hint{font-size:12.5px;color:var(--ink-soft);margin-top:6px;}
.send-btn{background:var(--accent);border:none;color:var(--on-accent);width:44px;height:44px;border-radius:var(--radius-md);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:var(--shadow-sm);transition:transform .15s, background .15s, box-shadow .15s;}
.send-btn:hover:not(:disabled){background:var(--accent-hover);transform:translateY(-1px);box-shadow:var(--shadow-lift);}
.send-btn:focus-visible{outline:none;box-shadow:0 0 0 4px var(--focus-ring);}
.send-btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none;}

/* ---------- RIGHT: DOCUMENT ---------- */
.doc-side{display:flex;flex-direction:column;min-height:0;min-width:0;}
.doc-toolbar{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 40px;border-bottom:1px solid var(--line);background:var(--bg);}
.doc-toolbar .label{font-size:13px;font-weight:600;color:var(--ink-soft);}
.doc-toolbar .tools{display:flex;gap:8px;align-items:center;}
.doc-panel{flex:1;overflow-y:auto;padding:32px 40px 80px;min-height:0;}
.doc-inner{max-width:820px;margin:0 auto;}

.doc-topbar{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:24px;}
.doc-topbar h2{font-size:30px;line-height:1.15;text-wrap:balance;}
.doc-topbar .rev{font-size:12.5px;color:var(--ink-soft);font-variant-numeric:tabular-nums;white-space:nowrap;padding-bottom:6px;}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-xl);margin-bottom:20px;box-shadow:var(--shadow-card);color:var(--ink);animation:rise .32s ease-out both;}
.card-head{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:650;letter-spacing:-.01em;color:var(--ink);padding:18px 26px 16px;border-bottom:1px solid var(--line);}
.card-head::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--accent);flex-shrink:0;}
.card-body{padding:22px 26px 26px;}
.field{margin-bottom:18px;}
.field:last-child{margin-bottom:0;}
.field-label-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px;}
.field-label{font-size:12.5px;font-weight:600;color:var(--ink-soft);}
.field-value{font-size:14.5px;line-height:1.55;color:var(--ink);white-space:pre-wrap;overflow-wrap:anywhere;}
.field-value.empty{color:var(--line-strong);}
ul.tags{margin:0;padding-left:20px;font-size:14.5px;line-height:1.55;}
ul.tags li{margin-bottom:3px;overflow-wrap:anywhere;}
ul.tags li::marker{color:var(--accent);}

.edit-icon{background:none;border:none;border-radius:var(--radius-sm);color:var(--ink-soft);cursor:pointer;padding:6px;display:flex;align-items:center;flex-shrink:0;opacity:.7;transition:opacity .15s,color .15s,background .15s;}
.edit-icon:hover{opacity:1;color:var(--accent);background:var(--accent-soft);}
.edit-icon:focus-visible{outline:none;opacity:1;box-shadow:0 0 0 4px var(--focus-ring);}

.heading-row{display:flex;align-items:center;gap:6px;margin-bottom:6px;min-width:0;}
.heading-row > :first-child{min-width:0;overflow-wrap:anywhere;}

.edit-input, .edit-textarea{width:100%;font:400 14.5px var(--font-sans);color:var(--ink);padding:10px 13px;border:1px solid var(--accent);border-radius:var(--radius-md);outline:none;background:var(--surface);box-shadow:0 0 0 4px var(--focus-ring);}
.edit-textarea{min-height:80px;resize:vertical;line-height:1.55;}
.edit-actions{display:flex;gap:8px;margin-top:12px;}
.edit-save-btn{background:var(--accent);color:var(--on-accent);border:none;padding:8px 16px;min-height:36px;border-radius:var(--radius-md);font:600 13px var(--font-sans);cursor:pointer;transition:background .15s;}
.edit-save-btn:hover{background:var(--accent-hover);}
.edit-cancel-btn{background:var(--surface);border:1px solid var(--line-strong);color:var(--ink);padding:8px 16px;min-height:36px;border-radius:var(--radius-md);font:600 13px var(--font-sans);cursor:pointer;transition:background .15s;}
.edit-cancel-btn:hover{background:var(--surface-alt);}
.edit-save-btn:focus-visible,.edit-cancel-btn:focus-visible,.edit-mini-btn:focus-visible,.edit-remove-btn:focus-visible{outline:none;box-shadow:0 0 0 4px var(--focus-ring);}
.edit-list-row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px;}
.edit-list-row span{min-width:0;overflow-wrap:anywhere;}
.edit-remove-btn{background:none;border:none;border-radius:var(--radius-sm);color:var(--ink-soft);cursor:pointer;font-size:13px;padding:4px 8px;flex-shrink:0;transition:background .15s,color .15s;}
.edit-remove-btn:hover{color:var(--error);background:var(--error-soft);}
.edit-list-add{display:flex;gap:8px;margin-top:10px;}
.edit-list-add .edit-input{box-shadow:none;border-color:var(--line-strong);}
.edit-list-add .edit-input:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--focus-ring);}
.edit-mini-btn{background:var(--surface);color:var(--ink);border:1px solid var(--line-strong);padding:8px 14px;border-radius:var(--radius-md);font:600 13px var(--font-sans);cursor:pointer;white-space:nowrap;transition:background .15s;}
.edit-mini-btn:hover{background:var(--surface-alt);}

.lesson-card{border:1px solid var(--line);border-radius:var(--radius-lg);margin:4px 0 18px;padding:16px 18px;background:var(--surface-alt);}
.lesson-card .lesson-name{font-weight:650;font-size:15.5px;letter-spacing:-.01em;}
.lesson-card .field{margin-bottom:14px;}
.lesson-card .field:last-child{margin-bottom:0;}
.module-name-head{font-weight:650;font-size:20px;letter-spacing:-.018em;margin:0;line-height:1.3;}
.module-head-wrap{margin-bottom:16px;}

.empty-doc{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--ink-soft);border:1.5px dashed var(--line);border-radius:var(--radius-xl);padding:64px 26px;font-size:14px;line-height:1.6;margin-top:8px;}
.empty-doc .big{font-size:20px;font-weight:650;letter-spacing:-.018em;color:var(--ink);margin-bottom:8px;}
.empty-doc .glyph{width:44px;height:44px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;margin-bottom:16px;}

.doc-footer{margin-top:28px;padding-top:16px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink-soft);}

/* ---------- Phone ---------- */
@media (max-width:800px){
  .app{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr);}
  .view-switch{display:flex;gap:4px;padding:4px;margin:10px 16px;background:var(--surface-alt);border:1px solid var(--line);border-radius:var(--radius-lg);}
  .view-switch button{flex:1;font:600 14px var(--font-sans);color:var(--ink-soft);background:transparent;border:none;border-radius:var(--radius-md);min-height:44px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;}
  .view-switch button.active{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm), inset 0 0 0 1px var(--line);}
  .view-switch button:focus-visible{outline:none;box-shadow:0 0 0 4px var(--focus-ring);}
  .view-switch .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);display:none;}
  .view-switch .dot.on{display:inline-block;}
  .chat-panel,.doc-side{grid-row:2;grid-column:1;border-right:none;}
  .app[data-view="chat"] .doc-side{display:none;}
  .app[data-view="doc"] .chat-panel{display:none;}
  .chat-header{padding:14px 16px 12px;}
  .chat-header h1{font-size:18px;}
  .levels{margin-top:12px;}
  .rail-item{width:auto;min-width:40px;}
  .rail-label{font-size:10.5px;}
  .chat-log{padding:16px;}
  .chat-input-row{padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));}
  .chat-input-row textarea{font-size:16px;min-height:48px;}
  .send-btn{width:48px;height:48px;}
  .choice-btn{min-height:44px;}
  .doc-toolbar{padding:10px 16px;}
  .doc-toolbar .label{display:none;}
  .doc-toolbar{justify-content:flex-end;}
  .doc-panel{padding:20px 16px 64px;}
  .doc-topbar{flex-direction:column;align-items:flex-start;gap:4px;}
  .doc-topbar h2{font-size:24px;}
  .doc-topbar .rev{padding-bottom:0;}
  .card-head{padding:16px 18px 14px;}
  .card-body{padding:18px 18px 20px;}
  .lesson-card{padding:14px;}
  .edit-input,.edit-textarea{font-size:16px;}
  .edit-list-add{flex-wrap:wrap;}
}
@media (max-width:420px){
  .rail-label{display:none;}
  .rail-item.is-active .rail-label{display:block;}
  .rail-item{min-width:24px;}
}
@media (prefers-reduced-motion:reduce){
  *, *::before, *::after{animation:none !important;transition:none !important;}
}
</style>
</head>
<body class="tw">
<div class="app" id="app" data-view="chat">

  <div class="view-switch" role="tablist" aria-label="Switch view">
    <button type="button" role="tab" id="viewChatBtn" class="active" aria-selected="true">Questions</button>
    <button type="button" role="tab" id="viewDocBtn" aria-selected="false">Outline <span class="dot" id="docDot"></span></button>
  </div>

  <div class="chat-panel">
    <div class="chat-header">
      <span class="eyebrow">Draft in progress</span>
      <h1>Learning Outline Builder</h1>
      <div class="levels" id="railTrack" aria-label="Outline level"></div>
    </div>
    <div class="chat-log" id="chatLog" aria-live="polite"></div>
    <div class="chat-input-row">
      <div class="input-wrap">
        <textarea id="inputBox" rows="1" placeholder="Type your answer…" aria-label="Your answer"></textarea>
        <div class="list-hint" id="listHint" style="display:none;">Separate multiple items with commas.</div>
      </div>
      <button class="send-btn" id="sendBtn" title="Send" aria-label="Send">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg>
      </button>
    </div>
  </div>

  <div class="doc-side">
    <div class="doc-toolbar">
      <span class="label">Live outline</span>
      <div class="tools">
        <button class="btn btn-primary" id="downloadBtn" style="display:none;" title="Download as an editable Word document">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M6.5 10.5L12 16l5.5-5.5"/><path d="M5 21h14"/></svg>
          Download as Word
        </button>
        <button type="button" class="icon-btn" id="themeToggle" aria-label="Switch theme"></button>
      </div>
    </div>
    <div class="doc-panel" id="docPanel">
      <div class="doc-inner" id="docContent">
        <div class="empty-doc" id="emptyDoc">
          <div class="glyph"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h4"/></svg></div>
          <div class="big">Your outline will build here</div>
          <div>Answer the questions on the left — this document<br>fills in live and stays fully editable when you're done.</div>
        </div>
      </div>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/docx@9.5.1/dist/index.umd.cjs"></script>
<script>
/* ---------------- THEME TOGGLE ---------------- */
const ICON_SUN = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const ICON_MOON = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
function isDark(){
  const t = document.documentElement.getAttribute('data-theme');
  if(t) return t === 'dark';
  return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
}
function paintThemeButton(){
  const b = document.getElementById('themeToggle');
  const dark = isDark();
  b.innerHTML = dark ? ICON_SUN : ICON_MOON;
  b.setAttribute('aria-label', dark ? 'Switch to light mode' : 'Switch to dark mode');
  b.title = b.getAttribute('aria-label');
}
document.getElementById('themeToggle').addEventListener('click', ()=>{
  document.documentElement.setAttribute('data-theme', isDark() ? 'light' : 'dark');
  paintThemeButton();
});
if(window.matchMedia){ try{ window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', paintThemeButton); }catch(e){} }
paintThemeButton();

/* ---------------- PHONE VIEW SWITCH ---------------- */
const appEl = document.getElementById('app');
const viewChatBtn = document.getElementById('viewChatBtn');
const viewDocBtn = document.getElementById('viewDocBtn');
const docDot = document.getElementById('docDot');
function setView(v){
  appEl.setAttribute('data-view', v);
  viewChatBtn.classList.toggle('active', v==='chat'); viewChatBtn.setAttribute('aria-selected', v==='chat');
  viewDocBtn.classList.toggle('active', v==='doc'); viewDocBtn.setAttribute('aria-selected', v==='doc');
  if(v==='doc') docDot.classList.remove('on');
}
viewChatBtn.addEventListener('click', ()=> setView('chat'));
viewDocBtn.addEventListener('click', ()=> setView('doc'));

/* ---------------- DATA MODEL ---------------- */
const data = {
  author:'', name:'', purpose:'', audience:'', duration:'', delivery:'', prerequisites:'',
  objectives:[],
  modules:[],
  capstone:'', finalAssessment:'', createdAt:''
};

const LEVELS = ['Course','Module','Lesson','Topic','Activity','Assessment'];
let activeLevel = 0;

const EDIT_SVG = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>`;

/* ---------------- STEP SCRIPT ---------------- */
let step = 'welcome';
let modIdx = -1, lesIdx = -1;

function currentModule(){ return data.modules[modIdx]; }
function currentLesson(){ return data.modules[modIdx].lessons[lesIdx]; }

function splitList(text){
  return text.split(/[,\n]/).map(s=>s.trim()).filter(Boolean);
}

function botSay(html){ addMsg('bot', html); }
function fieldTag(label){ return `<span class="field-tag">${label}</span><br>`; }

function startSequence(){
  botSay(fieldTag('Welcome') + `I'm here to help you build a learning outline. I'll ask a series of questions, working through each level of the course in turn:<br><br>
  <strong>Program</strong> — a multi-course journey toward a role or outcome<br>
  <strong>Course</strong> — a full learning experience made of modules<br>
  <strong>Module</strong> — related lessons organized around a topic<br>
  <strong>Lesson</strong> — teaches one concept or skill<br>
  <strong>Topic</strong> — an individual idea within a lesson<br>
  <strong>Activity</strong> — practice that reinforces learning<br>
  <strong>Assessment</strong> — how you measure learning<br><br>
  Select <strong>Start</strong> to begin.`);
  showChoices([{label:'Start', value:'start', primary:true}]);
}

/* ---- Course-level questions ---- */
function askAuthor(){ setLevel(0); botSay(fieldTag('Author') + 'Who will be building this course?'); }
function askName(){ botSay(fieldTag('Course Name') + 'What is the name of your course?'); }
function askPurpose(){ botSay(fieldTag('Purpose') + 'What is the purpose of the course?'); }
function askAudience(){ botSay(fieldTag('Target Audience') + 'Who is the target audience?'); }
function askDuration(){ botSay(fieldTag('Duration') + 'What is the estimated duration of the course? You can update this later.'); }
function askDelivery(){ botSay(fieldTag('Delivery Methods') + 'What delivery methods will be used to transfer knowledge and skills (e.g., instructor-led, virtual instructor-led, self-paced, blended)?'); }
function askPrereq(){ botSay(fieldTag('Prerequisites') + 'What does a participant need to know before taking this course?'); }

function askCourseObjective(){
  step='objectives.entry';
  const n = data.objectives.length + 1;
  const msg = n === 1
    ? `Now, let's define the learning objectives for your course. Starting with your first objective, what will participants be able to do by the end of the course? Begin with an action verb.`
    : `Learning Objective ${n}: By the end of the course, what will participants be able to do? Start with an action verb.`;
  botSay(fieldTag('Course Learning Objectives') + msg);
}
function askCourseObjectiveContinue(){
  step='objectives.continue';
  botSay(`Add another course learning objective?`);
  showChoices([{label:'+ Add another objective', value:'yes'},{label:"No, that's all", value:'no'}]);
}

/* ---- Modules ---- */
function beginModules(){
  botSay(`That completes the course-level details. Now let's fill in the modules that support your course objectives. It may help to jot down all your planned modules first.`);
  newModule();
}
function newModule(){
  modIdx++; lesIdx=-1;
  data.modules.push({name:'',purpose:'',duration:'',objectives:[],lessons:[],assessment:''});
  setLevel(1);
  step='module.name';
  const ordinal = modIdx===0 ? 'your first' : 'this next';
  botSay(fieldTag(`Module ${modIdx+1} Name`) + `What is the name of ${ordinal} module? The module should support at least one of your course learning objectives.`);
}
function askModulePurpose(){ botSay(fieldTag('Purpose') + 'What is the purpose of this module?'); }
function askModuleDuration(){ botSay(fieldTag('Duration') + 'What is the estimated duration of this module?'); }
function askModuleObjective(){
  step='module.objectives.entry';
  const n = currentModule().objectives.length + 1;
  const msg = n === 1
    ? `Module Learning Objective 1: By the end of this module, what will participants be able to do? Your objective should support at least one of your course learning objectives and begin with an action verb.`
    : `Module Learning Objective ${n}: By the end of this module, what will participants be able to do? Start with an action verb.`;
  botSay(fieldTag('Module Learning Objectives') + msg);
}
function askModuleObjectiveContinue(){
  step='module.objectives.continue';
  botSay(`Add another module learning objective?`);
  showChoices([{label:'+ Add another objective', value:'yes'},{label:"No, that's all", value:'no'}]);
}

/* ---- Lessons ---- */
function newLesson(){
  lesIdx++;
  currentModule().lessons.push({name:'',objective:'',topics:[],activities:[]});
  setLevel(2);
  showListHint(false);
  step='lesson.name';
  botSay(fieldTag(`Lesson ${modIdx+1}.${lesIdx+1} Name`) + `What is the name of Lesson ${modIdx+1}.${lesIdx+1}?`);
}
function askLessonObjective(){
  step='lesson.objective';
  const objs = currentModule().objectives;
  if(objs && objs.length){
    botSay(fieldTag('Lesson Objective') + 'Choose which module learning objective this lesson will support.');
    showChoices(objs.map(o=>({label:o, value:o})));
  } else {
    botSay(fieldTag('Lesson Objective') + 'What is the learning objective for this lesson?');
  }
}
function askLessonTopic(){
  step='lesson.topics.entry';
  setLevel(3);
  const n = currentLesson().topics.length + 1;
  const msg = n === 1
    ? `What topics will be covered in this lesson? Each topic should support the lesson learning objective. Let's start with your first topic.`
    : `Topic ${n}: What else will be covered in this lesson?`;
  botSay(fieldTag('Topics') + msg);
}
function askLessonTopicContinue(){
  step='lesson.topics.continue';
  botSay(`Add another topic?`);
  showChoices([{label:'+ Add another topic', value:'yes'},{label:'Move on to Activities', value:'no'}]);
}
function askLessonActivities(){
  setLevel(4);
  showListHint(true);
  botSay(fieldTag('Activities') + 'What activities will help deliver this knowledge and these skills (e.g., reflection exercises, knowledge checks, videos, case studies)?');
}
function askLessonContinue(){
  showListHint(false);
  step='lesson.continue';
  botSay(`That completes Lesson ${modIdx+1}.${lesIdx+1}. What would you like to do next?`);
  showChoices([{label:'+ Add another lesson', value:'continue'},{label:'Move on to Module Assessment', value:'done'}]);
}
function askModuleAssessment(){
  setLevel(5);
  step='module.assessment';
  botSay(fieldTag('Assessment') + `How will you assess the knowledge and skills participants gained in Module ${modIdx+1} (e.g., assessment questions, peer feedback)?`);
}
function askModuleContinue(){
  step='module.continue';
  botSay(`We've now gathered all the information for Module ${modIdx+1}. What would you like to do next?`);
  showChoices([{label:'+ Add another module', value:'continue'},{label:'Move on to Course Wrap-Up', value:'done'}]);
}

/* ---- Wrap-up ---- */
function beginWrapUp(){
  setLevel(5);
  step='capstone.choice';
  botSay(`<strong>Course Wrap-Up</strong><br><br>` + fieldTag('Capstone') + `Will your course include a capstone that allows learners to apply everything they've learned?`);
  showChoices([{label:'Yes', value:'yes'},{label:'No', value:'no'}]);
}
function askFinalAssessment(){
  step='finalAssessment';
  botSay(fieldTag('Final Assessment') + 'How will you assess the knowledge and skills participants gained across the entire course (e.g., knowledge assessments, practical assessments)?');
}
function finish(){
  step='done';
  botSay(`Your outline is complete. Take a moment to review it and select <strong>Edit</strong> to make any changes. When you're ready, click <strong>Download as Word</strong> above the document to save an editable copy that you can continue updating anytime.`);
}

/* ---------------- ANSWER HANDLER ---------------- */
function handleAnswer(raw, displayText){
  const text = (raw||'').trim();
  if(!text) return;
  addMsg('user', escapeHtml(displayText!==undefined ? displayText : text));

  switch(step){
    case 'welcome':
      if(/^start$/i.test(text)){
        data.createdAt = new Date().toLocaleDateString('en-US',{month:'long', day:'numeric', year:'numeric'});
        step='author'; askAuthor();
      }
      else { botSay('Select <strong>Start</strong> to begin.'); showChoices([{label:'Start', value:'start', primary:true}]); }
      return;
    case 'author': data.author=text; step='name'; askName(); return;
    case 'name': data.name=text; step='purpose'; askPurpose(); return;
    case 'purpose': data.purpose=text; step='audience'; askAudience(); return;
    case 'audience': data.audience=text; step='duration'; askDuration(); return;
    case 'duration': data.duration=text; step='delivery'; askDelivery(); return;
    case 'delivery': data.delivery=text; step='prerequisites'; askPrereq(); return;
    case 'prerequisites': data.prerequisites=text; askCourseObjective(); return;

    case 'objectives.entry':
      data.objectives.push(text);
      if(data.objectives.length >= 8){ beginModules(); }
      else { askCourseObjectiveContinue(); }
      return;
    case 'objectives.continue':
      if(text==='yes'){ askCourseObjective(); } else { beginModules(); }
      return;

    case 'module.name': currentModule().name=text; step='module.purpose'; askModulePurpose(); return;
    case 'module.purpose': currentModule().purpose=text; step='module.duration'; askModuleDuration(); return;
    case 'module.duration': currentModule().duration=text; askModuleObjective(); return;

    case 'module.objectives.entry':
      currentModule().objectives.push(text);
      if(currentModule().objectives.length >= 5){ newLesson(); }
      else { askModuleObjectiveContinue(); }
      return;
    case 'module.objectives.continue':
      if(text==='yes'){ askModuleObjective(); } else { newLesson(); }
      return;

    case 'lesson.name': currentLesson().name=text; askLessonObjective(); return;
    case 'lesson.objective': currentLesson().objective=text; askLessonTopic(); return;
    case 'lesson.topics.entry':
      currentLesson().topics.push(text);
      askLessonTopicContinue();
      return;
    case 'lesson.topics.continue':
      if(text==='yes'){ askLessonTopic(); } else { step='lesson.activities'; askLessonActivities(); }
      return;
    case 'lesson.activities': currentLesson().activities=splitList(text); askLessonContinue(); return;

    case 'lesson.continue':
      if(text==='continue'){ newLesson(); } else { askModuleAssessment(); }
      return;

    case 'module.assessment': currentModule().assessment=text; askModuleContinue(); return;
    case 'module.continue':
      if(text==='continue'){ newModule(); } else { beginWrapUp(); }
      return;

    case 'capstone.choice':
      if(text==='yes'){ step='capstone.description'; botSay('Write a brief description of your capstone.'); }
      else { data.capstone=''; askFinalAssessment(); }
      return;
    case 'capstone.description': data.capstone=text; askFinalAssessment(); return;
    case 'finalAssessment': data.finalAssessment=text; finish(); return;

    case 'done':
      botSay("The outline is complete — feel free to keep exploring the document on the right, or use the edit icons to make changes.");
      return;
  }
}

/* ---------------- UI: CHAT ---------------- */
const chatLog = document.getElementById('chatLog');
function addMsg(role, html){
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + role;
  const bub = document.createElement('div');
  bub.className = 'bubble';
  bub.innerHTML = html;
  wrap.appendChild(bub);
  chatLog.appendChild(wrap);
  chatLog.scrollTop = chatLog.scrollHeight;
  renderDoc();
}
function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

const inputBox = document.getElementById('inputBox');
const sendBtn = document.getElementById('sendBtn');
const listHint = document.getElementById('listHint');
function showListHint(v){ listHint.style.display = v ? 'block' : 'none'; }

function submit(){
  const val = inputBox.value;
  if(!val.trim() || inputBox.disabled) return;
  inputBox.value='';
  inputBox.style.height='auto';
  handleAnswer(val);
}
sendBtn.addEventListener('click', submit);
inputBox.addEventListener('keydown', e=>{
  if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); submit(); }
});
inputBox.addEventListener('input', ()=>{
  inputBox.style.height='auto';
  inputBox.style.height = Math.min(inputBox.scrollHeight,120)+'px';
});

function showChoices(options){
  const row = document.createElement('div');
  row.className = 'choice-row';
  options.forEach(opt=>{
    const btn = document.createElement('button');
    btn.className = 'choice-btn' + (opt.primary ? ' primary' : '');
    btn.textContent = opt.label;
    btn.addEventListener('click', ()=>{
      row.remove();
      inputBox.disabled = false;
      sendBtn.disabled = false;
      inputBox.placeholder = 'Type your answer…';
      inputBox.focus();
      handleAnswer(opt.value, opt.label);
    });
    row.appendChild(btn);
  });
  chatLog.appendChild(row);
  chatLog.scrollTop = chatLog.scrollHeight;
  inputBox.disabled = true;
  sendBtn.disabled = true;
  inputBox.placeholder = 'Choose an option above…';
}

/* ---------------- UI: LEVEL STEPPER ---------------- */
const railTrack = document.getElementById('railTrack');
function buildRail(){
  railTrack.innerHTML='';
  LEVELS.forEach((lvl,i)=>{
    const item = document.createElement('div');
    item.className='rail-item';
    item.id='item-'+i;
    item.innerHTML = `<div class="rail-dot" id="dot-${i}">${i+1}</div><div class="rail-label">${lvl}</div>`;
    railTrack.appendChild(item);
    if(i<LEVELS.length-1){
      const line = document.createElement('div');
      line.className='rail-line';
      line.id='line-'+i;
      railTrack.appendChild(line);
    }
  });
}
let levelStarted = false;
function setLevel(i){
  activeLevel = i;
  levelStarted = true;
  railTrack.classList.add('has-label');
  LEVELS.forEach((lvl,idx)=>{
    const dot = document.getElementById('dot-'+idx);
    const item = document.getElementById('item-'+idx);
    const line = document.getElementById('line-'+idx);
    if(!dot) return;
    dot.classList.toggle('active', idx===i);
    dot.classList.toggle('done', idx<i);
    item.classList.toggle('is-active', idx===i);
    if(line) line.classList.toggle('done', idx<i);
  });
}
buildRail();

/* ---------------- EDITING ---------------- */
function pathGet(path){ return path.reduce((o,k)=> (o==null?o:o[k]), data); }
function pathSet(path, value){
  let obj = data;
  for(let i=0;i<path.length-1;i++){ obj = obj[path[i]]; }
  obj[path[path.length-1]] = value;
}
function editIconHtml(path, isList){
  return `<button class="edit-icon" data-path='${JSON.stringify(path)}' data-list="${isList?1:0}" title="Edit" aria-label="Edit">${EDIT_SVG}</button>`;
}

const docPanel = document.getElementById('docPanel');
const docContent = document.getElementById('docContent');
docPanel.addEventListener('click', e=>{
  const btn = e.target.closest('.edit-icon');
  if(!btn) return;
  const path = JSON.parse(btn.getAttribute('data-path'));
  const isList = btn.getAttribute('data-list') === '1';
  const container = btn.closest('[data-editable]');
  if(!container) return;
  openEditor(container, path, isList);
});

function openEditor(container, path, isList){
  const current = pathGet(path);
  if(isList){
    let items = Array.isArray(current) ? current.slice() : [];
    const render = ()=>{
      container.innerHTML = `
        <div class="field-label">Editing</div>
        <div class="edit-list" id="editListItems"></div>
        <div class="edit-list-add">
          <input type="text" class="edit-input" id="editListNew" placeholder="Add item…">
          <button class="edit-mini-btn" id="editListAddBtn">Add</button>
        </div>
        <div class="edit-actions">
          <button class="edit-save-btn" id="editSaveBtn">Save</button>
          <button class="edit-cancel-btn" id="editCancelBtn">Cancel</button>
        </div>`;
      const listEl = container.querySelector('#editListItems');
      items.forEach((it, idx)=>{
        const row = document.createElement('div');
        row.className='edit-list-row';
        row.innerHTML = `<span>${escapeHtml(it)}</span><button class="edit-remove-btn" data-idx="${idx}" aria-label="Remove">✕</button>`;
        listEl.appendChild(row);
      });
      listEl.querySelectorAll('.edit-remove-btn').forEach(b=> b.addEventListener('click', ()=>{
        items.splice(Number(b.getAttribute('data-idx')),1); render();
      }));
      container.querySelector('#editListAddBtn').addEventListener('click', ()=>{
        const inp = container.querySelector('#editListNew');
        if(inp.value.trim()){ items.push(inp.value.trim()); inp.value=''; render(); container.querySelector('#editListNew').focus(); }
      });
      container.querySelector('#editListNew').addEventListener('keydown', ev=>{
        if(ev.key==='Enter'){ ev.preventDefault(); container.querySelector('#editListAddBtn').click(); }
      });
      container.querySelector('#editSaveBtn').addEventListener('click', ()=>{
        pathSet(path, items); renderDoc();
      });
      container.querySelector('#editCancelBtn').addEventListener('click', ()=> renderDoc());
    };
    render();
  } else {
    container.innerHTML = `
      <div class="field-label">Editing</div>
      <textarea class="edit-input edit-textarea" id="editTextArea">${escapeHtml(current||'')}</textarea>
      <div class="edit-actions">
        <button class="edit-save-btn" id="editSaveBtn">Save</button>
        <button class="edit-cancel-btn" id="editCancelBtn">Cancel</button>
      </div>`;
    const ta = container.querySelector('#editTextArea');
    ta.focus();
    ta.selectionStart = ta.value.length;
    container.querySelector('#editSaveBtn').addEventListener('click', ()=>{
      pathSet(path, ta.value); renderDoc();
    });
    container.querySelector('#editCancelBtn').addEventListener('click', ()=> renderDoc());
  }
}

/* ---------------- UI: DOCUMENT ---------------- */
const emptyDoc = document.getElementById('emptyDoc');
const downloadBtn = document.getElementById('downloadBtn');

function fieldHtml(label, value, isList, path){
  const filled = isList ? (value && value.length) : (value && value.trim());
  let inner;
  if(!filled){
    inner = `<div class="field-value empty">—</div>`;
  } else if(isList){
    inner = `<ul class="tags">${value.map(v=>`<li>${escapeHtml(v)}</li>`).join('')}</ul>`;
  } else {
    inner = `<div class="field-value">${escapeHtml(value)}</div>`;
  }
  return `<div class="field" data-editable>
    <div class="field-label-row"><div class="field-label">${label}</div>${editIconHtml(path, !!isList)}</div>
    ${inner}
  </div>`;
}

let lastDocHtml = '';
function renderDoc(){
  const hasStarted = data.author || data.name || data.purpose || data.modules.length;
  if(!hasStarted){
    docContent.innerHTML = '';
    docContent.appendChild(emptyDoc);
    emptyDoc.style.display='flex';
    downloadBtn.style.display='none';
    return;
  }
  emptyDoc.style.display='none';

  let html = `<div class="doc-topbar">
      <div style="min-width:0;">
        <div class="eyebrow" style="margin-bottom:10px;">Learning Outline · Draft</div>
        <div class="heading-row" data-editable>
          <h2>${data.name ? escapeHtml(data.name) : 'Untitled Course'}</h2>
          ${editIconHtml(['name'], false)}
        </div>
      </div>
      <div class="rev">Revised ${new Date().toLocaleDateString('en-US',{month:'numeric',day:'numeric',year:'2-digit'})}</div>
    </div>`;

  html += `<div class="card"><div class="card-head">Course Information</div><div class="card-body">
    ${fieldHtml('Author', data.author, false, ['author'])}
    ${fieldHtml('Purpose', data.purpose, false, ['purpose'])}
    ${fieldHtml('Target Audience', data.audience, false, ['audience'])}
    ${fieldHtml('Duration', data.duration, false, ['duration'])}
    ${fieldHtml('Delivery Methods', data.delivery, false, ['delivery'])}
    ${fieldHtml('Prerequisites', data.prerequisites, false, ['prerequisites'])}
    ${fieldHtml('Course Learning Objectives', data.objectives, true, ['objectives'])}
  </div></div>`;

  data.modules.forEach((m, mi)=>{
    html += `<div class="card"><div class="card-head">Module ${mi+1}</div><div class="card-body">
      <div class="heading-row module-head-wrap" data-editable>
        <p class="module-name-head">${m.name ? escapeHtml(m.name) : '—'}</p>
        ${editIconHtml(['modules', mi, 'name'], false)}
      </div>
      ${fieldHtml('Purpose', m.purpose, false, ['modules', mi, 'purpose'])}
      ${fieldHtml('Duration', m.duration, false, ['modules', mi, 'duration'])}
      ${fieldHtml('Module Learning Objectives', m.objectives, true, ['modules', mi, 'objectives'])}`;

    m.lessons.forEach((l, li)=>{
      html += `<div class="lesson-card">
        <div class="heading-row" data-editable>
          <div class="lesson-name">Lesson ${mi+1}.${li+1}: ${l.name ? escapeHtml(l.name) : '—'}</div>
          ${editIconHtml(['modules', mi, 'lessons', li, 'name'], false)}
        </div>
        ${fieldHtml('Objective', l.objective, false, ['modules', mi, 'lessons', li, 'objective'])}
        ${fieldHtml('Topics', l.topics, true, ['modules', mi, 'lessons', li, 'topics'])}
        ${fieldHtml('Activities', l.activities, true, ['modules', mi, 'lessons', li, 'activities'])}
      </div>`;
    });

    html += fieldHtml('Assessment', m.assessment, false, ['modules', mi, 'assessment']);
    html += `</div></div>`;
  });

  const wrapStarted = ['capstone.choice','capstone.description','finalAssessment','done'].includes(step) || data.capstone || data.finalAssessment;
  if(wrapStarted){
    html += `<div class="card"><div class="card-head">Course Wrap-Up</div><div class="card-body">
      ${fieldHtml('Capstone', data.capstone, false, ['capstone'])}
      ${fieldHtml('Final Assessment', data.finalAssessment, false, ['finalAssessment'])}
    </div></div>`;
  }

  html += `<div class="doc-footer">Outline created ${data.createdAt || '—'}</div>`;

  docContent.innerHTML = html;
  docContent.appendChild(emptyDoc);
  downloadBtn.style.display = 'inline-flex';
  if(html !== lastDocHtml && appEl.getAttribute('data-view')==='chat') docDot.classList.add('on');
  lastDocHtml = html;
}

/* ---------------- WORD EXPORT ---------------- */
function escW(s){ return (s||'').replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
const W_LABEL = 'width:24%;background:#E6F4F2;border:1px solid #D1D5DB;padding:8px 10px;font-weight:bold;font-size:11pt;color:#111827;vertical-align:top;';
const W_VALUE = 'width:76%;border:1px solid #D1D5DB;padding:8px 10px;font-size:11pt;color:#111827;vertical-align:top;';
const W_FONT = "Inter,'Segoe UI',Calibri,Arial,sans-serif";
function rowW(label, value){
  const v = value && value.trim() ? escW(value) : '—';
  return `<tr>
    <td style="${W_LABEL}">${escW(label)}</td>
    <td style="${W_VALUE}">${v}</td>
  </tr>`;
}
function listRowW(label, arr){
  const v = (arr && arr.length) ? ('<ul style="margin:0;padding-left:18px;">'+arr.map(a=>`<li>${escW(a)}</li>`).join('')+'</ul>') : '—';
  return `<tr>
    <td style="${W_LABEL}">${escW(label)}</td>
    <td style="${W_VALUE}">${v}</td>
  </tr>`;
}

function buildWordHtml(){
  const H2 = `font-family:${W_FONT};font-size:14pt;color:#0F766E;margin-top:22pt;`;
  const TBL = `border-collapse:collapse;width:100%;font-family:${W_FONT};`;
  let body = `<h1 style="font-family:${W_FONT};font-size:22pt;color:#111827;margin-bottom:2pt;">${escW(data.name)||'Untitled Course'}</h1>
  <p style="font-family:${W_FONT};font-size:9pt;color:#5B6472;margin-top:0;">Learning Outline &nbsp;·&nbsp; Created ${escW(data.createdAt)}</p>

  <h2 style="${H2}margin-top:20pt;">Course Information</h2>
  <table style="${TBL}">
    ${rowW('Author', data.author)}
    ${rowW('Purpose', data.purpose)}
    ${rowW('Target Audience', data.audience)}
    ${rowW('Duration', data.duration)}
    ${rowW('Delivery Methods', data.delivery)}
    ${rowW('Prerequisites', data.prerequisites)}
    ${listRowW('Course Learning Objectives', data.objectives)}
  </table>`;

  data.modules.forEach((m, mi)=>{
    body += `<h2 style="${H2}">Module ${mi+1}: ${escW(m.name)||'—'}</h2>
    <table style="${TBL}">
      ${rowW('Purpose', m.purpose)}
      ${rowW('Duration', m.duration)}
      ${listRowW('Module Learning Objectives', m.objectives)}
    </table>`;

    m.lessons.forEach((l, li)=>{
      body += `<h3 style="font-family:${W_FONT};font-size:12pt;color:#111827;margin-top:14pt;">Lesson ${mi+1}.${li+1}: ${escW(l.name)||'—'}</h3>
      <table style="${TBL}">
        ${rowW('Objective', l.objective)}
        ${listRowW('Topics', l.topics)}
        ${listRowW('Activities', l.activities)}
      </table>`;
    });

    body += `<table style="${TBL}margin-top:8pt;">
      ${rowW('Assessment', m.assessment)}
    </table>`;
  });

  if(data.capstone || data.finalAssessment){
    body += `<h2 style="${H2}">Course Wrap-Up</h2>
    <table style="${TBL}">
      ${rowW('Capstone', data.capstone)}
      ${rowW('Final Assessment', data.finalAssessment)}
    </table>`;
  }

  body += `<p style="font-family:${W_FONT};font-size:9pt;color:#5B6472;margin-top:24pt;border-top:1px solid #E5E7EB;padding-top:8pt;">Outline created ${escW(data.createdAt)}</p>`;

  return `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">
  <head><meta charset="utf-8"><title>${escW(data.name)||'Learning Outline'}</title>
  <!--[if gte mso 9]><xml><w:WordDocument><w:View>Print</w:View></w:WordDocument></xml><![endif]-->
  </head><body>${body}</body></html>`;
}

/* Real .docx for the published viewer (built with the docx library) */
function buildDocx(){
  const D = window.docx;
  const FONT = 'Calibri', ACCENT = '0F766E', INK = '111827', SOFT = '5B6472', LINE = 'D1D5DB', LABEL_BG = 'E6F4F2';
  const border = {style:D.BorderStyle.SINGLE, size:4, color:LINE};
  const borders = {top:border, bottom:border, left:border, right:border};
  const W_TOTAL = 9360, W_L = 2246, W_R = W_TOTAL - W_L;
  const cellMargins = {top:100, bottom:100, left:140, right:140};
  const run = (t, o={}) => new D.TextRun({text:t, font:FONT, size:22, color:INK, ...o});
  const valueParas = (value) => [new D.Paragraph({children:[run(value && value.trim() ? value : '—')]})];
  const listParas = (arr) => (arr && arr.length)
    ? arr.map(a => new D.Paragraph({bullet:{level:0}, children:[run(a)]}))
    : [new D.Paragraph({children:[run('—')]})];
  const row = (label, paras) => new D.TableRow({cantSplit:true, children:[
    new D.TableCell({width:{size:W_L, type:D.WidthType.DXA}, borders, margins:cellMargins,
      shading:{type:D.ShadingType.CLEAR, color:'auto', fill:LABEL_BG},
      children:[new D.Paragraph({children:[run(label,{bold:true})]})]}),
    new D.TableCell({width:{size:W_R, type:D.WidthType.DXA}, borders, margins:cellMargins, children:paras})
  ]});
  const table = (rows) => new D.Table({width:{size:W_TOTAL, type:D.WidthType.DXA}, columnWidths:[W_L, W_R], rows});
  const h = (text, size, color, before) => new D.Paragraph({keepNext:true, spacing:{before, after:120},
    children:[new D.TextRun({text, font:FONT, size, bold:true, color})]});
  const small = (text, before) => new D.Paragraph({spacing:{before:before||0, after:120},
    children:[new D.TextRun({text, font:FONT, size:18, color:SOFT})]});

  const kids = [
    h(data.name || 'Untitled Course', 44, INK, 0),
    small(`Learning Outline  ·  Created ${data.createdAt || ''}`),
    h('Course Information', 28, ACCENT, 400),
    table([
      row('Author', valueParas(data.author)),
      row('Purpose', valueParas(data.purpose)),
      row('Target Audience', valueParas(data.audience)),
      row('Duration', valueParas(data.duration)),
      row('Delivery Methods', valueParas(data.delivery)),
      row('Prerequisites', valueParas(data.prerequisites)),
      row('Course Learning Objectives', listParas(data.objectives))
    ])
  ];
  data.modules.forEach((m, mi)=>{
    kids.push(h(`Module ${mi+1}: ${m.name || '—'}`, 28, ACCENT, 440));
    kids.push(table([
      row('Purpose', valueParas(m.purpose)),
      row('Duration', valueParas(m.duration)),
      row('Module Learning Objectives', listParas(m.objectives))
    ]));
    m.lessons.forEach((l, li)=>{
      kids.push(h(`Lesson ${mi+1}.${li+1}: ${l.name || '—'}`, 24, INK, 280));
      kids.push(table([
        row('Objective', valueParas(l.objective)),
        row('Topics', listParas(l.topics)),
        row('Activities', listParas(l.activities))
      ]));
    });
    kids.push(new D.Paragraph({spacing:{before:160, after:0}, children:[]}));
    kids.push(table([row('Assessment', valueParas(m.assessment))]));
  });
  if(data.capstone || data.finalAssessment){
    kids.push(h('Course Wrap-Up', 28, ACCENT, 440));
    kids.push(table([
      row('Capstone', valueParas(data.capstone)),
      row('Final Assessment', valueParas(data.finalAssessment))
    ]));
  }
  kids.push(small(`Outline created ${data.createdAt || ''}`, 480));

  return new D.Document({
    styles:{default:{document:{run:{font:FONT, size:22}}}},
    sections:[{properties:{page:{size:{width:12240, height:15840}, margin:{top:1440, right:1440, bottom:1440, left:1440}}}, children:kids}]
  });
}

let downloadsApi;
const downloadsReady = (window.claude && typeof window.claude.use === 'function')
  ? window.claude.use('downloads').then(d => { downloadsApi = d; return d; }).catch(()=> null)
  : Promise.resolve(null);

async function downloadWord(){
  const safeName = (data.name || 'learning-outline').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'') || 'learning-outline';
  const dl = downloadsApi !== undefined ? downloadsApi : (window.claude ? await downloadsReady : null);
  if(dl && window.docx){
    const original = downloadBtn.innerHTML;
    downloadBtn.disabled = true;
    try{
      const blob = await window.docx.Packer.toBlob(buildDocx());
      await dl.save({filename:`${safeName}.docx`, data:blob});
    }catch(err){
      const code = err && err.code;
      if(code && code !== 'declined' && code !== 'rate_limited'){
        botSay('The Word download isn’t available in this view. Open the tool from its saved HTML file to download your outline.');
      }
    }finally{
      downloadBtn.disabled = false;
      downloadBtn.innerHTML = original;
    }
    return;
  }
  downloadWordLegacy(safeName);
}

/* Standalone file: original Word-compatible .doc download */
function downloadWordLegacy(safeName){
  const html = buildWordHtml();
  const blob = new Blob(['﻿', html], { type: 'application/msword' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${safeName}.doc`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
downloadBtn.addEventListener('click', downloadWord);

/* ---------------- INIT ---------------- */
startSequence();
if(window.matchMedia && !window.matchMedia('(max-width:800px)').matches) inputBox.focus();
</script>
