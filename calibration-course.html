<meta charset="utf-8">
<title>Performance Calibration for Managers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400..700;1,14..32,400..700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
/* Layout: e-learning player. Course menu drawer, one lesson card per screen, sticky Back/Next bar.
   Two box languages: interactive (white, blue outline, lift, "Select" cue) vs information (tinted, flat, no outline). */
:root{
  /* Light-only e-learning palette: soft blue-gray page, white lesson card, charcoal text (not pure black),
     one calm blue for everything clickable, warm amber for tips. All text pairs meet WCAG AA contrast. */
  color-scheme:light;
  --bg:#eef3f8; --panel:#ffffff; --ink:#243042; --muted:#55627a; --line:#d4dce8;
  --primary:#1f5fbf; --primary-hover:#174a96; --on-primary:#ffffff; --primary-soft:#e7f0fc; --focus:#e89b00;
  --info:#f3f6fb; --info-strong:#e3eaf4; --note:#fff6e2; --note-ink:#6b4a00; --note-line:#e7b23c;
  --good:#1b7a46; --good-soft:#e4f4ea; --bad:#b0341f; --bad-soft:#fdeae6; --mid:#8a5a00; --mid-soft:#fff2d9;
  --shadow:0 1px 2px rgba(31,52,90,.06),0 4px 14px rgba(31,52,90,.07);
  --head:"Inter","Segoe UI",system-ui,-apple-system,sans-serif;
  --body:"Inter","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:12px;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:16.5px/1.6 var(--body);-webkit-text-size-adjust:100%;font-feature-settings:"cv11","ss01"}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
h1,h2,h3{font-family:var(--head);font-weight:600;text-wrap:balance;margin:0}
p{margin:0}
a{color:var(--primary)}
/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding-inline:16px;padding-block:10px}
.topbar .name{font:600 1rem/1.2 var(--head);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbtn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:8px 14px;border-radius:999px;border:2px solid var(--line);background:var(--panel);cursor:pointer;font-weight:700;font-size:.92rem}
.tbtn:hover{border-color:var(--primary);color:var(--primary)}
.tbtn svg{width:18px;height:18px;flex:none}
.menu-only{display:none}
#unlockBtn[aria-pressed="true"]{background:var(--note);border-color:var(--note-line);color:var(--note-ink)}
.revbar{position:sticky;top:calc(65px + env(safe-area-inset-top,0px));z-index:14;background:var(--note);color:var(--note-ink);border-bottom:1px solid var(--note-line);display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;padding-inline:16px;padding-block:8px;font-size:.92rem;text-align:center}
.revbar .btn{min-height:38px;padding:6px 14px}
@media (max-width:640px){.revbar .more{display:none}.revbar{flex-wrap:nowrap;justify-content:space-between;text-align:left}}
.layout{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:calc(100% - 65px)}
/* menu */
.side{background:var(--panel);border-right:1px solid var(--line);padding:16px 12px 28px;position:sticky;top:calc(65px + env(safe-area-inset-top,0px));height:calc(100vh - 65px);overflow:auto}
.side-h{font:500 .78rem var(--head);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:4px 8px 10px}
.overall{margin:0 8px 16px}
.overall .t{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted);margin-bottom:6px}
.meter{height:8px;background:var(--info-strong);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--primary);border-radius:99px;transition:width .3s}
.mod-btn{width:100%;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;text-align:left;background:none;border:0;padding:10px 8px;border-radius:10px;cursor:pointer;min-height:48px}
.mod-btn:hover{background:var(--info)}
.mod-badge{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:600 .85rem var(--head);background:var(--info-strong);color:var(--ink)}
.mod-badge.done{background:var(--good);color:#fff}
.mod-badge.cur{background:var(--primary);color:var(--on-primary)}
.mod-name{font-weight:700;line-height:1.25}
.mod-sub{display:block;font-weight:400;font-size:.8rem;color:var(--muted)}
.mod-meta{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.scr-list{list-style:none;margin:2px 0 10px;padding:0 0 0 18px;border-left:2px solid var(--line);margin-left:22px}
.scr{width:100%;display:flex;gap:10px;align-items:center;text-align:left;background:none;border:0;padding:8px 10px;border-radius:8px;font-size:.92rem;color:var(--muted);cursor:pointer;min-height:40px}
.scr:hover:not(:disabled){background:var(--info);color:var(--ink)}
.scr:disabled{cursor:not-allowed;opacity:.5}
.scr.cur{background:var(--primary-soft);color:var(--ink);font-weight:700}
.dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--line);flex:none}
.scr.done .dot{background:var(--good);border-color:var(--good)}
.scr.cur .dot{border-color:var(--primary)}
.reviewer{margin:18px 8px 0;padding-top:14px;border-top:1px solid var(--line);font-size:.85rem;color:var(--muted);display:flex;flex-direction:column;gap:10px}
.reviewer label{display:flex;gap:8px;align-items:center;cursor:pointer}
.reviewer input{width:18px;height:18px;accent-color:var(--primary)}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:.85rem;padding:0;text-align:left}
.scrim{display:none}
/* main */
.main{min-width:0;padding-inline:24px;padding-block:20px 120px}
.wrap{max-width:900px;margin:0 auto}
.crumb{font-size:.88rem;color:var(--muted);margin-bottom:10px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.crumb .step{background:var(--primary-soft);color:var(--primary);font-weight:700;border-radius:99px;padding:2px 10px;font-size:.8rem}
.lesson{background:var(--panel);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.lesson .meter{border-radius:0;height:6px}
.lesson .meter i{border-radius:0}
.slide{padding:30px 36px 36px;display:flex;flex-direction:column;gap:20px}
.slide>h1{font-size:clamp(1.5rem,3vw,2rem);line-height:1.2}
.lead{font-size:1.06rem;max-width:68ch}
.prose{display:flex;flex-direction:column;gap:12px;max-width:70ch}
.ticks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}.ticks li{display:flex;gap:10px;align-items:flex-start}.ticks .tk{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:.8rem;margin-top:1px}.ticks .hit .tk{background:#1f8a4c;color:#fff}.ticks .miss .tk{background:#e3e7ee;color:#5b6576}
.ptag{display:inline-block;margin-left:8px;padding:1px 9px;border-radius:99px;background:rgba(255,255,255,.75);font-size:.85rem;font-weight:700}
.prose ul,.prose ol,.plain{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:6px}
/* bottom nav */
.navbar{position:fixed;left:300px;right:0;bottom:0;z-index:12;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(6px);border-top:1px solid var(--line);padding-inline:24px;padding-block:12px calc(12px + env(safe-area-inset-bottom,0px))}
.navbar .in{max-width:900px;margin:0 auto;display:flex;align-items:center;gap:12px}
.navbar .msg{flex:1;text-align:center;font-size:.92rem;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 22px;border-radius:999px;border:2px solid var(--line);background:var(--panel);cursor:pointer;font-weight:700}
.btn:hover:not(:disabled){border-color:var(--primary);color:var(--primary)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.pri{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn.pri:hover:not(:disabled){background:var(--primary-hover);border-color:var(--primary-hover);color:var(--on-primary)}
.btn.sm{min-height:42px;padding:8px 18px;font-size:.95rem}
.btn svg{width:18px;height:18px}
/* instruction line */
.ins{font-weight:600;color:var(--ink);font-size:.98rem;max-width:70ch}
/* INFORMATION style: tinted, flat, never outlined */
.info{background:var(--info);border-radius:var(--r);padding:16px 20px;max-width:72ch}
.info.tip{display:flex;gap:14px;align-items:flex-start;background:#fdf1ef;border-left:4px solid #d93a32}
.info.tip .pinwrap{flex:none;width:30px;height:30px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.info.tip .pin{width:20px;height:20px}
.info.tip .tipbody{min-width:0;display:flex;flex-direction:column;gap:4px}
.info .lab,.lab{font:600 .74rem var(--head);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;display:block}
.key{background:var(--primary-soft);border-radius:var(--r);padding:16px 20px;font-size:1.1rem;font-weight:700;max-width:72ch}
.note{background:var(--note);color:var(--note-ink);border-radius:var(--r);padding:14px 18px;max-width:72ch;font-size:.95rem}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:14px}
.col{background:var(--info);border-radius:var(--r);padding:16px 18px;min-width:0}
.col h2{font-size:1.02rem;margin-bottom:8px;display:flex;gap:8px;align-items:center}
.col ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:5px}
.col.do{background:var(--good-soft)} .col.dont{background:var(--bad-soft)}
.col .ic{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:.8rem;color:#fff;flex:none}
.col.do .ic{background:var(--good)} .col.dont .ic{background:var(--bad)}
.practices{background:var(--info);border-radius:var(--r);padding:14px 18px;max-width:72ch}
.practices .items{line-height:1.7}
.practices .sep{color:var(--primary);font-weight:700;padding:0 .45em}
.takeaways{background:var(--info);border-radius:var(--r);padding:18px 20px;max-width:72ch}
.takeaways ol{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:8px}
.flow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.fstep{background:var(--info-strong);border-radius:8px;padding:8px 12px;font-weight:700;font-size:.93rem}
.fstep.key2{background:var(--primary-soft);color:var(--primary)}
.arrow{color:var(--muted)}
.profile{background:var(--info);border-radius:var(--r);padding:18px 20px;max-width:72ch;display:flex;gap:16px;align-items:flex-start}
.profile .pbody{min-width:0;flex:1}
.profile .pn{font:600 1.08rem var(--head)}
.profile .pm{color:var(--muted);font-size:.92rem;margin-bottom:10px}
.profile ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
.profile li.hl{background:var(--note);color:var(--note-ink);border-radius:8px;padding:10px 12px;list-style:none;margin-left:-1.2em;font-weight:700;font-size:1.05rem}
.tbl-wrap{overflow-x:auto;max-width:100%;border-radius:var(--r);background:var(--info)}
table{border-collapse:collapse;font-size:.95rem;width:100%;min-width:480px}
th,td{padding:10px 14px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
th{font:600 .76rem var(--head);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);background:var(--info-strong)}
.opts-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:14px}
.ocard{background:var(--info);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:6px;min-width:0}
.ocard h3{font-size:1.02rem}
.ocard .stat{font:600 1.6rem/1.1 var(--head);font-variant-numeric:tabular-nums;color:var(--primary)}
.ocard .statl{font-size:.85rem;color:var(--muted)}
.badges{display:flex;flex-wrap:wrap;gap:6px}
.badge{font:600 .72rem var(--head);letter-spacing:.04em;text-transform:uppercase;border-radius:99px;padding:3px 9px}
.badge.common{background:var(--note);color:var(--note-ink)}
.badge.course{background:var(--primary);color:var(--on-primary)}
.ocard.course{box-shadow:inset 0 0 0 2px var(--primary)}
.source{font-size:.82rem;color:var(--muted);max-width:72ch}
.g9wrap{overflow-x:auto;max-width:100%;padding-bottom:4px}
.grid9{display:grid;grid-template-columns:auto repeat(3,minmax(0,1fr));gap:6px;font-size:.88rem;max-width:720px}
.g9ax .short{display:none}
.g9list{display:none;flex-direction:column;gap:12px}
.g9grp{display:flex;flex-direction:column;gap:6px}
.g9list .g9{min-height:0}
.g9 b{overflow-wrap:break-word;hyphens:auto}
.g9{background:var(--info);border-radius:8px;padding:10px;min-height:78px}
.g9 b{display:block;font-family:var(--head);font-weight:600;font-size:.9rem;margin-bottom:2px}
.g9.hi{background:var(--good-soft)} .g9.lo{background:var(--bad-soft)}
.g9ax{font:600 .72rem var(--head);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;justify-content:center;text-align:center;padding:4px}
.g9ax.v{writing-mode:vertical-rl;transform:rotate(180deg)}
.gloss{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px}
.ggroup{background:var(--info);border-radius:var(--r);padding:16px 18px}
.ggroup h2{font-size:1rem;margin-bottom:8px;color:var(--primary)}
.ggroup dl{margin:0;display:flex;flex-direction:column;gap:10px}
.ggroup dt{font-weight:700}
.ggroup dd{margin:0;color:var(--ink);font-size:.95rem}
.spread{display:flex;flex-direction:column;gap:8px;max-width:620px;background:var(--info);border-radius:var(--r);padding:16px 18px}
.srow{display:grid;grid-template-columns:minmax(110px,140px) minmax(0,1fr) 44px;gap:10px;align-items:center;font-size:.93rem}
.strack{height:22px;background:var(--info-strong);border-radius:6px;overflow:hidden}
.strack i{display:block;height:100%;background:var(--muted);opacity:.5}
.srow.me .strack i{background:var(--primary);opacity:1}
.srow.me{font-weight:700}
.snum{font-variant-numeric:tabular-nums;text-align:right}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:14px}
/* INTERACTIVE style: white, blue outline, shadow, cue */
.ix{background:var(--panel);border:2px solid var(--primary);border-radius:var(--r);box-shadow:var(--shadow);cursor:pointer;text-align:left;transition:transform .12s,box-shadow .12s,background .12s;position:relative}
.ix:hover:not(:disabled){transform:translateY(-1px);background:var(--primary-soft)}
.ix:disabled{cursor:default}
.cue{display:inline-flex;align-items:center;gap:6px;font-size:.82rem;font-weight:700;color:var(--primary);margin-top:auto}
.cue svg{width:16px;height:16px}
.seen-mark{display:none;color:var(--good);font-weight:700;font-size:.82rem;align-items:center;gap:4px}
.ix.seen .seen-mark{display:inline-flex}
.ix.seen{border-color:var(--good)}
.rgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:14px}
.rcard{padding:16px 18px;display:flex;flex-direction:column;gap:8px;min-height:120px}
.rcard .rh{font:600 1.02rem var(--head)}
.rcard .front{color:var(--muted);font-style:italic}
.rcard .rb{font-size:.97rem}
.rcard .qs{background:var(--primary-soft);border-radius:8px;padding:8px 10px;font-size:.93rem}
.rcard .qs b{color:var(--primary)}
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tabbtn{padding:10px 16px;font-weight:700;border-radius:999px;min-height:44px}
.ix.tabbtn[aria-selected="true"],.ix.tabbtn[aria-selected="true"]:hover:not(:disabled){background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.tabbtn.seen{border-color:var(--good)}
.tabbtn.seen[aria-selected="true"]{border-color:var(--primary)}
.tpanel{background:var(--info);border-radius:var(--r);padding:16px 20px;display:flex;flex-direction:column;gap:8px;max-width:72ch;min-height:90px}
.tpanel h2{font-size:1.08rem}
.tline{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.acc{display:flex;flex-direction:column;gap:10px;max-width:72ch}
.acc details{padding:0}
.acc summary{cursor:pointer;font-weight:700;padding:14px 18px;list-style:none;display:flex;justify-content:space-between;gap:12px;align-items:center;min-height:52px}
.acc summary::-webkit-details-marker{display:none}
.acc summary::after{content:"+";font:600 1.3rem var(--head);color:var(--primary)}
.acc details[open] summary::after{content:"–"}
.acc .ab{padding:0 18px 16px;display:flex;flex-direction:column;gap:6px}
.acc.drop{max-width:none}.resdrop{max-width:72ch}.replays{display:flex;flex-wrap:wrap;gap:10px}.resdrop .sumt{display:flex;align-items:center;gap:10px}.resdrop .sumt svg{width:18px;height:18px;color:var(--primary);flex:none}.acc.drop .ab{gap:16px;padding-top:4px}
.counter{font-size:.88rem;color:var(--muted);font-variant-numeric:tabular-nums}
/* choice options */
.mcq{display:flex;flex-direction:column;gap:12px}
.q{font-weight:700;font-size:1.06rem;max-width:70ch}
.opts{display:flex;flex-direction:column;gap:10px;max-width:74ch}
.opt{padding:12px 16px;display:flex;gap:12px;align-items:flex-start;min-height:52px}
.opt .k{font:600 .9rem var(--head);color:var(--primary);background:var(--primary-soft);border-radius:50%;width:28px;height:28px;display:grid;place-items:center;flex:none}
.ix.opt.pick.ok,.ix.opt.pick.ok:hover{border-color:var(--good);background:var(--good-soft)} .opt.pick.ok .k{background:var(--good);color:#fff}
.ix.opt.pick.no,.ix.opt.pick.no:hover{border-color:var(--bad);background:var(--bad-soft)} .opt.pick.no .k{background:var(--bad);color:#fff}
.ix.opt.pick.mid,.ix.opt.pick.mid:hover{border-color:var(--mid);background:var(--mid-soft)} .opt.pick.mid .k{background:var(--mid);color:#fff}
.opt.best:not(.pick){border-style:dashed;border-color:var(--good)}
.opt:disabled:not(.pick):not(.best){opacity:.6;border-color:var(--line);box-shadow:none}
.fb{border-radius:var(--r);padding:14px 18px;max-width:72ch}
.fb b.h{display:block;margin-bottom:2px}
.fb.ok{background:var(--good-soft)} .fb.no{background:var(--bad-soft)} .fb.mid{background:var(--mid-soft)} .fb.neu{background:var(--info)}
.pts{font-size:.92rem;font-weight:700;color:var(--muted)}
.pts span{font-variant-numeric:tabular-nums;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{padding:10px 16px;border-radius:999px;font-weight:700;min-height:46px}
.ix.chip[aria-pressed="true"],.ix.chip[aria-pressed="true"]:hover:not(:disabled){background:var(--primary);color:var(--on-primary)}
/* sort */
.sort{display:flex;flex-direction:column;gap:14px}
.pool{display:flex;flex-wrap:wrap;gap:10px;min-height:56px;padding:12px;border-radius:var(--r);background:var(--info)}
.pool:empty::before{content:"All cards placed. Check your answers below.";color:var(--muted);font-size:.92rem}
.card{padding:10px 14px;font-size:.97rem;max-width:100%;min-height:46px}
.ix.card[aria-pressed="true"],.ix.card[aria-pressed="true"]:hover:not(:disabled){background:var(--primary);color:var(--on-primary)}
.ix.card.wrong,.ix.card.wrong:hover:not(:disabled){border-color:var(--bad);background:var(--bad-soft)}
.ix.card.right,.ix.card.right:hover:not(:disabled){border-color:var(--good);background:var(--good-soft)}
.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:12px}
.bucket{border:2px dashed var(--primary);border-radius:var(--r);padding:12px;min-height:150px;display:flex;flex-direction:column;gap:8px;background:var(--panel);cursor:pointer}
.bucket.armed{background:var(--primary-soft);border-style:solid}
.bucket .bh{font:600 1rem var(--head);display:flex;justify-content:space-between;gap:8px}
.bucket .bh small{font:400 .8rem var(--body);color:var(--primary)}
.why{font-size:.86rem;color:var(--bad);margin-top:4px;font-weight:400}
/* inputs */
textarea,input[type=text]{width:100%;max-width:72ch;background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:12px 14px}
textarea:focus,input[type=text]:focus{border-color:var(--primary);outline:none}
textarea{min-height:96px;resize:vertical}
.field{display:flex;flex-direction:column;gap:6px;max-width:72ch}
.field label{font-weight:700}
.field .help{font-size:.88rem;color:var(--muted)}
.model{background:var(--good-soft);border-radius:var(--r);padding:14px 18px;max-width:72ch;display:flex;flex-direction:column;gap:8px}
.check{display:flex;flex-direction:column;gap:10px;max-width:72ch}

  ['Calibration','A structured meeting where managers review each other’s proposed ratings against shared standards before ratings are final.'],

{nav:'Welcome',blocks:[{type:'title',eyebrow:'Module 1 of 6 · Introduction',h:'Understanding Performance Calibration',
  lead:'Every performance rating can influence an employee’s pay, promotion opportunities, and decision to stay. Employees trust that ratings are fair and consistent, regardless of who their manager is. This course explores how calibration builds that trust and the role you play in making it happen.'}]},

  {type:'info',label:'Moving Through the Course',html:'<ul><li>Select <b>Next</b> at the bottom of the screen to move on. Activities are there to help you learn, so try as many as you find useful.</li><li>Knowledge checks are the exception. Answer every question and pass to unlock the rest of the course.</li><li>Use <b>Key Terms</b> at the top of the screen at any time to look up a word.</li><li>Use <b>Menu</b> to see your progress and jump between sections. You can hide the menu to give the lesson more room.</li><li>Look for <b>Download</b> buttons. They give you Word documents you can edit, print or save as PDF.</li></ul>'}]},

{h:'Key Terms',nav:'Key Terms',blocks:[

{h:'Rate This Employee',nav:'Rate This Employee',blocks:[
  {type:'lead',html:'Before we define calibration, let’s put your judgment to the test. Review Jordan’s performance over the past year, select a rating, and explain your reasoning in one sentence. There’s no right or wrong answer at this stage.'},
  {type:'profile',who:'jordan',name:'Jordan Ellis, Customer Success Manager II',meta:'2 years in role · Manages 40 mid-market accounts',lines:[

   '<b>Goal 2, cut onboarding from 45 to 30 days:</b> Achieved 28 days. Three other CSMs now use Jordan’s checklist.',
   '<b>Goal 3, quarterly business reviews (QBRs) with 90% of accounts:</b> Completed 75%. Focused on at-risk accounts in Q3 instead.',

{h:'Same Evidence. Different Ratings.',nav:'Same Evidence, Different Ratings',blocks:[
  {type:'recall',key:'jordan',label:'You Rated Jordan'},
  {type:'spread',key:'jordan',label:'How Other Managers Rated Jordan',bars:[['Exceptional',5],['Exceeds',40],['Meets',45],['Partially meets',10],['Does not meet',0]]},
  {type:'text',html:'<p>Managers reviewed the same performance profile and assigned different ratings. Some focused on the missed retention goal, while others emphasized the onboarding improvements that benefited the entire team.</p><p>Both perspectives are valid. The problem is that Jordan’s rating, and potentially their pay, could depend on which manager conducted the review. That’s where calibration comes in.</p>'}]},
{h:'Understanding Calibration',nav:'Understanding Calibration',blocks:[
  {type:'key',html:'Calibration is a structured peer review of proposed ratings against shared standards, held before ratings are final.'},
  {type:'text',html:'<p>During a calibration session, managers responsible for similar roles meet with a facilitator to review proposed performance ratings. For each employee:</p><ol><li>The manager shares the proposed rating and supporting evidence.</li><li>Peers ask questions and compare performance against similar cases.</li><li>The group agrees on a rating based on shared standards and documents the reasons for any changes.</li></ol><p>This process takes place before ratings are finalized or communicated to employees.</p>'}]},
{h:'Calibration: What It Is and What It Isn’t',nav:'What It Is and Isn’t',blocks:[
  {type:'lead',html:'Calibration is easy to misunderstand. Sort each statement into the box where it belongs.'},
  {type:'sort',buckets:['Calibration Is','Calibration Is Not'],ok:' Calibration ensures ratings are fair and consistent by comparing performance against shared standards, reviewing supporting evidence, and documenting any changes.',cards:[
   ['Checking ratings against shared level definitions',0,'This is the core of calibration.'],
   ['Comparing similar roles side by side',0,'Cross-checking similar roles is part of calibration.'],
   ['Changing a rating when the evidence supports it',0,'Calibration exists to make these changes.'],
   ['Recording the reason for every change',0,'Every change needs a recorded reason.'],
   ['Ranking employees against each other',1,'People are measured against the standard, not against each other.'],
   ['Letting the most persuasive manager win',1,'The best evidence should win, not the best advocate.'],
   ['Fitting ratings to a budget',1,'Ratings come first; pay decisions follow from them.'],
   ['The first time an employee hears about a problem',1,'Feedback belongs in check-ins during the year.']]}]},
{h:'Consequences of Inconsistent Performance Ratings',nav:'Consequences of Inconsistent Ratings',blocks:[
  {type:'lead',html:'Inconsistent performance ratings do more than create perceptions of unfairness. They can negatively impact the organization in four ways.'},
  {type:'reveal',style:'grid',items:[
   {h:'Pay and Promotion',b:'Inconsistent ratings waste compensation budgets, undervalue strong performers, and lead to poor promotion decisions.'},
   {h:'Retention',b:'Strong performers rated low by a strict manager are the most likely to leave, and the hardest to replace.'},
   {h:'Trust',b:'Employees compare notes. Inconsistent ratings make the whole process look arbitrary.'},
   {h:'Legal Risk',b:'Rating patterns that fall along demographic lines are hard to defend without documented evidence.'}]}]},
{h:'Where Calibration Fits in the Year',nav:'Where Calibration Fits',blocks:[
  {type:'lead',html:'Calibration sits between your draft rating and the conversation with your employee. It can only be as good as the evidence gathered before it.'},
  {type:'reveal',style:'timeline',ins:'Select each phase to learn more.',items:[
   {h:'Goal Setting',b:'<p><b>January–February:</b> Agree on goals and how success will be measured.</p><p><b>Why it matters:</b> Clear goals provide a consistent standard for evaluating performance.</p>'},
   {h:'Check-Ins',b:'<p><b>Throughout the year:</b> Provide regular feedback and document progress.</p><p><b>Why it matters:</b> Ongoing notes reduce recency bias during evaluations.</p>'},
   {h:'Self-Review',b:'<p><b>Early November:</b> Employees summarize their performance and accomplishments.</p><p><b>Why it matters:</b> Highlights contributions managers may have missed.</p>'},
   {h:'Manager Draft',b:'<p><b>Mid to Late November:</b> Propose a rating supported by evidence.</p><p><b>Why it matters:</b> Prepares you for calibration. Draft ratings remain private.</p>'},
   {h:'Calibration',b:'<p><b>Early December:</b> Managers review ratings, apply consistent standards, and document changes.</p><p><b>Why it matters:</b> Ensures ratings are fair and consistent across employees.</p>'},
   {h:'Delivery',b:'<p><b>Mid-December–January:</b> Share the final rating, supporting evidence, and development priorities.</p><p><b>Why it matters:</b> Provides clarity and helps shape next year’s goals.</p>'}]}]},
{h:'Three Rules That Keep the Cycle Fair',nav:'Three Rules',blocks:[
  {type:'cols',cols:[{h:'Keep Draft Ratings Private',items:['If calibration changes a rating you already shared, you have broken a promise']},{h:'Calibrate Before Compensation',items:['Ratings drive pay decisions, never the other way around']},{h:'Treat the Cycle as a Loop',items:['Gaps you find in calibration become better check-ins next year']}]},
  {type:'mcq',q:'Your direct report asks what rating you have put in. Calibration is next week. What do you say?',opts:[
   ['“Exceeds, but don’t tell anyone.”',false,'If calibration changes it, you have made a promise you cannot keep.'],
   ['“I’ve drafted a rating, but it isn’t final until calibration. We’ll talk once it is.”',true,'You are honest about the process without committing early.'],
   ['“I don’t know yet.”',false,'That isn’t quite honest: you have drafted one. Explain the process instead.']]}]},
{h:'Performance Review Approaches',nav:'Performance Review Approaches',blocks:[
  {type:'lead',html:'Most organizations hold one conversation after calibration. Some split it into two conversations instead.'},
  {type:'options',items:[{h:'One Conversation',course:true,b:'<p>Calibration happens first. Then one meeting covers the rating, the evidence and development.</p>'},{h:'Two Conversations',b:'<p>A feedback conversation comes first, with no rating. The manager uses that input in calibration, and a short rating conversation follows, usually within 2–4 weeks.</p>'}]},
  {type:'info',pin:true,html:'<p>The same rule applies in both models: never hint at a rating before calibration is complete.</p>'}]},
{h:'Calibration in Practice: Rating Scales',nav:'Rating Scales',blocks:[
  {type:'lead',html:'Organizations run calibration in different ways. The next four screens show the most common choices and explain which ones this course uses. First, the rating scale.'},
  {type:'reveal',style:'tabs',ins:'Select each tab to compare the three most common scale designs.',items:[
   {h:'Five-Level Scale',b:'<p><b>Exceptional · Exceeds · Meets · Partially meets · Does not meet</b></p><p>The most widely used design. It separates strong and weak performance into two levels each, which helps with pay decisions but means managers must agree where each boundary falls.</p>'},
   {h:'Four-Level Scale',b:'<p><b>Exceeds expectations · Fully meets expectations · Partially meets expectations · Does not meet expectations</b></p><p>With no middle level, managers must decide whether performance leans above or below the standard, which reduces clustering in the middle. The trade-off is that solid, reliable performance and slightly-below-standard performance can feel too far apart.</p>'},
   {h:'Three-Level Scale',b:'<p><b>Exceeds expectations · Meets expectations · Does not meet expectations</b></p><p>Simpler and quicker to calibrate, with less arguing over fine distinctions. The trade-off is that most people land in “Meets”, so pay differences rely more on manager judgment within that level.</p>'}]},
  {type:'drop',label:'Performance Rating Scales Across Organizations',blocks:[
  {type:'spread',label:'Performance Rating Scales: Percentage of Organizations by Number of Rating Levels',bars:[['5 levels',57],['4 levels',20],['3 levels',16]]},
  {type:'info',label:'What the Research Shows',html:'<p>Ratings are still the norm: 92% of organizations that review performance use them. The five-level scale is the most common by a wide margin.</p><p>The direction of change is <b>simplification</b>. Recent redesigns tend toward simpler rating structures and fewer levels, so the conversation focuses on the description rather than the number. Some organizations have moved to three- or four-level scales.</p>'}]},
  {type:'key',html:'This course uses a five-level rating scale, but the skills you’ll learn apply regardless of the scale your organization uses.'},
  {type:'source',html:'Source: <a href="https://talentstrategygroup.com/2026-performance-management-report/" target="_blank" rel="noopener">The Talent Strategy Group, 2026 Performance Management Report</a> (250+ organizations, surveyed late 2025).'}]},
{h:'When Calibration Happens',nav:'When It Happens',blocks:[
  {type:'lead',html:'How often organizations formally review performance, and therefore calibrate:'},
  {type:'options',items:[
   {h:'Once a Year, at Year-End',stat:'56%',statl:'of organizations',b:'<p>One review and one calibration, usually in November–December for a calendar year.</p>',common:true,course:true},
   {h:'Twice a Year',stat:'36%',statl:'of organizations',b:'<p>A mid-year review (June–July) and a year-end review. The mid-year round is often lighter and catches rating drift early.</p>'},
   {h:'More Than Twice a Year',stat:'8%',statl:'of organizations',b:'<p>Quarterly or continuous reviews, often with lighter calibration each time.</p>'}]},
  {type:'key',html:'This course uses one annual review with calibration in early December.'},
  {type:'source',html:'Source: <a href="https://talentstrategygroup.com/2026-performance-management-report/" target="_blank" rel="noopener">The Talent Strategy Group, 2026 Performance Management Report</a>.'}]},
{h:'Who Attends Calibration',nav:'Who Attends',blocks:[
  {type:'lead',html:'About 85% of organizations hold calibration meetings. Who is in the room varies.'},
  {type:'options',items:[
   {h:'Peer Managers and Their Leader',b:'<p>Managers who rate similar roles in one function or business unit, their shared leader, and an HRBP as facilitator.</p><p>Calibration most often happens at this business-unit or function level.</p>',common:true,course:true},
   {h:'Senior Leadership Team',b:'<p>Senior leaders review ratings for a whole department or organization, with managers sending in their proposals.</p><p>Faster, but the people who know the work best are not in the room.</p>'},
   {h:'Cross-Functional Panel by Level',b:'<p>Managers from different functions calibrate everyone at one job level, for example all senior individual contributors.</p><p>Strong consistency across the organization; needs good role descriptions.</p>'}]},
  {type:'key',html:'This course uses sessions of peer managers who rate similar roles, their shared leader, and an HRBP facilitator.'},
  {type:'source',html:'Source: <a href="https://talentstrategygroup.com/2026-performance-management-report/" target="_blank" rel="noopener">The Talent Strategy Group, 2026 Performance Management Report</a>.'}]},
{h:'Decisions That Follow',nav:'Decisions That Follow',blocks:[
  {type:'lead',html:'Most organizations link ratings to pay. How tightly they link them varies.'},
  {type:'options',items:[
   {h:'Guided Linkage',stat:'55%',statl:'of organizations',b:'<p>Each rating has a pay range; managers choose within it. Pay is decided after ratings are final.</p>',common:true,course:true},
   {h:'Fixed Linkage',stat:'18%',statl:'of organizations',b:'<p>A formula sets the merit increase or bonus directly from the rating.</p>'},
   {h:'Flexible or No Linkage',stat:'26%',statl:'of organizations',b:'<p>Managers decide pay with little guidance (19%), or ratings and pay are not linked at all (7%).</p>'}]},
  {type:'info',pin:true,html:'<p><b>Promotions</b> are usually discussed separately, in a talent review after calibration.</p>'},
  {type:'key',html:'In this course: ratings are calibrated first. Pay is decided afterward using guided ranges. Promotions and potential are discussed in a separate talent review.'},
  {type:'source',html:'Source: <a href="https://talentstrategygroup.com/2026-performance-management-report/" target="_blank" rel="noopener">The Talent Strategy Group, 2026 Performance Management Report</a>.'}]},
{h:'How Calibration Runs in This Course',nav:'This Course’s Model',blocks:[
  {type:'table',rowHead:true,head:['Choice','What This Course Uses'],rows:[
   ['Rating scale','Five levels: Exceptional, Exceeds, Meets, Partially meets, Does not meet'],
   ['Timing','One annual review; calibration in early December'],
   ['Who attends','Peer managers of similar roles, their shared leader, and an HRBP facilitator'],
   ['Decisions that follow','Pay decided afterward within guided ranges; promotions in a separate talent review'],
   ['Distribution','A recommended distribution is a reference point, never a quota']]},
  {type:'resources',label:'Tools and Templates',items:['prep','log','scale']}]},
{h:'Knowledge Check',nav:'Knowledge Check',blocks:[
  {type:'quiz',pass:3,review:'the screens “Understanding Calibration”, “Where Calibration Fits in the Year” and “Three Rules That Keep the Cycle Fair”',qs:[
   {q:'What is the main purpose of calibration?',opts:['Ranking employees against each other','Applying one rating standard consistently across teams','Fitting ratings to the merit budget','Giving employees feedback'],a:1,fb:'Calibration measures each person against the standard, not against each other or a budget.'},
   {q:'When should a manager share a rating with an employee?',opts:['When they draft it, so there are no surprises','After calibration, once ratings are final','During the self-review stage','Only if the rating changed in calibration'],a:1,fb:'Sharing a draft risks a promise you cannot keep if calibration changes it.'},
   {q:'Which is the strongest argument in a calibration discussion?',opts:['“I’ve managed people for 15 years and know a top performer.”','“She’s the hardest worker on my team.”','“She cut onboarding time from 45 to 30 days, and three other teams adopted her process.”','“He’ll leave if he doesn’t get this rating.”'],a:2,fb:'Specific, observable results persuade. Experience, effort and threats to leave do not.'},
   {q:'A problem raised in calibration is news to the employee. What went wrong?',opts:['Nothing; calibration is the right place to raise it','Feedback wasn’t given during check-ins earlier in the year','The self-review should have caught it','The facilitator should have screened it out'],a:1,fb:'Nothing raised in calibration should be the first time an employee hears it.'}]}]},
{h:'Summary and Next Steps',nav:'Summary',blocks:[
  {type:'takeaways',items:['Calibration applies one standard across all managers, before ratings are final.','Ratings that are not calibrated cost pay equity, retention, trust and legal safety.','Keep draft ratings private, and calibrate before compensation.','This course uses a five-level scale, annual year-end calibration with peer managers and an HRBP facilitator, and guided pay ranges afterward.']},
  {type:'resources',label:'Download for Later',items:['glance','hrbp']}]}
]});

COURSE.push({name:'The Calibration Process',screens:[
{nav:'Welcome',blocks:[{type:'title',eyebrow:'Module 2 of 6',h:'The Calibration Process',
  lead:'In Module 1, you saw how managers can interpret the same performance evidence differently. This module helps you apply consistent rating standards so that ratings mean the same thing across teams.'}]},
{h:'What You’ll Learn',nav:'What You’ll Learn',blocks:[
  {type:'lead',html:'By the end of this module, you’ll be able to:'},
  {type:'list',ordered:true,items:['Describe each rating level with observable examples','Rate performance against role expectations, not peers or past performance','Consistently evaluate results (the “what”) and behaviors (the “how”)','Apply ratings to partial-year, leave, and role-change situations','Explain why “Meets Expectations” reflects solid performance']}]},
{h:'Same Rating, Different Interpretations',nav:'Why Ratings Differ',blocks:[
  {type:'recall',key:'jordan',label:'You Rated Jordan in Module 1'},
  {type:'lead',html:'Most rating disagreements aren’t about employee performance. They stem from how managers interpret rating levels. Here’s how three managers define the same rating, “Exceeds Expectations”:'},
  {type:'cols',cols:[{h:'Manager A',items:['“Exceeds means going above and beyond.”']},{h:'Manager B',items:['“Exceeds means beating every goal.”']},{h:'Manager C',items:['“Exceeds means better than the rest of my team.”']}]},
  {type:'info',html:'<p>Three managers, three interpretations. Fair ratings require shared definitions, and that’s what you’ll learn in this module.</p>'}]},
{h:'Five Performance Rating Levels',nav:'Five Rating Levels',blocks:[
  {type:'lead',html:'Each rating level is based on expectations for the employee’s <b>current role and level</b>. For example, junior and senior employees can both earn “Exceeds Expectations” ratings for different contributions.'},
  {type:'reveal',style:'tabs',ins:'Select each of the five tabs to explore how each rating applies to results and behaviors. Pay special attention to “Meets” and “Exceeds,” where rating disagreements are most common.',items:[
   {h:'5 · Exceptional',b:'<p><b>Definition:</b> Impact well beyond the role, sustained all period.</p><p><b>Results look like:</b> Outcomes typically expected one level up; changes how the team or business works.</p><p><b>Behaviors look like:</b> Raises the bar for others; models values under pressure.</p>'},
   {h:'4 · Exceeds',b:'<p><b>Definition:</b> Regularly goes beyond expectations in important areas.</p><p><b>Results look like:</b> Meets all goals and clearly surpasses several; takes on added scope successfully.</p><p><b>Behaviors look like:</b> Improves processes for others; anticipates problems.</p>'},
   {h:'3 · Meets',b:'<p><b>Definition:</b> Fully and reliably delivers what the role requires.</p><p><b>Results look like:</b> Achieves goals, or misses narrowly for clear external reasons.</p><p><b>Behaviors look like:</b> Dependable; works well with others; acts on feedback.</p>'},
   {h:'2 · Partially Meets',b:'<p><b>Definition:</b> Falls short of expectations in meaningful areas.</p><p><b>Results look like:</b> Misses key goals for reasons within their control.</p><p><b>Behaviors look like:</b> Needs more direction than the level expects.</p>'},
   {h:'1 · Does Not Meet',b:'<p><b>Definition:</b> Well short of the role’s requirements.</p><p><b>Results look like:</b> Misses most goals; work often needs redoing.</p><p><b>Behaviors look like:</b> Conduct concerns; little response to feedback.</p>'}]}]},
{h:'Four Rating Rules',nav:'Four Rating Rules',blocks:[
  {type:'lead',html:'These four rules are what every manager uses in calibration. Each card starts with a question. Flip it to see the rule.'},
  {type:'reveal',style:'flip',ins:'Select each card to flip it and read the rule.',items:[
   {h:'Rule 1',f:'What are you comparing the person to?',b:'<b>Rate against the role, not the team.</b> Compare each person to the level expectations, not to the strongest or weakest person on your team.'},
   {h:'Rule 2',f:'What counts as evidence?',b:'<b>Rate this period only.</b> Last year’s rating, potential and length of service are not evidence for this year.'},
   {h:'Rule 3',f:'What if results and behaviors point different ways?',b:'<b>Weigh the “what” and the “how”.</b> Results establish the initial rating, but behaviors can raise or lower it. Serious conduct issues can outweigh strong results.'},
   {h:'Rule 4',f:'What does the middle of the scale mean?',b:'<b>“Meets” is a good rating.</b> It means the person fully delivered a demanding job.'}]}]},
{h:'Rules in Action',nav:'Rules in Action',blocks:[
  {type:'series',label:'Case',okLabel:'Right.',noLabel:'Not quite.',first:'<p class="lead">Apply each of the four rating rules to a case.</p>',ins:'Read each case, select your answer, and review the explanation. Then select Next Case to continue.',items:[
   {q:'Maya is the top performer on your team, but she met her goals without exceeding them. What rating is most appropriate?',fb:' Ratings are based on role expectations, not how an employee compares to teammates.',opts:[['Meets',true],['Exceeds',false]]},
   {q:'Tom earned an “Exceptional” rating last year. This year, he met his goals, but his planning errors delayed a major project by two quarters.',fb:' Rate Tom’s performance this year, not last year. His previous “Exceptional” rating doesn’t outweigh the impact of this year’s planning errors.',opts:[['Meets or lower',true],['Exceptional again',false]]},
   {q:'Marcus achieved 140% of his sales target, but colleagues repeatedly report that he takes credit for shared deals. Despite coaching, his behavior hasn’t improved.',fb:' Under the “what and how” rule, results and behaviors both matter. Marcus exceeded his sales target, but his repeated behavior issues, despite coaching, prevent him from earning a higher rating.',opts:[['Exceptional',false],['Meets or lower',true]]},
   {q:'Priya delivered every feature on time and met quality standards, but her performance did not exceed expectations.',fb:' Priya met all expectations by delivering quality work on time. “Meets Expectations” reflects solid, successful performance and is a positive rating.',opts:[['Meets',true],['Partially meets',false]]}]}]},
{h:'Tricky Cases and Common Objections',nav:'Tricky Cases',blocks:[
  {type:'lead',html:'Some situations come up every cycle. Here is guidance on the cases and objections managers raise most often.'},
  {type:'reveal',style:'accordion',ins:'Select each item to open it and read the guidance.',items:[
   {h:'Tricky Case: New Hire or Partial Year',b:'<p>Rate on the time worked, against the goals set for that time. Many organizations set a minimum, such as being hired before October 1, to receive a rating.</p>'},
   {h:'Tricky Case: Leave of Absence',b:'<p>Rate the time worked. Protected leave never lowers a rating. Talk to your HRBP if you are unsure.</p>'},
   {h:'Tricky Case: Role Change or Promotion',b:'<p>Rate against the current role, weighted toward the longer period. Note the change in your prep summary.</p>'},
   {h:'Objection: “‘Meets’ will demotivate them.”',b:'<p>“Meets” means they did a demanding job well. Module 6 shows how to deliver it that way.</p>'},
   {h:'Objection: “They’re my best person.”',b:'<p>Best on your team isn’t the standard. Compare them to the level expectations; on that basis they may well be “Exceeds”.</p>'},
   {h:'Objection: “They have huge potential.”',b:'<p>Potential matters for development and promotion, not for this period’s rating.</p>'},
   {h:'Objection: “The definitions are too vague.”',b:'<p>This is why anchors matter. We’ll explore them in the next section.</p>'}]}]},
{h:'What Is an Anchor?',nav:'What Is an Anchor?',blocks:[
  {type:'key',html:'An anchor is a concrete, observable example of what a rating level looks like for a specific role.'},
  {type:'text',html:'<p>Rating definitions like “regularly exceeds expectations” are intentionally broad so they apply across roles. Anchors make those definitions specific by describing what performance looks like in a particular role. They help managers interpret and apply ratings consistently.</p>'},
  {type:'cols',cols:[{tone:'dont',h:'Not an Anchor',items:['“Strong performer.”','“Great attitude.”','“Works really hard.”']},{tone:'do',h:'An Anchor',items:['“Onboards customers within the 30-day standard.”','“Net revenue retention at or near the 105% target.”','“Escalates account risks before they become losses.”']}]},
  {type:'info',label:'A Good Anchor',html:'<ul><li>Describes a result or a behavior someone could observe</li><li>Uses a number where possible</li><li>Fits one role and level</li></ul>'}]},
{h:'Model Anchors',nav:'Model Anchors',blocks:[
  {type:'lead',html:'Here are sample performance anchors for a Customer Success Manager II, Jordan’s role. Use these examples as a guide when creating your own anchors in the next section.'},
  {type:'table',rowHead:true,head:['Level','Customer Success Manager II'],rows:[
   ['Exceeds','Net revenue retention of 110% or more · Builds a playbook other CSMs adopt · Resolves escalations before leadership needs to step in'],
   ['Meets','Net revenue retention at or near the 105% target · Onboards customers within the 30-day standard · Holds QBRs with most accounts · Escalates risks early'],
   ['Partially meets','Retention below target for reasons within their control · Onboarding regularly runs past 45 days · Risks surface late']]},
  {type:'info',pin:true,label:'Notice',html:'<p>Each “Exceeds” anchor describes impact beyond normal role expectations, not simply doing more of the same work. Every anchor also includes observable evidence that others can verify.</p>'}]},
{h:'Write Anchors for a Role You Manage',nav:'Write Your Anchors',blocks:[
  {type:'lead',html:'Now it’s your turn to create performance anchors for a role you manage. Your work is saved automatically, and you can download your anchors as a Word document at the end of this module.'},
  {type:'info',label:'How to Do It',html:'<ol><li>Enter the job title and level.</li><li>Consider the role’s key goals and responsibilities.</li><li>For “Meets”, write 2–3 examples of performance that fully meets expectations.</li><li>For “Exceeds”, write 2–3 examples of performance that goes beyond expectations.</li><li>For each rating, include at least one measurable result and one observable behavior.</li></ol>'},
  {type:'entry',role:true,ins:false,fields:[
   {label:'What “Meets” looks like for this role',help:'Example from the model: “Onboards customers within the 30-day standard.”',ph:'One anchor per line',store:'meets',min:20},
   {label:'What “Exceeds” looks like for this role',help:'Example from the model: “Builds a playbook other CSMs adopt.”',ph:'One anchor per line',store:'exceeds',min:20}]}]},
{h:'Check Your Anchors',nav:'Check Your Anchors',blocks:[
  {type:'lead',html:'Review your anchors using the four criteria below. If an anchor doesn’t meet a criterion, return to the previous section and revise it.'},
  {type:'checklist',required:false,prompt:'Click each statement that applies to your anchors.',items:['My anchors include at least one measurable result.','Each anchor describes observable performance.','My anchors focus on results and behaviors, not just effort or attitude.','My “Exceeds” anchors demonstrate impact beyond “Meets” expectations.']},
  {type:'info',pin:true,html:'<p><b>Remember:</b> Bring your anchors to your calibration preparation. They’ll help you explain and support your proposed ratings.</p>'}]},
{h:'Practice Applying Performance Ratings',nav:'Practice Applying Ratings',blocks:[
  {type:'series',label:'Case',okLabel:'That matches the expert view.',noLabel:'The expert view is different.',first:'<p class="lead">Apply the rating scale and four rating rules to six realistic scenarios. After each decision, review the feedback to see how well your rating aligns with the standards.</p>',ins:false,items:[
   {q:'<b>Lena, HR Coordinator,</b> joined in September. In three months she cleared an onboarding backlog and meets every expectation set when she was hired.',fb:' The suggested rating is Meets Expectations. For a partial year, evaluate performance against the goals and expectations established for the time worked.',fbOk:' For a partial year, evaluate performance against the goals and expectations established for the time worked.',opts:[['Exceeds',false],['Meets',true],['Partially meets',false]]},
   {q:'<b>Aisha, Marketing Manager,</b> missed her lead-generation goal by 8% after a 30% budget cut in Q2, then kept the cost per lead below target.',fb:' The suggested rating is Meets Expectations. Aisha narrowly missed her goal due to a significant budget cut but adapted effectively, keeping her cost per lead below target.',fbOk:' Aisha narrowly missed her goal due to a significant budget cut but adapted effectively, keeping her cost per lead below target.',opts:[['Meets',true],['Partially meets',false],['Does not meet',false]]},
   {q:'<b>Daniel, a Support Specialist,</b> handles a typical ticket volume but falls short of his customer satisfaction target (4.2 vs. 4.4) and repeatedly completes shift handoffs late despite feedback.',fb:' The suggested rating is Partially Meets. Daniel handles the expected workload but falls short on customer satisfaction and consistently misses timely handoffs. These ongoing performance gaps prevent a “Meets” rating.',fbOk:' Daniel handles the expected workload but falls short on customer satisfaction and consistently misses timely handoffs. These ongoing performance gaps prevent a “Meets” rating.',opts:[['Meets',false],['Partially meets',true],['Does not meet',false]]},
   {q:'<b>Grace, a Product Manager,</b> delivered all planned roadmap initiatives and led a pricing project that increased average deal size by 12%, taking on responsibilities typically handled by a Senior Product Manager.',fb:' The suggested rating is Exceeds Expectations, possibly Exceptional. Grace delivered results beyond her role’s expectations. An “Exceptional” rating would depend on whether she consistently demonstrated this level of impact throughout the review period.',fbOk:' Grace delivered results beyond her role’s expectations. An “Exceptional” rating would depend on whether she consistently demonstrated this level of impact throughout the review period.',opts:[['Meets',false],['Exceeds',true],['Exceptional',true]]},
   {q:'<b>Owen, a Data Analyst,</b> took four months of approved parental leave. During the eight months he worked, he met all his goals and developed a dashboard now used across the company.',fb:' The suggested rating is Exceeds Expectations. Owen met all goals and created a dashboard with company-wide impact, exceeding role expectations. His rating reflects his performance during the eight months worked, without penalizing him for parental leave.',fbOk:' Owen met all goals and created a dashboard with company-wide impact, exceeding role expectations. His rating reflects his performance during the eight months worked, without penalizing him for parental leave.',opts:[['Meets',false],['Exceeds',true],['Partially meets',false]]},
   {q:'<b>Sofia, a Finance Associate,</b> missed two monthly close deadlines and made reconciliation errors that were flagged by auditors. Despite coaching, her performance has not improved.',fb:' The suggested rating is Does Not Meet Expectations. Sofia missed critical deadlines and made errors that reached auditors. Despite coaching, her performance has not improved.',fbOk:' Sofia missed critical deadlines and made errors that reached auditors. Despite coaching, her performance has not improved.',opts:[['Meets',false],['Partially meets',false],['Does not meet',true]]}]}]},
{h:'Knowledge Check',nav:'Knowledge Check',blocks:[
  {type:'quiz',pass:3,review:'the screens “Five Performance Rating Levels” and “Four Rating Rules”',qs:[
   {q:'A manager rates someone “Exceeds” because they are the strongest person on the team. What is wrong?',opts:['Nothing; that is how ratings work','The rating should compare the person to the role’s expectations, not to teammates','The manager should have waited for calibration','Only senior leaders can give “Exceeds”'],a:1,
    fb:'Performance ratings should reflect how well an employee meets or exceeds the expectations of their role and level, not how they compare to teammates. Being the strongest performer on a team doesn’t automatically justify an Exceeds or above rating.'},
   {q:'An employee delivered every goal well and on time, with no extras. Which rating fits?',opts:['Partially meets','Meets','Exceeds','Exceptional'],a:1,
    fb:'“Meets” reflects consistently delivering quality work on time and fulfilling all expectations. Exceeds or above requires contributions beyond the role’s expectations.'},
   {q:'An employee was on approved medical leave for three months. How does that affect the rating?',opts:['Lower it one level','Give “Meets” automatically','Rate the time worked against goals for that time; leave does not lower it','Don’t rate them this year'],a:2,
    fb:'Approved medical leave should not lower an employee’s rating. Evaluate their performance against expectations for the time worked, without penalizing them for their absence.'},
   {q:'Which of the following is valid evidence for an employee’s performance rating this year?',opts:['Last year’s rating','High potential','Cutting onboarding from 45 to 28 days this year','Ten years of service'],a:2,
    fb:'Reducing onboarding time from 45 to 28 days is measurable evidence of this year’s performance. Ratings should reflect current results, not past ratings, potential, or years of service.'}]}]},
{h:'Key Takeaways',nav:'Key Takeaways',blocks:[
  {type:'takeaways',label:false,items:['Rate against role expectations, using observable results and behaviors.','Focus on the current review period, considering both results (the “what”) and behaviors (the “how”).','“Meets Expectations” is a strong rating that reflects successfully fulfilling role requirements.','Use performance anchors to help managers interpret and apply rating standards consistently.']},
  {type:'resources',label:'Download for Later',items:['scale','anchors','anchorsheet','hrbp']}]}
]});

COURSE.push({name:'Gather the Evidence',screens:[
{nav:'Welcome',blocks:[{type:'title',eyebrow:'Module 3 of 6',h:'Preparing Evidence Before the Session',
  lead:'You now know how to apply rating standards consistently. The next step is learning how to support your ratings with clear evidence. During calibration, the strength of the evidence, not the strength of someone’s opinion, should guide the discussion.'}]},
{h:'What You’ll Learn',nav:'What You’ll Learn',blocks:[
  {type:'lead',html:'By the end of this module, you will be able to:'},
  {type:'list',ordered:true,items:['Name the sources of evidence to draw on for each direct report','Gather evidence that covers the whole review period','Describe contributions using Situation, Behavior, Impact (SBI)','Separate facts from interpretation, and spot unsupported statements','Flag cases that will need extra discussion','Complete a one-page prep summary for each direct report']}]},
{h:'Two Managers, Two Cases',nav:'Two Managers, Two Cases',blocks:[
  {type:'lead',html:'Two managers propose the same rating for the same employee, Sam. Read both cases.'},
  {type:'cols',cols:[{h:'Manager A',items:['“Sam is a rock star. Everyone loves working with him, and he always goes above and beyond. Definitely Exceeds.”']},{h:'Manager B',items:['“I’m proposing Exceeds for Sam. He beat his 105% retention goal at 111%, and the escalation process he designed cut response time from 3 days to 1. Two other teams now use it.”']}]},
  {type:'mcq',q:'Which case would you trust in calibration?',opts:[['Manager A',false,'Manager A may be right about Sam, but nothing here can be checked against the scale. Peers would have to take it on faith.'],['Manager B',true,'Manager B gives specific, observable results that peers can test against the scale.']]}]},
{h:'Where Evidence Comes From',nav:'Sources of Evidence',blocks:[
  {type:'lead',html:'Strong evidence comes from several sources, not just your memory. Each source answers a different question.'},
  {type:'reveal',style:'grid',ins:'Select each of the five sources to see what to look for.',items:[
   {h:'Goals and Outcomes',b:'What was agreed at the start of the period, and what was delivered. Use numbers wherever possible.'},
   {h:'Check-In Notes',b:'Your notes from one-to-ones and the mid-year review. Your best defense against recency bias.'},
   {h:'Work Products',b:'Projects shipped, documents, dashboards and customer outcomes.'},
   {h:'Peer and Stakeholder Input',b:'Feedback from people who worked with the employee. Look for patterns, not single comments.'},
   {h:'Self-Review',b:'What the employee highlights, especially work you didn’t see firsthand.'}]}]},
{h:'Cover the Whole Year',nav:'Cover the Whole Year',blocks:[
  {type:'lead',html:'Memory favors what happened recently. If most of your evidence is from the last two months, your rating reflects two months, not a year.'},
  {type:'reveal',style:'timeline',ins:'Select each quarter to see where to look for evidence you may have forgotten.',items:[
   {h:'Q1',b:'<p>Goal-setting notes and the first check-ins. What did the person take on, and how did they start?</p>'},
   {h:'Q2',b:'<p>Mid-year review notes and goal updates. What was delivered by the halfway point?</p>'},
   {h:'Q3',b:'<p>Check-in notes and project close-outs. Which work finished over the summer?</p>'},
   {h:'Q4',b:'<p>Recent work is easy to recall. Make sure it doesn’t outweigh the other three quarters.</p>'}]},
  {type:'info',pin:true,html:'<p><b>Rule of thumb:</b> Before you finalize any summary, check you have at least one piece of evidence from each quarter.</p>'}]},
{h:'Describe Contributions With SBI',nav:'SBI',blocks:[
  {type:'lead',html:'SBI keeps evidence short and specific. Two or three SBI statements per person are usually enough for calibration.'},
  {type:'flow',steps:['Situation: when and where','Behavior: what the person did','Impact: what changed as a result']},
  {type:'reveal',style:'grid',ins:'Select each part to see how it builds one evidence statement.',items:[
   {h:'S · Situation',b:'“During Q2 renewals…”'},{h:'B · Behavior',b:'“…Jordan identified two at-risk accounts early and built a recovery plan with each customer.”'},{h:'I · Impact',b:'“Both renewed, protecting $340K in annual revenue.”'}]}]},
{h:'Fact or Interpretation?',nav:'Fact or Interpretation',blocks:[
  {type:'lead',html:'Calibration runs on evidence. Interpretations, like “rock star” or “not a team player”, invite argument without settling anything.'},
  {type:'sort',buckets:['Fact','Interpretation'],ins:'Select a card, then select the appropriate box to classify it as a Fact or Interpretation. To move a card back, select it again.',ok:' Facts can be checked; interpretations can only be argued.',cards:[
   ['Shipped the billing migration two weeks ahead of plan',0,'A specific, checkable result.'],['Missed three of five sprint commitments in Q3',0,'Specific and time-bound.'],['Trained four new hires, all of whom passed certification',0,'Observable, with an outcome.'],['CSAT of 4.6 against a 4.4 target',0,'A measured result.'],
   ['Has a great attitude',1,'A judgment. What did they do?'],['Isn’t a team player',1,'A judgment. What happened?'],['Works harder than anyone',1,'Effort, not a result.'],['Seems disengaged lately',1,'An impression, not a behavior.']]}]},
{h:'Rewrite Practice',nav:'Rewrite Practice',blocks:[
  {type:'info',label:'SBI Reminder',html:'<p><b>S · Situation:</b> When and where it happened. <b>B · Behavior:</b> What the person did that someone could observe. <b>I · Impact:</b> What changed as a result.</p>'},
  {type:'lead',html:'Use the SBI model to rewrite each vague statement with specific evidence. You can invent realistic details for practice. If you can’t identify supporting evidence, write “unsupported.”'},
  {type:'entry',ins:'Rewrite as many statements as you like, then select Compare With Model Rewrites to review your answers.',compare:'Compare With Model Rewrites',fields:[{label:'1. “Great attitude.”',min:10},{label:'2. “Not a team player.”',min:10},{label:'3. “Goes above and beyond.”',min:10},{label:'4. “Struggles with deadlines.”',min:10},{label:'5. “Natural leader.”',min:10}],
   model:'<b>Model rewrites</b><ol style="margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px"><li>“Volunteered to cover on-call during two colleagues’ leave in Q3, with no missed incidents.”</li><li>“Declined three of four code-review requests in Q2 and Q3; two releases were delayed waiting on reviews.”</li><li>“Built a reporting template outside her role that the finance team now uses monthly.”</li><li>“Delivered four of seven quarterly reports late, by an average of six days.”</li><li>Unsupported as written. Replace it with specific behavior, for example “Ran the Q4 planning process for a team of eight.”</li></ol><p><b>Check each of yours:</b> Does it name a specific action? Could someone else verify it? Is there a time frame?</p>'}]},
{h:'Flag Cases That Need Discussion',nav:'Flag Cases',blocks:[
  {type:'lead',html:'Some cases will take more discussion time. Flag them in your summary so the facilitator can plan, and so you go in with your strongest evidence ready. A flag isn’t a weakness. It shows you have thought ahead.'},
  {type:'practices',label:'Flag These Cases',items:['Borderline ratings','Your highest and lowest ratings','Promotion candidates','A change of more than one level from last cycle','Partial year, leave or role change','Peer input that disagrees with yours']},
  {type:'mcq',q:'You are proposing “Exceeds” for someone you rated “Partially meets” last year. What should you do?',opts:[
   ['Nothing; last year doesn’t matter.',false,'Last year’s rating isn’t evidence, but a big change will draw questions. Be ready.'],
   ['Flag it and include evidence showing what changed this year.',true,'Lead with the evidence of change.'],
   ['Lower the proposal to “Meets” to avoid questions.',false,'Never adjust a rating to avoid discussion. Rate the evidence.']]}]},
{h:'The Prep Template',nav:'The Prep Template',blocks:[
  {type:'lead',html:'You will use a one-page prep template for every direct report. It has six parts.'},
  {type:'reveal',style:'accordion',ins:'Select each part of the template to see what goes in it.',items:[
   {h:'1. Employee, Role, Level and Time in Role',b:'<p>The context peers need to apply the scale.</p>'},
   {h:'2. Proposed Rating',b:'<p>Your draft. It stays private until calibration is complete.</p>'},
   {h:'3. Evidence: Three to Five SBI Statements',b:'<p>Cover the whole period and include at least one result with a number.</p>'},
   {h:'4. How the Person Worked',b:'<p>One or two behavior statements, positive or developmental.</p>'},
   {h:'5. Flags',b:'<p>Flag cases that will require more time for discussion.</p>'},
   {h:'6. What Would Change the Rating',b:'<p>One line on what a level higher, or lower, would have required. It answers the question peers most often ask.</p>'}]}]},
{h:'Complete a Summary for One Direct Report',nav:'Complete a Summary',blocks:[
  {type:'lead',html:'Download the Calibration Prep Template and complete it for one of your direct reports now, while the method is fresh. Use Jordan’s example below as a guide. Keep your summary private: it is your starting point for calibration.'},
  {type:'resources',items:['prep']},
  {type:'drop',label:'Click to Review the Work Example',blocks:[{type:'profile',who:'jordan',name:'Work Example: Jordan Ellis, Customer Success Manager II',meta:'Proposed rating: Exceeds',lines:[
   '<b>Evidence:</b> Redesigned the onboarding checklist, cutting onboarding from 45 to 28 days; three other CSMs adopted it (Q2–Q3). Flagged churn risk on two acquired accounts and escalated in Q1; both left after the acquisition (Q2). CSAT 4.6 against a 4.4 team average (full year).',
   '<b>How they worked:</b> Focused on at-risk accounts over QBRs in Q3 (75% completion against a 90% goal). Covered for a colleague on leave in Q4 with no drop in results.',
   '<b>Flags:</b> Borderline between Meets and Exceeds.',
   '<b>What would change it:</b> Retention at target would make Exceeds clear; QBR completion below 60% without a reason would point to Meets.']}]},
  {type:'checklist',prompt:'When you have completed a summary, check the box below to track it.',items:['I have completed a prep summary for at least one of my direct reports.']}]},
{h:'Knowledge Check',nav:'Knowledge Check',blocks:[
  {type:'quiz',pass:3,review:'the screens “Cover the whole year”, “SBI” and “Flag cases”',qs:[
   {q:'Which is the strongest evidence statement?',opts:['“She’s a rock star.”','“She works harder than anyone.”','“She cut invoice errors from 6% to 2% in Q3.”','“Everyone likes her.”'],a:2,fb:'Strong evidence is specific, observable and has a time frame.'},
   {q:'Most of your evidence for an employee is from November. What should you do?',opts:['Nothing','Check earlier check-in notes and goal updates for each quarter','Lower the rating','Ask the employee to rewrite their self-review'],a:1,fb:'Rate the whole period; recent events shouldn’t outweigh the year.'},
   {q:'In SBI, what does the “B” describe?',opts:['The employee’s attitude','What the person did, in a way someone could observe','The business result','Your opinion'],a:1,fb:'Behavior is an action someone could see, not a trait.'},
   {q:'Which case should you flag before calibration?',opts:['Any rating of “Meets”','A change of more than one level from last cycle','Every employee','Only low ratings'],a:1,fb:'Big changes, borderline calls, extremes, promotions and partial years all need flags.'}]}]},
{h:'Key Takeaways',nav:'Key Takeaways',blocks:[
  {type:'takeaways',label:false,items:['Draw evidence from goals, check-in notes, work products, peers and the self-review.','Cover every quarter, and write evidence as SBI: specific, observable and time-bound.','Flag cases that need discussion, and prepare a one-page summary for each person.']},
  {type:'resources',label:'Download for Later',items:['prep','sbi']}]}
]});

COURSE.push({name:'Check for Bias',screens:[
{nav:'Welcome',blocks:[{type:'title',eyebrow:'Module 4 of 6',h:'Recognizing and Countering Rater Bias',
  lead:'Everyone has biases. They’re a natural part of how we make judgments, especially under time pressure. The goal of this module isn’t to eliminate bias, but to help you recognize and challenge it before defending a performance rating.'}]},
{h:'What You’ll Learn',nav:'What You’ll Learn',blocks:[
  {type:'lead',html:'By the end of this module, you will be able to:'},
  {type:'list',ordered:true,items:['Identify eight common rating biases in performance evaluations','Apply self-check questions to recognize and counter each bias','Replace vague or biased language with observable, behavior-based evidence','Recognize and address bias during calibration discussions']}]},
{h:'Rate This Employee',nav:'Rate This Employee',blocks:[
  {type:'lead',html:'Review Alex’s performance over the past year, starting with the most recent event, then select the most appropriate rating.'},
  {type:'profile',who:'alex',name:'Alex Rivera, Operations Analyst II',meta:'Most recent first',hl:0,lines:[
   '<b>December:</b> A reporting error Alex made reached the leadership team. Alex caught and corrected it within a day.',
   '<b>October:</b> Automated the weekly inventory report, saving the team about 6 hours a week.',
   '<b>July:</b> Led the vendor data cleanup and finished two weeks early.',
   '<b>April:</b> Trained two new analysts, who now both work independently.',
   '<b>Goals:</b> Met all four annual goals.']},
  {type:'rate',key:'alex',ins:'Select the rating you would give Alex.'}]},
{h:'What Just Happened?',nav:'What Just Happened?',blocks:[
  {type:'recall',key:'alex',label:'You Rated Alex'},
  {type:'key',html:'One recent mistake. A full year of results.'},
  {type:'text',html:'<p>Alex met every goal and delivered three improvements beyond role expectations. The December error was significant but was quickly identified and corrected.</p><p>The December event was intentionally highlighted and shown first to demonstrate how recent events can influence judgment. If it lowered your rating, you may have experienced <b>recency bias</b>. A fair rating considers performance across the entire review period.</p><p>Recency bias is one of eight common rating biases. Each can be recognized and challenged by asking the right questions.</p>'}]},
{h:'Eight Biases in Four Groups',nav:'Eight Biases',blocks:[
  {type:'lead',html:'Rater biases are common judgment errors that can distort performance ratings. They fall into four groups.'},
  {type:'text',html:'<p>Over the next four sections, you’ll explore each group and learn a simple self-check question to help recognize and prevent each bias.</p>'},
  {type:'options',items:[
   {h:'Biases of Time',b:'<p><b>Recency</b> and <b>prior-rating anchoring</b>: when something happened shapes the rating more than what happened.</p>'},
   {h:'Biases About the Person',b:'<p><b>Halo/horns</b> and <b>similarity</b>: one trait, or how much someone is like us, colors the whole rating.</p>'},
   {h:'Biases About the Scale',b:'<p><b>Central tendency</b> and <b>leniency/strictness</b>: how a manager uses the scale across the whole team.</p>'},
   {h:'Blind Spots',b:'<p><b>Visibility</b> and <b>coded language</b>: what we don’t see, and the words we choose.</p>'}]},
  {type:'info',pin:true,html:'<p>You don’t need to memorize the names of each bias. What matters is developing the habit of asking the right self-check questions before defending a rating.</p>'}]},
{h:'Biases of Time',nav:'Biases of Time',blocks:[
  {type:'lead',html:'The first two biases are about <b>when</b> things happened.'},
  {type:'reveal',style:'flip',ins:'Select each card to flip it and see what the bias looks like and its Quick Self-Check.',items:[
   {h:'Recency',f:'“Her Q4 launch was brilliant, so she’s Exceeds.”',b:'<b>Looks like:</b> Recent performance outweighs the rest of the year.',q:'Do I have evidence from every quarter?'},
   {h:'Prior-Rating Anchoring',f:'“He was Meets last year, so Meets again.”',b:'<b>Looks like:</b> Last year’s rating influences this year’s rating.',q:'Am I rating this period’s evidence only?'}]}]},
{h:'Biases About the Person',nav:'Biases About the Person',blocks:[
  {type:'lead',html:'The next two are about how we see the person as a whole.'},
  {type:'reveal',style:'flip',ins:'Select each card to flip it and see what the bias looks like and its Quick Self-Check.',items:[
   {h:'Halo / Horns',f:'“Her presentations are amazing, so she must be great at everything.”',b:'<b>Looks like:</b> One strength or weakness influences the entire rating.',q:'Would I rate each goal the same if I saw it alone?'},
   {h:'Similarity',f:'“He reminds me of myself at that stage.”',b:'<b>Looks like:</b> Giving higher ratings to employees who are similar to you.',q:'Would I write the same evidence for someone unlike me?'}]}]},
{h:'Biases About the Scale',nav:'Biases About the Scale',blocks:[
  {type:'lead',html:'These two show up in how a manager uses the scale across the whole team.'},
  {type:'reveal',style:'flip',ins:'Select each card to flip it and see what the bias looks like and its Quick Self-Check.',items:[
   {h:'Central Tendency',f:'“Everyone on my team is Meets. It’s safer.”',b:'<b>Looks like:</b> Giving everyone average ratings to avoid difficult conversations.',q:'Can I name what would move this person up or down?'},
   {h:'Leniency / Strictness',f:'“I never give Exceeds; nobody’s perfect.”',b:'<b>Looks like:</b> Consistently rating employees too high or too low, regardless of performance.',q:'How does my distribution compare with the organization’s?'}]}]},
{h:'Blind Spots',nav:'Blind Spots',blocks:[
  {type:'lead',html:'The last two are easy to miss because they are about what we don’t see, and the words we choose.'},
  {type:'reveal',style:'flip',ins:'Select each card to flip it and see what the bias looks like and its Quick Self-Check.',items:[
   {h:'Visibility',f:'“I don’t hear much from her, so she must not be doing much.”',b:'<b>Looks like:</b> Remote, quiet, or behind-the-scenes work is underrated.',q:'What did this person deliver that I didn’t see firsthand?'},
   {h:'Coded Language',f:'“He’s a bit abrasive.” “She can be emotional.”',b:'<b>Looks like:</b> Subjective personality labels are used and may be applied unevenly across groups.',q:'Is this word tied to a specific behavior and its impact?'}]},
  {type:'resources',label:'All Eight Quick Self-Checks on One Page',items:['bias']}]},
{h:'Spot the Bias',nav:'Spot the Bias',blocks:[
  {type:'series',label:'Write-Up',first:'<p class="lead">Here are four short write-ups from managers preparing for calibration. Each one shows one main bias.</p>',okLabel:'Correct.',noLabel:'Not this one.',ins:'Read each write-up, choose the main bias, then read the explanation.',end:'This practice is not scored.',items:[
   {q:'“Proposing Exceeds for Ben. He nailed the client presentation last month, and leadership loved it. That’s the kind of performance I want to reward.”',fb:' Recency: one recent event drives the rating. What did Ben deliver in the other eleven months?',opts:[['Recency',true],['Visibility',false],['Halo',false],['Coded language',false]]},
   {q:'“Proposing Meets for Hana. She works remotely and I rarely hear from her, so it’s hard to say she’s done more than the basics.”',fb:' Visibility: not hearing from someone isn’t evidence. Check her goals, output and peer input.',opts:[['Recency',false],['Visibility',true],['Halo',false],['Coded language',false]]},
   {q:'“Proposing Exceeds for Luis across the board. His technical skills are the best on the team, so the rest follows.”',fb:' Halo: one strength is being applied to every part of the rating. Rate each goal on its own evidence.',opts:[['Recency',false],['Visibility',false],['Halo',true],['Coded language',false]]},
   {q:'“Proposing Partially meets for Grace. She’s too aggressive in meetings and not really a culture fit.”',fb:' Coded language: “aggressive” and “culture fit” aren’t tied to behavior or impact. What specifically happened, and what was the effect?',opts:[['Recency',false],['Visibility',false],['Halo',false],['Coded language',true]]}]}]},
{h:'Audit Your Own Language',nav:'Audit Your Language',blocks:[
  {type:'lead',html:'These words may seem harmless, but they often reflect subjective judgments rather than observable performance. They can also be applied inconsistently across employees, introducing bias into ratings.'},
  {type:'practices',label:'Watch-Out Words',items:['abrasive','aggressive','emotional','bossy','not a culture fit','lacks presence','rock star','natural leader','high energy','difficult']},
  {type:'key',html:'For each one, ask: What did the person do? When? What was the impact?'},
  {type:'info',label:'Your Task',html:'<ol><li>Open the prep summary you wrote in Module 3, or the Language Audit Guide below.</li><li>Look for any of these words, or anything like them.</li><li>Rewrite each one as evidence using SBI, or remove it.</li></ol>'},
  {type:'resources',items:['audit']},
  {type:'checklist',prompt:'Confirm each step when you have done it.',items:['I checked my summary for vague or coded words.','I rewrote or removed any I found.','I checked that my evidence covers every quarter.'],wait:'Check all three boxes to continue.'}]},
{h:'Bias in the Room',nav:'Bias in the Room',blocks:[
  {type:'lead',html:'Bias doesn’t only live in write-ups. It shows up in the meeting too: the loudest voice, the most senior person, the rush to agree.'},
  {type:'profile',who:'marcus',name:'In the Session',meta:'Marcus, a senior manager, speaks firmly',lines:['“I’ve known Priya for years. She’s Exceptional, no question.”','Nobody asks for evidence, and the group starts to move on.']},
  {type:'mcq',q:'What would you do?',opts:[
   ['Stay quiet; it’s not your employee.',false,'The rating goes through on reputation alone. If it is wrong, everyone rated on evidence is treated less fairly.'],
   ['Ask: “What were the two or three results that make this Exceptional rather than Exceeds?”',true,'A neutral evidence question, the same one you would ask of anyone, keeps the standard the same for all.'],
   ['Say: “That sounds like favoritism.”',false,'You may be right, but an accusation shuts down discussion. Asking for evidence reaches the same goal.']]},
  {type:'practices',label:'Watch for in the Room',items:['The loudest voice','Seniority','Groupthink','Time pressure at the end of the session']}]},
{h:'Knowledge Check',nav:'Knowledge Check',blocks:[
  {type:'quiz',pass:3,review:'the four bias screens and “Bias in the room”',qs:[
   {q:'A manager rates everyone on the team “Meets” to avoid difficult conversations. Which bias is this?',opts:['Halo','Central tendency','Recency','Similarity'],a:1,fb:'Clustering everyone in the middle hides real differences in performance.'},
   {q:'Which Quick Self-Check counters recency bias?',opts:['Would I write this for someone unlike me?','Do I have evidence from every quarter?','Is this word tied to a behavior?','How does my distribution compare?'],a:1,fb:'Recency is about time; check that the whole period is covered.'},
   {q:'Which phrase needs rewriting before calibration?',opts:['“Closed 12 deals in Q2”','“Not a culture fit”','“Trained three new hires”','“Reduced errors by 40%”'],a:1,fb:'It describes a judgment, not a behavior or impact. Say what happened and what it affected.'},
