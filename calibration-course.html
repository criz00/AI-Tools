   {q:'In calibration, a senior leader declares a rating with no evidence, and the group starts to move on. What is the best response?',opts:['Stay quiet','Ask for the specific results behind it','Call it favoritism','Lower your own ratings to compensate'],a:1,fb:'A neutral evidence question keeps the standard the same for everyone.'}]}]},
{h:'Key Takeaways',nav:'Key Takeaways',blocks:[
  {type:'takeaways',label:false,items:['<b>Recognize bias:</b> Check your judgments before defending a rating.','<b>Use self-check questions:</b> Refer to the Bias Check Card during calibration.','<b>Focus on evidence:</b> Replace subjective personality labels with observable behaviors and their impact.','<b>Challenge bias:</b> Ask neutral, evidence-based questions consistently during calibration discussions.']},
  {type:'resources',label:'Download for Later',items:['bias','audit']}]}
]});

COURSE.push({name:'Calibrate Together',screens:[
{nav:'Welcome',blocks:[{type:'title',eyebrow:'Module 5 of 6',h:'Inside the Calibration Session',
  lead:'You’ve learned how to apply rating standards, gather supporting evidence, and check for bias. Now it’s time to explore the session itself. In this module, you’ll see how calibration sessions work, practice three essential skills, and participate in a simulated session.'}]},
{h:'What You’ll Learn',nav:'What You’ll Learn',blocks:[
  {type:'lead',html:'By the end of this module, you will be able to:'},
  {type:'list',ordered:true,items:['Describe the calibration process from start to finish','Present a rating in two minutes using supporting evidence','Ask neutral, evidence-based questions about proposed ratings','Respond constructively to challenges and adjust ratings when evidence supports a change','For facilitators: Manage time, encourage participation, address bias, and flag unresolved cases']}]},
{h:'The Six Stages of a Session',nav:'Six Stages',blocks:[
  {type:'lead',html:'Most sessions follow the same six stages and last 60 to 120 minutes.'},
  {type:'reveal',style:'timeline',ins:'Select each stage to learn what happens.',items:[
   {h:'Open',b:'<p>The facilitator restates the purpose, the scale definitions, confidentiality and the ground rules.</p>'},
   {h:'Review the Distribution',b:'<p>The group looks at proposed ratings across all teams. It is a view, not a quota.</p>'},
   {h:'Discuss Each Employee',b:'<p>Each manager presents, peers ask questions, and the group agrees or adjusts. The next screen walks through this in detail.</p>'},
   {h:'Prioritize Edge Cases',b:'<p>Most time goes to top and bottom ratings, borderline calls and promotion candidates.</p>'},
   {h:'Cross-Check',b:'<p>Similar roles and levels are compared side by side to make sure the same evidence gets the same rating.</p>'},
   {h:'Close',b:'<p>Final ratings are confirmed, the reason for every change is recorded, and follow-ups are listed.</p>'}]}]},
{h:'What Happens for Each Employee',nav:'Each Employee’s Discussion',blocks:[
  {type:'lead',html:'Stage 3, “Discuss each employee”, is where you spend most of the session. Every person on the list goes through the same short discussion. Knowing it in advance tells you what to prepare and what to expect.'},
  {type:'reveal',style:'timeline',ins:'Select each part to follow Jordan’s case through the discussion.',items:[
   {h:'1. You Present',b:'<p><b>What happens:</b> You give the proposed rating and your strongest evidence in about two minutes.</p><p><b>Example:</b> “Jordan Ellis, CSM II. Proposing Exceeds. Onboarding cut from 45 to 28 days and adopted by three peers…”</p><p><b>What to prepare:</b> Your prep summary from Module 3.</p>'},
   {h:'2. Peers Ask Questions',b:'<p><b>What happens:</b> Other managers test the rating against the scale.</p><p><b>Example:</b> “Jordan missed the retention goal. Why an ‘Exceeds’ rating rather than ‘Meets’?”</p><p><b>What to expect:</b> Questions are normal. They are how the group keeps one standard.</p>'},
   {h:'3. The Group Checks the Fit',b:'<p><b>What happens:</b> The group evaluates whether the evidence supports the proposed rating and compares it with similar cases.</p><p><b>Example:</b> “How does Jordan compare with the other CSM II we rated Exceeds?”</p>'},
   {h:'4. One of Three Outcomes',b:'<p>Every case concludes with one of three documented outcomes:</p><ul><li><b>Confirmed:</b> The proposed rating remains unchanged.</li><li><b>Adjusted:</b> The rating changes, and the reason is documented.</li><li><b>Parked:</b> The group needs more information or discussion. An owner, required evidence, and resolution deadline are assigned.</li></ul><p><b>Example:</b> Jordan’s “Exceeds” rating is confirmed.</p>'}]},
  {type:'key',html:'No rating leaves the room without a recorded outcome.'}]},
{h:'Present Your Case in Two Minutes',nav:'Present Your Case',blocks:[
  {type:'lead',html:'A strong presentation follows your prep summary: context, rating, best evidence, then flags. Naming the weak spot yourself builds trust, because peers will find it anyway.'},
  {type:'profile',who:'You',name:'Example Presentation',meta:'About two minutes',lines:['“Jordan Ellis, CSM II, two years in role. I’m proposing Exceeds. Jordan cut onboarding from 45 to 28 days, and three other CSMs adopted the checklist. CSAT was 4.6 against a 4.4 average. Retention came in at 103% against 105%, after two acquired accounts left; Jordan flagged that risk in Q1. I’ve flagged this as borderline Meets or Exceeds. If retention had hit target, it would be a clear Exceeds.”']},
  {type:'order',ins:'Use the arrows to arrange the four parts of a strong presentation in the correct order, then select Check Order.',ok:' Context, rating, evidence, then flags.',items:['Context: role, level, time in role','Proposed rating','Your two or three strongest pieces of evidence','Flags, and what would change the rating']}]},
{h:'Ask Good Challenge Questions',nav:'Challenge Questions',blocks:[
  {type:'lead',html:'Challenging a peer’s rating isn’t an attack. It helps ensure ratings are fair and consistent. Effective questions are neutral, focus on evidence, and apply equally to everyone.'},
  {type:'sort',buckets:['Helpful','Unhelpful'],ok:' Helpful questions are neutral, about evidence, and could be asked of anyone.',cards:[
   ['“What would a higher rating have required?”',0],['“How does this compare with others at the same level?”',0],['“What evidence do you have from the first half of the year?”',0],['“Which goal had the biggest impact?”',0],
   ['“Are you sure you’re not just being soft on them?”',1,'It questions the manager, not the evidence.'],['“I’ve heard she’s difficult. Is that true?”',1,'Hearsay, and about personality.'],['“Why do you always rate high?”',1,'An accusation, not a question about this case.'],['“Can we just move on?”',1,'It skips the evidence altogether.']]},
  {type:'resources',label:'Keep These Questions Handy',items:['challenge']}]},
{h:'When Your Rating Is Challenged',nav:'When You Are Challenged',blocks:[
  {type:'lead',html:'A peer challenges your proposed “Exceeds” rating for Jordan.'},
  {type:'profile',who:'li',name:'Li Asks',meta:'Peer manager',lines:['“Jordan missed the retention goal. Why isn’t that Meets?”']},
  {type:'mcq',q:'How do you respond?',opts:[
   ['“I know Jordan much better than you do.”',0,'Defensive. It turns a question about evidence into a question about authority.'],
   ['“Fair point. The miss came from two acquired accounts Jordan flagged in Q1. Against that, the onboarding work changed how the whole team operates. I’d still say Exceeds, but I see why it’s borderline.”',2,'You acknowledge the point, add evidence and stay open.'],
   ['“OK, let’s make it Meets.”',1,'Changing a rating is fine when the evidence supports it, but giving up at the first question means your evidence is never heard.']]}]},
{h:'When to Change Your Rating',nav:'When to Change Your Rating',blocks:[
  {type:'lead',html:'Being willing to change a rating is a strength, not a loss. What matters is that changes are supported by evidence and the reasons are documented.'},
  {type:'cols',cols:[{h:'Change Your Rating If…',items:['Peers show evidence you hadn’t considered.','Similar cases at the same level are rated differently.','Your evidence fits the next level’s definition better.']},{h:'Hold Your Rating If…',items:['The challenge focuses on personality or reputation rather than performance.','It relies on a single event rather than overall performance.','It focuses on meeting a rating distribution rather than evaluating evidence.']}]},
  {type:'info',pin:true,html:'<p>After calibration, you’re responsible for communicating the final rating to your employee, whether it changed or stayed the same. Module 6 will show you how to have that conversation.</p>'}]},
{h:'About the Simulation',nav:'About the Simulation',blocks:[
  {type:'lead',html:'Next, you’ll participate in a simulated calibration session. Meet the participants and learn how the simulation works.'},
  {type:'cols',cols:[{h:'Dana',items:['HR business partner who facilitates the session']},{h:'Marcus',items:['Senior manager, experienced and direct']},{h:'Li and Sam',items:['Peer managers who rate similar roles']}]},
  {type:'info',label:'How the Simulation Works',html:'<p>Receive feedback and earn points for each decision:</p><ul><li><b>2 points:</b> Effective response</li><li><b>1 point:</b> Partly effective response</li><li><b>0 points:</b> Ineffective response</li></ul><p>Aim for at least <b>6 out of 10 points</b>. You can replay the simulation as often as you like.</p>'}]},
{h:'Simulated Calibration Session',nav:'Simulation',blocks:[
  {type:'sim',key:'m5',cast:['dana','marcus','li','sam','You'],youRole:'Manager (Jordan’s manager)',steps:[
   {lines:[['dana','Thanks, everyone. Quick reminders: we rate against the level definitions, not against each other. What’s said here stays here. Every change gets a recorded reason. We have six people to cover in 40 minutes, so about two minutes per presentation. Let’s start with Jordan.','happy']],
    q:'Case 1: you present Jordan. Choose your opening.',opts:[
    ['“Jordan Ellis, CSM II, two years in role. Proposing Exceeds. Onboarding cut from 45 to 28 days, adopted by three peers; CSAT 4.6 against 4.4. Retention 103% against 105% after two acquired accounts left, a risk Jordan flagged in Q1. I’ve flagged it as borderline.”',2,'Clear and evidence-led, and you named the weak spot yourself.',[['dana','Thanks, that’s clear.','happy']]],
    ['“Jordan’s one of the best people I’ve managed. Really goes above and beyond. Exceeds for sure.”',0,'No evidence the group can test against the scale.',[['li','Can you give us some specifics?','concerned']]],
    ['“Proposing Exceeds. Jordan did a lot this year: onboarding, QBRs, retention, covering for a colleague, training, the checklist…”',1,'The evidence is there, but it is a list, not a case. Lead with the two or three strongest points.',[['dana','Which two of those matter most?','thinking']]]]},
   {lines:[['marcus','Retention is the core of the job, and Jordan missed it. Feels like Meets to me.','concerned']],q:'Respond to the challenge.',opts:[
    ['“With respect, you don’t manage Jordan.”',0,'Defensive. It shifts the topic from evidence to authority.',[['marcus','That doesn’t answer the question.','upset']]],
    ['“It’s a fair concern. Both lost accounts left after an acquisition, and Jordan raised the risk early. Against the scale, the onboarding work goes beyond what we expect at CSM II. Happy to hear if others see it differently.”',2,'You acknowledge, add evidence and invite the group in.',[['li','I compared Jordan with the other CSM II we rated Exceeds. The evidence lines up.','happy'],['','The group confirms Exceeds. Dana records the reason.']]],
    ['“OK, Meets is fine.”',1,'Being open is good, but the group lost your evidence. Make your case first.',[['li','Wait, what about the onboarding work?','thinking']]]]},
   {lines:[['sam','Taylor, Analyst II. I’m proposing Exceptional. Taylor’s incredibly smart and everyone wants Taylor on their projects.','happy']],q:'Case 2: what do you ask?',opts:[
    ['Say nothing; it’s Sam’s employee.',0,'The rating would go through without evidence, which is unfair to everyone rated on evidence.',[['dana','Sam, what were the two or three results behind Exceptional?','thinking'],['','Sam describes one major project delivered well, but nothing beyond the level. The group settles on Exceeds.']]],
    ['“What were the two or three results that make this Exceptional rather than Exceeds?”',2,'A neutral evidence question any manager could be asked.',[['sam','One big project, delivered really well. Thinking about it, nothing beyond the level. I’d move to Exceeds.','thinking'],['','The group agrees. Dana records why.']]],
    ['“Isn’t that just because Taylor’s your favorite?”',0,'An accusation shuts down the discussion, even if the concern is valid.',[['sam','That’s not fair.','upset'],['dana','Let’s keep to the evidence. Sam, what were the key results?','concerned']]]]},
   {lines:[['dana','Before we close, a cross-check. You proposed Meets for Chris, Support Specialist II. Li proposed Exceeds for Morgan, in the same role. Their numbers look very similar.','thinking'],['','<b>Chris:</b> CSAT 4.7, tickets at 110% of target, built the team’s refund shortcut. <b>Morgan:</b> CSAT 4.6, tickets at 105% of target, mentored one new hire.']],
    q:'Case 3: what do you do?',opts:[
    ['“I still think Meets is right for Chris.”',0,'The evidence suggests Chris performed at least as well as Morgan. Holding your rating without new evidence leaves an inconsistency.',[['li','Then how do we explain the difference?','concerned']]],
    ['“Looking at these side by side, Chris’s evidence fits Exceeds. I’d like to change my proposal, and note that the cross-check showed I’d underrated Chris.”',2,'Changing a rating when the evidence supports it is a strength, and the reason is recorded.',[['dana','Thank you. Recording Exceeds for Chris, with the cross-check as the reason.','happy']]],
    ['“Then maybe Morgan should be Meets.”',1,'Possible, but lowering the other rating without looking at the evidence just swaps one inconsistency for another.',[['li','Morgan’s evidence clearly fits Exceeds.','concerned']]]]},
   {lines:[['dana','We have two minutes left and one case we couldn’t agree on.','concerned']],q:'What do you suggest?',opts:[
    ['“Just go with the manager’s rating.”',0,'The disagreement goes unresolved and unrecorded.',[['marcus','That leaves the question open.','concerned']]],
    ['“Let’s park it, list the evidence we need, and agree when we’ll close it.”',2,'No rating leaves the room without a recorded outcome, and the follow-up has an owner and a date.',[['dana','Good. I’ll own the follow-up and we’ll close it by Friday.','happy']]],
    ['“Split the difference.”',1,'A compromise rating isn’t tied to evidence.',[['sam','But which level does the evidence support?','thinking']]]]}],
   end:'Continue to the next screen for your debrief.'}]},
{h:'Debrief',nav:'Debrief',blocks:[
  {type:'lead',html:'Here is how you did. Notice that the strongest choices have one thing in common: they keep the discussion focused on evidence.'},
  {type:'debrief',keys:['m5'],names:['the simulation'],replay:['Replay the Simulation'],maxEach:10,pass:6,check:[
   ['Present ratings with evidence and acknowledge potential concerns.','m5',0],['Respond to challenges without becoming defensive.','m5',1],['Ask neutral, evidence-based questions.','m5',2],['Adjust ratings when the evidence supports a change.','m5',3],['Ensure every case has a documented outcome.','m5',4]]}]},
{h:'Optional: For Facilitators',nav:'For Facilitators (Optional)',blocks:[
  {type:'info',pin:true,html:'<p>This activity is optional. If you facilitate calibration sessions, practice making three real-time decisions. Otherwise, select Next to continue.</p>'},
  {type:'series',required:false,label:'Decision',okLabel:'Right.',noLabel:'Not the best move.',ins:'Choose what you would do as facilitator.',items:[
   {q:'Twenty minutes in, you have covered two of eight cases.',fb:' Restate the time limit and bring the edge cases forward.',opts:[['Restate the time limit and move edge cases to the front',true],['Let the discussion run',false],['Skip the remaining discussions',false]]},
   {q:'Sam hasn’t spoken in three cases.',fb:' Invite a quiet voice in with a specific, neutral question.',opts:[['“Sam, you manage a similar team. How does this compare with what you see?”',true],['Leave Sam alone',false],['“Sam, wake up!”',false]]},
   {q:'A manager says, “She’s a bit emotional for a lead role.”',fb:' Name the bias with an evidence question, not an accusation.',opts:[['“Can you tell us what she did and what the impact was?”',true],['Let it pass',false],['“That’s a biased thing to say.”',false]]}]},
  {type:'practices',label:'Facilitator Best Practices',items:['Keep time and put edge cases first','Draw out quiet voices','Name bias with an evidence question','Park unresolved cases with an owner and a date']}]},
{h:'Knowledge Check',nav:'Knowledge Check',blocks:[
  {type:'quiz',pass:3,review:'the screens from “Each employee’s discussion” to “When to change your rating”',qs:[
   {q:'What should come first in your two-minute presentation?',opts:['Your strongest story','Context and the proposed rating','How hard the person worked','Last year’s rating'],a:1,fb:'Peers need the role, level and proposal before they can weigh the evidence.'},
   {q:'Which is a helpful challenge question?',opts:['“Are you being soft?”','“What would a higher rating have required?”','“Why do you always rate high?”','“Can we move on?”'],a:1,fb:'Helpful questions are neutral and about evidence.'},
   {q:'A cross-check shows you rated someone lower than a peer with similar evidence. What do you do?',opts:['Hold your rating','Change it and record why','Ask to lower the other rating','Leave it to the facilitator'],a:1,fb:'Changing a rating when the evidence supports it keeps the standard consistent.'},
   {q:'A case is unresolved at the end of the session. What should happen?',opts:['Use the manager’s rating','Split the difference','Park it with the evidence needed, an owner and a date','Drop it'],a:2,fb:'Every rating needs a recorded outcome.'}]}]},
{h:'Key Takeaways',nav:'Key Takeaways',blocks:[
  {type:'takeaways',label:false,items:['Present in two minutes: context, rating, best evidence, flags.','Challenge with neutral evidence questions, and respond with evidence, not authority.','Change a rating when the evidence supports it, and record why.','Every case leaves the room confirmed, adjusted, or parked with an owner.']},
  {type:'resources',label:'Download for Later',items:['checklist','challenge','log']}]}
]});

COURSE.push({name:'Communicating the Outcome',screens:[
{nav:'Welcome',blocks:[{type:'title',eyebrow:'Module 6 of 6 · After Calibration',h:'Communicating the Outcome',
  lead:'Calibration is complete. Now it’s time to discuss the final rating with your employee. Even a fair rating can feel unfair if it’s communicated poorly. In this module, you’ll learn how to deliver ratings clearly and constructively, especially when the outcome differs from what your employee expected.'}]},
{h:'What You’ll Learn',nav:'What You’ll Learn',blocks:[
  {type:'lead',html:'By the end of this module, you will be able to:'},
  {type:'list',ordered:true,items:['Take ownership of the final rating, even if it changed during calibration','Structure a rating conversation around evidence, impact, development, and next steps','Explain what can and cannot be shared about calibration','Respond constructively to strong reactions without reopening the rating decision','Document the conversation and connect feedback to next year’s goals']}]},
{h:'Own the Rating',nav:'Own the Rating',blocks:[
  {type:'lead',html:'After calibration, you’re responsible for the final rating, even if it changed. Saying “the committee lowered your rating” tells your employee the process is arbitrary and that you had no say in it.'},
  {type:'sort',buckets:['Owns the Rating','Passes the Blame'],ok:' Own the outcome and explain the evidence.',cards:[
   ['“Your rating this year is Meets, and here’s why.”',0],['“After reviewing your work against the level expectations, I’ve rated you Exceeds.”',0],['“Every rating is reviewed against the same standard, and that review helped me land on Meets. I agree with it.”',0,'Honest about the process, and still owns the result.'],
   ['“I fought for you, but I lost.”',1,'It implies the rating isn’t yours.'],['“The committee lowered you.”',1,'It blames the process.'],['“HR made me do it.”',1,'It blames someone else.']]}]},
{h:'Structure the Conversation',nav:'Structure the Conversation',blocks:[
  {type:'lead',html:'A rating conversation has five parts. Lead with the rating: people can’t listen to feedback while they are waiting for the number.'},
  {type:'reveal',style:'timeline',ins:'Select each part to see what to do, with an example line.',items:[
   {h:'1. Rating First',b:'<p>Say it in the first minute.</p><p><b>Example:</b> “Your rating for this year is Exceeds.”</p>'},
   {h:'2. Evidence',b:'<p>Two or three specific contributions from your prep summary.</p><p><b>Example:</b> “You cut onboarding from 45 to 28 days, and three other CSMs now use your checklist.”</p>'},
   {h:'3. Impact',b:'<p>What those contributions changed for the team or the business.</p><p><b>Example:</b> “That means new customers get value two weeks sooner.”</p>'},
   {h:'4. Development',b:'<p>One or two areas to grow next year, framed with evidence.</p><p><b>Example:</b> “Next year I’d like QBR coverage back above 90%.”</p>'},
   {h:'5. Next Steps',b:'<p>Pay or promotion outcomes, and when you will set next year’s goals.</p><p><b>Example:</b> “Let’s set your goals together by January 20.”</p>'}]}]},
{h:'Practice Your Opening',nav:'Practice Your Opening',blocks:[
  {type:'lead',html:'The first two sentences set the tone for the rating conversation. Managers often make the mistake of avoiding the rating or taking too long to get to it. Preparing your opening in advance helps you communicate the rating clearly and confidently.'},
  {type:'entry',ins:'Think of someone who reports directly to you. Write the first two sentences you would use to open their rating conversation. Then select Compare With a Model Opening.',compare:'Compare With a Model Opening',fields:[{label:'',aria:'Your first two sentences',ph:'Example: “Thanks for making time…”',min:30}],
   model:'<p><b>Model opening:</b> “Thanks for making time. Your rating for this year is Meets. I want to walk you through the evidence, talk about what you did well, and agree one or two areas to focus on next year.”</p><p><b>Compare yours with it:</b></p><ul><li>Did you say the rating in the first or second sentence?</li><li>Did you avoid words like “only” or “unfortunately”?</li><li>Did you tell the person what the rest of the conversation will cover?</li></ul><p>If any answer is no, rewrite your opening before your real conversation.</p>'}]},
{h:'What You Can and Can’t Share',nav:'What You Can Share',blocks:[
  {type:'lead',html:'Calibration discussions are confidential. You can explain how the process works and the evidence for this person’s rating. You can’t share what others said, or anyone else’s rating.'},
  {type:'cols',cols:[{h:'You Can Share',tone:'do',items:['Their final rating','The evidence behind it','That ratings are calibrated against shared standards','How pay or promotion decisions follow']},{h:'You Can’t Share',tone:'dont',items:['What other managers said','Other employees’ ratings, or comparisons by name','Who argued for or against a rating']}]},
  {type:'mcq',q:'Your employee asks, “Did someone in calibration push for a lower rating?” What do you say?',opts:[
   ['“Calibration discussions are confidential, but I can walk you through the evidence for your rating.”',true,'You explain the process and keep the discussion confidential.'],
   ['“Yes, Marcus did.”',false,'That breaks confidentiality and turns the conversation toward a colleague.'],
   ['“No, nobody did.”',false,'Don’t describe the discussion at all, even to reassure.']]}]},
{h:'About the Practice Conversations',nav:'About the Practice',blocks:[
  {type:'lead',html:'Next, you will practice three rating conversations, one at a time. Each one is a situation managers find hard.'},
  {type:'options',items:[
   {h:'1. Jordan Ellis',b:'<p><b>The expected rating.</b> Jordan expects a strong rating, and calibration confirmed Exceeds.</p>'},
   {h:'2. Riley Chen',b:'<p><b>Lower than expected.</b> Riley’s self-review said Exceeds; the final rating is Meets.</p>'},
   {h:'3. Avery Park',b:'<p><b>Changed in calibration.</b> You proposed Exceeds; calibration agreed on Meets.</p>'}]},
  {type:'info',label:'How Each Conversation Works',html:'<ol><li>Read the situation and what the employee says.</li><li>Choose your response. You’ll make three decisions per conversation, one at a time.</li><li>Review the employee’s reaction, feedback, and points:<ul><li><b>2 points:</b> Effective response</li><li><b>1 point:</b> Partly effective response</li><li><b>0 points:</b> Ineffective response</li></ul></li><li>Select <b>Next Decision</b> to continue.</li><li>Aim for at least <b>12 out of 18 points</b> across all three conversations. You can replay any conversation.</li></ol>'}]},
{h:'Conversation 1: The Expected Rating',nav:'Practice: Jordan',blocks:[
  {type:'sim',key:'m6a',focus:'jordan',context:'<b>Situation:</b> Jordan expects a strong rating. Calibration confirmed your proposed <b>Exceeds</b>.',end:'Takeaway: rating first, specific evidence, and a growth goal, even for top performers.',steps:[
   {mood:'neutral',q:'Jordan sits down. How do you open the conversation?',opts:[
    ['“Thanks for making time. Your rating this year is Exceeds. I want to walk you through why, and talk about next year.”',2,'Rating first, then a clear plan for the conversation.',[['jordan','That’s great to hear. Thank you.','happy']],'happy'],
    ['“So, how do you think your year went?”',1,'Fine for a feedback conversation, but in a rating conversation Jordan is waiting for the number.',[['jordan','Um… pretty good, I think?','thinking']],'thinking'],
    ['“Before we get to your rating, there are a few things I want to cover.”',0,'Jordan grows anxious and stops absorbing what you say.',[['jordan','Okay… is something wrong?','concerned']],'concerned']]},
   {mood:'happy',q:'Now explain the rating.',opts:[
    ['Cite the onboarding redesign adopted by three peers and the 4.6 CSAT, and say what that changed for the team.',2,'Specific evidence tells Jordan what to keep doing.',[['jordan','I’m glad the checklist made such a difference.','happy']],'happy'],
    ['“You just did a great job all round.”',0,'Praise without evidence doesn’t tell Jordan what to repeat.',[['jordan','Thanks… which parts mattered most?','thinking']],'thinking'],
    ['List every goal and its result, in order.',1,'Accurate, but the key contributions get lost.',[['jordan','Okay.','neutral']],'neutral']]},
   {mood:'happy',q:'Turn to development for next year.',opts:[
    ['“Next year, I’d like QBR coverage back above 90% while keeping your focus on at-risk accounts. What would help?”',2,'A specific growth goal, and Jordan is invited into the plan.',[['jordan','A bit more time blocked for QBRs would help. I can plan that.','happy']],'happy'],
    ['Skip development because the rating is high.',0,'High performers want growth too, and this is where you keep them.',[['jordan','So… what should I focus on next?','concerned']],'concerned'],
    ['“Just keep doing what you’re doing.”',1,'Encouraging, but it gives Jordan nothing to work toward.',[['jordan','Will do.','neutral']],'neutral']]}]}]},
{h:'Conversation 2: Lower Than Expected',nav:'Practice: Riley',blocks:[
  {type:'sim',key:'m6b',focus:'riley',context:'<b>Situation:</b> Riley’s self-review proposed Exceeds. The calibrated rating is <b>Meets</b>, which matches your own proposal.',end:'Takeaway: acknowledge the gap, explain the standard, and give a clear path forward.',steps:[
   {mood:'neutral',q:'How do you open the conversation?',opts:[
    ['“Your rating this year is Meets. I know your self-review said Exceeds, so I want to explain how I got there and hear your view.”',2,'Clear, and it addresses the gap directly. Riley is disappointed but engaged.',[['riley','Okay. I was hoping for more, but I’m listening.','concerned']],'concerned'],
    ['“Your rating is Meets, which is honestly great.”',1,'True, but it skips past the gap with what Riley expected.',[['riley','Great? I put Exceeds in my self-review.','upset']],'upset'],
    ['“Unfortunately, it’s only Meets.”',0,'“Only” and “unfortunately” tell Riley you think Meets is a bad result.',[['riley','Only Meets? So I disappointed you?','upset']],'upset']]},
   {mood:'upset',lines:[['riley','I don’t get it. I worked so hard this year.','upset']],q:'How do you respond?',opts:[
    ['“I saw how hard you worked, and it showed. Meets means you fully delivered a demanding role. Exceeds is about results that go beyond it, like leading a cross-team project. Let’s look at where that could come from next year.”',2,'You acknowledge the effort, explain the standard and look forward.',[['riley','Okay. That makes the difference clearer.','thinking']],'thinking'],
    ['“Everyone works hard.”',0,'Dismissive. Riley stops listening.',[['riley','…Right.','upset']],'upset'],
    ['“Maybe I can look at it again.”',0,'Reopening a final rating creates a promise you can’t keep.',[['riley','So it might change?','concerned']],'concerned']]},
   {mood:'thinking',q:'How do you close the conversation?',opts:[
    ['Agree one or two specific goals that would show Exceeds-level impact, and offer to follow up in writing.',2,'Clear next steps, and a written record of what you agreed.',[['riley','Thanks. Having it in writing will help.','relieved']],'relieved'],
    ['End quickly to avoid more discomfort.',0,'Riley leaves with nothing to work on.',[['riley','Okay… thanks, I guess.','concerned']],'concerned'],
    ['Suggest Riley talk to HR.',1,'An option if Riley wants it, but not a substitute for your own follow-through.',[['riley','Do I need to?','thinking']],'thinking']]}]}]},
{h:'Conversation 3: Changed in Calibration',nav:'Practice: Avery',blocks:[
  {type:'sim',key:'m6c',focus:'avery',context:'<b>Situation:</b> You proposed Exceeds for Avery. In calibration, comparison with similar roles showed <b>Meets</b> fit better, and you agreed. Avery never knew your draft.',end:'Takeaway: present the final rating as your own, be honest about the process, and never promise a future rating.',steps:[
   {mood:'neutral',q:'How do you open the conversation?',opts:[
    ['“Your rating this year is Meets. Here’s the evidence I based it on.”',2,'Your draft was never shared, so there is nothing to walk back. Present the final rating as your own.',[['avery','Okay, I’d like to understand it.','thinking']],'thinking'],
    ['“I put you down for Exceeds, but calibration brought it down.”',0,'It passes the blame and reveals a confidential draft.',[['avery','So it was someone else’s decision?','upset']],'upset'],
    ['“Meets. It wasn’t my call.”',0,'It disowns the rating.',[['avery','Then whose call was it?','upset']],'upset']]},
   {mood:'thinking',lines:[['avery','Did calibration change my rating?','concerned']],q:'How do you respond honestly?',opts:[
    ['“Every rating is reviewed against the same standard, and that review helped me land on Meets. I agree with it, and here’s why.”',2,'Honest about the process, owns the outcome, and keeps the discussion confidential.',[['avery','That makes sense. What would Exceeds look like for me?','thinking']],'thinking'],
    ['“No, it was always Meets.”',0,'Untrue, and damaging if Avery learns otherwise.',[['avery','Okay…','neutral']],'neutral'],
    ['“Yes, they lowered you.”',0,'It passes the blame and implies the rating isn’t yours.',[['avery','Who lowered it?','upset']],'upset']]},
   {mood:'thinking',q:'Turn to development for next year.',opts:[
    ['Name the specific gap between Avery’s work and the Exceeds anchors, and agree how to close it.',2,'Avery knows exactly what Exceeds looks like and how to get there.',[['avery','That’s really clear. I can work with that.','relieved']],'relieved'],
    ['“Don’t worry, you’ll get Exceeds next year.”',0,'A promise you can’t keep.',[['avery','Is that guaranteed?','thinking']],'thinking'],
    ['Talk about Avery’s strengths only.',1,'Kind, but Avery leaves without a path forward.',[['avery','Thanks. I’m not sure what to change, though.','concerned']],'concerned']]}]}]},
{h:'Debrief: All Three Conversations',nav:'Debrief',blocks:[
  {type:'lead',html:'Here are your points across the three conversations.'},
  {type:'debrief',keys:['m6a','m6b','m6c'],names:['Conversation 1: Jordan','Conversation 2: Riley','Conversation 3: Avery'],replay:['Replay Conversation 1','Replay Conversation 2','Replay Conversation 3'],maxEach:6,pass:12},
  {type:'practices',label:'Best Practices',items:['Lead with the rating','Back it with evidence','Own the outcome, never the blame','Never promise a future rating']}]},
{h:'Handling Strong Reactions',nav:'Strong Reactions',blocks:[
  {type:'lead',html:'Strong reactions are normal. Your job isn’t to talk someone out of their feelings or to change the rating. It is to listen, acknowledge, and make a clear plan to follow up.'},
  {type:'reveal',style:'grid',ins:'Select each reaction to see how to respond.',items:[
   {h:'Anger',b:'Stay calm and acknowledge their frustration. You might say, “I understand this isn’t what you expected.” Avoid debating the rating point by point. Offer them time to reflect and schedule a follow-up.'},
   {h:'Tears',b:'Pause and acknowledge their emotions. Offer a moment or a short break. Continue when they’re ready, or schedule another time to discuss development and next steps.'},
   {h:'Silence',b:'Give them time to process. Ask an open-ended question, such as “What’s going through your mind?” Allow space for a response, and offer to continue the conversation later if needed.'},
   {h:'“I’m Going to Appeal.”',b:'Stay neutral and explain the appeal process. Avoid discouraging the employee or reopening the rating decision. Let your HRBP know about the concern.'}]},
  {type:'practices',label:'Best Practices',items:['Listen','Acknowledge','Don’t renegotiate in the moment','Follow up in writing']}]},
{h:'Follow Up in Writing',nav:'Follow Up in Writing',blocks:[
  {type:'lead',html:'Send a short written recap within a day or two. It confirms what was said, gives the employee something to reflect on, and creates a record. Keep it factual: no new information, and nothing from the calibration discussion.'},
  {type:'info',label:'Sample Email',html:'<p>“Hi Riley, thanks for our conversation today. To recap: your rating for this year is Meets. We discussed your strong delivery on the Q2 onboarding project and the support handbook. For next year, we agreed to focus on leading one cross-team project and presenting results to the leadership team. Let’s set goals together by January 20. If you have questions in the meantime, I’m happy to talk.”</p>'},
  {type:'practices',label:'Every Follow-Up Email Includes',items:['The rating','The evidence you discussed','The development focus','A next step with a date','An open door']},
  {type:'resources',label:'Download the Template',items:['email']}]},
{h:'Connect to Next Year',nav:'Connect to Next Year',blocks:[
  {type:'lead',html:'Every rating conversation helps set the stage for the year ahead. Turn the development priorities you agree on into clear goals, and schedule regular check-ins to track progress. This helps build a strong foundation of performance evidence from day one.'},
  {type:'flow',steps:['Goal setting','Check-ins','Self-review','Manager draft','Calibration','Delivery'],keyIdx:5,loop:true},
  {type:'entry',ins:false,fields:[{label:'Set a Development Goal for a Direct Report',help:'Write one specific, measurable development goal to agree on with a direct report after their rating conversation.',ph:'Example: “Lead one cross-team project by June and present the results to leadership.”',min:20}]}]},
{h:'Knowledge Check',nav:'Knowledge Check',blocks:[
  {type:'quiz',pass:3,review:'the screens “Own the rating”, “Structure the conversation”, “What you can share” and “Strong reactions”',qs:[
   {q:'When should you share the rating in the conversation?',opts:['At the end','In the first minute','Only if asked','After the development discussion'],a:1,fb:'People can’t absorb feedback while they are waiting for the number.'},
   {q:'Calibration changed your proposed rating. What do you tell the employee?',opts:['“Calibration lowered you.”','“I fought for you.”','Present the final rating as your own, with evidence','Say nothing about calibration, even if asked'],a:2,fb:'Owning the rating protects trust in you and in the process.'},
   {q:'An employee asks which manager argued against them. What do you say?',opts:['Name them','Deny that anyone did','Explain that discussions are confidential, and walk through the evidence','Promise to find out'],a:2,fb:'You can explain the process and the evidence, never what others said.'},
   {q:'An employee becomes angry and asks you to change the rating. What is the best response?',opts:['Change it to end the conflict','Argue each point','Acknowledge it, don’t renegotiate, and follow up in writing','End the meeting immediately'],a:2,fb:'Listening and a clear follow-up calm the situation without reopening a final rating.'}]}]},
{h:'Key Takeaways',nav:'Key Takeaways',blocks:[
  {type:'takeaways',label:false,items:['Lead with the rating, then evidence, impact, development and next steps.','Own the calibrated rating as yours. Never pass the blame.','Keep calibration discussions confidential.','Listen to and acknowledge strong reactions, and follow up in writing.','Turn the development focus into next year’s goals.']},
  {type:'resources',label:'Download for Later',items:['convo','email','hrbp']}]},
{h:'Program Complete: Recap',nav:'Program Complete: Recap',blocks:[
  {type:'banner',h:'You’ve Completed Performance Calibration for Managers',sub:'You are ready for this cycle’s calibration. Here is what each module covered.'},
  {type:'recap',items:[
   ['Understanding Performance Calibration','Calibration applies one standard across all managers before ratings are final, protecting pay equity, retention and trust.'],
   ['The Calibration Process','Rate against the role and level, rate this period only, weigh results and behaviors, and treat “Meets” as a good rating.'],
   ['Gather the Evidence','Cover the whole year, write evidence as Situation, Behavior, Impact, and prepare a one-page summary for each person.'],
   ['Check for Bias','Run the eight Quick Self-Checks before you defend a rating, and replace personality words with behavior and impact.'],
   ['Calibrate Together','Present in two minutes, ask neutral evidence questions, and change a rating when the evidence supports it.'],
   ['Communicating the Outcome','Lead with the rating, own it as yours, keep the discussion confidential, and follow up in writing.']]},
  {type:'info',pin:true,html:'<p><b>Before your session:</b> Revisit your prep summaries, and keep the Bias Check Card and the Rating Scale Card close at hand.</p>'},
  {type:'resources',label:'All Course Documents',items:['glance','hrbp','scale','prep','sbi','bias','audit','challenge','checklist','log','convo','email']}]}
]});

<script>

let S;
function fresh(){return {m:0,s:0,done:{},rating:{},sim:{},anchors:{},review:false,lk2:true};}

function clearQuizzes(){COURSE.forEach((m,mi)=>m.screens.forEach((sc,si)=>{if(hasQuiz(mi,si))delete S.done[k(mi,si)];}));}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
load();
const $=id=>document.getElementById(id);
function h(tag,props,...kids){const e=document.createElement(tag);
  for(const [k,v] of Object.entries(props||{})){
    if(k==='class')e.className=v;else if(k==='html')e.innerHTML=v;else if(k==='style')e.setAttribute('style',v);
    else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);
    else if(v===true)e.setAttribute(k,'');else if(v!==false&&v!=null)e.setAttribute(k,v);}
  for(const c of kids.flat()){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(c));}
  return e;}
