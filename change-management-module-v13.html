function App() {
  const [data, setData] = useState(initialData());
  const [mode, setMode] = useState("full"); // 'quick' | 'full'
  const [phase, setPhase] = useState(0);
  const [step, setStep] = useState(0);
  const [loaded, setLoaded] = useState(false);
  const [showWelcome, setShowWelcome] = useState(true);
  const [infoPhase, setInfoPhase] = useState(null);
  const [confirmModal, setConfirmModal] = useState(null); // { message, onConfirm }
  const [showSummary, setShowSummary] = useState(false);
  const [saveStatus, setSaveStatus] = useState("idle"); // 'idle' | 'saving' | 'saved'
  const [menuOpen, setMenuOpen] = useState(false);
  const [, setThemeTick] = useState(0);
  const saveTimer = useRef(null);
  const savedFlashTimer = useRef(null);

  useEffect(() => {
    let mq = null;
    const h = () => setThemeTick((x) => x + 1);
    try { mq = window.matchMedia("(prefers-color-scheme: dark)"); mq.addEventListener("change", h); } catch (e) {}
    return () => { try { mq && mq.removeEventListener("change", h); } catch (e) {} };
  }, []);
  const dark = isDark();
  const toggleTheme = () => {
    document.documentElement.setAttribute("data-theme", isDark() ? "light" : "dark");
    setThemeTick((x) => x + 1);
  };

  useEffect(() => {
    (async () => {
      try {
        const raw = localStorage.getItem("cm-module-draft");
        const res = raw ? { value: raw } : null;
        if (res && res.value) {
          const parsed = JSON.parse(res.value);
          if (parsed && parsed.data) setData(parsed.data);
          if (parsed && parsed.mode) setMode(parsed.mode);
          if (parsed && parsed.data && parsed.data.setup.initiativeName) setShowWelcome(false);
        }
      } catch (e) { /* nothing saved yet */ }
      setLoaded(true);
    })();
  }, []);

  useEffect(() => {
    if (!loaded) return;
    setSaveStatus("saving");
    if (saveTimer.current) clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(async () => {
      try {
        localStorage.setItem("cm-module-draft", JSON.stringify({ data, mode }));
        setSaveStatus("saved");
        if (savedFlashTimer.current) clearTimeout(savedFlashTimer.current);
        savedFlashTimer.current = setTimeout(() => setSaveStatus("idle"), 2500);
      } catch (e) { console.error("save failed", e); setSaveStatus("idle"); }
    }, 700);
    return () => clearTimeout(saveTimer.current);
  }, [data, mode, loaded]);

  const update = (section, patch) => setData((d) => ({ ...d, [section]: { ...d[section], ...patch } }));

  const resetAll = () => {
    setMenuOpen(false);
    setConfirmModal({
      message: "Clear all entries and start over? This can't be undone.",
      onConfirm: async () => {
        setData(initialData());
        setMode("full");
        setShowWelcome(true);
        setPhase(0);
        setStep(0);
        try { localStorage.removeItem("cm-module-draft"); } catch (e) {}
      },
    });
  };

  const phaseStepsAll = getPhaseSteps(mode);
  const stepKeys = phaseStepsAll[phase];
  const stepKey = stepKeys[step];

  const scrollTop = () => { try { window.scrollTo({ top: 0 }); } catch (e) {} };
  const goNext = () => {
    if (step < stepKeys.length - 1) setStep(step + 1);
    else if (phase < PHASES.length - 1) { setPhase(phase + 1); setStep(0); }
    scrollTop();
  };
  const goBack = () => {
    if (step > 0) setStep(step - 1);
    else if (phase > 0) { setPhase(phase - 1); setStep(phaseStepsAll[phase - 1].length - 1); }
    scrollTop();
  };
  const jump = (p, s) => { setPhase(p); setStep(s); setMenuOpen(false); scrollTop(); };
  const jumpToRequirement = (p, reqStepKey) => {
    const keys = phaseStepsAll[p];
    const idx = keys.indexOf(reqStepKey);
    jump(p, idx >= 0 ? idx : 0);
  };

  useEffect(() => {
    if (step >= stepKeys.length) setStep(Math.max(0, stepKeys.length - 1));
  }, [mode, phase, stepKeys.length, step]);

  const isLast = phase === PHASES.length - 1 && step === stepKeys.length - 1;

  const overallImpact = computeOverallImpact(data.impact.groups, data.impact.ratings);
  const readyAvg = overallReadiness(data.readiness.ratings);
  const overallReady = readinessLevel(readyAvg);

  const totalSteps = phaseStepsAll.reduce((s, arr) => s + arr.length, 0);
  const doneSteps = phaseStepsAll.slice(0, phase).reduce((s, arr) => s + arr.length, 0) + step;
  const progressPct = Math.round((doneSteps / (totalSteps - 1)) * 100);
  const completablePhases = PHASES.filter((p) => p.completable);
  const phasesComplete = PHASES.map((p, i) => p.completable && phaseComplete(data, i)).filter(Boolean).length;

  const phaseList = (
    <PhaseList
      data={data}
      phase={phase}
      infoPhase={infoPhase}
      setInfoPhase={setInfoPhase}
      onJump={(i) => jump(i, 0)}
      onJumpReq={(p, k) => { jumpToRequirement(p, k); setInfoPhase(null); }}
    />
  );
  const statusPanel = (
    <StatusPanel
      saveStatus={saveStatus}
      phasesComplete={phasesComplete}
      completableCount={completablePhases.length}
      overallImpact={overallImpact}
      overallReady={overallReady}
      mode={mode}
      setMode={setMode}
      onSummary={() => { setMenuOpen(false); setShowSummary(true); }}
      onAbout={() => { setMenuOpen(false); setShowWelcome(true); }}
      onReset={resetAll}
    />
  );
  const themeBtn = (
    <button type="button" className="icon-btn" onClick={toggleTheme} aria-label={dark ? "Switch to light mode" : "Switch to dark mode"} title={dark ? "Switch to light mode" : "Switch to dark mode"}>
      {dark ? <Sun size={18} /> : <Moon size={18} />}
    </button>
  );

  return (
    <div>
      {/* phone header */}
      <header className="mobile-header">
        <div className="mh-row">
          <button type="button" className="mobile-toggle" aria-expanded={menuOpen} onClick={() => setMenuOpen(!menuOpen)}>
            <span className="mb-text">
              <span className="mb-step">Section {phase + 1} of {PHASES.length}</span>
              <span className="mb-label">{PHASES[phase].label}</span>
            </span>
            <span className="mb-chev"><ChevronDown size={14} strokeWidth={2.2} /></span>
          </button>
          <button type="button" className="icon-btn" onClick={() => setShowSummary(true)} aria-label="View full summary" title="View full summary"><ListChecks size={18} /></button>
          {themeBtn}
        </div>
        {menuOpen && (
          <div className="mb-menu">
            {phaseList}
            <StatusLegend />
            {statusPanel}
          </div>
        )}
        <div className="mb-progress"><div className="mb-fill" style={{ width: `${progressPct}%` }} /></div>
      </header>

      <div className="shell">
        <aside className="sidebar">
          <div className="brand">
            <span className="brand-tile"><BarChart size={17} /></span>
            <span className="brand-name">Change Management Module</span>
            {themeBtn}
          </div>
          <div className="progress">
            <div className="progress-top"><span>Progress</span><span>{progressPct}%</span></div>
            <div className="progress-track"><div className="progress-fill" style={{ width: `${progressPct}%` }} /></div>
          </div>
          {phaseList}
          <StatusLegend />
          {statusPanel}
        </aside>

        <main className="main">
          <Eyebrow>Change Management Module</Eyebrow>
          <input
            className="title-input"
            aria-label="Initiative name"
            value={data.setup.initiativeName}
            onChange={(e) => update("setup", { initiativeName: e.target.value })}
            placeholder="Name this initiative..."
          />

          <div className="screen" key={phase + "-" + step}>
            {step === 0 && (
              <div className="note">
                <Compass size={16} />
                <p>{PHASE_DESCRIPTIONS[phase]}</p>
              </div>
            )}

            <StepDots steps={stepKeys} current={step} onJump={(s) => { setStep(s); scrollTop(); }} labels={stepLabels(phase, stepKeys)} />

            {phase === 0 && <SetupScreen stepKey={stepKey} data={data} update={update} />}
            {phase === 1 && <ImpactScreen stepKey={stepKey} data={data} update={update} />}
            {phase === 2 && <ReadinessScreen stepKey={stepKey} data={data} update={update} overallImpact={overallImpact} readyAvg={readyAvg} overallReady={overallReady} />}
            {phase === 3 && <PlanScreen stepKey={stepKey} data={data} update={update} overallImpact={overallImpact} overallReady={overallReady} />}
            {phase === 4 && <ActionPlanScreen stepKey={stepKey} data={data} update={update} />}
            {phase === 5 && <MonitoringDashboardScreen data={data} overallReady={overallReady} />}
          </div>

          <div className="nav-bar">
            <div className="nav-inner">
              <GhostBtn onClick={goBack}><ChevronLeft size={16} /> Back</GhostBtn>
              {!isLast ? (
                <PrimaryBtn onClick={goNext}>Continue <ChevronRight size={16} /></PrimaryBtn>
              ) : (
                <div className="caught-up"><CheckCircle2 size={17} /> You're all caught up</div>
              )}
            </div>
          </div>
        </main>
      </div>

      {showSummary && <SummaryOverlay data={data} overallImpact={overallImpact} overallReady={overallReady} onClose={() => setShowSummary(false)} />}
      {showWelcome && <WelcomeOverlay mode={mode} onStart={(m) => { setMode(m); setShowWelcome(false); }} />}
      {confirmModal && (
        <ConfirmModal
          message={confirmModal.message}
          onCancel={() => setConfirmModal(null)}
          onConfirm={() => { confirmModal.onConfirm(); setConfirmModal(null); }}
        />
      )}
    </div>
  );
}

function PhaseList({ data, phase, infoPhase, setInfoPhase, onJump, onJumpReq }) {
  return (
    <ul className="steps">
      {PHASES.map((p, i) => {
        const active = i === phase;
        const complete = p.completable && phaseComplete(data, i);
        const cls = "step clickable" + (active ? " active" : "") + (complete ? " done" : "");
        const mark = complete ? <Check size={12} /> : p.completable ? i + 1 : "★";
        return (
          <li key={p.label}>
            <div className={cls}>
              <button
                type="button"
                className="step-main"
                onClick={() => onJump(i)}
                aria-current={active ? "step" : undefined}
                title={complete ? `${p.label} — complete` : p.label}
              >
                <span className="step-num">{mark}</span>
                <span className="step-label">{p.label}</span>
              </button>
              {p.completable && (
                <button
                  type="button"
                  className="req-toggle"
                  aria-expanded={infoPhase === i}
                  onClick={() => setInfoPhase(infoPhase === i ? null : i)}
                  title="What's needed to complete this section"
                  aria-label="What's needed to complete this section"
                >
                  <ChevronDown size={15} />
                </button>
              )}
            </div>
            {infoPhase === i && (
              <div className="req-panel">
                <div className="req-title">To mark "{PHASES[i].label}" complete:</div>
                {PHASE_REQUIREMENTS[i].map((req, ri) => {
                  const done = req.check(data);
                  return (
                    <button key={ri} type="button" className="req-item" disabled={done} onClick={() => { if (!done) onJumpReq(i, req.stepKey); }}>
                      <span className={"req-mark" + (done ? " done" : "")}>{done && <Check size={10} />}</span>
                      <span>{req.label}</span>
                    </button>
                  );
                })}
              </div>
            )}
          </li>
        );
      })}
    </ul>
  );
}

function StatusLegend() {
  return (
    <div className="legend">
      <span className="legend-title">Section status:</span>
      <span className="legend-item"><span className="legend-dot" /> Not started</span>
      <span className="legend-item"><span className="legend-dot active" /> In progress</span>
      <span className="legend-item"><span className="legend-dot done" /> Complete</span>
    </div>
  );
}

function StatusPanel({ saveStatus, phasesComplete, completableCount, overallImpact, overallReady, mode, setMode, onSummary, onAbout, onReset }) {
  return (
    <div className="status-card">
      <div className="status-badges">
        <Badge label="Sections" value={`${phasesComplete}/${completableCount}`} tone={phasesComplete === completableCount ? "info" : "neutral"} />
        {overallImpact && <Badge label="Impact" value={overallImpact} tone={IMPACT_TONE[overallImpact]} />}
        {overallReady && <Badge label="Readiness" value={overallReady} tone={READY_TONE[overallReady]} />}
      </div>
      <div className="status-row">
        <ModeToggle mode={mode} onChange={setMode} />
        <SaveIndicator status={saveStatus} />
      </div>
      <div className="status-actions">
        <button type="button" className="btn btn-text" onClick={onSummary}><ListChecks size={16} /> View full summary</button>
        <button type="button" className="btn btn-text" onClick={onAbout}><HelpCircle size={16} /> About this tool</button>
        <button type="button" className="btn btn-text" onClick={onReset}><RotateCcw size={16} /> Start over</button>
      </div>
    </div>
  );
}

function Badge({ label, value, tone = "neutral" }) {
  return (
    <span className={"badge " + tone}>
      {label && <span className="badge-label">{label}</span>}
      <span className="badge-value">{value}</span>
    </span>
  );
}

function SaveIndicator({ status }) {
  if (status === "idle") return <span className="save-ind" />;
  const saving = status === "saving";
  return (
    <span className="save-ind" role="status">
      {saving ? (<><span className="save-dot" /> Saving…</>) : (<><CheckCircle2 size={13} /> Saved</>)}
    </span>
  );
}

function ModeToggle({ mode, onChange }) {
  return (
    <div className="mode-toggle" role="group" aria-label="Plan depth">
      {["quick", "full"].map((m) => {
        const active = mode === m;
        return (
          <button
            key={m}
            type="button"
            aria-pressed={active}
            className={active ? "selected" : ""}
            onClick={() => onChange(m)}
            title={m === "quick" ? "Quick plan — required fields only" : "Full plan — every question"}
          >
            {m}
          </button>
        );
      })}
    </div>
  );
}

function Overlay({ children, onBackdropClick }) {
  return (
    <div className="overlay" onClick={onBackdropClick}>
      <div className="overlay-inner">
        <div onClick={(e) => e.stopPropagation()} style={{ width: "100%", display: "flex", justifyContent: "center" }}>{children}</div>
      </div>
    </div>
  );
}

function WelcomeOverlay({ mode, onStart }) {
  const [choice, setChoice] = useState(mode || "full");
  return (
    <Overlay onBackdropClick={() => onStart(choice)}>
      <div className="modal" role="dialog" aria-modal="true" aria-labelledby="cm-welcome-title">
        <Eyebrow>Change Management Module</Eyebrow>
        <h1 id="cm-welcome-title">Plan a change from setup through rollout</h1>
        <p className="modal-desc">
          This tool walks you through six sections. Information you enter once — like affected groups or your change
          team — carries forward automatically, so you won't re-type it later.
        </p>
        <div className="phase-list">
          {PHASES.map((p, i) => {
            const PIcon = p.icon;
            return (
              <div key={p.label} className="phase-row">
                <div className="phase-ic"><PIcon size={15} /></div>
                <div>
                  <div className="phase-name">{p.label}</div>
                  <div className="phase-desc">{PHASE_DESCRIPTIONS[i]}</div>
                </div>
              </div>
            );
          })}
        </div>
        <div className="note small" style={{ marginBottom: 12 }}>
          <CheckCircle2 size={15} />
          <p>Click the small arrow next to any section to see exactly what's still needed.</p>
        </div>
        <div className="legend" style={{ padding: 0, marginBottom: 24 }}>
          <span className="legend-item"><span className="legend-dot" /> Not started</span>
          <span className="legend-item"><span className="legend-dot active" /> In progress</span>
          <span className="legend-item"><span className="legend-dot done" /> Complete</span>
        </div>

        <div style={{ marginBottom: 22 }}>
          <div className="field-label" style={{ fontSize: 13, fontWeight: 600, marginBottom: 10 }}>How thorough should this plan be?</div>
          <div className="mode-cards">
            <ModeCard
              title="Quick plan"
              description="Just the required fields — ownership, overview, stakeholders, impact, readiness, and actions. Good for smaller changes."
              active={choice === "quick"}
              onClick={() => setChoice("quick")}
            />
            <ModeCard
              title="Full plan"
              description="Every question, including roles, processes, technology, skills, and policy impacts. Best for larger changes."
              active={choice === "full"}
              onClick={() => setChoice("full")}
            />
          </div>
          <div className="hint">You can switch this anytime from the Quick / Full toggle.</div>
        </div>

        <PrimaryBtn onClick={() => onStart(choice)}>Get started</PrimaryBtn>
      </div>
    </Overlay>
  );
}

function ModeCard({ title, description, active, onClick }) {
  return (
    <button type="button" aria-pressed={active} onClick={onClick} className={"mode-card" + (active ? " selected" : "")}>
      <div className="mc-title">{title}</div>
      <div className="mc-desc">{description}</div>
    </button>
  );
}

function ConfirmModal({ message, onConfirm, onCancel }) {
  return (
    <Overlay onBackdropClick={onCancel}>
      <div className="modal small" role="alertdialog" aria-modal="true">
        <div className="confirm-body">
          <AlertTriangle size={19} />
          <p style={{ margin: 0 }}>{message}</p>
        </div>
        <div className="modal-actions">
          <GhostBtn onClick={onCancel}>Cancel</GhostBtn>
          <button type="button" className="btn btn-danger" onClick={onConfirm}>Confirm</button>
        </div>
      </div>
    </Overlay>
  );
}

function SumSection({ title, children }) {
  return (
    <div className="sum-section">
      <div className="sum-section-title">{title}</div>
      {children}
    </div>
  );
}

function SumRow({ label, value }) {
  return (
    <div className="sum-row">
      <div className="sum-label">{label}</div>
      <div className="sum-text">{value || "—"}</div>
    </div>
  );
}

function SummaryOverlay({ data, overallImpact, overallReady, onClose }) {
  const s = data.setup, im = data.impact, rr = data.readiness.ratings, pl = data.plan;
  const actions = pl.actions.filter((a) => a.action);
  return (
    <Overlay onBackdropClick={onClose}>
      <div className="modal wide" role="dialog" aria-modal="true" aria-label="Full plan summary">
        <div id="cm-print-area">
          <div className="sum-head cm-no-print">
            <div>
              <Eyebrow>Full Plan Summary</Eyebrow>
              <h1>{s.initiativeName || "Untitled Initiative"}</h1>
            </div>
            <div style={{ display: "flex", gap: 8 }}>
              <GhostBtn onClick={() => window.print()}><ListChecks size={15} /> Print / Save as PDF</GhostBtn>
              <IconBtn onClick={onClose} label="Close summary"><ChevronLeft size={16} /></IconBtn>
            </div>
          </div>
          <h1 className="print-only" style={{ fontSize: 24, margin: "0 0 24px" }}>{s.initiativeName || "Untitled Initiative"} — Change Plan Summary</h1>

          <SumSection title="Setup & Governance">
            <SumRow label="Executive Sponsor" value={`${s.sponsor.name}${s.sponsor.title ? ", " + s.sponsor.title : ""}`} />
            <SumRow label="Accountable Owner" value={`${s.accountable.name}${s.accountable.title ? ", " + s.accountable.title : ""}`} />
            <SumRow label="Change Management Lead" value={`${s.cmLead.name}${s.cmLead.title ? ", " + s.cmLead.title : ""}`} />
            <SumRow label="Project Lead" value={`${s.projectLead.name}${s.projectLead.title ? ", " + s.projectLead.title : ""}`} />
            <SumRow label="Change Team" value={s.team.map((t) => `${t.name || "—"} (${t.role || "—"})`).join("; ")} />
            <SumRow label="Decision Authority" value={s.decisionAuthority} />
            <SumRow label="Escalation Process" value={s.escalation} />
          </SumSection>

          <SumSection title="Organizational Impact">
            <SumRow label="What's Changing" value={im.whatChanging} />
            <SumRow label="Why" value={im.why} />
            <SumRow label="Why Now" value={im.urgency} />
            <SumRow label="Target Outcome" value={im.outcome} />
            <SumRow label="Effective Date" value={im.effectiveDate} />
            <SumRow label="Affected Groups & Impact Level" value={im.groups.map((g) => `${g.name || "—"} (${g.count || "?"} people) — ${overallLevel(im.ratings[g.id] || {}) || "unrated"}`).join("\n")} />
          </SumSection>

          <SumSection title="Change Readiness">
            <div className="sum-grid">
              {READINESS_CATS.map((c) => {
                const avg = catAverage(rr, c.key, c.statements.length);
                return <SumRow key={c.key} label={c.title} value={avg !== null ? `${avg.toFixed(1)} / 5` : "Not scored"} />;
              })}
            </div>
            <SumRow label="Overall Impact × Readiness" value={overallImpact && overallReady ? `${overallImpact} impact, ${overallReady} readiness` : "Incomplete"} />
          </SumSection>

          <SumSection title="Action Plan">
            {actions.length === 0 ? (
              <p className="italic-empty">No actions documented yet.</p>
            ) : (
              <div className="table-wrap">
                <table className="table">
                  <thead>
                    <tr>{["Action", "Owner", "Due", "Status"].map((h) => <th key={h}>{h}</th>)}</tr>
                  </thead>
                  <tbody>
                    {actions.map((a) => (
                      <tr key={a.id}>
                        <td>{a.action}</td>
                        <td>{a.owner || "—"}</td>
                        <td>{a.dueDate || "—"}</td>
                        <td className={"t-" + (STATUS_TONE[a.status] || "neutral")} style={{ fontWeight: 600 }}>{a.status}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}
          </SumSection>
        </div>
      </div>
    </Overlay>
  );
}

function stepLabels(phase, keys) {
  const maps = [
    { ownership: "Ownership", team: "Change Team", governance: "Governance" },
    { overview: "Overview", stakeholders: "Stakeholders", roles: "Roles", processes: "Processes", technology: "Technology", skills: "Skills", policies: "Policies", impactLevel: "Impact Level", summary: "Summary" },
    Object.fromEntries(READINESS_CATS.map((c) => [c.key, c.title.split(" ")[0]]).concat([["pairing", "Impact × Readiness"]])),
    Object.fromEntries(PLAN_SECTIONS.map((s) => [s.key, s.title])),
    { planactions: "Change Management Plan Actions" },
    { dashboard: "Dashboard" },
  ];
  return keys.map((k) => maps[phase][k] || k);
}

function StepDots({ steps, current, onJump, labels }) {
  if (steps.length <= 1) return null;
  return (
    <div className="pills" role="tablist" aria-label="Steps in this section">
      {steps.map((s, i) => {
        const active = i === current;
        const done = i < current;
        return (
          <button
            key={s}
            type="button"
            role="tab"
            aria-selected={active}
            onClick={() => onJump(i)}
            className={"pill" + (active ? " active" : done ? " done" : "")}
          >
            {labels[i]}
          </button>
        );
      })}
    </div>
  );
}

/* ---------------------------------------------------------------- */
/* Phase 1 — Setup & Governance                                      */
/* ---------------------------------------------------------------- */

function RequiredLegend() {
  return (
    <div className="req-legend">
      <span className="req">*</span> Required for this section to be marked complete
    </div>
  );
}

function PersonFields({ label, value, onChange, required }) {
  const id = useId();
  return (
    <div className="field">
      <label htmlFor={id}>{label}{required && <span className="req"> *</span>}</label>
      <div className="row2">
        <input id={id} type="text" value={value.name} onChange={(e) => onChange({ ...value, name: e.target.value })} placeholder="Name" />
        <input type="text" aria-label={label + " — job title"} value={value.title} onChange={(e) => onChange({ ...value, title: e.target.value })} placeholder="Job title" style={{ marginTop: 0 }} />
      </div>
    </div>
  );
}

function SetupScreen({ stepKey, data, update }) {
  const s = data.setup;
  const set = (patch) => update("setup", patch);

  if (stepKey === "ownership") {
    return (
      <Card>
        <Eyebrow>Change Ownership</Eyebrow>
        <RequiredLegend />
        <PersonFields label="Executive sponsor" value={s.sponsor} onChange={(v) => set({ sponsor: v })} required />
        <PersonFields label="Who is accountable for the overall success of the change?" value={s.accountable} onChange={(v) => set({ accountable: v })} required />
        <PersonFields label="Who is leading the change management effort?" value={s.cmLead} onChange={(v) => set({ cmLead: v })} required />
        <PersonFields label="Who is leading the overall project or implementation?" value={s.projectLead} onChange={(v) => set({ projectLead: v })} required />
      </Card>
    );
  }
  if (stepKey === "team") {
    return (
      <>
        <Card>
          <Eyebrow>Change Team</Eyebrow>
          <p className="card-help">Who's on the core change team, and what each person will do.</p>
          <Repeater
            items={s.team}
            onChange={(v) => set({ team: v })}
            addLabel="Add team member"
            empty="No team members added yet."
            fields={[
              { key: "name", label: "Name" },
              { key: "function", label: "Business Function" },
              { key: "role", label: "Role on Change Team" },
              { key: "roleDescription", label: "Role Description", type: "textarea", wide: true },
              { key: "contact", label: "Contact Info" },
            ]}
          />
        </Card>
        <Card>
          <Eyebrow>Extended Contributors</Eyebrow>
          <p className="card-help">Anyone who needs to be involved but isn't on the core team.</p>
          <Repeater
            items={s.smes}
            onChange={(v) => set({ smes: v })}
            addLabel="Add contributor"
            empty="None yet — add if applicable."
            fields={[
              { key: "name", label: "Name" },
              { key: "function", label: "Business Function" },
              { key: "role", label: "Role in the Change", wide: true },
            ]}
          />
        </Card>
      </>
    );
  }
  if (stepKey === "governance") {
    return (
      <Card>
        <Eyebrow>Governance</Eyebrow>
        <Field label="Who has final decision-making authority for the change?" value={s.decisionAuthority} onChange={(v) => set({ decisionAuthority: v })} area />
        <Field label="How will major issues, risks, or decisions be escalated?" value={s.escalation} onChange={(v) => set({ escalation: v })} area />
      </Card>
    );
  }
  return null;
}

/* ---------------------------------------------------------------- */
/* Phase 2 — Organizational Impact Assessment                        */
/* ---------------------------------------------------------------- */

function ImpactScreen({ stepKey, data, update }) {
  const im = data.impact;
  const set = (patch) => update("impact", patch);

  if (stepKey === "overview") {
    return (
      <Card>
        <Eyebrow>Change Overview</Eyebrow>
        <RequiredLegend />
        <Field label="What is changing?" value={im.whatChanging} onChange={(v) => set({ whatChanging: v })} area required />
        <Field label="Why is the change being made?" value={im.why} onChange={(v) => set({ why: v })} area required />
        <Field label="Why now? What happens if this waits?" value={im.urgency} onChange={(v) => set({ urgency: v })} area required help="This is what a sponsor points to when someone asks 'why can't this wait until next quarter?'" />
        <Field label="What business outcome is the change intended to achieve?" value={im.outcome} onChange={(v) => set({ outcome: v })} area required />
        <div style={{ maxWidth: 320 }}>
          <Field label="When will the change take effect?" value={im.effectiveDate} onChange={(v) => set({ effectiveDate: v })} type="date" />
        </div>
      </Card>
    );
  }

  if (stepKey === "stakeholders") {
    return (
      <>
        <Card>
          <Eyebrow>Stakeholders</Eyebrow>
          <p className="card-help">List every group affected by this change — a team, department, or location. You'll rate each one's impact next, and they'll carry forward automatically into Readiness and the Change Management Plan.</p>
          <Repeater
            items={im.groups}
            onChange={(v) => set({ groups: v })}
            addLabel="Add affected group"
            empty="No groups added yet."
            fields={[
              { key: "name", label: "Group" },
              { key: "count", label: "# People Affected", type: "number" },
              { key: "effect", label: "How They're Affected", type: "textarea", wide: true },
            ]}
          />
        </Card>
        <Card>
          <YesNo label="Are any groups affected significantly more than others?" value={im.sigMore} onChange={(v) => set({ sigMore: v })} detailLabel="Which groups, and how?" />
          <YesNo label="Are customers, vendors, or external partners affected?" value={im.external} onChange={(v) => set({ external: v })} detailLabel="Which external groups, and how?" />
        </Card>
      </>
    );
  }

  if (stepKey === "roles") {
    return (
      <Card>
        <Eyebrow>Roles & Responsibilities</Eyebrow>
        <YesNoSimple
          label="Will any roles or responsibilities change?"
          value={im.rolesChange.yes}
          onChange={(v) => set({ rolesChange: { ...im.rolesChange, yes: v } })}
        />
        {im.rolesChange.yes === true && (
          <div style={{ marginBottom: 28 }}>
            <Repeater
              items={im.rolesChange.list}
              onChange={(v) => set({ rolesChange: { ...im.rolesChange, list: v } })}
              addLabel="Add role change"
              empty="No role changes added yet."
              fields={[{ key: "role", label: "Role / Responsibility", wide: true }, { key: "detail", label: "What Changes", type: "textarea", wide: true }]}
            />
          </div>
        )}
        <div className="field-label" style={{ fontSize: 13, fontWeight: 600, marginBottom: 12 }}>What will people need to start, stop, or continue doing?</div>
        <div className="sscols">
          <LineList label="Start" items={im.start} onChange={(v) => set({ start: v })} placeholder="Something to start doing" />
          <LineList label="Stop" items={im.stop} onChange={(v) => set({ stop: v })} placeholder="Something to stop doing" />
          <LineList label="Continue" items={im.cont} onChange={(v) => set({ cont: v })} placeholder="Something to keep doing" />
        </div>
        <YesNo label="Will decision-making authority or accountability change?" value={im.authorityChange} onChange={(v) => set({ authorityChange: v })} />
        <YesNo label="Will reporting relationships or team structures change?" value={im.reportingChange} onChange={(v) => set({ reportingChange: v })} />
      </Card>
    );
  }

  if (stepKey === "processes") {
    return (
      <Card>
        <Eyebrow>Processes & Ways of Working</Eyebrow>
        <p className="card-help">List any existing processes or workflows this change affects.</p>
        <Repeater
          items={im.processes}
          onChange={(v) => set({ processes: v })}
          addLabel="Add process"
          empty="No processes added yet."
          fields={[
            { key: "name", label: "Process / Workflow", wide: true },
            { key: "whatChanges", label: "What Will Change", type: "textarea", wide: true },
            { key: "significance", label: "Significance", type: "select", options: ["Low", "Medium", "High"] },
          ]}
        />
        <div className="spacer-24" />
        <YesNoSimple
          label="Are any new processes, outside of what was listed above, being introduced?"
          value={im.newProcesses.yes}
          onChange={(v) => set({ newProcesses: { ...im.newProcesses, yes: v } })}
        />
        {im.newProcesses.yes === true && (
          <div style={{ marginBottom: 22 }}>
            <Repeater
              items={im.newProcesses.list}
              onChange={(v) => set({ newProcesses: { ...im.newProcesses, list: v } })}
              addLabel="Add new process"
              empty="None added yet."
              fields={[{ key: "name", label: "New Process" }, { key: "significance", label: "Significance", type: "select", options: ["Low", "Medium", "High"] }]}
            />
          </div>
        )}
        <YesNo label="Will the change affect how teams work together or depend on one another?" value={im.handoffs} onChange={(v) => set({ handoffs: v })} />
      </Card>
    );
  }

  if (stepKey === "technology") {
    return (
      <Card>
        <Eyebrow>Technology & Tools</Eyebrow>
        <p className="card-help">Check anything that applies, then add detail once below.</p>
        <ChecklistBlock
          items={[
            { key: "newSystems", label: "Employees will use new or different systems, tools, or technology" },
            { key: "retiredSystems", label: "Existing systems or tools will be retired" },
            { key: "accessChange", label: "Workflows, permissions, or system access will change" },
            { key: "infoHandling", label: "Employees will need to enter, update, or manage information differently" },
          ]}
          checked={im.techChecklist}
          onChangeChecked={(v) => set({ techChecklist: v })}
          detail={im.techDetail}
          onChangeDetail={(v) => set({ techDetail: v })}
          detailLabel="What's changing — which systems, what access, what's different?"
        />
      </Card>
    );
  }

  if (stepKey === "skills") {
    return (
      <Card>
        <Eyebrow>Skills & Behaviors</Eyebrow>
        <Field label="What new knowledge or skills will employees need?" value={im.newSkills} onChange={(v) => set({ newSkills: v })} area />
        <Field label="What existing skills will become less important or obsolete?" value={im.obsoleteSkills} onChange={(v) => set({ obsoleteSkills: v })} area />
        <Field label="What behaviors will need to change?" value={im.behaviorChange} onChange={(v) => set({ behaviorChange: v })} area />
        <YesNo label="Will managers need new capabilities to support the change?" value={im.managerCapability} onChange={(v) => set({ managerCapability: v })} />
      </Card>
    );
  }

  if (stepKey === "policies") {
    return (
      <Card>
        <Eyebrow>Policies & Structure</Eyebrow>
        <p className="card-help">Check anything that applies, then add detail once below.</p>
        <ChecklistBlock
          items={[
            { key: "policyChange", label: "Policies, procedures, governance, or controls will change" },
            { key: "structureChange", label: "Organizational structures or reporting relationships will change" },
            { key: "performanceChange", label: "Performance expectations or measures will change" },
            { key: "incentiveChange", label: "Incentives or rewards will change" },
          ]}
          checked={im.policyChecklist}
          onChangeChecked={(v) => set({ policyChecklist: v })}
          detail={im.policyDetail}
          onChangeDetail={(v) => set({ policyDetail: v })}
          detailLabel="What's changing about policy, structure, performance, or incentives?"
        />
      </Card>
    );
  }

  if (stepKey === "impactLevel") {
    if (im.groups.length === 0) {
      return <Card><p className="italic-empty" style={{ margin: 0 }}>Add affected groups on the Stakeholders step to rate their impact level here.</p></Card>;
    }
    return (
      <Card>
        <Eyebrow>Impact Level</Eyebrow>
        <p className="card-help">Rate each group below. Their overall impact level is calculated automatically and determines which groups get flagged as priorities later in your Change Management Plan.</p>
        <div className="stack">
          {im.groups.map((g) => {
            const dims = im.ratings[g.id] || {};
            const level = overallLevel(dims);
            const setDim = (dim, val) => set({ ratings: { ...im.ratings, [g.id]: { ...dims, [dim]: val } } });
            return (
              <div key={g.id} className="entry">
                <div className="card-head" style={{ marginBottom: g.effect ? 0 : 14 }}>
                  <div className="group-name">{g.name || "Unnamed group"}</div>
                  {level && <Badge label="Overall" value={level} tone={IMPACT_TONE[level]} />}
                </div>
                {g.effect && <div className="group-effect">{g.effect}</div>}
                <div className="dims">
                  {[
                    ["degree", "Degree of Change", "How different the future state is from how things work today."],
                    ["frequency", "Frequency", "How often this group will encounter or use the change."],
                    ["complexity", "Complexity", "How difficult the change will be to learn or carry out."],
                    ["disruption", "Disruption", "How much the change will interrupt current work or routines."],
                  ].map(([key, label, def]) => (
                    <div key={key}>
                      <div className="mini-label" style={{ color: "var(--ink)", marginBottom: 2 }}>{label}</div>
                      <div className="mini-desc">{def}</div>
                      <Select value={dims[key]} onChange={(v) => setDim(key, v)} options={["Low", "Medium", "High"]} ariaLabel={`${g.name || "Group"} — ${label}`} />
                    </div>
                  ))}
                </div>
              </div>
            );
          })}
        </div>
      </Card>
    );
  }

  if (stepKey === "summary") {
    return (
      <Card>
        <Eyebrow>Organizational Impact — Summary</Eyebrow>
        <div>
          <SummaryBlock label="What's changing" text={im.whatChanging} />
          <SummaryBlock label="Why" text={im.why} />
          <SummaryBlock label="Why now" text={im.urgency} />
          <SummaryBlock label="Target outcome" text={im.outcome} />
          <SummaryBlock label="Effective date" text={im.effectiveDate} />
          <SummaryBlock label="Affected groups" text={im.groups.map((g) => `${g.name || "—"} (${g.count || "?"} people): ${g.effect || "—"}`).join("\n") || "None entered."} />

          <SummaryBlock label="Process changes" text={im.processes.map((p) => `${p.name || "—"} — ${p.whatChanges || "—"} (${p.significance || "unrated"})`).join("\n") || "None entered."} />

function SummaryBlock({ label, text }) {
  return (
    <div className="sum-block">

function ReadinessScreen({ stepKey, data, update, overallImpact, readyAvg, overallReady }) {
  const rr = data.readiness.ratings;

  const setRow = (catKey, idx, patch, len) => {
    const rows = rr[catKey] ? [...rr[catKey]] : Array(len).fill(null);
    rows[idx] = { ...(rows[idx] || {}), ...patch };
    update("readiness", { ratings: { ...rr, [catKey]: rows } });
  };

  const cat = READINESS_CATS.find((c) => c.key === stepKey);

  if (cat) {
    const avg = catAverage(rr, cat.key, cat.statements.length);
    return (
      <Card>
        <div className="card-head">
          <Eyebrow>{cat.title}</Eyebrow>
          {avg !== null && <Badge label="Section avg" value={avg.toFixed(1)} tone={READY_TONE[readinessLevel(avg)]} />}
        </div>
        <p className="card-help">
          Rate each statement from 1–5, where 1 = Strongly Disagree and 5 = Strongly Agree. For each statement, identify the actions needed to improve readiness.
        </p>
        <div className="stack">
          {cat.statements.map((stmt, idx) => {
            const row = (rr[cat.key] || [])[idx] || {};
            return (
              <div key={idx} className="entry">
                <div className="stmt">{stmt}</div>
                <div className="scores" role="group" aria-label={stmt} style={{ marginBottom: 12 }}>
                  {[1, 2, 3, 4, 5].map((n) => {
                    const active = row.score === n;
                    return (
                      <button
                        key={n}
                        type="button"
                        aria-pressed={active}
                        onClick={() => setRow(cat.key, idx, { score: n }, cat.statements.length)}
                        title={RATING[n].label}
                        aria-label={`${n} — ${RATING[n].label}`}
                        className={"score-btn" + (active ? " selected" : "")}
                      >
                        {n}
                      </button>
                    );
                  })}
                  {row.score && <span className="score-label">{RATING[row.score].label}</span>}
                </div>
                <input
                  type="text"
                  aria-label="Action step to close the gap"
                  value={row.action || ""}
                  onChange={(e) => setRow(cat.key, idx, { action: e.target.value }, cat.statements.length)}
                  placeholder="Action step to close the gap (optional)"
                />
              </div>
            );
          })}
        </div>
      </Card>
    );
  }

  if (stepKey === "pairing") {
    const px = overallReady === "Low" ? 0 : overallReady === "Medium" ? 1 : overallReady === "High" ? 2 : null;
    const py = overallImpact === "Low" ? 0 : overallImpact === "Medium" ? 1 : overallImpact === "High" ? 2 : null;
    return (
      <Card>
        <Eyebrow>Overall Readiness</Eyebrow>
        <div className="cat-grid">
          {READINESS_CATS.map((c) => {
            const a = catAverage(rr, c.key, c.statements.length);
            const rows = rr[c.key] || [];
            const actionTexts = rows.map((r) => r && r.action).filter((t) => t && t.trim());
            const tone = a !== null ? READY_TONE[readinessLevel(a)] : "neutral";
            return (
              <div key={c.key} className="cat-tile">
                <div className="cat-title">{c.title}</div>
                <div className={"cat-score t-" + tone}>{a !== null ? a.toFixed(1) : "—"}</div>
                {actionTexts.length > 0 && (
                  <ul>{actionTexts.map((t, i) => <li key={i}>{t}</li>)}</ul>
                )}
              </div>
            );
          })}
        </div>

        <div className="badge-row">
          <Badge label="Overall readiness" value={readyAvg !== null ? `${readyAvg.toFixed(1)} · ${overallReady}` : "Not yet scored"} tone={overallReady ? READY_TONE[overallReady] : "neutral"} />
          <Badge label="Overall impact" value={overallImpact || "Not yet rated"} tone={overallImpact ? IMPACT_TONE[overallImpact] : "neutral"} />
        </div>

        <Eyebrow>Impact × Readiness</Eyebrow>
        <div className="pairing">
          <div className="matrix">
            <div className="matrix-grid">
              {Array.from({ length: 9 }).map((_, i) => {
                const col = i % 3, row = Math.floor(i / 3);
                const highlight = px !== null && py !== null && col === px && row === 2 - py;
                return <div key={i} className={"matrix-cell" + (highlight ? " hl" : "")} />;
              })}
            </div>
            {px !== null && py !== null && (
              <div className="matrix-dot" style={{ left: `${((px * 2 + 1) / 6) * 100}%`, top: `${(((2 - py) * 2 + 1) / 6) * 100}%` }} />
            )}
            <div className="axis y">IMPACT →</div>
            <div className="axis x">READINESS →</div>
          </div>
          <div className="pairing-text">
            <h3>{overallImpact && overallReady ? `${overallImpact} impact, ${overallReady.toLowerCase()} readiness` : "Complete both assessments to see the full picture"}</h3>
            <p>
              {overallImpact === "High" && overallReady === "Low" && "Largest gap on the board — the Change Management Plan will prioritize stakeholder engagement, leadership visibility, and resistance planning."}
              {overallImpact === "High" && overallReady !== "Low" && "Significant change with a reasonable foundation — the plan will focus on sustaining momentum and reinforcing new behaviors."}
              {overallImpact !== "High" && overallReady === "Low" && "Modest change, but low readiness signals a communication or awareness gap worth closing early."}
              {overallImpact !== "High" && overallReady !== "Low" && overallImpact !== null && overallReady !== null && "Favorable position — lighter-touch engagement should be enough to sustain adoption."}
              {(!overallImpact || !overallReady) && "This quadrant fills in automatically from your Impact Level and Readiness scores."}
            </p>
          </div>
        </div>
      </Card>
    );
  }

  return null;
}

function ActionsRepeater({ sectionKey, data, update, groups }) {
  const all = data.plan.actions;
  const items = all.filter((a) => a.section === sectionKey);
  const owners = [
    data.setup.sponsor.name, data.setup.accountable.name, data.setup.cmLead.name, data.setup.projectLead.name,
    ...data.setup.team.map((t) => t.name),
  ].filter(Boolean);
  const groupNames = groups.map((g) => g.name).filter(Boolean);

  const add = () => update("plan", { actions: [...all, { id: uid(), section: sectionKey, action: "", group: [], owner: "", dueDate: "", measure: "", status: "Not Started", trend: "Not Yet Determined", issues: "", comments: "" }] });
  const remove = (id) => update("plan", { actions: all.filter((a) => a.id !== id) });
  const set = (id, key, val) => update("plan", { actions: all.map((a) => (a.id === id ? { ...a, [key]: val } : a)) });

  return (
    <div style={{ borderTop: "1px solid var(--line)", paddingTop: 24, marginTop: 6 }}>
      <Eyebrow>Actions</Eyebrow>
      <p className="card-help">
        Turn the answers above into specific actions — who owns each one, when it's due, and what success looks like. Status, issues, and comments are tracked separately in the Action Plan section.
      </p>
      {items.length === 0 && <p className="italic-empty">No actions added yet. These roll up automatically into the Action Plan and the Monitoring Dashboard.</p>}
      {items.length > 0 && (
        <div className="stack-lg">
          {items.map((row) => (
            <div key={row.id} className="entry">
              <div style={{ marginBottom: 16 }}>
                <div className="mini-label">Action</div>
                <AutoTextarea value={row.action} onChange={(e) => set(row.id, "action", e.target.value)} minHeight={56} />
              </div>
              <div style={{ marginBottom: 16 }}>
                <div className="mini-label">Stakeholder Group(s)</div>
                <MultiSelect value={row.group} onChange={(v) => set(row.id, "group", v)} options={groupNames} placeholder="Add stakeholder groups on the Stakeholders step first" />
              </div>
              <div className="row2" style={{ marginBottom: 16 }}>
                <div>
                  <div className="mini-label">Owner</div>
                  <Select value={row.owner} onChange={(v) => set(row.id, "owner", v)} options={owners} ariaLabel="Owner" />
                </div>
                <div>
                  <div className="mini-label">Due Date</div>
                  <input type="date" aria-label="Due Date" value={row.dueDate} onChange={(e) => set(row.id, "dueDate", e.target.value)} />
                </div>
              </div>
              <div className="measure-row">
                <div>
                  <div className="mini-label">Success Measure</div>
                  <input type="text" aria-label="Success Measure" value={row.measure} onChange={(e) => set(row.id, "measure", e.target.value)} />
                </div>
                <DeleteButton onDelete={() => remove(row.id)} />

            </div>
          ))}
        </div>
      )}
      <GhostBtn onClick={add}><Plus size={15} /> Add action</GhostBtn>
    </div>
  );
}

function GapBanner({ section, data }) {
  const rr = data.readiness.ratings;
  if (section.key === "stakeholder") return null;
  const gaps = section.related.map((key) => {
    const cat = READINESS_CATS.find((c) => c.key === key);
    const avg = catAverage(rr, key, cat.statements.length);
    return { title: cat.title, avg };
  }).filter((g) => g.avg !== null && g.avg < 3.5);

  if (section.related.length === 0) return null;
  if (gaps.length > 0) {
    return (
      <div className="note warning">
        <AlertTriangle size={16} />
        <p><strong>Priority — </strong>flagged from Readiness: {gaps.map((g) => `${g.title} scored ${g.avg.toFixed(1)}/5`).join("; ")}.</p>
      </div>
    );
  }
  const scored = section.related.every((key) => {
    const cat = READINESS_CATS.find((c) => c.key === key);
    return catAverage(rr, key, cat.statements.length) !== null;
  });
  if (scored) {
    return (
      <div className="note info">
        <CheckCircle2 size={16} />
        <p><strong>Light touch — </strong>related readiness scores are healthy. Keep this section brief.</p>
      </div>
    );
  }
  return null;
}

function isOverdue(a) {
  if (!a.dueDate || a.status === "Complete") return false;
  const today = new Date().toISOString().slice(0, 10);
  return a.dueDate < today;
}

function computeOverallStatus(actions) {
  if (actions.length === 0) return "Not Started";
  if (actions.every((a) => a.status === "Complete")) return "Complete";
  const severity = { Blocked: 5, "Off Track": 4, "At Risk": 3, "Not Started": 2, "On Track": 1, Complete: 0 };
  let worst = null;
  actions.forEach((a) => {
    if (a.status === "Complete") return;
    if (worst === null || severity[a.status] > severity[worst]) worst = a.status;
  });
  return worst || "Complete";
}

function computeOverallTrend(actions) {
  const counts = {};
  actions.forEach((a) => { const t = a.trend || "Not Yet Determined"; counts[t] = (counts[t] || 0) + 1; });
  if (Object.keys(counts).length === 0) return "Not Yet Determined";
  const priority = ["Declining", "Stable", "Improving", "Not Yet Determined"];
  let best = null, bestCount = -1;
  priority.forEach((t) => {
    const c = counts[t] || 0;
    if (c > bestCount) { bestCount = c; best = t; }
  });
  return best;
}

function leadershipSupportFor(status) {
  if (status === "Blocked") return "Immediate senior leadership intervention to remove the blocker";
  if (status === "Off Track") return "Senior leadership visibility and additional resourcing";
  if (status === "At Risk") return "Manager check-in and closer monitoring";
  return "Standard monitoring";
}

function MonitoringDashboardScreen({ data, overallReady }) {
  const actions = data.plan.actions.filter((a) => a.action);
  const complete = actions.filter((a) => a.status === "Complete").length;
  const pctComplete = actions.length > 0 ? Math.round((complete / actions.length) * 100) : 0;
  const overallStatus = computeOverallStatus(actions);
  const overallTrend = computeOverallTrend(actions);
  const attention = actions.filter((a) => ["At Risk", "Off Track", "Blocked"].includes(a.status));

  if (actions.length === 0) {
    return (
      <Card>
        <Eyebrow>Monitoring Dashboard</Eyebrow>
        <p className="italic-empty" style={{ margin: 0 }}>Add actions in the Change Management Plan first — this dashboard fills in automatically once you do.</p>
      </Card>
    );
  }

  return (
    <>
      <Card>
        <Eyebrow>Executive Overview</Eyebrow>
        <div className="metric-grid">
          <StatTile label="Overall Status" value={overallStatus} tone={STATUS_TONE[overallStatus] || "neutral"} />
          <StatTile label="Overall Trend" value={overallTrend} tone={TREND_TONE[overallTrend] || "neutral"} />
          <StatTile label="Overall Readiness" value={overallReady || "Not yet scored"} tone={overallReady ? READY_TONE[overallReady] : "neutral"} />
          <StatTile label="Actions Completed" value={`${pctComplete}%`} num />
        </div>
      </Card>

      <Card>
        <Eyebrow>Actions Requiring Attention</Eyebrow>
        {attention.length === 0 ? (
          <p className="italic-empty" style={{ margin: 0 }}>No actions currently At Risk, Off Track, or Blocked.</p>
        ) : (
          <div className="table-wrap">
            <table className="table">
              <thead>
                <tr>{["Area", "Current Condition", "Leadership Support Needed"].map((h) => <th key={h}>{h}</th>)}</tr>
              </thead>
              <tbody>
                {attention.map((a) => (
                  <tr key={a.id}>
                    <td style={{ fontWeight: 500 }}>{a.action}</td>
                    <td>
                      <span className={"t-" + STATUS_TONE[a.status]} style={{ fontWeight: 600 }}>{a.status}</span>
                      {a.issues ? ` — ${a.issues}` : ""}
                      {isOverdue(a) ? " (overdue)" : ""}
                    </td>
                    <td>{leadershipSupportFor(a.status)}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </Card>

      <Card>
        <Eyebrow>All Actions</Eyebrow>
        <p className="card-help">This list is read-only. Update status, issues, trend, and comments from the Action Plan section.</p>
        <div className="stack">
          {actions.map((a) => {
            const sec = PLAN_SECTIONS.find((s) => s.key === a.section);
            const overdueRow = isOverdue(a);
            return (
              <div key={a.id} className={"entry dash-item" + (overdueRow ? " overdue" : "")}>
                <div className="dash-top">
                  <div className="dash-title">{a.action}</div>
                  <div className="dash-sec">{sec ? sec.title : a.section}</div>
                </div>
                <div className="dash-meta">
                  {(a.group || []).join(", ") || "No group"} · Owner: {a.owner || "Unassigned"} · Due: {a.dueDate || "—"} · Success: {a.measure || "—"}
                </div>
                <div className="status-badges">
                  <Badge label="Status" value={a.status} tone={STATUS_TONE[a.status] || "neutral"} />
                  <Badge label="Trend" value={a.trend || "Not Yet Determined"} tone={TREND_TONE[a.trend] || "neutral"} />
                  {overdueRow && <Badge label="Due" value="Overdue" tone="high" />}
                </div>
                {a.issues && <div className="dash-note"><strong>Issues:</strong> {a.issues}</div>}
                {a.comments && <div className="dash-note soft"><strong>Comments:</strong> {a.comments}</div>}
              </div>
            );
          })}
        </div>
      </Card>
    </>
  );
}

function StatTile({ label, value, tone = "neutral", num }) {
  return (
    <div className="metric">
      <span className="metric-label">{label}</span>
      <span className={"metric-value" + (num ? " num" : " t-" + tone)} style={tone === "neutral" && !num ? { color: "var(--ink)" } : undefined}>{value}</span>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);

</script>
</body>
</html>
