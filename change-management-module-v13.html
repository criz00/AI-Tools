<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Change Management Module</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.4/babel.min.js"></script>
<style>
/* ===== Talent Workspace UI (talent-ui.css) ===== */
:root{
  --font-sans:Inter, system-ui, -apple-system, sans-serif;
  --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:22px;--space-6:28px;--space-7:32px;--space-8:56px;
  --radius-sm:8px;--radius-md:10px;--radius-lg:12px;--radius-xl:14px;--radius-pill:999px;
  --bg:#F7F8FA;--surface:#FFFFFF;--surface-alt:#F1F3F5;--ink:#111827;--ink-soft:#5B6472;--line:#E5E7EB;--line-strong:#8A9099;
  --accent:#0F766E;--accent-hover:#0B5F58;--on-accent:#FFFFFF;--accent-soft:#E6F4F2;--focus-ring:rgba(15,118,110,0.25);
  --info:#1D4ED8;--info-soft:#EEF3FF;--warning:#B54708;--warning-soft:#FEF3E2;--error:#B42318;--error-soft:#FEECEB;
  --shadow-sm:0 1px 2px rgba(16,24,40,0.05);
  --shadow-card:0 1px 2px rgba(16,24,40,0.04), 0 6px 20px -4px rgba(16,24,40,0.07);
  --shadow-lift:0 2px 4px rgba(16,24,40,0.06), 0 10px 28px -6px rgba(16,24,40,0.12);
  --scrim:rgba(17,24,39,0.5);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1113;--surface:#171B1F;--surface-alt:#1F2429;--ink:#ECEEF0;--ink-soft:#9AA3AD;--line:#2A3036;--line-strong:#6B747E;
    --accent:#3CC4B4;--accent-hover:#62D3C6;--on-accent:#04201C;--accent-soft:rgba(60,196,180,0.13);--focus-ring:rgba(60,196,180,0.3);
    --info:#8AB4F8;--info-soft:rgba(138,180,248,0.13);--warning:#F5B45C;--warning-soft:rgba(245,180,92,0.13);--error:#F28B82;--error-soft:rgba(242,139,130,0.13);
    --shadow-sm:0 1px 2px rgba(0,0,0,0.4);
    --shadow-card:0 1px 2px rgba(0,0,0,0.4), 0 8px 24px -6px rgba(0,0,0,0.5);
    --shadow-lift:0 2px 4px rgba(0,0,0,0.45), 0 12px 30px -6px rgba(0,0,0,0.6);
    --scrim:rgba(0,0,0,0.65);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1113;--surface:#171B1F;--surface-alt:#1F2429;--ink:#ECEEF0;--ink-soft:#9AA3AD;--line:#2A3036;--line-strong:#6B747E;
  --accent:#3CC4B4;--accent-hover:#62D3C6;--on-accent:#04201C;--accent-soft:rgba(60,196,180,0.13);--focus-ring:rgba(60,196,180,0.3);
  --info:#8AB4F8;--info-soft:rgba(138,180,248,0.13);--warning:#F5B45C;--warning-soft:rgba(245,180,92,0.13);--error:#F28B82;--error-soft:rgba(242,139,130,0.13);
  --shadow-sm:0 1px 2px rgba(0,0,0,0.4);
  --shadow-card:0 1px 2px rgba(0,0,0,0.4), 0 8px 24px -6px rgba(0,0,0,0.5);
  --shadow-lift:0 2px 4px rgba(0,0,0,0.45), 0 12px 30px -6px rgba(0,0,0,0.6);
  --scrim:rgba(0,0,0,0.65);
  color-scheme:dark;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
.tw, body.tw{background:var(--bg);color:var(--ink);font-family:var(--font-sans);-webkit-font-smoothing:antialiased;}
.tw h1,.tw h2,.tw h3{font-weight:650;letter-spacing:-.022em;margin:0;}
.eyebrow{display:inline-flex;align-items:center;gap:6px;color:var(--accent);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;margin-bottom:12px;}
.page-desc{color:var(--ink-soft);font-size:15.5px;line-height:1.6;max-width:620px;margin:0 0 36px;}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-xl);padding:var(--space-7);margin-bottom:20px;box-shadow:var(--shadow-card);color:var(--ink);}
.field{margin-bottom:var(--space-5);}
.field label,.field .field-label{display:block;font-size:13px;font-weight:600;color:var(--ink);margin-bottom:var(--space-2);line-height:1.45;}
.hint{font-size:12.5px;color:var(--ink-soft);margin-top:6px;line-height:1.45;}
.tw input[type=text], .tw input:not([type]), .tw input[type=number], .tw input[type=date], .tw select, .tw textarea{
  width:100%;min-height:44px;font:400 14.5px var(--font-sans);color:var(--ink);
  background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--radius-md);
  padding:11px 14px;outline:none;transition:border-color .15s, box-shadow .15s;}
.tw input:hover, .tw select:hover, .tw textarea:hover{border-color:var(--ink-soft);}
.tw input:focus, .tw select:focus, .tw textarea:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--focus-ring);}
.tw ::placeholder{color:var(--ink-soft);opacity:1;}
.tw textarea{resize:vertical;min-height:96px;line-height:1.55;}
.tw select{appearance:none;cursor:pointer;padding-right:40px;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' stroke='%238A9099' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>");
  background-repeat:no-repeat;background-position:right 15px center;}
.tw input[type=date]{font-variant-numeric:tabular-nums;}
.btn{font:600 14px var(--font-sans);border-radius:var(--radius-md);padding:11px 20px;min-height:44px;
  border:1px solid transparent;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  transition:background .15s, box-shadow .15s, transform .15s, border-color .15s, color .15s;}
.btn-primary{background:var(--accent);color:var(--on-accent);box-shadow:var(--shadow-sm);}
.btn-primary:hover:not(:disabled){background:var(--accent-hover);transform:translateY(-1px);box-shadow:var(--shadow-lift);}
.btn-primary:active:not(:disabled){transform:none;}
.btn-secondary{background:var(--surface);color:var(--ink);border-color:var(--line-strong);box-shadow:var(--shadow-sm);}
.btn-secondary:hover:not(:disabled){background:var(--surface-alt);}
.btn-text{background:transparent;color:var(--ink-soft);border:none;padding:8px 10px;}
.btn-text:hover{color:var(--ink);background:var(--surface-alt);}
.btn-danger{background:var(--error);color:var(--surface);box-shadow:var(--shadow-sm);}
.btn-danger:hover{filter:brightness(.95);}
.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none;}
.tw button:focus-visible{outline:none;box-shadow:0 0 0 4px var(--focus-ring);}
.entry{border:1px solid var(--line);background:var(--surface);border-radius:var(--radius-lg);padding:18px 20px;box-shadow:var(--shadow-sm);transition:box-shadow .2s;color:var(--ink);}
.entry:hover{box-shadow:var(--shadow-card);}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px 3px 8px;border-radius:var(--radius-pill);background:var(--surface-alt);color:var(--ink-soft);white-space:nowrap;}
.badge::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;flex-shrink:0;}
.badge.high{background:var(--error-soft);color:var(--error);}
.badge.medium{background:var(--warning-soft);color:var(--warning);}
.badge.low, .badge.neutral{background:var(--surface-alt);color:var(--ink-soft);}
.badge.info{background:var(--info-soft);color:var(--info);}
.progress{padding:14px;border-radius:var(--radius-lg);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-sm);}
.progress-top{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:9px;}
.progress-top span:first-child{color:var(--ink-soft);font-weight:500;}
.progress-top span:last-child{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums;}
.progress-track{height:6px;border-radius:var(--radius-pill);background:var(--surface-alt);overflow:hidden;}
.progress-fill{height:100%;border-radius:var(--radius-pill);background:var(--accent);transition:width .5s cubic-bezier(.2,.8,.2,1);}
.steps{list-style:none;margin:0;padding:0;}
.step{display:flex;gap:4px;align-items:center;padding:0;border-radius:var(--radius-md);margin-bottom:2px;transition:background .15s, box-shadow .15s;}
.step.clickable{cursor:pointer;}
.step.clickable:hover{background:var(--surface-alt);}
.step-num{width:24px;height:24px;border-radius:50%;flex-shrink:0;border:1.5px solid var(--line-strong);color:var(--ink-soft);font-size:11.5px;font-weight:600;display:flex;align-items:center;justify-content:center;}
.step-label{font-size:13.5px;color:var(--ink-soft);line-height:1.35;}
.step.active, .step.active.clickable:hover{background:var(--surface);box-shadow:var(--shadow-sm), inset 0 0 0 1px var(--line);}
.step.active .step-num{background:var(--accent);border-color:var(--accent);color:var(--on-accent);}
.step.active .step-label{color:var(--ink);font-weight:600;}
.step.done .step-num{background:var(--accent-soft);border-color:transparent;color:var(--accent);}
.step.done .step-label{color:var(--ink);}
.step.active.done .step-num{background:var(--accent);color:var(--on-accent);}
.mobile-toggle{display:flex;align-items:center;gap:12px;flex:1;min-width:0;background:none;border:none;border-radius:var(--radius-md);padding:6px 8px 10px;text-align:left;cursor:pointer;color:var(--ink);font-family:var(--font-sans);}
.mb-text{flex:1;min-width:0;display:flex;flex-direction:column;}
.mb-step{font-size:11.5px;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:.06em;}
.mb-label{font-size:15px;font-weight:600;letter-spacing:-.01em;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mb-chev{width:34px;height:34px;border-radius:var(--radius-md);flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--surface-alt);color:var(--ink-soft);}
.mb-chev svg{transition:transform .2s;}
.mobile-toggle[aria-expanded="true"] .mb-chev svg{transform:rotate(180deg);}
.mb-progress{height:3px;background:var(--surface-alt);}
.mb-fill{height:100%;background:var(--accent);transition:width .5s cubic-bezier(.2,.8,.2,1);}

/* ===== Tool layout: 280px sticky sidebar + main column up to 940px ===== */
.shell{display:grid;grid-template-columns:280px minmax(0,940px);gap:48px;max-width:1280px;margin:0 auto;padding-inline:32px;}
.sidebar{position:sticky;top:0;align-self:start;max-height:100vh;overflow-y:auto;padding-block:32px;display:flex;flex-direction:column;gap:20px;}
.main{padding-top:var(--space-8);min-width:0;}
.brand{display:flex;align-items:center;gap:10px;padding:0 4px 0 10px;}
.brand-tile{width:32px;height:32px;border-radius:var(--radius-md);background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.brand-name{flex:1;min-width:0;font-size:14px;font-weight:650;letter-spacing:-.01em;line-height:1.3;}
.icon-btn{width:34px;height:34px;border-radius:var(--radius-md);border:none;background:transparent;color:var(--ink-soft);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .15s,color .15s,border-color .15s;font-family:var(--font-sans);}
.icon-btn:hover{background:var(--surface-alt);color:var(--ink);}
.icon-btn.bordered{border:1px solid var(--line-strong);background:var(--surface);}
.icon-btn.danger:hover{color:var(--error);background:var(--error-soft);border-color:var(--error);}

/* Sidebar stepper */
.step-main{display:flex;align-items:center;gap:12px;flex:1;min-width:0;background:none;border:none;padding:9px 10px;border-radius:var(--radius-md);cursor:pointer;text-align:left;font-family:var(--font-sans);}
.req-toggle{width:30px;height:30px;margin-right:4px;border:none;background:transparent;border-radius:var(--radius-sm);color:var(--ink-soft);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.req-toggle:hover{background:var(--surface-alt);color:var(--ink);}
.req-toggle svg{transition:transform .2s;}
.req-toggle[aria-expanded="true"] svg{transform:rotate(180deg);}
.req-panel{margin:4px 0 10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:12px 12px 10px;box-shadow:var(--shadow-sm);}
.req-title{font-size:12.5px;font-weight:600;color:var(--ink);margin:0 4px 6px;line-height:1.4;}
.req-item{display:flex;gap:8px;align-items:flex-start;width:100%;font:400 13px/1.45 var(--font-sans);color:var(--ink);background:transparent;border:none;padding:6px;border-radius:var(--radius-sm);cursor:pointer;text-align:left;}
.req-item:hover:not(:disabled){background:var(--surface-alt);}
.req-item:disabled{cursor:default;color:var(--ink-soft);}
.req-item:disabled span:last-child{text-decoration:line-through;}
.req-mark{width:16px;height:16px;border-radius:50%;flex-shrink:0;margin-top:1px;border:1.5px solid var(--line-strong);display:flex;align-items:center;justify-content:center;}
.req-mark.done{background:var(--accent-soft);border-color:transparent;color:var(--accent);}
.legend{display:flex;flex-wrap:wrap;gap:6px 10px;padding:0 10px;}
.legend-title{width:100%;font-size:12px;font-weight:600;color:var(--ink-soft);}
.legend-item{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-soft);}
.legend-dot{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--line-strong);flex-shrink:0;}
.legend-dot.active{background:var(--accent);border-color:var(--accent);}
.legend-dot.done{background:var(--accent-soft);border-color:var(--accent);}
.status-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-xl);box-shadow:var(--shadow-card);padding:16px;display:flex;flex-direction:column;gap:14px;}
.status-badges{display:flex;flex-wrap:wrap;gap:6px;}
.status-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
.status-actions{display:flex;flex-direction:column;gap:2px;border-top:1px solid var(--line);padding-top:10px;margin:0 -6px;}
.status-actions .btn{justify-content:flex-start;min-height:38px;font-weight:500;font-size:13.5px;width:100%;}
.badge-label{font-weight:500;}
.badge-value{color:var(--ink);}
.save-ind{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-soft);min-height:18px;}
.save-dot{width:6px;height:6px;border-radius:50%;background:var(--warning);}
.save-ind svg{color:var(--accent);}

/* Segmented controls */
.seg{display:flex;gap:8px;flex-wrap:wrap;}
.seg-btn{min-height:40px;padding:8px 18px;border-radius:var(--radius-pill);border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);font:500 13.5px var(--font-sans);cursor:pointer;transition:background .15s,border-color .15s,color .15s;}
.seg-btn:hover{background:var(--surface-alt);}
.seg-btn.selected{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600;}
.seg-btn.selected.na{background:var(--surface-alt);border-color:var(--ink-soft);color:var(--ink);}
.mode-toggle{display:inline-flex;border:1px solid var(--line-strong);border-radius:var(--radius-pill);padding:2px;gap:2px;background:var(--surface);}
.mode-toggle button{border:none;background:transparent;color:var(--ink-soft);font:500 12.5px var(--font-sans);padding:6px 14px;border-radius:var(--radius-pill);cursor:pointer;text-transform:capitalize;}
.mode-toggle button:hover{color:var(--ink);}
.mode-toggle button.selected{background:var(--accent);color:var(--on-accent);font-weight:600;}

/* Main column */
.title-input{display:block;width:100%;font:650 32px/1.2 var(--font-sans) !important;letter-spacing:-.022em;color:var(--ink);background:transparent !important;border:none !important;border-radius:var(--radius-sm) !important;padding:2px 0 !important;margin:0 0 20px;min-height:0 !important;box-shadow:none;}
.title-input:hover{background:transparent;}
.title-input:focus{box-shadow:0 4px 0 -2px var(--accent) !important;}
.note{display:flex;gap:10px;align-items:flex-start;background:var(--surface-alt);border-radius:var(--radius-md);padding:13px 16px;margin-bottom:20px;font-size:14px;line-height:1.55;color:var(--ink);}
.note p{margin:0;}
.note > svg{flex-shrink:0;margin-top:3px;color:var(--accent);}
.note.warning{background:var(--warning-soft);}
.note.warning > svg{color:var(--warning);}
.note.info{background:var(--info-soft);}
.note.info > svg{color:var(--info);}
.note.small{font-size:13px;}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px;}
.pill{min-height:36px;padding:7px 14px;border-radius:var(--radius-pill);border:1px solid var(--line-strong);background:var(--surface);color:var(--ink-soft);font:500 13px var(--font-sans);cursor:pointer;transition:background .15s,color .15s,border-color .15s;white-space:nowrap;}
.pill:hover{background:var(--surface-alt);color:var(--ink);}
.pill.done{background:var(--accent-soft);border-color:transparent;color:var(--accent);}
.pill.active{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600;}
.screen{animation:fadeUp .32s ease-out both;}
@keyframes fadeUp{from{opacity:.001;transform:translateY(6px);}to{opacity:1;transform:none;}}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;}
.card-help{color:var(--ink-soft);font-size:14.5px;line-height:1.6;margin:-2px 0 22px;max-width:640px;}
.req-legend{font-size:12.5px;color:var(--ink-soft);margin:-4px 0 22px;}
.req{color:var(--error);}
.mini-label{font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;line-height:1.4;}
.mini-desc{font-size:12.5px;color:var(--ink-soft);margin:-2px 0 8px;line-height:1.45;}
.italic-empty{font-size:14px;color:var(--ink-soft);margin:0 0 14px;}
.stack{display:flex;flex-direction:column;gap:14px;}
.stack-lg{display:flex;flex-direction:column;gap:16px;margin-bottom:16px;}
.btn-sm{min-height:38px;padding:8px 14px;font-size:13.5px;}
.spacer-8{height:8px;}.spacer-16{height:16px;}.spacer-24{height:24px;}

/* Repeater */
.rep-row{display:flex;gap:14px;align-items:flex-start;}
.rep-fields{display:grid;grid-template-columns:1fr 1fr;gap:16px 18px;flex:1;min-width:0;}
.rep-fields .wide{grid-column:1 / -1;}
.del-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;min-width:36px;padding:0;border-radius:var(--radius-md);border:1px solid var(--line-strong);background:var(--surface);color:var(--ink-soft);cursor:pointer;flex-shrink:0;font:600 12.5px var(--font-sans);white-space:nowrap;transition:background .15s,color .15s,border-color .15s;}
.del-btn:hover{color:var(--error);border-color:var(--error);background:var(--error-soft);}
.del-btn.confirming{padding:0 12px;background:var(--error);border-color:var(--error);color:var(--surface);}

/* Start / stop / continue */
.sscols{display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px;margin-bottom:24px;}
.line-list{display:flex;flex-direction:column;gap:8px;margin-bottom:10px;}
.line-row{display:flex;gap:6px;align-items:center;}

/* Chips & checklist */
.chips{display:flex;flex-wrap:wrap;gap:6px;}
.chip{min-height:34px;padding:6px 12px;border-radius:var(--radius-pill);border:1px solid var(--line-strong);background:var(--surface);color:var(--ink-soft);font:500 13px var(--font-sans);cursor:pointer;}
.chip:hover{background:var(--surface-alt);color:var(--ink);}
.chip.selected{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600;}
.check-list{display:flex;flex-direction:column;gap:10px;}
.check-item{display:flex;align-items:center;gap:12px;text-align:left;min-height:48px;padding:12px 16px;border-radius:var(--radius-lg);border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);font:400 14px/1.45 var(--font-sans);cursor:pointer;box-shadow:var(--shadow-sm);transition:border-color .15s,background .15s;}
.check-item:hover{border-color:var(--accent);}
.check-item.selected{border-color:var(--accent);background:var(--accent-soft);}
.check-box{width:20px;height:20px;border-radius:6px;flex-shrink:0;border:1.5px solid var(--line-strong);display:flex;align-items:center;justify-content:center;color:var(--on-accent);}
.check-item.selected .check-box{background:var(--accent);border-color:var(--accent);}

/* Impact level */
.dims{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px;}
.group-name{font-weight:600;font-size:15px;letter-spacing:-.01em;}
.group-effect{font-size:13px;color:var(--ink-soft);line-height:1.5;margin:4px 0 14px;max-width:640px;}

/* Summary blocks */
.sum-block{padding:14px 0;border-bottom:1px solid var(--line);}
.sum-block:first-of-type{padding-top:0;}
.sum-block:last-child{border-bottom:none;padding-bottom:0;}
.sum-label{font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:4px;}
.sum-text{font-size:14.5px;color:var(--ink);white-space:pre-line;line-height:1.55;}

/* Readiness */
.stmt{font-size:14.5px;color:var(--ink);margin-bottom:12px;line-height:1.5;}
.scores{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
.score-btn{width:40px;height:40px;border-radius:var(--radius-md);border:1px solid var(--line-strong);background:var(--surface);color:var(--ink-soft);font:600 14px var(--font-sans);cursor:pointer;font-variant-numeric:tabular-nums;transition:background .15s,border-color .15s,color .15s;}
.score-btn:hover{background:var(--surface-alt);color:var(--ink);}
.score-btn.selected{background:var(--accent);border-color:var(--accent);color:var(--on-accent);}
.score-label{font-size:13px;color:var(--ink-soft);margin-left:6px;}
.cat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:24px;}
.cat-tile{background:var(--surface-alt);border-radius:var(--radius-lg);padding:14px 16px;}
.cat-title{font-size:13px;font-weight:600;color:var(--ink);margin-bottom:2px;}
.cat-score{font-size:22px;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums;}
.cat-tile ul{margin:8px 0 0;padding-left:16px;display:flex;flex-direction:column;gap:3px;}
.cat-tile li{font-size:12.5px;color:var(--ink-soft);line-height:1.45;}
.t-high{color:var(--error);}.t-medium{color:var(--warning);}.t-info{color:var(--info);}.t-neutral,.t-low{color:var(--ink-soft);}
.badge-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:28px;}
.pairing{display:flex;gap:40px;align-items:flex-start;flex-wrap:wrap;margin-top:6px;padding-left:24px;}
.matrix{position:relative;width:240px;height:240px;flex-shrink:0;margin-bottom:26px;}
.matrix-grid{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:3px;}
.matrix-cell{background:var(--surface-alt);border-radius:6px;}
.matrix-cell.hl{background:var(--accent-soft);box-shadow:inset 0 0 0 1.5px var(--accent);}
.matrix-dot{position:absolute;width:16px;height:16px;border-radius:50%;background:var(--accent);border:2px solid var(--surface);box-shadow:0 0 0 2px var(--accent);transform:translate(-50%,-50%);}
.axis{position:absolute;font-size:11px;font-weight:600;color:var(--ink-soft);letter-spacing:.06em;white-space:nowrap;}
.axis.y{left:-10px;top:50%;transform:translate(-100%,-50%) rotate(-90deg);transform-origin:center;}
.axis.x{bottom:-24px;left:50%;transform:translateX(-50%);}
.pairing-text{flex:1;min-width:240px;padding-top:4px;}
.pairing-text h3{font-size:16px;margin-bottom:6px !important;}
.pairing-text p{font-size:14px;color:var(--ink-soft);line-height:1.6;margin:0;}

/* Plan & actions */
.context-strip{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.measure-row{display:flex;gap:10px;align-items:flex-end;}
.measure-row > div{flex:1;min-width:0;}
.action-title{font-size:15.5px;font-weight:600;letter-spacing:-.01em;line-height:1.4;}
.read-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin:14px 0 18px;}
.read-field{background:var(--surface-alt);border-radius:var(--radius-md);padding:10px 12px;}
.read-field .rf-label{font-size:11.5px;color:var(--ink-soft);font-weight:600;margin-bottom:3px;}
.read-field .rf-value{font-size:14px;color:var(--ink);}
.status-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:16px;}

/* Dashboard */
.metric-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;}
.metric{background:var(--surface-alt);border-radius:var(--radius-lg);padding:16px 18px;display:flex;flex-direction:column;gap:4px;}
.metric-label{font-size:12.5px;font-weight:600;color:var(--ink-soft);}
.metric-value{font-size:20px;font-weight:650;letter-spacing:-.015em;line-height:1.25;}
.metric-value.num{font-size:28px;font-variant-numeric:tabular-nums;}
.table-wrap{overflow-x:auto;margin:0 -4px;}
.table{width:100%;border-collapse:collapse;font-size:13.5px;}
.table th{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line-strong);font-size:12.5px;font-weight:600;color:var(--ink-soft);}
.table td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.5;}
.table tr:last-child td{border-bottom:none;}
.dash-item.overdue{border-color:var(--error);background:var(--error-soft);}
.dash-top{display:flex;justify-content:space-between;gap:10px;margin-bottom:6px;}
.dash-title{font-size:14.5px;font-weight:600;}
.dash-sec{font-size:12.5px;color:var(--ink-soft);white-space:nowrap;}
.dash-meta{font-size:13px;color:var(--ink-soft);margin-bottom:10px;line-height:1.5;}
.dash-note{font-size:13px;margin-top:8px;line-height:1.5;}
.dash-note.soft{color:var(--ink-soft);margin-top:4px;}

/* Sticky nav */
.nav-bar{position:sticky;bottom:0;z-index:5;margin-top:12px;padding:14px 0 18px;background:linear-gradient(to bottom, transparent, var(--bg) 18px);}
.nav-inner{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-xl);box-shadow:var(--shadow-card);padding:10px;}
.caught-up{display:flex;align-items:center;gap:8px;color:var(--accent);font-weight:600;font-size:14px;padding-right:10px;}

/* Overlays */
.overlay{position:fixed;inset:0;background:var(--scrim);overflow-y:auto;z-index:100;}
.overlay-inner{min-height:100%;display:flex;align-items:center;justify-content:center;padding:20px;}
.modal{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:var(--radius-xl);box-shadow:var(--shadow-lift);padding:36px 40px;max-width:580px;width:100%;}
.modal.small{max-width:400px;padding:26px 28px;}
.modal.wide{max-width:780px;width:90vw;}
.modal h1{font-size:26px;line-height:1.2;margin:0 0 12px !important;}
.modal-desc{font-size:15px;color:var(--ink-soft);line-height:1.6;margin:0 0 22px;}
.phase-list{display:flex;flex-direction:column;gap:12px;margin-bottom:22px;}
.phase-row{display:flex;gap:12px;align-items:flex-start;}
.phase-ic{width:30px;height:30px;border-radius:var(--radius-sm);background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.phase-name{font-size:14px;font-weight:600;}
.phase-desc{font-size:13px;color:var(--ink-soft);line-height:1.45;}
.mode-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.mode-card{text-align:left;padding:16px;border-radius:var(--radius-lg);border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);font-family:var(--font-sans);cursor:pointer;box-shadow:var(--shadow-sm);transition:border-color .15s,background .15s;}
.mode-card:hover{border-color:var(--accent);}
.mode-card.selected{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent);}
.mode-card .mc-title{font-size:14px;font-weight:600;margin-bottom:4px;}
.mode-card .mc-desc{font-size:12.5px;color:var(--ink-soft);line-height:1.45;}
.confirm-body{display:flex;gap:12px;align-items:flex-start;margin-bottom:22px;font-size:15px;line-height:1.5;}
.confirm-body svg{color:var(--warning);flex-shrink:0;margin-top:2px;}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;}
.sum-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:26px;flex-wrap:wrap;}
.sum-head h1{margin:0 !important;}
.sum-section{margin-bottom:28px;break-inside:avoid;}
.sum-section-title{font-size:17px;font-weight:650;letter-spacing:-.01em;padding-bottom:10px;margin-bottom:14px;border-bottom:1px solid var(--line);}
.sum-row{margin-bottom:12px;}
.sum-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:4px 16px;}
.print-only{display:none;}

/* Mobile header */
.mobile-header{display:none;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:var(--shadow-sm);}
.mh-row{display:flex;align-items:center;gap:4px;padding:8px 10px 0;}
.mh-row .icon-btn{margin-bottom:4px;}
.mb-menu{padding:8px 12px 14px;border-top:1px solid var(--line);max-height:calc(100vh - 80px);overflow-y:auto;display:flex;flex-direction:column;gap:14px;}

@media (max-width:800px){
  .shell{grid-template-columns:1fr;padding-inline:16px;gap:0;}
  .sidebar{display:none;}
  .mobile-header{display:block;}
  .main{padding-top:24px;}
  .title-input{font-size:24px !important;margin-bottom:16px;}
  .card{padding:22px 18px;}
  .tw input, .tw select, .tw textarea{font-size:16px;min-height:48px;}
  .btn{min-height:48px;}
  .row2,.rep-fields,.sscols,.mode-cards{grid-template-columns:1fr;}
  .pills{flex-wrap:nowrap;overflow-x:auto;margin-inline:-16px;padding-inline:16px;padding-bottom:4px;scrollbar-width:none;}
  .pills::-webkit-scrollbar{display:none;}
  .pill{flex-shrink:0;}
  .rep-row{flex-direction:column-reverse;}
  .rep-row .del-btn{align-self:flex-end;}
  .entry{padding:16px;}
  .modal{padding:24px 20px;}
  .modal.wide{width:100%;}
  .nav-inner .btn{flex:1 1 auto;}
  .pairing{gap:28px;}
}
@media (prefers-reduced-motion:reduce){
  .tw *, .tw *::before, .tw *::after{animation:none !important;transition:none !important;}
}
@media print{
  :root, :root[data-theme="dark"]{--bg:#FFFFFF;--surface:#FFFFFF;--surface-alt:#F1F3F5;--ink:#111827;--ink-soft:#5B6472;--line:#E5E7EB;--line-strong:#8A9099;--accent:#0F766E;--info:#1D4ED8;--warning:#B54708;--error:#B42318;}

  #cm-print-area{position:absolute;top:0;left:0;width:100%;}
  .cm-no-print{display:none !important;}
  .print-only{display:block !important;}
  .overlay{background:none;position:static;}
  .modal{box-shadow:none;border:none;}
}

function isDark() {
  const t = document.documentElement.getAttribute("data-theme");
  if (t) return t === "dark";
  return !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
}

/* ---------------------------------------------------------------- */
/* small primitives                                                  */
/* ---------------------------------------------------------------- */

function Eyebrow({ children }) {
  return <div className="eyebrow">{children}</div>;
}

/* Textarea that grows automatically as the person types, instead of relying
   on a manual drag-handle nobody notices. Still keeps resize:vertical as a
   fallback in case someone wants to shrink it back down. */
function AutoTextarea({ value, onChange, placeholder, minHeight = 76, id }) {
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    el.style.height = "auto";
    el.style.height = Math.max(el.scrollHeight + 2, minHeight) + "px";
  }, [value, minHeight]);
  return (
    <textarea
      id={id}
      ref={ref}
      value={value || ""}
      onChange={onChange}
      placeholder={placeholder || ""}
      style={{ overflow: "hidden", minHeight }}
    />
  );
}

function Field({ label, value, onChange, placeholder, area, type = "text", help, required }) {
  const id = useId();
  return (
    <div className="field">
      {label && <label htmlFor={id}>{label}{required && <span className="req"> *</span>}</label>}
      {help && <div className="hint" style={{ marginTop: -2, marginBottom: 8 }}>{help}</div>}
      {area
        ? <AutoTextarea id={id} value={value} onChange={(e) => onChange(e.target.value)} placeholder={placeholder} minHeight={96} />
        : <input id={id} type={type} value={value || ""} onChange={(e) => onChange(e.target.value)} placeholder={placeholder || ""} />}
    </div>
  );
}

function TriToggle({ value, onChange, labelId }) {
  return (
    <div className="seg" role="group" aria-labelledby={labelId}>
      {["Yes", "No", "N/A"].map((opt) => {
        const optVal = opt === "Yes" ? true : opt === "No" ? false : "na";
        const active = value === optVal;
        return (
          <button
            key={opt}
            type="button"
            aria-pressed={active}
            onClick={() => onChange(optVal)}
            className={"seg-btn" + (active ? (opt === "N/A" ? " selected na" : " selected") : "")}
          >
            {opt}
          </button>
        );
      })}
    </div>
  );
}

function YesNo({ label, value, onChange, detailLabel = "Tell us more", area = true }) {
  const v = value || { yes: null, detail: "" };
  const id = useId();
  return (
    <div className="field">
      <div className="field-label" id={id}>{label}</div>
      <TriToggle value={v.yes} onChange={(yes) => onChange({ ...v, yes })} labelId={id} />
      {v.yes === true && (
        <div style={{ marginTop: 10 }}>
          {area ? (
            <AutoTextarea value={v.detail} onChange={(e) => onChange({ ...v, detail: e.target.value })} placeholder={detailLabel} minHeight={80} />
          ) : (
            <input type="text" value={v.detail} onChange={(e) => onChange({ ...v, detail: e.target.value })} placeholder={detailLabel} />
          )}
        </div>
      )}
    </div>
  );
}

/* Yes/No toggle only — used when the "yes" branch reveals a custom widget
   (like a repeater) elsewhere on the screen, so no free-text detail field
   is needed here. */
function YesNoSimple({ label, value, onChange }) {
  const id = useId();
  return (
    <div className="field">
      <div className="field-label" id={id}>{label}</div>
      <TriToggle value={value} onChange={onChange} labelId={id} />
    </div>
  );
}

/* Add-a-line list, used for Start / Stop / Continue */
function LineList({ label, items, onChange, placeholder }) {
  const add = () => onChange([...items, { id: uid(), text: "" }]);
  const remove = (id) => onChange(items.length > 1 ? items.filter((i) => i.id !== id) : items);
  const set = (id, text) => {
    if (items.some((i) => i.id === id)) {
      onChange(items.map((i) => (i.id === id ? { ...i, text } : i)));
    } else {
      onChange([...items, { id, text }]);
    }
  };
  const list = items.length ? items : [{ id: uid(), text: "" }];

  return (
    <div>
      <div className="mini-label">{label}</div>
      <div className="line-list">
        {list.map((item) => (
          <div key={item.id} className="line-row">
            <input
              type="text"
              aria-label={label}
              value={item.text}
              onChange={(e) => set(item.id, e.target.value)}
              placeholder={placeholder}
            />
            {list.length > 1 && (
              <IconBtn onClick={() => remove(item.id)} danger label="Remove"><Trash2 size={15} /></IconBtn>
            )}
          </div>
        ))}
      </div>
      <GhostBtn small onClick={add}><Plus size={14} /> Add another</GhostBtn>
    </div>
  );
}

function Card({ children }) {
  return <div className="card">{children}</div>;
}

function PrimaryBtn({ children, onClick, disabled }) {
  return <button type="button" className="btn btn-primary" onClick={onClick} disabled={disabled}>{children}</button>;
}

function GhostBtn({ children, onClick, small }) {
  return <button type="button" className={"btn btn-secondary" + (small ? " btn-sm" : "")} onClick={onClick}>{children}</button>;
}

function IconBtn({ onClick, children, danger, label }) {
  return (
    <button type="button" onClick={onClick} aria-label={label} title={label} className={"icon-btn bordered" + (danger ? " danger" : "")}>
      {children}
    </button>
  );
}

/* Delete button that requires a second click within a few seconds to confirm,
   instead of deleting instantly or interrupting with a modal for every row. */
function DeleteButton({ onDelete }) {
  const [confirming, setConfirming] = useState(false);
  const timer = useRef(null);
  useEffect(() => () => { if (timer.current) clearTimeout(timer.current); }, []);
  const handleClick = () => {
    if (confirming) {
      if (timer.current) clearTimeout(timer.current);
      setConfirming(false);
      onDelete();
    } else {
      setConfirming(true);
      timer.current = setTimeout(() => setConfirming(false), 2500);
    }
  };
  return (
    <button
      type="button"
      onClick={handleClick}
      title={confirming ? "Click again to confirm delete" : "Delete"}
      aria-label={confirming ? "Click again to confirm delete" : "Delete"}
      className={"del-btn" + (confirming ? " confirming" : "")}
    >
      <Trash2 size={15} />
      {confirming && "Confirm?"}
    </button>
  );
}

function Select({ value, onChange, options, placeholder, ariaLabel }) {
  return (
    <select value={value || ""} onChange={(e) => onChange(e.target.value)} aria-label={ariaLabel}>
      <option value="">{placeholder || "Select..."}</option>
      {options.map((o) => (
        <option key={o} value={o}>{o}</option>
      ))}
    </select>
  );
}

/* Multi-select rendered as toggleable chips */
function MultiSelect({ value, onChange, options, placeholder }) {
  const v = value || [];
  if (options.length === 0) {
    return <div className="hint" style={{ marginTop: 0 }}>{placeholder || "No options yet"}</div>;
  }
  const toggle = (opt) => onChange(v.includes(opt) ? v.filter((x) => x !== opt) : [...v, opt]);
  return (
    <div className="chips">
      {options.map((opt) => {
        const active = v.includes(opt);
        return (
          <button key={opt} type="button" aria-pressed={active} onClick={() => toggle(opt)} className={"chip" + (active ? " selected" : "")}>
            {opt}
          </button>
        );
      })}
    </div>
  );
}

/* Checklist of "which of these apply" items sharing one detail box, replacing
   a stack of near-identical Yes/No-plus-detail questions. */
function ChecklistBlock({ items, checked, onChangeChecked, detail, onChangeDetail, detailLabel = "Tell us more about what's checked above" }) {
  const toggle = (key) => onChangeChecked(checked.includes(key) ? checked.filter((k) => k !== key) : [...checked, key]);
  return (
    <div>
      <div className="check-list" style={{ marginBottom: checked.length ? 16 : 0 }}>
        {items.map((item) => {
          const active = checked.includes(item.key);
          return (
            <button key={item.key} type="button" role="checkbox" aria-checked={active} onClick={() => toggle(item.key)} className={"check-item" + (active ? " selected" : "")}>
              <span className="check-box">{active && <Check size={13} />}</span>
              <span>{item.label}</span>
            </button>
          );
        })}
      </div>
      {checked.length > 0 && (
        <AutoTextarea value={detail} onChange={(e) => onChangeDetail(e.target.value)} placeholder={detailLabel} minHeight={90} />
      )}
    </div>
  );
}

/* generic repeater for simple multi-field rows */
function Repeater({ items, onChange, fields, addLabel, empty }) {
  const add = () => {
    const row = { id: uid() };
    fields.forEach((f) => (row[f.key] = ""));
    onChange([...items, row]);
  };
  const remove = (id) => onChange(items.filter((r) => r.id !== id));
  const set = (id, key, val) => onChange(items.map((r) => (r.id === id ? { ...r, [key]: val } : r)));

  return (
    <div>
      {items.length === 0 && <p className="italic-empty">{empty}</p>}
      {items.length > 0 && (
        <div className="stack-lg">
          {items.map((row) => (
            <div key={row.id} className="entry rep-row">
              <div className="rep-fields">
                {fields.map((f) => (
                  <div key={f.key} className={f.wide || f.type === "textarea" ? "wide" : ""}>
                    <div className="mini-label">{f.label}</div>
                    {f.type === "select" ? (
                      <Select value={row[f.key]} onChange={(v) => set(row.id, f.key, v)} options={f.options} ariaLabel={f.label} />
                    ) : f.type === "textarea" ? (
                      <AutoTextarea value={row[f.key]} onChange={(e) => set(row.id, f.key, e.target.value)} minHeight={76} />
                    ) : (
                      <input
                        type={f.type === "number" ? "number" : "text"}
                        aria-label={f.label}
                        value={row[f.key]}
                        onChange={(e) => set(row.id, f.key, e.target.value)}
                      />
                    )}
                  </div>
                ))}
              </div>
              <DeleteButton onDelete={() => remove(row.id)} />
            </div>
          ))}
        </div>
      )}
      <GhostBtn onClick={add}><Plus size={15} /> {addLabel}</GhostBtn>
    </div>
  );
}

/* ---------------------------------------------------------------- */
/* impact / readiness helpers                                        */
/* ---------------------------------------------------------------- */

function overallLevel(dims) {
  const vals = Object.values(dims).filter(Boolean);
  if (vals.length < 4) return null;
  const score = { Low: 1, Medium: 2, High: 3 };
  const avg = vals.reduce((s, v) => s + score[v], 0) / vals.length;
  if (avg >= 2.4) return "High";
  if (avg >= 1.6) return "Medium";
  return "Low";
}

function computeOverallImpact(groups, ratings) {
  const levels = groups.map((g) => overallLevel(ratings[g.id] || {})).filter(Boolean);
  if (levels.length === 0) return null;
  const score = { Low: 1, Medium: 2, High: 3 };
  const avg = levels.reduce((s, l) => s + score[l], 0) / levels.length;
  if (avg >= 2.4) return "High";
  if (avg >= 1.6) return "Medium";
  return "Low";
}

function catAverage(readinessRatings, key, len) {
  const rows = readinessRatings[key];
  if (!rows) return null;
  const scored = rows.filter((r) => r && r.score);
  if (scored.length < len) return null;
  return scored.reduce((s, r) => s + r.score, 0) / scored.length;
}

function overallReadiness(readinessRatings) {
  const avgs = READINESS_CATS.map((c) => catAverage(readinessRatings, c.key, c.statements.length)).filter((v) => v !== null);
  if (avgs.length === 0) return null;
  return avgs.reduce((a, b) => a + b, 0) / avgs.length;
}

function readinessFullyScored(readinessRatings) {
  return READINESS_CATS.every((c) => catAverage(readinessRatings, c.key, c.statements.length) !== null);
}

function readinessLevel(avg) {
  if (avg === null) return null;
  if (avg >= 3.75) return "High";
  if (avg >= 2.5) return "Medium";
  return "Low";
}

function phaseComplete(data, index) {
  if (index === 0) {
    const s = data.setup;
    return !!(data.setup.initiativeName && s.sponsor.name && s.accountable.name && s.cmLead.name && s.projectLead.name);
  }
  if (index === 1) {
    const im = data.impact;
    if (!(im.whatChanging && im.why && im.urgency && im.outcome && im.groups.length > 0)) return false;
    return im.groups.every((g) => overallLevel(im.ratings[g.id] || {}) !== null);
  }
  if (index === 2) {
    return readinessFullyScored(data.readiness.ratings);
  }
  if (index === 3) {
    return PLAN_SECTIONS.every((sec) => data.plan.actions.some((a) => a.section === sec.key && a.action));
  }
  if (index === 4) {
    const actions = data.plan.actions.filter((a) => a.action);
    return actions.length > 0 && actions.every((a) => a.status !== "Not Started");
  }
  if (index === 5) {
    const actions = data.plan.actions.filter((a) => a.action);
    return actions.length > 0 && actions.every((a) => a.status === "Complete");
  }
  return false;
}
