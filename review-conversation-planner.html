<title>Review Conversation Planner</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap">
<style>
/* ===== Talent Workspace UI (talent-ui.css) ===== */
/* Layout: brand row, tool header + section progress, then a step card with the section summary panel beside it (stacks below 900px). */
:root{
  --font-sans:Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:22px;--space-6:28px;--space-7:32px;--space-8:56px;
  --radius-sm:8px;--radius-md:10px;--radius-lg:12px;--radius-xl:14px;--radius-pill:999px;
  --bg:#F7F8FA;--surface:#FFFFFF;--surface-alt:#F1F3F5;--ink:#111827;--ink-soft:#5B6472;--line:#E5E7EB;--line-strong:#8A9099;
  --accent:#0F766E;--accent-hover:#0B5F58;--on-accent:#FFFFFF;--accent-soft:#E6F4F2;--focus-ring:rgba(15,118,110,0.25);
  --info:#1D4ED8;--info-soft:#EEF3FF;--warning:#B54708;--warning-soft:#FEF3E2;--error:#B42318;--error-soft:#FEECEB;
  --shadow-sm:0 1px 2px rgba(16,24,40,0.05);
  --shadow-card:0 1px 2px rgba(16,24,40,0.04), 0 6px 20px -4px rgba(16,24,40,0.07);
  --shadow-lift:0 2px 4px rgba(16,24,40,0.06), 0 10px 28px -6px rgba(16,24,40,0.12);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1113;--surface:#171B1F;--surface-alt:#1F2429;--ink:#ECEEF0;--ink-soft:#9AA3AD;--line:#2A3036;--line-strong:#6B747E;
    --accent:#3CC4B4;--accent-hover:#62D3C6;--on-accent:#04201C;--accent-soft:rgba(60,196,180,0.13);--focus-ring:rgba(60,196,180,0.3);
    --info:#8AB4F8;--info-soft:rgba(138,180,248,0.13);--warning:#F5B45C;--warning-soft:rgba(245,180,92,0.13);--error:#F28B82;--error-soft:rgba(242,139,130,0.13);
    --shadow-sm:0 1px 2px rgba(0,0,0,0.4);
    --shadow-card:0 1px 2px rgba(0,0,0,0.4), 0 8px 24px -6px rgba(0,0,0,0.5);
    --shadow-lift:0 2px 4px rgba(0,0,0,0.45), 0 12px 30px -6px rgba(0,0,0,0.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1113;--surface:#171B1F;--surface-alt:#1F2429;--ink:#ECEEF0;--ink-soft:#9AA3AD;--line:#2A3036;--line-strong:#6B747E;
  --accent:#3CC4B4;--accent-hover:#62D3C6;--on-accent:#04201C;--accent-soft:rgba(60,196,180,0.13);--focus-ring:rgba(60,196,180,0.3);
  --info:#8AB4F8;--info-soft:rgba(138,180,248,0.13);--warning:#F5B45C;--warning-soft:rgba(245,180,92,0.13);--error:#F28B82;--error-soft:rgba(242,139,130,0.13);
  --shadow-sm:0 1px 2px rgba(0,0,0,0.4);
  --shadow-card:0 1px 2px rgba(0,0,0,0.4), 0 8px 24px -6px rgba(0,0,0,0.5);
  --shadow-lift:0 2px 4px rgba(0,0,0,0.45), 0 12px 30px -6px rgba(0,0,0,0.6);
  color-scheme:dark;
}
*{box-sizing:border-box;}
[hidden]{display:none!important;}
#exStatus:empty{display:none;}
html,body{margin:0;background:var(--bg);}
body{color:var(--ink);font-family:var(--font-sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;}
h1,h2,h3,h4{font-weight:650;letter-spacing:-.022em;margin:0;line-height:1.2;text-wrap:balance;}
p{margin:0;}
button{font:inherit;cursor:pointer;}
:focus-visible{outline:none;box-shadow:0 0 0 4px var(--focus-ring);border-radius:var(--radius-sm);}

/* ===== Shell ===== */
.shell{max-width:1180px;margin:0 auto;padding-inline:32px;padding-block:28px 56px;display:flex;flex-direction:column;gap:var(--space-5);}
.brandrow{display:flex;align-items:center;gap:10px;}
.brand-tile{width:32px;height:32px;border-radius:var(--radius-md);background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.brand-name{flex:1;min-width:0;font-size:14px;font-weight:650;letter-spacing:-.01em;}
.icon-btn{width:34px;height:34px;border-radius:var(--radius-md);border:none;background:transparent;color:var(--ink-soft);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .15s,color .15s;}
.icon-btn:hover{background:var(--surface-alt);color:var(--ink);}

/* Tool header */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;}
.brand{display:flex;flex-direction:column;align-items:flex-start;gap:6px;background:none;border:0;padding:0;text-align:left;color:inherit;}
.brand[disabled]{cursor:default;}
.eyebrow{display:inline-flex;align-items:center;gap:6px;color:var(--accent);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;}
.brand h1{font-size:32px;line-height:1.15;}
.top-right{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}

/* ===== Buttons ===== */
.btn{font:600 14px var(--font-sans);border-radius:var(--radius-md);padding:11px 20px;min-height:44px;
  border:1px solid transparent;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  transition:background .15s, box-shadow .15s, transform .15s, border-color .15s, color .15s;}
.btn-primary{background:var(--accent);color:var(--on-accent);box-shadow:var(--shadow-sm);}
.btn-primary:hover:not(:disabled){background:var(--accent-hover);transform:translateY(-1px);box-shadow:var(--shadow-lift);}
.btn-primary:active:not(:disabled){transform:none;}
.btn-secondary{background:var(--surface);color:var(--ink);border-color:var(--line-strong);box-shadow:var(--shadow-sm);}
.btn-secondary:hover:not(:disabled){background:var(--surface-alt);}
.btn-text{background:transparent;color:var(--ink-soft);border:none;padding:8px 12px;}
.btn-text:hover:not(:disabled){color:var(--ink);background:var(--surface-alt);}
.btn-danger{background:var(--error);color:var(--surface);box-shadow:var(--shadow-sm);}
.btn-danger:hover:not(:disabled){filter:brightness(.92);}
.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none;}
.btn:focus-visible{box-shadow:0 0 0 4px var(--focus-ring);}
.btn-sm{min-height:34px;padding:6px 12px;font-size:13px;}

/* ===== Progress ===== */
.progress{display:grid;grid-template-columns:3fr 3fr auto;gap:14px;align-items:start;padding:14px 16px;border-radius:var(--radius-lg);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-sm);}
.pgroup{display:flex;flex-direction:column;gap:9px;min-width:0;}
.pgroup .plabel{font-size:12.5px;font-weight:500;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pgroup.active .plabel{color:var(--ink);font-weight:600;}
.segs{display:flex;gap:4px;}
.seg{--c:var(--surface-alt);flex:1;position:relative;height:22px;margin-block:-8px;background:none;border:0;padding:0;border-radius:var(--radius-pill);}
.seg::after{content:"";position:absolute;left:0;right:0;top:8px;height:6px;border-radius:var(--radius-pill);background:var(--c);transition:background .2s;}
.seg:hover::after{filter:brightness(.95);}
.seg.done{--c:var(--accent);}
.seg.skipped{--c:var(--line-strong);}
.seg.current{--c:var(--accent);}
.seg.current::after{box-shadow:0 0 0 3px var(--focus-ring);}
.pfinal{width:88px;}
.pfinal .seg{flex:none;width:100%;}

/* ===== Step layout ===== */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;align-items:start;}
.layout.solo{grid-template-columns:minmax(0,1fr);max-width:820px;width:100%;margin:0 auto;}
.aside{position:sticky;top:calc(env(safe-area-inset-top, 0px) + 16px);max-height:calc(100vh - 32px);display:flex;flex-direction:column;background:var(--surface-alt);border:1px solid var(--line);border-radius:var(--radius-xl);overflow:hidden;}
.aside-head{padding:18px 18px 14px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;border-bottom:1px solid var(--line);}
.aside-title{display:flex;flex-direction:column;gap:3px;min-width:0;}
.aside-head h3{font-size:15px;}
.aside-count{font-size:12.5px;color:var(--ink-soft);font-variant-numeric:tabular-nums;}
.aside-body{padding:14px;display:flex;flex-direction:column;gap:8px;overflow-y:auto;}
.aside-empty{border:1.5px dashed var(--line-strong);border-radius:var(--radius-lg);padding:22px 16px;text-align:center;color:var(--ink-soft);font-size:13.5px;}
.panelbtn{flex:none;display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);color:var(--ink-soft);border-radius:var(--radius-sm);padding:5px 10px;font-size:13px;font-weight:600;transition:background .15s,color .15s;}
.panelbtn:hover{color:var(--ink);background:var(--surface-alt);}
.kicker .panelbtn{margin-left:auto;}
.qa-item{position:relative;display:flex;flex-direction:column;gap:4px;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:12px 14px;color:var(--ink);box-shadow:var(--shadow-sm);transition:box-shadow .2s,border-color .15s;}
.qa-item:hover{box-shadow:var(--shadow-card);border-color:var(--line-strong);}
.qa-item .q{font-size:12px;font-weight:600;color:var(--ink-soft);line-height:1.4;}
.qa-item .a{font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5;}
.qa-item .a.empty{color:var(--ink-soft);font-style:italic;}
.qa-item .edit{position:absolute;right:8px;bottom:6px;font-size:12px;font-weight:600;color:var(--accent);background:var(--accent-soft);padding:2px 8px;border-radius:var(--radius-pill);opacity:0;transition:opacity .15s;}
.qa-item:hover .edit,.qa-item:focus-visible .edit{opacity:1;}

/* ===== Card ===== */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-xl);padding:var(--space-7);box-shadow:var(--shadow-card);display:flex;flex-direction:column;gap:24px;min-width:0;color:var(--ink);}
.card-head{display:flex;flex-direction:column;gap:10px;}
.kicker{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--ink-soft);font-variant-numeric:tabular-nums;}
.pill{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;background:var(--accent-soft);color:var(--accent);font-weight:600;border-radius:var(--radius-pill);padding:3px 10px 3px 8px;font-size:12px;}
.pill::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;}
.pill.s2{background:var(--info-soft);color:var(--info);}
.card h2{font-size:24px;line-height:1.25;}
.lede{color:var(--ink-soft);font-size:15px;line-height:1.6;max-width:62ch;}

/* Fields */
.fields{display:flex;flex-direction:column;gap:var(--space-5);}
.field{display:flex;flex-direction:column;gap:var(--space-2);}
.field label{font-size:14px;font-weight:600;color:var(--ink);max-width:62ch;line-height:1.45;}
textarea{width:100%;min-height:108px;font:400 14.5px var(--font-sans);color:var(--ink);line-height:1.55;
  background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--radius-md);
  padding:11px 14px;outline:none;resize:vertical;transition:border-color .15s, box-shadow .15s;}
textarea:hover{border-color:var(--ink-soft);}
textarea:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--focus-ring);}
textarea::placeholder{color:var(--ink-soft);opacity:1;}
.invalid textarea{border-color:var(--error);}
.invalid textarea:focus{box-shadow:0 0 0 4px var(--error-soft);}
.err{color:var(--error);font-size:13px;font-weight:500;display:flex;gap:6px;align-items:center;}
.hint{font-size:12.5px;color:var(--ink-soft);}

/* Reaction examples */
.examples{background:var(--surface-alt);border-radius:var(--radius-lg);padding:16px 18px;display:flex;flex-direction:column;gap:10px;}
.examples .ex-label{font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);}
.examples ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:8px;font-size:14.5px;color:var(--ink);max-width:70ch;}
.examples li::marker{color:var(--accent);}
.examples b{font-weight:600;color:var(--ink);}

/* Actions */
.actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:20px;}
.actions .right{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-left:auto;}

/* Intro */
.narrow{max-width:820px;width:100%;margin:0 auto;}
.note{display:flex;gap:12px;background:var(--info-soft);border-radius:var(--radius-lg);padding:14px 16px;font-size:14px;line-height:1.55;color:var(--ink);}
.note svg{flex:none;margin-top:2px;color:var(--info);}
.linkbtn{text-align:left;background:none;border:0;padding:4px 8px;border-radius:var(--radius-sm);color:var(--accent);font-weight:600;font-size:13px;transition:background .15s;}
.linkbtn:hover{background:var(--accent-soft);}
.textlink{display:inline-flex;align-items:center;gap:8px;color:var(--accent);font-weight:600;font-size:14px;text-decoration:underline;text-underline-offset:3px;}
.textlink:hover{color:var(--accent-hover);}

/* Overall summary */
.ov-sec{display:flex;flex-direction:column;gap:14px;}
.ov-sec + .ov-sec{border-top:1px solid var(--line);padding-top:24px;}
.ov-sec > h3{font-size:17px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.ov-step{border:1px solid var(--line);background:var(--surface);border-radius:var(--radius-lg);padding:18px 20px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow-sm);}
.ov-step-head{display:flex;justify-content:space-between;align-items:center;gap:12px;}
.ov-step-head h4{font-size:15px;letter-spacing:-.01em;}
.qa{display:flex;flex-direction:column;gap:2px;}
.qa .q{font-size:12.5px;font-weight:600;color:var(--ink-soft);}
.qa .a{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14.5px;}
.qa .a.empty{color:var(--ink-soft);font-style:italic;}
.stat-row{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;}
.dl{display:flex;flex-direction:column;gap:12px;background:var(--surface-alt);border-radius:var(--radius-lg);padding:20px;}
.dl h3{font-size:17px;}
.dl-row{display:flex;flex-wrap:wrap;gap:10px;}
.status{font-size:13.5px;min-height:1.4em;color:var(--ink-soft);}
.status.bad{color:var(--error);}
.status.good{color:var(--accent);}
.confirm{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:14px;background:var(--error-soft);border-radius:var(--radius-md);padding:8px 8px 8px 14px;}

.fade{animation:rise .35s ease both;}
@keyframes rise{from{opacity:.001;transform:translateY(8px);}to{opacity:1;transform:none;}}
@media (prefers-reduced-motion:reduce){.fade{animation:none;}*{transition:none!important;}}
@media (max-width:900px){
  .layout{grid-template-columns:1fr;}
  .aside{position:static;max-height:none;}
}
@media (hover:none){ .qa-item .edit{opacity:1;} }
@media (pointer:coarse){
  .panelbtn{min-height:40px;padding-inline:12px;}
  .linkbtn{padding:8px;}
}
@media (max-width:800px){
  .shell{padding-inline:16px;padding-block:16px 40px;gap:18px;}
  .brand .eyebrow{display:none;}
  .brand h1{font-size:22px;}
  .top{flex-wrap:nowrap;align-items:center;}
  .progress{grid-template-columns:3fr 3fr 1fr;gap:6px;padding:12px;}
  .progress .plabel{display:none;}
  .pfinal{width:auto;}
  .card{padding:22px 18px;gap:20px;}
  .card h2{font-size:20px;}
  .lede{font-size:14.5px;}
  textarea{font-size:16px;min-height:120px;}
  .btn{min-height:48px;}
  .kicker .panelbtn{margin-left:0;}
  .actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .actions .right{display:contents;}
  .actions .btn{width:100%;}
  .actions .btn-primary{grid-column:1/-1;order:-1;}
  .actions .btn-secondary{order:1;}
  .actions .btn-text{order:2;}
  .actions > :only-child{grid-column:1/-1;}
  .actions .confirm,.actions .stat-row{grid-column:1/-1;order:3;}
  .confirm{padding:12px;}
  .confirm span{flex:1 1 100%;}
  .confirm .btn{flex:1;}
  .dl{padding:16px;}
  .dl-row .btn{flex:1 1 100%;}
  .ov-step{padding:14px 16px;}
  .aside-head{padding:16px;}
  .aside-body{padding:12px;}
}
</style>

<script>
/* Theme toggle (Talent Workspace) */
const ICON_SUN = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const ICON_MOON = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
function isDark(){
  const t = document.documentElement.getAttribute('data-theme');
  if (t) return t === 'dark';
  return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
}
function paintThemeButtons(){
  const dark = isDark();
  document.querySelectorAll('.theme-toggle').forEach(b => {
    b.innerHTML = dark ? ICON_SUN : ICON_MOON;
    b.setAttribute('aria-label', dark ? 'Switch to light mode' : 'Switch to dark mode');
    b.title = b.getAttribute('aria-label');
  });
}
document.querySelectorAll('.theme-toggle').forEach(b => b.addEventListener('click', () => {
  document.documentElement.setAttribute('data-theme', isDark() ? 'light' : 'dark');
  paintThemeButtons();
}));
if (window.matchMedia) { try { window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', paintThemeButtons); } catch (e) {} }
paintThemeButtons();
</script>

  { id: "sources", sec: 0, title: "Who you’ll talk to and what sources you’ll review",

  { id: "selfeval", sec: 0, title: "Self-evaluation",

      { id: "selfeval_q1", q: "Why is self-evaluation important?" },
      { id: "selfeval_q2", q: "What questions will you ask the employee to think about before the review?" } ] },
  { id: "data", sec: 1, title: "Employee data and examples",

    fields: [

function clearErr(el) { const f = el.closest(".field.invalid"); if (f) { f.classList.remove("invalid"); f.querySelectorAll(":scope > .err").forEach(e => e.remove()); } }

function go(t, focusId) {

/* ---------- Export model ---------- */
function model() {
  return [0, 1].map(sec => ({ title: SECTIONS[sec].short + ": " + SECTIONS[sec].name,
    steps: secSteps(sec).map(s => ({ title: s.title,
      items: s.fields.map(f => ({ q: qLabel(f), a: (state.answers[f.id] || "").trim() || "Not answered" })) })) }));
}
const DOC_TITLE = "Performance Review Conversation Plan";
const today = () => new Date().toLocaleDateString(undefined, { year: "numeric", month: "long", day: "numeric" });

function planText() {
  let t = DOC_TITLE + "\nPrepared " + today() + "\n";
  model().forEach(sec => { t += "\n\n" + sec.title.toUpperCase() + "\n";
    sec.steps.forEach(st => { t += "\n" + st.title + "\n";
      st.items.forEach(it => { t += "\n" + it.q + "\n" + it.a + "\n"; }); }); });
  return t.trim() + "\n";
}

/* DOCX (Talent Workspace colors) */
const xesc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function run(text, o = {}) {
  const rpr = `<w:rPr><w:rFonts w:ascii="Calibri" w:hAnsi="Calibri" w:cs="Calibri"/>${o.b ? "<w:b/>" : ""}${o.color ? `<w:color w:val="${o.color}"/>` : ""}<w:sz w:val="${o.sz || 22}"/></w:rPr>`;
  return String(text).split("\n").map((line, i) => (i ? `<w:r>${rpr}<w:br/></w:r>` : "") + `<w:r>${rpr}<w:t xml:space="preserve">${xesc(line)}</w:t></w:r>`).join("");
}
function para(text, o = {}) {
  const ppr = `<w:pPr><w:spacing w:before="${o.before || 0}" w:after="${o.after ?? 120}"/>${o.border ? `<w:pBdr><w:bottom w:val="single" w:sz="8" w:space="4" w:color="E5E7EB"/></w:pBdr>` : ""}${o.keep ? "<w:keepNext/>" : ""}</w:pPr>`;
  return `<w:p>${ppr}${run(text, o)}</w:p>`;
}
async function buildDocx() {
  let body = para(DOC_TITLE, { b: true, sz: 40, color: "111827", after: 60 }) +
    para("Prepared " + today(), { sz: 20, color: "5B6472", after: 240 });
  model().forEach(sec => {
    body += para(sec.title, { b: true, sz: 30, color: "0F766E", before: 360, after: 160, border: true, keep: true });
    sec.steps.forEach(st => {
      body += para(st.title, { b: true, sz: 25, color: "111827", before: 200, after: 100, keep: true });
      st.items.forEach(it => {
        body += para(it.q, { b: true, sz: 21, color: "5B6472", after: 40, keep: true });
        body += para(it.a, { sz: 22, color: it.a === "Not answered" ? "5B6472" : "111827", after: 160 });
      });
    });
  });
  const doc = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>${body}<w:sectPr><w:pgSz w:w="12240" w:h="15840"/><w:pgMar w:top="1260" w:right="1260" w:bottom="1260" w:left="1260" w:header="720" w:footer="720" w:gutter="0"/></w:sectPr></w:body></w:document>`;
  const zip = new JSZip();
  zip.file("[Content_Types].xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>`);
  zip.file("_rels/.rels", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>`);
  zip.file("word/document.xml", doc);
  return zip.generateAsync({ type: "blob", mimeType: "application/vnd.openxmlformats-officedocument.wordprocessingml.document" });
}

/* PDF (Talent Workspace colors) */
function buildPdf() {
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({ unit: "pt", format: "letter" });
  const W = pdf.internal.pageSize.getWidth(), H = pdf.internal.pageSize.getHeight(), M = 60, CW = W - M * 2;
  let y = M;
  const rgb = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  const ensure = h => { if (y + h > H - M) { pdf.addPage(); y = M; } };
  const text = (s, { size = 11, bold = false, color = "#111827", gap = 4, keep = 0 } = {}) => {
    pdf.setFont("helvetica", bold ? "bold" : "normal"); pdf.setFontSize(size); pdf.setTextColor(...rgb(color));
    const lines = pdf.splitTextToSize(String(s), CW); const lh = size * 1.4;
    ensure(Math.min(lines.length, 2) * lh + keep);
    lines.forEach(l => { ensure(lh); pdf.text(l, M, y + size); y += lh; });
    y += gap;
  };
  text(DOC_TITLE, { size: 20, bold: true, gap: 2 });
  text("Prepared " + today(), { size: 10, color: "#5B6472", gap: 14 });
  model().forEach(sec => {
    y += 10; ensure(70);
    text(sec.title, { size: 15, bold: true, color: "#0F766E", gap: 2 });
    pdf.setDrawColor(...rgb("#E5E7EB")); pdf.setLineWidth(1); pdf.line(M, y, W - M, y); y += 12;
    sec.steps.forEach(st => {
      text(st.title, { size: 12.5, bold: true, color: "#111827", gap: 6, keep: 40 });
      st.items.forEach(it => {
        text(it.q, { size: 10, bold: true, color: "#5B6472", gap: 2, keep: 16 });
        text(it.a, { size: 11, color: it.a === "Not answered" ? "#5B6472" : "#111827", gap: 10 });
      });
      y += 4;
    });
  });
  const n = pdf.getNumberOfPages();
  for (let i = 1; i <= n; i++) { pdf.setPage(i); pdf.setFont("helvetica", "normal"); pdf.setFontSize(8.5); pdf.setTextColor(...rgb("#5B6472"));
    pdf.text(DOC_TITLE + "  ·  Page " + i + " of " + n, M, H - 30); }
  return pdf.output("blob");
}

/* ---------- Downloads ---------- */
/* Inside a claude.ai artifact, files are offered through the viewer's downloads capability.
   Opened as a plain file anywhere else, a regular browser download is used instead. */
const linkDownloads = { save: async ({ filename, data }) => {
  const blob = data instanceof Blob ? data : new Blob([data]);
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  return { status: "saved" };
} };
const inArtifact = !!(window.claude && typeof window.claude.use === "function");
let downloadsChecked = !inArtifact;
let downloadsApi = inArtifact ? null : linkDownloads;
if (inArtifact) {
  window.claude.use("downloads").catch(() => null).then(d => {
    downloadsApi = d; downloadsChecked = true;
    if (state.view === "summary") renderSummary();
  });
}
function setStatus(msg, kind = "") { const s = $("#dlStatus"); if (s) { s.textContent = msg; s.className = "status " + kind; } }
async function download(kind) {
  if (!downloadsApi) { setStatus(downloadsChecked ? "File downloads aren’t available in this view. Use Copy as text instead." : "Downloads are still loading. Try again in a moment.", "bad"); return; }
  const btn = kind === "pdf" ? $("#dlPdf") : $("#dlDocx"); btn.disabled = true;
  setStatus("Preparing your " + (kind === "pdf" ? "PDF" : "Word document") + "…");
  try {
    const data = kind === "pdf" ? buildPdf() : await buildDocx();
    await downloadsApi.save({ filename: "review-conversation-plan." + kind, data });
    setStatus("Downloaded review-conversation-plan." + kind + ".", "good");
  } catch (e) {
    const code = e && e.code;
    const msg = code === "declined" ? "Download canceled. Choose a format again whenever you’re ready."
      : code === "rate_limited" ? "A download prompt is already open. Finish that one, then try again."
      : (code === "rejected_extension" || code === "extension_not_enabled") ? "That file format isn’t available here. Try the other format or Copy as text."
      : "The file couldn’t be created here. Use Copy as text instead.";
    setStatus(msg, code === "declined" ? "" : "bad");
  } finally { btn.disabled = false; }
}
async function openExample(e) {
  if (!downloadsApi) return; // fall back to opening the link
  e.preventDefault();
  const st = $("#exStatus");
  try {
    const res = await fetch("review-conversation-planner-example.pdf"); if (!res.ok) throw new Error();
    await downloadsApi.save({ filename: "example-review-conversation-plan.pdf", data: await res.blob() });
    st.textContent = ""; st.className = "status";
  } catch (err) {
    if (err && err.code === "declined") return;
    st.textContent = "The example couldn’t be opened here. Try again in a moment."; st.className = "status bad";
  }
}
async function copyText() {
  const txt = planText();
  try { await navigator.clipboard.writeText(txt); setStatus("Copied your plan as plain text.", "good"); }
  catch { const ta = $("#copyFallback"); ta.hidden = false; ta.value = txt; ta.style.minHeight = "200px"; ta.focus(); ta.select();
    setStatus("Your browser blocked copying. The text is selected below; press Ctrl+C or ⌘C to copy it."); }
}

render();
</script>
