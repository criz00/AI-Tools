<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Review Conversation Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
body{margin:0}

:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --surface-alt:#E4E9EF;
  --ink:#1B2430; --ink-soft:#5B6675; --line:#D6DCE3;
  --accent:#2F6F63; --accent-2:#176480; --accent-soft:#82B3C1; --error:#B3432B;
  --tint:#E9F2F5; --accent-tint:#E6F0EE;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Instrument Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r:14px;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
#exStatus:empty{display:none}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;padding-inline:16px;padding-block:28px 64px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15;letter-spacing:-0.01em}
p{margin:0}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent-2);outline-offset:2px;border-radius:6px}

/* Header */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 24px}
.brand{display:flex;flex-direction:column;align-items:flex-start;background:none;border:0;padding:0;text-align:left;color:inherit}
.brand[disabled]{cursor:default}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
.brand h1{font-size:clamp(24px,4vw,32px);font-weight:650;margin-top:4px}
.top-right{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.homebtn{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1.5px solid var(--line);color:var(--ink);border-radius:10px;padding:8px 14px;font-weight:600;font-size:14px}
.homebtn:hover{border-color:var(--accent-soft);background:var(--tint)}

/* Progress */
.progress{display:grid;grid-template-columns:3fr 3fr auto;gap:10px;align-items:start}
.pgroup{display:flex;flex-direction:column;gap:6px;min-width:0}
.pgroup .plabel{font-size:12px;font-weight:600;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pgroup.active .plabel{color:var(--ink)}
.segs{display:flex;gap:4px}
.seg{--c:var(--line);flex:1;position:relative;height:22px;margin-block:-8px;background:none;border:0;padding:0}
.seg::after{content:"";position:absolute;left:0;right:0;top:8px;height:6px;border-radius:3px;background:var(--c)}
.seg.done{--c:var(--accent)}
.seg.skipped{--c:var(--accent-soft)}
.seg.current{--c:var(--accent-2)}
.pfinal{width:88px}
.pfinal .seg{flex:none;width:100%}

/* Two-column step layout */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;align-items:start}
.aside{position:sticky;top:calc(env(safe-area-inset-top, 0px) + 16px);max-height:calc(100vh - 32px);display:flex;flex-direction:column;background:var(--surface-alt);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.aside-head{padding:18px 18px 12px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;border-bottom:1px solid var(--line)}
.aside-title{display:flex;flex-direction:column;gap:4px;min-width:0}
.panelbtn{flex:none;display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1.5px solid var(--line);color:var(--ink-soft);border-radius:8px;padding:5px 10px;font-size:13px;font-weight:600}
.panelbtn:hover{color:var(--ink);border-color:var(--accent-soft);background:var(--tint)}
.kicker .panelbtn{margin-left:auto}
.layout.solo{grid-template-columns:minmax(0,1fr);max-width:900px;width:100%;margin:0 auto}
.aside-head h3{font-size:18px;font-weight:650}
.aside-count{font-size:13px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.aside-body{padding:14px;display:flex;flex-direction:column;gap:8px;overflow-y:auto}
.aside-empty{padding:18px 6px;color:var(--ink-soft);font-size:14px}
.qa-item{display:flex;flex-direction:column;gap:3px;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;color:var(--ink);transition:border-color .15s}
.qa-item:hover{border-color:var(--accent-soft)}
.qa-item .q{font-size:12.5px;color:var(--ink-soft);line-height:1.4}
.qa-item .a{font-size:14.5px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5}
.qa-item .a.empty{color:var(--ink-soft);font-style:italic}
.qa-item{position:relative}
.qa-item .edit{position:absolute;right:8px;bottom:6px;font-size:12px;font-weight:600;color:var(--accent-2);background:var(--surface);padding:2px 6px;border-radius:6px;opacity:0;transition:opacity .15s}
.qa-item:hover .edit,.qa-item:focus-visible .edit{opacity:1}

/* Card */
.card{background:var(--surface);border-radius:18px;border:1px solid var(--line);box-shadow:0 1px 2px rgba(27,36,48,.04),0 12px 32px -18px rgba(27,36,48,.18);padding:clamp(20px,4vw,40px);display:flex;flex-direction:column;gap:24px;min-width:0}
.card-head{display:flex;flex-direction:column;gap:10px}
.kicker{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--ink-soft)}
.pill{white-space:nowrap;background:var(--accent-tint);color:var(--accent);font-weight:600;border-radius:999px;padding:3px 10px;font-size:12px;letter-spacing:.02em}
.pill.s2{background:var(--tint);color:var(--accent-2)}
.card h2{font-size:clamp(22px,3.4vw,28px);font-weight:650}
.lede{color:var(--ink-soft);max-width:62ch}
.fields{display:flex;flex-direction:column;gap:22px}
.field{display:flex;flex-direction:column;gap:8px}
.field label{font-weight:600;max-width:62ch}
textarea{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;transition:border-color .15s, box-shadow .15s;min-height:108px;resize:vertical;line-height:1.5}
textarea:hover{border-color:var(--accent-soft)}
textarea:focus{outline:none;border-color:var(--accent-2);box-shadow:0 0 0 4px rgba(130,179,193,.35)}
.invalid textarea{border-color:var(--error)}
.err{color:var(--error);font-size:13px;font-weight:500;display:flex;gap:6px;align-items:center}
.hint{font-size:13px;color:var(--ink-soft)}

/* Reaction examples */
.examples{background:var(--bg);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.examples .ex-label{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
.examples{padding:16px 18px;gap:10px}
.examples ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:8px;font-size:15px;color:var(--ink);max-width:70ch}
.examples b{font-weight:600;color:var(--accent-2)}

.actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:20px}
.actions .right{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-left:auto}
.btn{border-radius:10px;padding:11px 20px;font-weight:600;border:1.5px solid transparent;display:inline-flex;align-items:center;gap:8px;transition:background .15s,transform .05s}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);color:#fff}
.btn.primary:hover{background:#275D53}
.btn.secondary{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn.secondary:hover{border-color:var(--accent-soft);background:var(--tint)}
.btn.blue{background:var(--accent-2);color:#fff}
.btn.blue:hover{background:#12526A}
.btn.ghost{background:none;color:var(--ink-soft);padding-inline:10px}
.btn.ghost:hover{color:var(--ink)}
.btn.danger{background:var(--error);color:#fff}
.btn[disabled]{opacity:.55;cursor:default}

/* Intro */
.narrow{max-width:860px;width:100%;margin:0 auto}
.note{display:flex;gap:12px;background:var(--tint);border:1px solid var(--accent-soft);border-radius:12px;padding:14px 16px;font-size:14px}
.note svg{flex:none;margin-top:2px;color:var(--accent-2)}
.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:#FBF1EE;border:1px solid #E6C3B9;color:var(--ink);border-radius:12px;padding:10px 14px;font-size:14px}
.banner b{color:var(--error)}
.linkbtn{text-align:left;background:none;border:0;padding:2px 4px;color:var(--accent-2);font-weight:600;font-size:13px;text-decoration:underline;text-underline-offset:3px}
.linkbtn:hover{color:var(--accent)}
.textlink{display:inline-flex;align-items:center;gap:8px;color:var(--accent-2);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.textlink:hover{color:var(--accent)}

/* Overall summary */
.ov-sec{display:flex;flex-direction:column;gap:14px}
.ov-sec + .ov-sec{border-top:1px solid var(--line);padding-top:24px}
.ov-sec > h3{font-size:20px;font-weight:650;display:flex;gap:10px;align-items:center}
.ov-step{background:var(--bg);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
.ov-step-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.ov-step-head h4{margin:0;font-size:15px;font-weight:600}
.qa{display:flex;flex-direction:column;gap:2px}
.qa .q{font-size:13px;color:var(--ink-soft)}
.qa .a{white-space:pre-wrap;overflow-wrap:anywhere}
.qa .a.empty{color:var(--ink-soft);font-style:italic}
.stat-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.dl{display:flex;flex-direction:column;gap:12px;background:var(--surface-alt);border-radius:14px;padding:18px}
.dl h3{font-size:18px;font-weight:650}
.dl-row{display:flex;flex-wrap:wrap;gap:10px}
.status{font-size:14px;min-height:1.4em;color:var(--ink-soft)}
.status.bad{color:var(--error)}
.status.good{color:var(--accent)}
.confirm{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:14px}

.fade{animation:fade .28s ease both}
@keyframes fade{from{opacity:.001;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}*{transition:none!important}}
@media (max-width:900px){
  .layout{grid-template-columns:1fr}
  .aside{position:static;max-height:none}
}
@media (hover:none){
  .qa-item .edit{opacity:1}
}
@media (pointer:coarse){
  .panelbtn{min-height:40px;padding-inline:12px}
  .homebtn{min-height:44px}
  .linkbtn{padding:8px 4px}
}
@media (max-width:620px){
  body{padding-block:18px 40px}
  .top{flex-wrap:nowrap;align-items:center}
  .brand .eyebrow{display:none}
  .brand h1{font-size:22px;margin-top:0}
  .homebtn{padding:8px 12px}
  .progress{grid-template-columns:3fr 3fr 1fr;gap:6px}
  .progress .plabel{display:none}
  .pfinal{width:auto}
  .card{border-radius:16px;gap:20px}
  .card h2{font-size:22px}
  .lede{font-size:15px}
  .kicker .panelbtn{margin-left:0}
  .actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .actions .right{display:contents}
  .actions .btn{justify-content:center;width:100%}
  .actions .btn.primary{grid-column:1/-1;order:-1;min-height:48px}
  .actions .btn.secondary{order:1}
  .actions .btn.ghost{order:2}
  .actions > :only-child{grid-column:1/-1}
  .actions .confirm,.actions .stat-row{grid-column:1/-1;order:3}
  .confirm .btn{flex:1}
  .dl-row .btn{flex:1 1 100%;justify-content:center}
  .ov-step{padding:14px}
  .aside-head{padding:16px}
  .aside-body{padding:12px}
}
</style>
</head>
<body></style>

<div class="wrap">
  <header class="top">
    <button class="brand" id="brand" aria-label="Go to home page">
      <span class="eyebrow">Performance Review Conversation Training</span>
      <h1>Review Conversation Planner</h1>
    </button>
    <div class="top-right">
      <button class="homebtn" id="homeBtn" hidden>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>
        Home
      </button>
    </div>
  </header>
  <nav class="progress" id="progress" aria-label="Progress"></nav>
  <main id="main"></main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const SECTIONS = [
  { name: "Prepare the employee", short: "Section 1" },
  { name: "Prepare yourself", short: "Section 2" }
];
const REACT_Q = "What reactions might come up, and how will you respond?";

const STEPS = [
  { id: "purpose", sec: 0, title: "Purpose, agenda, and outcomes",
    desc: "Before the performance review, outline its purpose, agenda, and intended outcomes. Explain what the review is meant to achieve, how the conversation will be structured, and what both you and the employee should walk away with.",
    fields: [
      { id: "purpose_q1", q: "What will you say to explain the purpose of the review and what you’ll discuss?" },
      { id: "purpose_q2", q: "What will you say to explain what you want to accomplish during the review?" } ] },
  { id: "sources", sec: 0, title: "Who you’ll talk to and what sources you’ll review",
    desc: "Let the employee know who you’ll talk to and what sources you’ll use to review their performance.",
    fields: [ { id: "sources_q1", q: "Who will you speak with, and what information will you use to review the employee’s performance?" } ] },
  { id: "selfeval", sec: 0, title: "Self-evaluation",
    desc: "Explain why the self-evaluation is important and what the employee should think about before the review.",
    fields: [
      { id: "selfeval_q1", q: "Why is self-evaluation important?" },
      { id: "selfeval_q2", q: "What questions will you ask the employee to think about before the review?" } ] },
  { id: "data", sec: 1, title: "Employee data and examples",
    desc: "Pull together the evidence you’ll rely on: measurable results, specific examples, and feedback from the people the employee works with.",
    fields: [
      { id: "data_q1", q: "What measurable performance data have you gathered about the employee’s performance?" },
      { id: "data_q2", q: "What specific examples demonstrate where the employee was effective or struggled to achieve their goals?" },
      { id: "data_q3", q: "What feedback have coworkers, stakeholders, or customers shared about the employee during the performance period?" } ] },
  { id: "message", sec: 1, title: "Preparing your message",
    desc: "Decide what you’ll focus on so the conversation stays clear and forward-looking.",
    fields: [
      { id: "message_q1", q: "Which key responsibilities will you focus on during the review?" },
      { id: "message_q2", q: "What are the employee’s top two or three strengths that will help them succeed in the future?" },
      { id: "message_q3", q: "What are the top two or three areas where the employee should grow or improve?" },
      { id: "message_q4", q: "What are the two or three key areas you want the employee to focus on in the next performance period?" } ] },
  { id: "reactions", sec: 1, type: "reactions", title: "Prepare and Plan for Reactions",
    desc: "Below are some common reactions during a performance review. Use them as a starting point and note how you plan to respond.",
    examples: [
      ["When discussing the purpose and outcomes:", "They may ask about a pay raise, promotion, or more responsibility."],
      ["When asking for their perspective:", "They may be unprepared, hesitant to share, bring too much information, or focus on behaviors instead of results."],
      ["When sharing feedback:", "They may become defensive, interrupt, shift blame, or disengage."] ],
    fields: [ { id: "react_q1", q: REACT_Q } ] }
];
const qLabel = f => f.q;


let state;
let hideSum = false;
const panelIcon = () => '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></svg>';
function reset() { state = { view: "intro", idx: 0, answers: {}, status: {}, errors: {} }; }
reset();

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const secSteps = sec => STEPS.filter(s => s.sec === sec);
const stepPos = step => secSteps(step.sec).indexOf(step) + 1;
const hasProgress = () => Object.keys(state.status).length > 0;
const errSvg = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 7v6M12 17h.01"/></svg>';
const arrow = () => '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
const pdfIcon = () => '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/></svg>';
const dlIcon = () => '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>';

/* ---------- Header + progress ---------- */
function renderChrome() {
  $("#homeBtn").hidden = state.view === "intro";
  $("#brand").disabled = state.view === "intro";
  const cur = state.view === "step" ? STEPS[state.idx] : null;
  const seg = s => {
    const cls = cur && cur.id === s.id ? "current" : (state.status[s.id] || "");
    return `<button class="seg ${cls}" data-go="${STEPS.indexOf(s)}" aria-label="${esc(s.title)}" title="${esc(s.title)}"></button>`;
  };
  const group = sec => `<div class="pgroup ${cur && cur.sec === sec ? "active" : ""}">
      <span class="plabel">${SECTIONS[sec].name}</span><div class="segs">${secSteps(sec).map(seg).join("")}</div></div>`;
  $("#progress").innerHTML = group(0) + group(1) +
    `<div class="pgroup pfinal ${state.view === "summary" ? "active" : ""}"><span class="plabel">Summary</span><button class="seg ${state.view === "summary" ? "current" : ""}" data-go="summary" aria-label="Overall summary" title="Overall summary"></button></div>`;
  $("#progress").hidden = state.view === "intro";
}

/* ---------- Section summary (right column) ---------- */
function asideHTML(sec) {
  const steps = secSteps(sec);
  const saved = steps.filter(s => state.status[s.id]);
  const allQs = steps.reduce((n, s) => n + s.fields.length, 0);
  const answered = saved.reduce((n, s) => n + s.fields.filter(f => (state.answers[f.id] || "").trim()).length, 0);
  const items = saved.flatMap(s => s.fields.map(f => {
    const a = (state.answers[f.id] || "").trim();
    return `<button class="qa-item" data-go="${STEPS.indexOf(s)}" data-focus="${f.id}" title="Edit this answer">
      <span class="q">${esc(qLabel(f))}</span>
      <span class="a ${a ? "" : "empty"}">${a ? esc(a) : "Not answered"}</span>
      <span class="edit">Edit</span></button>`;
  })).join("");
  return `<aside class="aside" aria-label="${SECTIONS[sec].name} summary">
    <div class="aside-head"><div class="aside-title"><h3>${SECTIONS[sec].name}</h3>
      <span class="aside-count">${answered} of ${allQs} questions answered</span></div>
      <button class="panelbtn" id="hideSum" aria-label="Hide summary panel">${panelIcon()} Hide</button></div>
    <div class="aside-body">${items || `<p class="aside-empty">Your answers will appear here as you save each step.</p>`}</div>
  </aside>`;
}

/* ---------- Views ---------- */

function renderIntro() {
  const resume = hasProgress();
  const firstOpen = STEPS.findIndex(s => state.status[s.id] !== "done");
  $("#main").innerHTML = `<div class="narrow"><section class="card fade">
    <div class="card-head">
      <h2>Plan a collaborative, focused review conversation</h2>
      <p class="lede">This interactive tool helps you prepare for your next performance review and keep the conversation focused, collaborative, and on track.</p>
      <p class="lede">Work through two short sections, Prepare Your Employee and Prepare Yourself, then review and download your plan.</p>
      <p><a class="textlink" id="exLink" href="review-conversation-planner-example.pdf" target="_blank" rel="noopener">${pdfIcon()} View an example plan (PDF)</a></p>
      <p class="status" id="exStatus" role="status" aria-live="polite"></p>
    </div>
    <div class="note"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
      <p>Nothing you enter into this tool is stored, saved, or sent anywhere. Your answers stay only while this page is open, and they clear when you reload or close it, or when you choose Clear all answers. It’s still good practice to protect employee privacy by not entering an employee’s real name or other personal information.</p></div>
    <div class="actions">
      ${resume ? `<div class="stat-row" id="clearArea"><button class="btn secondary" data-go="summary">View summary</button><button class="btn ghost" id="clearHome">Clear all answers</button></div>` : ""}
      <div class="right"><button class="btn primary" id="start">${resume ? "Continue where you left off" : "Start planning"} ${arrow()}</button></div></div>
  </section></div>`;
  $("#start").onclick = () => go(resume ? (firstOpen === -1 ? "summary" : firstOpen) : 0);
  const ch = $("#clearHome");
  if (ch) ch.onclick = () => {
    $("#clearArea").innerHTML = `<div class="confirm"><span>Clear every answer you’ve entered?</span><button class="btn ghost" id="keepHome">Keep answers</button><button class="btn danger" id="yesHome">Clear answers</button></div>`;
    $("#keepHome").onclick = renderIntro;
    $("#yesHome").onclick = () => { reset(); render(); };
  };
}

function fieldHTML(f) {
  const e = state.errors[f.id];
  return `<div class="field ${e ? "invalid" : ""}"><label for="${f.id}">${esc(f.q)}</label>
    <textarea id="${f.id}" data-f="${f.id}" placeholder="${f.id === "react_q1" ? "Note the reactions you expect and what you’ll say or do" : "Write what you plan to say or share"}">${esc(state.answers[f.id] || "")}</textarea>
    ${e ? `<div class="err">${errSvg}${e}</div>` : ""}</div>`;
}
function renderStep(focusId) {
  const step = STEPS[state.idx];
  const secN = secSteps(step.sec).length;
  const fields = step.type === "reactions"
    ? `<div class="examples"><span class="ex-label">Examples</span><ul>${step.examples.map(([k, v]) => `<li><b>${esc(k)}</b> ${esc(v)}</li>`).join("")}</ul></div>${step.fields.map(fieldHTML).join("")}`
    : step.fields.map(fieldHTML).join("");
  const last = state.idx === STEPS.length - 1;
  const nextLabel = last ? "Save and view summary" : (STEPS[state.idx + 1].sec !== step.sec ? "Save and start Section 2" : "Save and continue");
  const prevLabel = state.idx === 0 ? "Home" : (STEPS[state.idx - 1].sec !== step.sec ? "Back to Section 1" : "Back");
  $("#main").innerHTML = `<div class="layout ${hideSum ? "solo" : ""}">
    <div style="display:flex;flex-direction:column;gap:14px;min-width:0">
    <section class="card fade" aria-labelledby="stepTitle">
      <div class="card-head">
        <div class="kicker"><span class="pill ${step.sec ? "s2" : ""}">${SECTIONS[step.sec].short} · ${SECTIONS[step.sec].name}</span><span>Step ${stepPos(step)} of ${secN}</span>${hideSum ? `<button class="panelbtn" id="showSum" aria-label="Show summary panel">${panelIcon()} Show summary</button>` : ""}</div>
        <h2 id="stepTitle">${esc(step.title)}</h2>
        <p class="lede">${esc(step.desc)}</p>
      </div>
      <div class="fields">${fields}</div>
      <div class="actions">
        <button class="btn secondary" id="back">${prevLabel}</button>
        <div class="right"><button class="btn ghost" id="skip">Skip for now</button><button class="btn primary" id="next">${nextLabel} ${arrow()}</button></div>
      </div>
    </section></div>
    ${hideSum ? "" : asideHTML(step.sec)}
  </div>`;
  document.querySelectorAll("[data-f]").forEach(t => t.addEventListener("input", () => { state.answers[t.dataset.f] = t.value; clearErr(t); }));
  const hs = $("#hideSum"), ss = $("#showSum");
  if (hs) hs.onclick = () => { hideSum = true; renderStep(); $("#showSum").focus(); };
  if (ss) ss.onclick = () => { hideSum = false; renderStep(); $("#hideSum").focus(); };
  $("#back").onclick = () => go(state.idx === 0 ? "intro" : state.idx - 1);
  $("#skip").onclick = () => { if (state.status[step.id] !== "done") state.status[step.id] = "skipped"; advance(); };
  $("#next").onclick = () => { if (validate(step)) { state.status[step.id] = "done"; advance(); } else { renderStep(); focusFirstErr(); } };
  if (focusId) { const t = document.getElementById(focusId); if (t) { t.focus({ preventScroll: true }); t.scrollIntoView({ block: "center" }); } }
}
function clearErr(el) { const f = el.closest(".field.invalid"); if (f) { f.classList.remove("invalid"); f.querySelectorAll(":scope > .err").forEach(e => e.remove()); } }
function focusFirstErr() { const t = document.querySelector(".invalid textarea"); if (t) t.focus(); }
function validate(step) {
  const e = {};
  step.fields.forEach(f => { if (!(state.answers[f.id] || "").trim()) e[f.id] = "Add an answer to continue, or choose Skip for now."; });
  state.errors = e; return !Object.keys(e).length;
}
function advance() { state.idx === STEPS.length - 1 ? go("summary") : go(state.idx + 1); }

function renderSummary() {
  const done = STEPS.filter(s => state.status[s.id] === "done").length;
  const missing = STEPS.filter(s => state.status[s.id] !== "done");
  $("#main").innerHTML = `<div class="narrow" style="display:flex;flex-direction:column;gap:14px">
  <section class="card fade" aria-labelledby="sumTitle">
    <div class="card-head">
      <div class="kicker"><span class="pill s2">Overall summary</span><span>${done} of ${STEPS.length} steps complete</span></div>
      <h2 id="sumTitle">Your review conversation plan</h2>
      <p class="lede">Everything you entered, in the order you’ll use it. Edit any step, then download a copy to bring to the conversation.</p>
      ${missing.length ? `<div class="stat-row"><span class="hint">Still open:</span>${missing.map(s => `<button class="linkbtn" data-go="${STEPS.indexOf(s)}">${esc(s.title)}</button>`).join("")}</div>` : ""}
    </div>
    ${[0, 1].map(sec => `<div class="ov-sec"><h3><span class="pill ${sec ? "s2" : ""}">${SECTIONS[sec].short}</span>${SECTIONS[sec].name}</h3>
      ${secSteps(sec).map(s => `<div class="ov-step"><div class="ov-step-head"><h4>${esc(s.title)}</h4><button class="linkbtn" data-go="${STEPS.indexOf(s)}">Edit</button></div>
        ${s.fields.map(f => { const a = (state.answers[f.id] || "").trim();
          return `<div class="qa"><span class="q">${esc(qLabel(f))}</span><span class="a ${a ? "" : "empty"}">${a ? esc(a) : "Not answered"}</span></div>`; }).join("")}</div>`).join("")}
    </div>`).join("")}
    <div class="dl">
      <h3>Download your plan</h3>
      <p class="hint">Save a copy before you close this page. Your answers aren’t kept anywhere once you leave.</p>
      <div class="dl-row">
        <button class="btn primary" id="dlDocx">${dlIcon()} Word document (.docx)</button>
        <button class="btn blue" id="dlPdf">${dlIcon()} PDF</button>
        <button class="btn secondary" id="copyTxt">Copy as text</button>
      </div>
      <div class="status" id="dlStatus" role="status" aria-live="polite"></div>
      <textarea id="copyFallback" hidden readonly aria-label="Plan text to copy"></textarea>
    </div>
    <div class="actions">
      <button class="btn secondary" id="backLast">Back to last step</button>
      <div class="right" id="resetArea"><button class="btn ghost" id="startOver">Start over</button></div>
    </div>
  </section></div>`;
  $("#backLast").onclick = () => go(STEPS.length - 1);
  $("#startOver").onclick = () => {
    $("#resetArea").innerHTML = `<div class="confirm"><span>Clear every answer?</span><button class="btn ghost" id="noReset">Keep answers</button><button class="btn danger" id="yesReset">Clear and start over</button></div>`;
    $("#noReset").onclick = renderSummary; $("#yesReset").onclick = () => { reset(); render(); };
  };
  $("#dlDocx").onclick = () => download("docx");
  $("#dlPdf").onclick = () => download("pdf");
  $("#copyTxt").onclick = copyText;
  if (downloadsChecked && !downloadsApi) { $("#dlDocx").disabled = true; $("#dlPdf").disabled = true; setStatus("File downloads aren’t available in this view. Use Copy as text instead.", "bad"); }
}

function go(t, focusId) {
  if (t === "intro") state.view = "intro";
  else if (t === "summary") state.view = "summary";
  else { state.view = "step"; state.idx = +t; }
  state.errors = {}; render(focusId);
  if (!focusId) window.scrollTo({ top: 0, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
}
function render(focusId) {
  renderChrome();
  if (state.view === "intro") renderIntro(); else if (state.view === "summary") renderSummary(); else renderStep(focusId);
}
document.addEventListener("click", e => { const b = e.target.closest("[data-go]"); if (b) { e.preventDefault(); go(b.dataset.go, b.dataset.focus); } });
$("#homeBtn").onclick = () => go("intro");
$("#brand").onclick = () => go("intro");


/* ---------- Export model ---------- */
function model() {
  return [0, 1].map(sec => ({ title: SECTIONS[sec].short + ": " + SECTIONS[sec].name,
    steps: secSteps(sec).map(s => ({ title: s.title,
      items: s.fields.map(f => ({ q: qLabel(f), a: (state.answers[f.id] || "").trim() || "Not answered" })) })) }));
}
const DOC_TITLE = "Performance Review Conversation Plan";
const today = () => new Date().toLocaleDateString(undefined, { year: "numeric", month: "long", day: "numeric" });

function planText() {
  let t = DOC_TITLE + "\nPrepared " + today() + "\n";
  model().forEach(sec => { t += "\n\n" + sec.title.toUpperCase() + "\n";
    sec.steps.forEach(st => { t += "\n" + st.title + "\n";
      st.items.forEach(it => { t += "\n" + it.q + "\n" + it.a + "\n"; }); }); });
  return t.trim() + "\n";
}

/* DOCX */
const xesc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function run(text, o = {}) {
  const rpr = `<w:rPr><w:rFonts w:ascii="Calibri" w:hAnsi="Calibri" w:cs="Calibri"/>${o.b ? "<w:b/>" : ""}${o.color ? `<w:color w:val="${o.color}"/>` : ""}<w:sz w:val="${o.sz || 22}"/></w:rPr>`;
  return String(text).split("\n").map((line, i) => (i ? `<w:r>${rpr}<w:br/></w:r>` : "") + `<w:r>${rpr}<w:t xml:space="preserve">${xesc(line)}</w:t></w:r>`).join("");
}
function para(text, o = {}) {
  const ppr = `<w:pPr><w:spacing w:before="${o.before || 0}" w:after="${o.after ?? 120}"/>${o.border ? `<w:pBdr><w:bottom w:val="single" w:sz="8" w:space="4" w:color="D6DCE3"/></w:pBdr>` : ""}${o.keep ? "<w:keepNext/>" : ""}</w:pPr>`;
  return `<w:p>${ppr}${run(text, o)}</w:p>`;
}
async function buildDocx() {
  let body = para(DOC_TITLE, { b: true, sz: 40, color: "1B2430", after: 60 }) +
    para("Prepared " + today(), { sz: 20, color: "5B6675", after: 240 });
  model().forEach(sec => {
    body += para(sec.title, { b: true, sz: 30, color: "2F6F63", before: 360, after: 160, border: true, keep: true });
    sec.steps.forEach(st => {
      body += para(st.title, { b: true, sz: 25, color: "176480", before: 200, after: 100, keep: true });
      st.items.forEach(it => {
        body += para(it.q, { b: true, sz: 21, color: "5B6675", after: 40, keep: true });
        body += para(it.a, { sz: 22, color: it.a === "Not answered" ? "5B6675" : "1B2430", after: 160 });
      });
    });
  });
  const doc = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>${body}<w:sectPr><w:pgSz w:w="12240" w:h="15840"/><w:pgMar w:top="1260" w:right="1260" w:bottom="1260" w:left="1260" w:header="720" w:footer="720" w:gutter="0"/></w:sectPr></w:body></w:document>`;
  const zip = new JSZip();
  zip.file("[Content_Types].xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>`);
  zip.file("_rels/.rels", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>`);
  zip.file("word/document.xml", doc);
  return zip.generateAsync({ type: "blob", mimeType: "application/vnd.openxmlformats-officedocument.wordprocessingml.document" });
}

/* PDF */
function buildPdf() {
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({ unit: "pt", format: "letter" });
  const W = pdf.internal.pageSize.getWidth(), H = pdf.internal.pageSize.getHeight(), M = 60, CW = W - M * 2;
  let y = M;
  const rgb = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  const ensure = h => { if (y + h > H - M) { pdf.addPage(); y = M; } };
  const text = (s, { size = 11, bold = false, color = "#1B2430", gap = 4, keep = 0 } = {}) => {
    pdf.setFont("helvetica", bold ? "bold" : "normal"); pdf.setFontSize(size); pdf.setTextColor(...rgb(color));
    const lines = pdf.splitTextToSize(String(s), CW); const lh = size * 1.4;
    ensure(Math.min(lines.length, 2) * lh + keep);
    lines.forEach(l => { ensure(lh); pdf.text(l, M, y + size); y += lh; });
    y += gap;
  };
  text(DOC_TITLE, { size: 20, bold: true, gap: 2 });
  text("Prepared " + today(), { size: 10, color: "#5B6675", gap: 14 });
  model().forEach(sec => {
    y += 10; ensure(70);
    text(sec.title, { size: 15, bold: true, color: "#2F6F63", gap: 2 });
    pdf.setDrawColor(...rgb("#D6DCE3")); pdf.setLineWidth(1); pdf.line(M, y, W - M, y); y += 12;
    sec.steps.forEach(st => {
      text(st.title, { size: 12.5, bold: true, color: "#176480", gap: 6, keep: 40 });
      st.items.forEach(it => {
        text(it.q, { size: 10, bold: true, color: "#5B6675", gap: 2, keep: 16 });
        text(it.a, { size: 11, color: it.a === "Not answered" ? "#5B6675" : "#1B2430", gap: 10 });
      });
      y += 4;
    });
  });
  const n = pdf.getNumberOfPages();
  for (let i = 1; i <= n; i++) { pdf.setPage(i); pdf.setFont("helvetica", "normal"); pdf.setFontSize(8.5); pdf.setTextColor(...rgb("#5B6675"));
    pdf.text(DOC_TITLE + "  ·  Page " + i + " of " + n, M, H - 30); }
  return pdf.output("blob");
}

/* ---------- Downloads ---------- */
let downloadsChecked = true;
const downloadsApi = { save: async ({ filename, data }) => {
  const blob = data instanceof Blob ? data : new Blob([data]);
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  return { status: "saved" };
} };
function setStatus(msg, kind = "") { const s = $("#dlStatus"); if (s) { s.textContent = msg; s.className = "status " + kind; } }
async function download(kind) {
  if (!downloadsApi) { setStatus(downloadsChecked ? "File downloads aren’t available in this view. Use Copy as text instead." : "Downloads are still loading. Try again in a moment.", "bad"); return; }
  const btn = kind === "pdf" ? $("#dlPdf") : $("#dlDocx"); btn.disabled = true;
  setStatus("Preparing your " + (kind === "pdf" ? "PDF" : "Word document") + "…");
  try {
    const data = kind === "pdf" ? buildPdf() : await buildDocx();
    await downloadsApi.save({ filename: "review-conversation-plan." + kind, data });
    setStatus("Downloaded review-conversation-plan." + kind + ".", "good");
  } catch (e) {
    const code = e && e.code;
    const msg = code === "declined" ? "Download canceled. Choose a format again whenever you’re ready."
      : code === "rate_limited" ? "A download prompt is already open. Finish that one, then try again."
      : (code === "rejected_extension" || code === "extension_not_enabled") ? "That file format isn’t available here. Try the other format or Copy as text."
      : "The file couldn’t be created here. Use Copy as text instead.";
    setStatus(msg, code === "declined" ? "" : "bad");
  } finally { btn.disabled = false; }
}
async function openExample(e) {
  if (!downloadsApi) return; // fall back to opening the link
  e.preventDefault();
  const st = $("#exStatus");
  try {
    const res = await fetch("review-conversation-planner-example.pdf"); if (!res.ok) throw new Error();
    await downloadsApi.save({ filename: "example-review-conversation-plan.pdf", data: await res.blob() });
    st.textContent = ""; st.className = "status";
  } catch (err) {
    if (err && err.code === "declined") return;
    st.textContent = "The example couldn’t be opened here. Try again in a moment."; st.className = "status bad";
  }
}
async function copyText() {
  const txt = planText();
  try { await navigator.clipboard.writeText(txt); setStatus("Copied your plan as plain text.", "good"); }
  catch { const ta = $("#copyFallback"); ta.hidden = false; ta.value = txt; ta.style.minHeight = "200px"; ta.focus(); ta.select();
    setStatus("Your browser blocked copying. The text is selected below; press Ctrl+C or ⌘C to copy it."); }
}

render();
</script>
