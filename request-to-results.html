<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Request to Results</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&family=Literata:opsz,wght@7..72,600&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* ===== Talent Workspace UI (talent-ui.css tokens) ===== */
/* Layout: white app bar with a "View as" switch; stakeholder portal (request list → overview) or L&D workspace (dashboard → 7-stage project workspace with a stage-tracking side panel). At 760px and below (same as the original), panels stack into one column. */
:root{
  --font-sans:Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:22px;--space-6:28px;--space-7:32px;--space-8:56px;
  --radius-sm:8px;--radius-md:10px;--radius-lg:12px;--radius-xl:14px;--radius-pill:999px;
  --bg:#F7F8FA;--surface:#FFFFFF;--surface-alt:#F1F3F5;--ink:#111827;--ink-soft:#5B6472;--line:#E5E7EB;--line-strong:#8A9099;
  --accent:#0F766E;--accent-hover:#0B5F58;--on-accent:#FFFFFF;--accent-soft:#E6F4F2;--focus-ring:rgba(15,118,110,0.25);
  --info:#1D4ED8;--info-soft:#EEF3FF;--warning:#B54708;--warning-soft:#FEF3E2;--error:#B42318;--error-soft:#FEECEB;
  --shadow-sm:0 1px 2px rgba(16,24,40,0.05);
  --shadow-card:0 1px 2px rgba(16,24,40,0.04), 0 6px 20px -4px rgba(16,24,40,0.07);
  --shadow-lift:0 2px 4px rgba(16,24,40,0.06), 0 10px 28px -6px rgba(16,24,40,0.12);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1113;--surface:#171B1F;--surface-alt:#1F2429;--ink:#ECEEF0;--ink-soft:#9AA3AD;--line:#2A3036;--line-strong:#6B747E;
    --accent:#3CC4B4;--accent-hover:#62D3C6;--on-accent:#04201C;--accent-soft:rgba(60,196,180,0.13);--focus-ring:rgba(60,196,180,0.3);
    --info:#8AB4F8;--info-soft:rgba(138,180,248,0.13);--warning:#F5B45C;--warning-soft:rgba(245,180,92,0.13);--error:#F28B82;--error-soft:rgba(242,139,130,0.13);
    --shadow-sm:0 1px 2px rgba(0,0,0,0.4);
    --shadow-card:0 1px 2px rgba(0,0,0,0.4), 0 8px 24px -6px rgba(0,0,0,0.5);
    --shadow-lift:0 2px 4px rgba(0,0,0,0.45), 0 12px 30px -6px rgba(0,0,0,0.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1113;--surface:#171B1F;--surface-alt:#1F2429;--ink:#ECEEF0;--ink-soft:#9AA3AD;--line:#2A3036;--line-strong:#6B747E;
  --accent:#3CC4B4;--accent-hover:#62D3C6;--on-accent:#04201C;--accent-soft:rgba(60,196,180,0.13);--focus-ring:rgba(60,196,180,0.3);
  --info:#8AB4F8;--info-soft:rgba(138,180,248,0.13);--warning:#F5B45C;--warning-soft:rgba(245,180,92,0.13);--error:#F28B82;--error-soft:rgba(242,139,130,0.13);
  --shadow-sm:0 1px 2px rgba(0,0,0,0.4);
  --shadow-card:0 1px 2px rgba(0,0,0,0.4), 0 8px 24px -6px rgba(0,0,0,0.5);
  --shadow-lift:0 2px 4px rgba(0,0,0,0.45), 0 12px 30px -6px rgba(0,0,0,0.6);
  color-scheme:dark;
}
/* Tool aliases: the app's scripts reference these names in inline styles, so they point at Talent Workspace tokens (they follow light/dark automatically). */
:root{
  --sunk:var(--surface-alt);--ink-2:var(--ink-soft);--ink-3:var(--ink-soft);--accent-ink:var(--on-accent);
  --ok:var(--accent);--ok-soft:var(--accent-soft);--warn:var(--warning);--warn-soft:var(--warning-soft);--bad:var(--error);--bad-soft:var(--error-soft);
  --pop:var(--info);--pop-ink:var(--on-accent);--pop-edge:var(--info);
  --band:var(--surface);--band-ink:var(--ink);--band-2:var(--ink-soft);
  --f-display:var(--font-sans);--f-body:var(--font-sans);--f-mono:var(--font-sans);
  --r:var(--radius-md);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
html,body{margin:0;background:var(--bg)}
body{color:var(--ink);font-family:var(--font-sans);font-size:14.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--font-sans);font-weight:650;letter-spacing:-.022em;text-wrap:balance;margin:0}
h1{font-size:clamp(26px,3.4vw,32px);line-height:1.15}
h2{font-size:21px;line-height:1.25}
h3{font-size:17px;line-height:1.3}
p{margin:0}
a{color:var(--accent)}
.mono{font-family:var(--font-sans);font-size:.92em;letter-spacing:.01em}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--accent)}
.muted{color:var(--ink-soft)}
.small{font-size:13px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:none;box-shadow:0 0 0 4px var(--focus-ring)}
tr:focus-visible{box-shadow:none;outline:2px solid var(--accent);outline-offset:-2px}

/* app bar */
.appbar{background:var(--surface);color:var(--ink);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:8}
.appbar-in{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 20px;padding-block:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:32px;height:32px;border-radius:var(--radius-md);background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-family:var(--font-sans);font-size:11.5px;font-weight:700;letter-spacing:.02em;flex:none}
.brand-name{font-weight:650;font-size:15px;letter-spacing:-.01em;line-height:1.3}
.brand-sub{font-size:12.5px;color:var(--ink-soft)}
.viewas{display:flex;align-items:center;gap:8px}
.viewas .lbl{font-size:13px;color:var(--ink-soft);font-weight:600;white-space:nowrap;margin-left:6px}
.switch{display:inline-flex;background:var(--surface-alt);border-radius:var(--radius-md);padding:3px;gap:2px}
.switch button{appearance:none;border:0;background:none;color:var(--ink-soft);padding:7px 14px;border-radius:var(--radius-sm);font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap;transition:background .15s,color .15s,box-shadow .15s}
.switch button:hover{color:var(--ink)}
.switch button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm),inset 0 0 0 1px var(--line)}

/* guide */
.guide{margin-top:18px;border:1px solid var(--line);background:var(--surface);border-radius:var(--radius-xl);padding:16px 18px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px 20px;align-items:start;box-shadow:var(--shadow-card)}
.guide p{color:var(--ink-soft);max-width:72ch;font-size:14px}
.guide ol{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.guide li button{appearance:none;border:1px solid var(--line-strong);background:var(--surface);border-radius:var(--radius-pill);padding:6px 12px;font-size:13px;cursor:pointer;display:flex;gap:8px;align-items:center}
.guide li button:hover{border-color:var(--accent)}
.guide li .n{font-size:11px;font-weight:700;color:var(--accent)}
.guide-actions{display:flex;gap:8px;flex-wrap:wrap}
.guide.compact{display:flex;justify-content:flex-end;border:0;background:none;padding:0;box-shadow:none}

/* generic */
main{padding-block:24px 72px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-xl);padding:24px;min-width:0;box-shadow:var(--shadow-card);color:var(--ink)}
.btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);padding:10px 18px;min-height:44px;border-radius:var(--radius-md);font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap;box-shadow:var(--shadow-sm);transition:background .15s,box-shadow .15s,transform .15s,border-color .15s,color .15s}
.btn:hover:not(:disabled){background:var(--surface-alt)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover:not(:disabled){background:var(--accent-hover);border-color:var(--accent-hover);transform:translateY(-1px);box-shadow:var(--shadow-lift)}
.btn.primary:active:not(:disabled){transform:none}
.btn.warn{border-color:var(--warning);color:var(--warning)}
.btn.warn:hover:not(:disabled){background:var(--warning-soft)}
.btn.sm{padding:6px 12px;min-height:34px;font-size:13px}
.btn.ghost{border-color:transparent;background:none;box-shadow:none;padding-inline:10px;color:var(--ink-soft)}
.btn.ghost:hover:not(:disabled){color:var(--ink);background:var(--surface-alt)}
.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.linkbtn{appearance:none;border:0;background:none;color:var(--accent);font-weight:600;cursor:pointer;padding:0;font-size:14px;border-radius:4px}
.linkbtn:hover{color:var(--accent-hover);text-decoration:underline;text-underline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.between{justify-content:space-between}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 8px;border-radius:var(--radius-pill);font-size:12px;font-weight:600;white-space:nowrap;background:var(--surface-alt);color:var(--ink-soft);line-height:1.5}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.pill.plain{padding-left:10px}
.pill.plain::before{display:none}
/* status colours: done → accent, in progress → accent-soft, new → info, attention → warning, problem → error */
.st-Completed,.st-Closed,.st-Approved,.st-Exceeded-target,.st-Met-target{background:var(--accent);color:var(--on-accent)}
.st-In-Progress,.st-Active,.st-Consultation-Scheduled,.st-In-progress{background:var(--accent-soft);color:var(--accent)}
.st-Awaiting-Input,.st-Awaiting-Approval,.st-Under-Review,.st-On-Hold,.st-Follow-Up-Required,.st-Pending,.st-Revisions-Requested,.st-Improved-below-target,.st-Awaiting-your-approval,.st-Medium{background:var(--warning-soft);color:var(--warning)}
.st-Skipped,.st-Not-needed{background:transparent;color:var(--ink-soft);box-shadow:inset 0 0 0 1px var(--line-strong)}
.st-Cancelled,.st-Rejected,.st-Overdue,.st-Below-target,.st-Not-ready-for-the-change,.st-High,.st-Critical,.st-No-improvement{background:var(--error-soft);color:var(--error)}
.st-You-submitted-this{background:var(--info);color:var(--on-accent)}
.st-Submitted,.st-New{background:var(--info-soft);color:var(--info)}
.st-Pending{background:var(--warning-soft);color:var(--warning)}
.st-Low{background:var(--surface-alt);color:var(--ink-soft)}
.usewrap{font-size:12.5px;align-self:flex-start;color:var(--ink-soft)}
.usewrap .linkbtn{font-size:12.5px;color:var(--info)}
.appbar-in{position:relative}
.bell{appearance:none;border:0;background:none;color:var(--ink-soft);width:38px;height:38px;border-radius:var(--radius-md);display:grid;place-items:center;cursor:pointer;position:relative;transition:background .15s,color .15s}
.bell:hover{background:var(--surface-alt);color:var(--ink)}
.bell .badge{position:absolute;top:1px;right:0;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--info);color:var(--on-accent);font-size:11px;font-weight:700;display:grid;place-items:center;font-variant-numeric:tabular-nums;box-shadow:0 0 0 2px var(--surface)}
.notes-panel{position:absolute;top:calc(100% + 4px);right:max(24px,env(safe-area-inset-right,0px));width:min(380px,calc(100vw - 32px));max-height:min(70vh,520px);overflow:auto;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow-lift);z-index:30}
.note{appearance:none;display:grid;grid-template-columns:10px minmax(0,1fr);gap:10px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:12px 14px;cursor:pointer;font-size:14px;color:var(--ink)}
.note:last-child{border-bottom:0}
.note:hover{background:var(--surface-alt)}
.note .dot{width:8px;height:8px;border-radius:50%;margin-top:7px;background:transparent}
.note.unread .dot{background:var(--info)}
.note.unread{font-weight:600}
.inbox{display:flex;flex-direction:column;gap:8px;margin-bottom:18px}
.inbox-item{appearance:none;display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:left;padding:12px 16px;border:1px solid var(--line);border-left:4px solid var(--info);border-radius:var(--radius-lg);background:var(--info-soft);color:var(--ink);font:inherit;font-size:14.5px;cursor:pointer;transition:box-shadow .15s}
.inbox-item:hover{box-shadow:var(--shadow-card)}
.inbox-item .dot{width:9px;height:9px;border-radius:50%;background:var(--info)}
.inbox-item .go{font-weight:700;color:var(--info);white-space:nowrap}
.pop{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;margin-bottom:14px;border-radius:var(--radius-lg);background:var(--info-soft);color:var(--ink);border:1px solid var(--line);border-left:4px solid var(--info);box-shadow:var(--shadow-sm);font-size:14.5px;line-height:1.5}
.pop svg{flex:none;margin-top:1px;color:var(--info)}
.pop svg path{stroke:var(--surface)}
.followup{margin-top:10px;padding:12px 14px;border-left:3px solid var(--warning);background:var(--warning-soft);border-radius:0 var(--radius-md) var(--radius-md) 0}
.st-Yes{background:var(--accent);color:var(--on-accent)}
.st-Partially{background:var(--warning-soft);color:var(--warning)}
.st-No{background:var(--error-soft);color:var(--error)}
.drop{border:1.5px dashed var(--line-strong);border-radius:var(--radius-lg);padding:20px 16px;text-align:center;background:var(--surface-alt);cursor:pointer;color:var(--ink-soft);font-size:14px;transition:background .15s,border-color .15s}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop b{color:var(--accent)}
.filelist{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.filelist li{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 8px;border:1px solid var(--line);border-radius:var(--radius-md);background:var(--surface);font-size:14px;box-shadow:var(--shadow-sm)}
.filelist img{width:36px;height:36px;object-fit:cover;border-radius:var(--radius-sm)}
.filelist .ext{width:36px;height:36px;border-radius:var(--radius-sm);background:var(--accent-soft);display:grid;place-items:center;font-size:10px;font-weight:700;letter-spacing:.03em;color:var(--accent)}
.filelist .fn{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:var(--radius-pill);white-space:nowrap}
.tag.internal{background:var(--surface-alt);color:var(--ink-soft)}
.tag.shared{background:var(--info-soft);color:var(--info)}
.lock{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--ink-soft)}
.lock svg{flex:none;margin-top:3px}
.empty{padding:36px 26px;border:1.5px dashed var(--line);border-radius:var(--radius-xl);text-align:center;color:var(--ink-soft)}
.empty h3{color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:11px 16px;border-radius:var(--radius-md);font-size:14px;font-weight:500;z-index:70;max-width:calc(100% - 32px);box-shadow:var(--shadow-lift)}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px 20px}
.kv dt{font-size:11.5px;color:var(--ink-soft);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.kv dd{margin:3px 0 0;font-weight:600;overflow-wrap:anywhere}
.kv div{min-width:0}

/* forms */
.fields{display:grid;grid-template-columns:1fr 1fr;gap:20px 20px}
.field{display:flex;flex-direction:column;gap:8px;min-width:0}
.field.full{grid-column:1/-1}
.qrow{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline;justify-content:space-between}
.q{font-weight:600;font-size:13.5px;color:var(--ink)}
.q .req{color:var(--warning);margin-left:3px}
.q .opt{color:var(--ink-soft);font-weight:400;font-size:12.5px;margin-left:6px}
.ess{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--warning);margin-left:8px}
.hint{font-size:12.5px;color:var(--ink-soft)}
input[type=text],input[type=email],input[type=url],input[type=number],input[type=date],input[type=search],select,textarea{width:100%;min-height:44px;font:400 14.5px var(--font-sans);color:var(--ink);background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--radius-md);padding:10px 14px;outline:none;transition:border-color .15s,box-shadow .15s}
input:hover:not(:disabled),select:hover:not(:disabled),textarea:hover:not(:disabled){border-color:var(--ink-soft)}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--focus-ring)}
::placeholder{color:var(--ink-soft);opacity:1}
input[type=date],input[type=number]{font-variant-numeric:tabular-nums}
select{appearance:none;cursor:pointer;padding-right:40px;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' stroke='%238A9099' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>");
  background-repeat:no-repeat;background-position:right 15px center}
select option,select optgroup{color:var(--ink);background:var(--surface)}
textarea{min-height:96px;resize:vertical;line-height:1.55}
input:disabled,textarea:disabled,select:disabled{opacity:.5;background:var(--surface-alt);cursor:not-allowed}
input[type=checkbox],input[type=radio]{accent-color:var(--accent)}
.affix{display:flex;align-items:center;border:1px solid var(--line-strong);border-radius:var(--radius-md);background:var(--surface);padding-inline:12px;gap:6px;transition:border-color .15s,box-shadow .15s}
.affix:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px var(--focus-ring)}
.affix input{border:0!important;padding-inline:0!important;min-width:0;background:none;box-shadow:none!important}
.affix span{color:var(--ink-soft);font-size:14px}
.field.invalid input,.field.invalid select,.field.invalid textarea,.field.invalid .seg,.field.invalid .chips,.field.invalid .affix{border-color:var(--error);box-shadow:0 0 0 4px var(--error-soft)}
.field.invalid .affix input{box-shadow:none}
.field .err{display:none;font-size:12.5px;font-weight:600;color:var(--error)}
.field.invalid .err{display:block}
.field.invalid > .qrow .q .req,.field.invalid > .req-note .req,.field.invalid .q .req{color:var(--error);font-size:1.35em;font-weight:800;line-height:0;vertical-align:-.12em}
.field.flagged > :not(.qrow):not(.flagnote){opacity:.45}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line-strong);border-radius:var(--radius-md);overflow:hidden;width:max-content;max-width:100%;background:var(--surface)}
.seg label{position:relative}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:block;padding:9px 16px;cursor:pointer;font-weight:500;font-size:13.5px;border-right:1px solid var(--line);transition:background .15s,color .15s}
.seg label:hover span{background:var(--surface-alt)}
.seg label:last-child span{border-right:0}
.seg input:checked+span{background:var(--accent);color:var(--on-accent);font-weight:600}
.seg input:disabled+span{cursor:not-allowed}
.seg input:focus-visible+span{box-shadow:inset 0 0 0 3px var(--focus-ring)}
.chips{display:flex;flex-wrap:wrap;gap:8px;border-radius:var(--radius-md)}
.chips label{position:relative}
.chips input{position:absolute;opacity:0;pointer-events:none}
.chips span{display:inline-block;padding:6px 13px;border:1px solid var(--line-strong);border-radius:var(--radius-pill);font-size:13px;cursor:pointer;background:var(--surface);transition:background .15s,border-color .15s,color .15s}
.chips label:hover span{border-color:var(--ink-soft)}
.chips input:checked+span{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.chips input:focus-visible+span{box-shadow:0 0 0 4px var(--focus-ring)}

/* solution format, from the intervention types chosen in Solution Recommendation */
const FMT_LEARN=["E-learning","Instructor-led training","Virtual instructor-led training","Blended learning","Coaching or mentoring"];
const FMT_LABEL={learning:"Training or learning event",support:"Job aid or performance support",process:"Process or workflow change"};
function typesChosen(p){return(p.phases[4].data.types||[]).length>0}
function formats(p){const t=p.phases[4].data.types||[];const f=new Set();
  if(t.some(x=>FMT_LEARN.includes(x)))f.add("learning");
  if(t.includes("Job aids or performance support"))f.add("support");
  if(t.includes("Process or workflow improvements"))f.add("process");
  if(!f.size)f.add(p.training===false?"process":"learning");return f}
const isVisible=(x,p)=>(!x.when||x.when.some(w=>formats(p).has(w)))&&(!x.whenNot||!x.whenNot.some(w=>formats(p).has(w)));
function visSections(p,n){return PHASES[n-1].sections.filter(s=>isVisible(s,p)).map(s=>({...s,name:typeof s.name==="function"?s.name(p):s.name,fields:s.fields.filter(f=>isVisible(f,p))})).filter(s=>s.fields.length)}

  const hi=m.dir!=="lower";const d=Math.round((a-b)*100)/100;const unit=m.unit==="%"?" pts":m.unit==="#"?"":" "+m.unit;
  const chg=(d>0?"+":"")+d+unit;const better=hi?a-b:b-a;

function syncMetrics(p){
  const k=p.phases[2].data.kpis;if(!Array.isArray(k))return;const d=p.phases[7].data;let m=Array.isArray(d.metrics)?d.metrics:[];

    if(!r){r={kid:x.kid,actual:""};const at=m.findIndex(y=>!y.kid);m.splice(at<0?m.length:at,0,r)}

function filled(f,store){
  if(store[f.id+"__flag"])return true;const v=store[f.id];
  if(f.type==="rca")return v&&Object.keys(v).length>=21;
  if(f.type==="repeat")return Array.isArray(v)&&v.some(x=>String(x).trim());
  if(f.type==="kpis")return Array.isArray(v)&&v.some(x=>String(x.metric||"").trim());
  if(f.type==="yndet"&&v===(f.revealOn||"Yes")&&f.detail&&!String(store[f.detail]||"").trim())return false;
  if(f.type==="gaps")return Array.isArray(v)&&v.some(x=>String(x.current||"").trim()||String(x.should||"").trim());
  if(f.type==="people")return v==="No"||(v==="Yes"&&(store[f.list]||[]).some(x=>String(x.name||"").trim()));
  if(f.type==="metrics")return Array.isArray(v)&&v.length>0&&v.every(x=>x.actual!==""&&x.actual!==undefined&&x.actual!==null);
  if(Array.isArray(v))return v.length>0;
  if(f.type==="email")return/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(v||"").trim());
  if(f.type==="number")return v!==""&&v!==undefined&&v!==null&&+v>=1;
  return v!==undefined&&v!==null&&String(v).trim()!=="";
}
function missing(p,n){
  const ph=PHASES[n-1],st=p.phases[n];const out=[];
  if(n>1)visSections(p,n).flatMap(s=>s.fields).forEach(f=>{if(f.ess&&!filled(f,st.data))out.push("data."+f.id);if(f.other&&(st.data[f.id]||[]).includes("Other")&&!String(st.data[f.other]||"").trim())out.push("data."+f.other);if(f.followup&&String(st.data[f.id]||"").trim()&&!String(st.data[f.followup.id]||"").trim())out.push("data."+f.followup.id)});
  ph.track.forEach(f=>{if(f.ess&&f.type!=="auto"&&(!f.showIf||f.showIf(p))&&!filled(f,st.track))out.push("track."+f.id)});
  return out;
}
function gate(p,n){
  const t=p.phases[n].track,d=p.phases[n].data;
  if(n===1&&!p.consultant)return"Assign a consultant before completing intake.";
  if(n===4&&t.approvalStatus!=="Approved")return"This stage needs stakeholder approval first. Use Send for approval.";
  if(n===5){const dl=d.deliverables||[];if(dl.some(x=>x.status!=="Completed"))return"All deliverables must be completed before moving to Implementation.";if(t.finalApproval!=="Approved")return"Final approval status must be Approved.";}
  if(n===7&&openActions(p).length){const k=openActions(p).length;return`${k} follow-up ${k===1?"action is":"actions are"} still open, so the project stays in follow-up. Mark them Done to close it.`}
  return null;
}

  run(){wtResetApproval();wtStage("LPR-260902-MGR7",4,["B"])},sel:'.acc[data-sec="B"]',block:"start"},
 {t:"Review and Approve the Solution",x:"Dana reviews the proposed solution and can approve it with one click or submit follow-up questions through the system to the L&D team.",extra:1500,
  run(){wtResetApproval();ui.mode="stakeholder";ui.persona="Dana Brooks";ui.sTab="requests";ui.sProject="LPR-260902-MGR7";render();window.scrollTo(0,0);
   wtLater(()=>{const b=wtq('[data-act="approve"]');if(b){b.click();requestAnimationFrame(wtScroll)}},4200)},sel:()=>wtq(".action")?".action":".agreed"},
 {t:"Design and Plan the Solution",x:"The designer maps skills, activities, and assessments to each learning objective, then uploads the solution outline and supporting documentation and enters deliverables and timelines for L&D team visibility.",
  run(){wtStage("LPR-260818-LDR2",5,["LO"])},sel:'[data-fid="data.activityPlan"]',block:"start"},
 {t:"Assess Change Readiness",x:"A change readiness assessment confirms whether the organization is prepared to implement the solution. If it’s not ready, the solution gets flagged.",
  run(){wtStage("LPR-260720-ONB5",6,["CR"])},sel:'.acc[data-sec="CR"]',block:"start"},
 {t:"Evaluate Results",x:"Evaluation compares actual results against the baseline and targets established during Performance Analysis.",
  run(){wtStage("LPR-260414-CSV3",7,["C"])},sel:'[data-fid="data.metrics"]'},
 {t:"Review Business Impact",x:"Results from all projects are consolidated into a single view of the outcomes that matter most to leaders.",
  run(){ui.mode="ld";ui.ldScreen="dash";ui.filters={};render();window.scrollTo(0,0)},sel:".wins",block:"start"},
 {t:"Closing: Your Turn to Explore",x:"That completes the full cycle. Now try it yourself by submitting a stakeholder request or exploring the L&D workspace.",end:1,
  run(){},sel:null}
];
function wtDur(s){const w=(s.t+" "+s.x).split(/\s+/).length;return Math.max(5500,w*235+2000)+(s.extra||0)}
function wtTarget(){const s=WT_STEPS[WT.i];if(!s||!s.sel)return null;return wtq(typeof s.sel==="function"?s.sel():s.sel)}
function wtScroll(){const el=wtTarget();if(!el)return;const r=el.getBoundingClientRect(),bar=$(".appbar").getBoundingClientRect().height,pl=($("#wt")||{}).offsetHeight||0;
  const top=bar+14,avail=innerHeight-pl-top-24;let y=r.top+scrollY-top;if(WT_STEPS[WT.i].block!=="start"&&r.height<avail)y-=(avail-r.height)/2;
  window.scrollTo({top:Math.max(0,y),behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"instant":"smooth"})}
function wtLoop(){if(!WT.on)return;const ring=$("#wtRing"),el=wtTarget();
  if(el&&ring){const r=el.getBoundingClientRect(),p=6;ring.hidden=false;Object.assign(ring.style,{left:r.left-p+"px",top:r.top-p+"px",width:r.width+2*p+"px",height:r.height+2*p+"px"})}else if(ring)ring.hidden=true;
  const bar=$("#wtProg");if(bar){const e=WT.paused?WT.el:WT.el+(performance.now()-WT.t0);bar.style.width=Math.min(100,e/WT.dur*100)+"%";if(!WT.paused&&e>=WT.dur&&!WT_STEPS[WT.i].end)wtGo(WT.i+1)}
  WT.raf=requestAnimationFrame(wtLoop)}
function wtPlayer(){const s=WT_STEPS[WT.i],n=WT_STEPS.length;let p=$("#wt");if(!p){p=document.createElement("div");p.id="wt";p.className="wt";p.setAttribute("role","dialog");p.setAttribute("aria-label","Walkthrough");document.body.appendChild(p)}
  p.innerHTML=`<div class="wt-top"><span class="wt-n">Step ${WT.i+1} of ${n}</span><div class="wt-dots" aria-hidden="true">${WT_STEPS.map((_,k)=>`<i class="${k<WT.i?"done":k===WT.i?"now":""}"></i>`).join("")}</div><button type="button" class="wt-x" data-wt="exit" aria-label="Close walkthrough">×</button></div>
   <h3 class="wt-t" aria-live="polite">${esc(s.t)}</h3><p class="wt-txt">${esc(s.x)}</p>
   ${s.end?`<div class="wt-ctl"><button type="button" class="btn sm" data-wt="replay">Replay</button><span class="wt-sp"></span><button type="button" class="btn sm" data-wt="ld">Explore the L&amp;D view</button><button type="button" class="btn sm primary" data-wt="sh">Try it as a stakeholder</button></div>`
   :`<div class="wt-bar"><i id="wtProg"></i></div><div class="wt-ctl"><button type="button" class="btn sm" data-wt="back" ${WT.i?"":"disabled"} aria-label="Previous step">‹ Back</button><button type="button" class="btn sm" data-wt="pause">${WT.paused?"▶ Play":"❚❚ Pause"}</button><span class="wt-sp"></span><button type="button" class="btn sm primary" data-wt="next">Next ›</button></div>`}`}
function wtGo(i){if(i<0||i>=WT_STEPS.length)return;WT.timers.forEach(clearTimeout);WT.timers=[];WT.i=i;WT.el=0;WT.t0=performance.now();const s=WT_STEPS[i];WT.dur=wtDur(s);
  try{s.run()}catch(e){console.error(e)}$("#toast").hidden=true;wtPlayer();requestAnimationFrame(()=>requestAnimationFrame(wtScroll))}
function wtStart(){if(WT.on)return;WT.snapS=JSON.stringify(S);const acc={};Object.entries(ui.acc||{}).forEach(([k,v])=>acc[k]=new Set(v));WT.snapUi={...ui,acc,draft:clone(ui.draft||{})};
  S=freshState();ui.filters={};/* the walkthrough always plays on the clean sample data; wtStop puts the saved data back */
  const m=byId("LPR-260902-MGR7");WT.mgr=m?JSON.stringify({ph:m.phases[4],status:m.status}):null;WT.newId=null;WT.on=true;ui.tour=true;WT.paused=false;$("#notesPanel").hidden=true;ui.notesOpen=false;
  document.body.classList.add("touring");const r=document.createElement("div");r.id="wtRing";r.className="wt-ring";r.hidden=true;document.body.appendChild(r);wtGo(0);wtLoop()}
function wtStop(dest){WT.on=false;cancelAnimationFrame(WT.raf);WT.timers.forEach(clearTimeout);WT.timers=[];["#wt","#wtRing"].forEach(s=>{const e=$(s);if(e)e.remove()});document.body.classList.remove("touring");
  S=JSON.parse(WT.snapS);Object.keys(ui).forEach(k=>delete ui[k]);Object.assign(ui,WT.snapUi);ui.tour=false;
  if(dest==="sh"){ui.mode="stakeholder";ui.sTab="requests";ui.sProject=null;ui.draft={}}if(dest==="ld"){ui.mode="ld";ui.ldScreen="dash"}
  try{if(Object.keys(ui.draft||{}).length)localStorage.setItem(KEY+"-draft",JSON.stringify(ui.draft));else localStorage.removeItem(KEY+"-draft")}catch(e){}
  render();window.scrollTo({top:0,behavior:"instant"});$("#toast").hidden=true;const b=$('[data-act="walk"]');if(b&&!dest)b.focus()}
function wtPause(v){if(v===WT.paused)return;if(v){WT.el+=performance.now()-WT.t0}else WT.t0=performance.now();WT.paused=v;const b=$('[data-wt="pause"]');if(b)b.textContent=v?"▶ Play":"❚❚ Pause"}
document.addEventListener("click",e=>{if(!WT.on)return;const b=e.target.closest("[data-wt]");
  if(b){const a=b.dataset.wt;if(a==="next")wtGo(WT.i+1);else if(a==="back")wtGo(WT.i-1);else if(a==="pause")wtPause(!WT.paused);else if(a==="replay"){WT.paused=false;wtGo(0)}else wtStop(a==="exit"?null:a);return}
  if(e.isTrusted&&!e.target.closest("#wt")){wtPause(true)}},true);
document.addEventListener("keydown",e=>{if(!WT.on)return;if(e.key==="Escape"){e.stopImmediatePropagation();wtStop(null)}else if(e.key==="ArrowRight"&&!/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))wtGo(WT.i+1);else if(e.key==="ArrowLeft"&&!/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))wtGo(WT.i-1)},true);
addEventListener("resize",()=>{if(WT.on)wtScroll()});

/* ---------- light / dark switch ---------- */
const SUN='<circle cx="10" cy="10" r="3.6" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10 1.8v2.2M10 16v2.2M1.8 10H4M16 10h2.2M4.2 4.2l1.6 1.6M14.2 14.2l1.6 1.6M4.2 15.8l1.6-1.6M14.2 5.8l1.6-1.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>';
const MOON='<path d="M15.8 12.6A6.6 6.6 0 0 1 7.4 4.2a6.6 6.6 0 1 0 8.4 8.4Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>';
const isDark=()=>{const t=document.documentElement.dataset.theme;return t?t==="dark":matchMedia("(prefers-color-scheme: dark)").matches};
function syncThemeBtn(){const d=isDark();const b=$("#themeBtn");if(!b)return;$("#themeIcon").innerHTML=d?SUN:MOON;const l=d?"Switch to light mode":"Switch to dark mode";b.setAttribute("aria-label",l);b.title=l}
function setTheme(t){document.documentElement.dataset.theme=t;try{localStorage.setItem("lpcs-theme",t)}catch(e){}syncThemeBtn()}
try{const t=localStorage.getItem("lpcs-theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}
try{matchMedia("(prefers-color-scheme: dark)").addEventListener("change",syncThemeBtn)}catch(e){}
new MutationObserver(syncThemeBtn).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
syncThemeBtn();

/* ---------- boot ---------- */
ui.mode=location.hash==="#ld"?"ld":"stakeholder";
window.addEventListener("hashchange",()=>{const m=location.hash==="#ld"?"ld":"stakeholder";if(m!==ui.mode){ui.mode=m;render()}});
render();
})();
</script>
