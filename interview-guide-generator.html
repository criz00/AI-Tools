/* ===== Talent Workspace UI (talent-ui.css) ===== */
/* Layout: single main column (max 820px) — brand row, page header, role picker card; the guide renders as a cover card, an overview card, then one card per competency. */
:root{
  --font-sans:Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:22px;--space-6:28px;--space-7:32px;--space-8:56px;
  --radius-sm:8px;--radius-md:10px;--radius-lg:12px;--radius-xl:14px;--radius-pill:999px;
  --bg:#F7F8FA;--surface:#FFFFFF;--surface-alt:#F1F3F5;--ink:#111827;--ink-soft:#5B6472;--line:#E5E7EB;--line-strong:#8A9099;
  --accent:#0F766E;--accent-hover:#0B5F58;--on-accent:#FFFFFF;--accent-soft:#E6F4F2;--focus-ring:rgba(15,118,110,0.25);
  --info:#1D4ED8;--info-soft:#EEF3FF;--warning:#B54708;--warning-soft:#FEF3E2;--error:#B42318;--error-soft:#FEECEB;
  --shadow-sm:0 1px 2px rgba(16,24,40,0.05);
  --shadow-card:0 1px 2px rgba(16,24,40,0.04), 0 6px 20px -4px rgba(16,24,40,0.07);
  --shadow-lift:0 2px 4px rgba(16,24,40,0.06), 0 10px 28px -6px rgba(16,24,40,0.12);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1113;--surface:#171B1F;--surface-alt:#1F2429;--ink:#ECEEF0;--ink-soft:#9AA3AD;--line:#2A3036;--line-strong:#6B747E;
    --accent:#3CC4B4;--accent-hover:#62D3C6;--on-accent:#04201C;--accent-soft:rgba(60,196,180,0.13);--focus-ring:rgba(60,196,180,0.3);
    --info:#8AB4F8;--info-soft:rgba(138,180,248,0.13);--warning:#F5B45C;--warning-soft:rgba(245,180,92,0.13);--error:#F28B82;--error-soft:rgba(242,139,130,0.13);
    --shadow-sm:0 1px 2px rgba(0,0,0,0.4);
    --shadow-card:0 1px 2px rgba(0,0,0,0.4), 0 8px 24px -6px rgba(0,0,0,0.5);
    --shadow-lift:0 2px 4px rgba(0,0,0,0.45), 0 12px 30px -6px rgba(0,0,0,0.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1113;--surface:#171B1F;--surface-alt:#1F2429;--ink:#ECEEF0;--ink-soft:#9AA3AD;--line:#2A3036;--line-strong:#6B747E;
  --accent:#3CC4B4;--accent-hover:#62D3C6;--on-accent:#04201C;--accent-soft:rgba(60,196,180,0.13);--focus-ring:rgba(60,196,180,0.3);
  --info:#8AB4F8;--info-soft:rgba(138,180,248,0.13);--warning:#F5B45C;--warning-soft:rgba(245,180,92,0.13);--error:#F28B82;--error-soft:rgba(242,139,130,0.13);
  --shadow-sm:0 1px 2px rgba(0,0,0,0.4);
  --shadow-card:0 1px 2px rgba(0,0,0,0.4), 0 8px 24px -6px rgba(0,0,0,0.5);
  --shadow-lift:0 2px 4px rgba(0,0,0,0.45), 0 12px 30px -6px rgba(0,0,0,0.6);
  color-scheme:dark;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-sans);-webkit-font-smoothing:antialiased;font-size:14.5px;line-height:1.55;}

.ig-page{max-width:820px;margin:0 auto;padding:var(--space-6) 24px var(--space-8);}

/* Brand row */
.brand-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:var(--space-7);}
.brand{display:flex;align-items:center;gap:10px;font-weight:650;font-size:15px;letter-spacing:-.01em;min-width:0;}
.brand-tile{width:30px;height:30px;border-radius:var(--radius-sm);background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.icon-btn{width:38px;height:38px;border-radius:var(--radius-md);border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:var(--shadow-sm);transition:background .15s,color .15s;}
.icon-btn:hover{background:var(--surface-alt);color:var(--ink);}
.icon-btn:focus-visible{outline:none;box-shadow:0 0 0 4px var(--focus-ring);}

/* Page header */
.eyebrow{display:inline-flex;align-items:center;gap:6px;color:var(--accent);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;margin-bottom:12px;}
.page-title{font-size:32px;line-height:1.15;font-weight:650;letter-spacing:-.022em;margin:0 0 12px;text-wrap:balance;}
.page-desc{color:var(--ink-soft);font-size:15.5px;line-height:1.6;max-width:620px;margin:0 0 var(--space-6);}

/* Notice strip (was the banner) */
.notice{display:flex;align-items:center;gap:10px;background:var(--accent-soft);color:var(--accent);border-radius:var(--radius-lg);padding:11px 16px;font-size:13.5px;font-weight:600;margin-bottom:var(--space-6);}
.notice svg{flex-shrink:0;}

/* Card */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-xl);padding:var(--space-7);margin-bottom:20px;box-shadow:var(--shadow-card);color:var(--ink);animation:rise .32s ease-out both;}
@keyframes rise{from{opacity:.001;transform:translateY(6px);}to{opacity:1;transform:none;}}
.group-heading{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:650;letter-spacing:-.01em;color:var(--ink);padding-bottom:16px;margin:0 0 22px;border-bottom:1px solid var(--line);}

/* Fields */
.field{margin-bottom:var(--space-5);}
.field label, .field .label{display:block;font-size:13px;font-weight:600;color:var(--ink);margin-bottom:var(--space-2);}
.input{width:100%;min-height:44px;font:400 14.5px var(--font-sans);color:var(--ink);background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--radius-md);padding:11px 14px;outline:none;transition:border-color .15s, box-shadow .15s;}
.input:hover{border-color:var(--ink-soft);}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--focus-ring);}
.input::placeholder{color:var(--ink-soft);opacity:1;}
.input.lg{font-size:17px;min-height:50px;}

/* Supported roles */
.role-list-label{font-size:13px;font-weight:600;color:var(--ink);margin:0 0 10px;}
.chips{display:flex;flex-wrap:wrap;gap:8px;}
.chip{background:var(--surface);border:1px solid var(--line-strong);color:var(--ink);padding:7px 14px;min-height:36px;border-radius:var(--radius-pill);font:500 13.5px var(--font-sans);cursor:pointer;transition:background .15s,border-color .15s,color .15s;}
.chip:hover{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);}
.chip:focus-visible{outline:none;box-shadow:0 0 0 4px var(--focus-ring);}

/* Buttons */
.btn{font:600 14px var(--font-sans);border-radius:var(--radius-md);padding:11px 20px;min-height:44px;border:1px solid transparent;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:background .15s, box-shadow .15s, transform .15s, border-color .15s, color .15s;}
.btn-primary{background:var(--accent);color:var(--on-accent);box-shadow:var(--shadow-sm);}
.btn-primary:hover:not(:disabled){background:var(--accent-hover);transform:translateY(-1px);box-shadow:var(--shadow-lift);}
.btn-primary:active:not(:disabled){transform:none;}
.btn-secondary{background:var(--surface);color:var(--ink);border-color:var(--line-strong);box-shadow:var(--shadow-sm);}
.btn-secondary:hover:not(:disabled){background:var(--surface-alt);}
.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none;}
.btn:focus-visible{outline:none;box-shadow:0 0 0 4px var(--focus-ring);}
.btn-row{display:flex;gap:var(--space-3);margin-top:var(--space-6);align-items:center;flex-wrap:wrap;}
.actions{display:flex;gap:var(--space-3);align-items:center;flex-wrap:wrap;margin-bottom:var(--space-6);}
.actions.bottom{margin:var(--space-6) 0 0;}

/* Messages */
.msg{display:flex;gap:10px;align-items:flex-start;border-radius:var(--radius-md);padding:11px 14px;font-size:13.5px;line-height:1.5;margin-top:16px;}
.msg svg{flex-shrink:0;margin-top:2px;}
.msg.error{background:var(--error-soft);color:var(--error);}
.msg.info{background:var(--info-soft);color:var(--info);}
.msg:empty{display:none;}
.msg-slot{flex-basis:100%;}
.msg-slot:empty{display:none;}
.msg-slot .msg{margin-top:0;}

/* Cover */
.cover{padding:var(--space-8) var(--space-7);}
.cover-role{font-size:40px;line-height:1.1;font-weight:650;letter-spacing:-.026em;margin:0 0 8px;text-wrap:balance;}
.cover-meta{font-size:14px;color:var(--ink-soft);margin-bottom:var(--space-7);font-variant-numeric:tabular-nums;}
.cover-fields{display:grid;grid-template-columns:1fr 1fr;gap:18px;max-width:560px;}
.cover-fields .field{margin-bottom:0;}

/* Overview */
.overview-text{color:var(--ink-soft);font-size:14.5px;line-height:1.6;max-width:620px;margin:0 0 var(--space-6);}
.comp-list-title{font-size:13px;font-weight:600;color:var(--ink);margin:0 0 6px;}
ol.comp-list{list-style:none;margin:0;padding:0;counter-reset:c;}
ol.comp-list li{counter-increment:c;display:flex;gap:14px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--line);}
ol.comp-list li:last-child{border-bottom:none;padding-bottom:0;}
ol.comp-list li::before{content:"0" counter(c);flex-shrink:0;width:30px;height:26px;border-radius:var(--radius-sm);background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:650;font-variant-numeric:tabular-nums;display:flex;align-items:center;justify-content:center;margin-top:1px;}
.comp-name{font-weight:600;font-size:15px;letter-spacing:-.01em;}
.comp-why{font-size:13px;color:var(--ink-soft);line-height:1.5;margin-top:2px;}

/* Guide heading */
.guide-head{margin:var(--space-7) 0 var(--space-5);}
.guide-title{font-size:24px;line-height:1.2;font-weight:650;letter-spacing:-.02em;margin:0 0 4px;text-wrap:balance;}
.guide-meta{font-size:13px;color:var(--ink-soft);}

/* Competency card */
.comp-card .comp-title{font-size:20px;font-weight:650;letter-spacing:-.018em;margin:0 0 10px;line-height:1.25;}
.inrole{background:var(--surface-alt);border-radius:var(--radius-md);padding:11px 14px;font-size:14px;line-height:1.55;color:var(--ink);margin-bottom:var(--space-5);}
.inrole b{font-weight:600;}
.section-label{font-size:13px;font-weight:600;color:var(--ink);margin:var(--space-5) 0 6px;}
.check{display:flex;align-items:flex-start;gap:10px;padding:5px 0;font-size:14px;line-height:1.5;color:var(--ink);}
.check .box{width:15px;height:15px;border:1.5px solid var(--line-strong);border-radius:4px;flex-shrink:0;margin-top:3px;}
.check b{font-weight:600;}
.notes{border:1.5px dashed var(--line-strong);border-radius:var(--radius-lg);padding:14px 16px;margin-top:var(--space-5);min-height:130px;}
.notes-label{font-size:13px;font-weight:600;color:var(--ink);margin-bottom:4px;}
.notes-placeholder{font-size:13px;color:var(--ink-soft);}
.np-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:var(--space-5);}
.np-grid > div{min-width:0;}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px 3px 8px;border-radius:var(--radius-pill);margin-bottom:6px;letter-spacing:.04em;}
.badge::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;}
.badge.high{background:var(--error-soft);color:var(--error);}
.badge.info{background:var(--info-soft);color:var(--info);}
.rating-row{display:flex;flex-wrap:wrap;gap:8px;}
.rating{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:var(--radius-pill);padding:6px 12px 6px 10px;font-size:13px;color:var(--ink);font-variant-numeric:tabular-nums;}
.rating .box{width:13px;height:13px;border:1.5px solid var(--line-strong);border-radius:4px;}

/* Phone */
@media (max-width:800px){
  .ig-page{padding:var(--space-5) 16px var(--space-7);}
  .brand-row{margin-bottom:var(--space-6);}
  .page-title{font-size:26px;}
  .page-desc{font-size:15px;}
  .card{padding:22px 18px;}
  .cover{padding:var(--space-7) 18px;}
  .cover-role{font-size:30px;}
  .cover-fields{grid-template-columns:1fr;}
  .input, .input.lg{font-size:16px;min-height:48px;}
  .btn{min-height:48px;}
  .btn-row .btn, .actions .btn{flex:1 1 auto;}
  .chip{min-height:40px;}
  .np-grid{grid-template-columns:1fr;gap:var(--space-4);}
  .comp-card .comp-title{font-size:18px;}
}
@media (prefers-reduced-motion:reduce){
  *, *::before, *::after{animation:none !important;transition:none !important;}
}
/* Browser print of this page (Ctrl+P / Cmd+P) */
@media print{
  :root{--bg:#fff;--surface:#fff;--surface-alt:#F3F4F6;--ink:#000;--ink-soft:#333;--line:#999;--line-strong:#555;--accent:#0F766E;--accent-soft:#E6F4F2;}
  .brand-row,.notice,.actions,.no-print,.guide-head{display:none !important;}
  .card{box-shadow:none;animation:none;break-inside:avoid;}
  .cover,.overview,.comp-card{break-after:page;}
  .comp-card:last-of-type{break-after:auto;}
  .notes{min-height:2.5in;}
  .notes-placeholder{display:none;}
}
</style>

function isDark(){
  const t = document.documentElement.getAttribute('data-theme');
  if(t) return t === 'dark';
  return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
}
function paintThemeButton(){
  const b = document.getElementById('themeToggle');
  const dark = isDark();
  b.innerHTML = dark ? ICON_SUN : ICON_MOON;
  b.setAttribute('aria-label', dark ? 'Switch to light mode' : 'Switch to dark mode');
  b.title = b.getAttribute('aria-label');
}
document.getElementById('themeToggle').addEventListener('click', ()=>{
  document.documentElement.setAttribute('data-theme', isDark() ? 'light' : 'dark');
  paintThemeButton();
});
if(window.matchMedia){ try{ window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', paintThemeButton); }catch(e){} }
paintThemeButton();

/* Published viewer: saves come through the downloads capability */
/* Viewer capabilities are looked up when needed, not at load: the viewer may attach after this script runs. */
function hasViewer(){ return !!(window.claude && typeof window.claude.use === 'function'); }
async function getCapability(name){
  if(!hasViewer()) return null;
  try { return await window.claude.use(name); } catch(e) { return null; }
}
// Warm the lookup early when the viewer is already there (the result is memoized by the viewer).
if(hasViewer()) getCapability('downloads');

      <div class="guide-head">
        <h2 class="guide-title">Interview Guide &mdash; ${escapeHtml(roleName)}</h2>
        <div class="guide-meta">${escapeHtml(role.meta)}</div>
      </div>
      ${role.competencies.map(([name, inRole]) => renderCompetencyBlock(name, inRole)).join("")}
      <div class="actions bottom no-print">
        <button type="button" class="btn btn-primary" id="ig-print-btn-2">Print / Save as PDF</button>
        <button type="button" class="btn btn-secondary" id="ig-back-btn-2">&larr; Choose a different role</button>
        <div class="msg-slot" id="ig-print-msg-2"></div>
      </div>
    `;
    document.getElementById("ig-back-btn").onclick = () => { selectedRole = null; render(); };
    document.getElementById("ig-back-btn-2").onclick = () => { selectedRole = null; render(); };
    document.getElementById("ig-print-btn").onclick = () => openPrintWindow("ig-print-msg");
    document.getElementById("ig-print-btn-2").onclick = () => openPrintWindow("ig-print-msg-2");
  }

  function renderCompetencyBlock(name, inRole) {
    const d = COMPETENCY_DATA[name];
    if (!d) return `<div class="card comp-card">Missing data for ${escapeHtml(name)}</div>`;
    return `
      <section class="card comp-card">
        <h3 class="comp-title">${escapeHtml(name)}</h3>
        <div class="inrole"><b>In this role:</b> ${escapeHtml(inRole)}</div>

        <div class="section-label">Interview Questions</div>
        ${d.questions.map(q => `<div class="check"><span class="box"></span><div>${escapeHtml(q)}</div></div>`).join("")}

        <div class="section-label">Follow-Up Questions</div>
        ${d.followups.map(f => renderFollowup(f)).join("")}

        <div class="notes">
          <div class="notes-label">Interview Notes</div>
          <div class="notes-placeholder">This space is intentionally left blank for handwritten notes when printed.</div>
        </div>

        <div class="np-grid">
          <div>
            <span class="badge high">NEGATIVE</span>
            ${d.negative.map(n => `<div class="check"><span class="box"></span><div>${escapeHtml(n)}</div></div>`).join("")}
          </div>
          <div>
            <span class="badge info">POSITIVE</span>
            ${d.positive.map(p => `<div class="check"><span class="box"></span><div>${escapeHtml(p)}</div></div>`).join("")}
          </div>
        </div>

        <div class="section-label">Rating</div>
        <div class="rating-row">
          ${d.rating.map(r => `<span class="rating"><span class="box"></span>${escapeHtml(r)}</span>`).join("")}
        </div>
      </section>
    `;
  }

  function renderFollowup(text) {
    const idx = text.indexOf(":");
    if (idx === -1) return `<div class="check"><span class="box"></span><div>${escapeHtml(text)}</div></div>`;
    const label = text.slice(0, idx + 1);
    const rest = text.slice(idx + 1);
    return `<div class="check"><span class="box"></span><div><b>${escapeHtml(label)}</b>${escapeHtml(rest)}</div></div>`;
  }

  /* ---------------- PRINT ---------------- */
  // A light, paper-first document: cover page, overview page, then one page per competency.
  const PRINT_CSS = `
    *{box-sizing:border-box;}
    body{margin:0;background:#fff;color:#111827;font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;font-size:11pt;line-height:1.45;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    .doc{max-width:760px;margin:0 auto;padding:24px;}
    .page + .page{break-before:page;page-break-before:always;}
    .page{break-inside:auto;}
    .eyebrow{color:#0F766E;font-size:9pt;font-weight:600;text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px;}
    .cover{padding-top:2.6in;}
    .cover-role{font-size:34pt;line-height:1.1;font-weight:650;letter-spacing:-.025em;margin:0 0 6px;}
    .cover-meta{font-size:11pt;color:#5B6472;margin-bottom:44px;}
    .cover-field{margin-bottom:26px;max-width:420px;}
    .cover-field-label{font-size:9.5pt;font-weight:600;color:#5B6472;margin-bottom:6px;}
    .cover-value{border-bottom:1.5px solid #8A9099;padding:6px 2px;font-size:13pt;min-height:1.6em;}
    h2{font-size:18pt;font-weight:650;letter-spacing:-.02em;margin:0 0 12px;}
    .overview-text{color:#374151;max-width:560px;margin:0 0 24px;}
    .list-title{font-size:10pt;font-weight:600;margin-bottom:6px;}
    ol{list-style:none;margin:0;padding:0;counter-reset:c;}
    ol li{counter-increment:c;display:flex;gap:12px;padding:10px 0;border-bottom:1px solid #D1D5DB;}
    ol li::before{content:"0" counter(c);flex-shrink:0;width:26px;height:22px;border-radius:6px;background:#E6F4F2;color:#0F766E;font-size:9pt;font-weight:650;display:flex;align-items:center;justify-content:center;}
    .comp-name{font-weight:600;font-size:11.5pt;}
    .comp-why{font-size:9.5pt;color:#5B6472;}
    h3{font-size:16pt;font-weight:650;letter-spacing:-.015em;margin:0 0 4px;}
    .inrole{font-size:9.5pt;color:#374151;margin-bottom:8px;}
    .inrole b{color:#111827;}
    .label{font-size:9pt;font-weight:600;margin:8px 0 3px;}
    .check{display:flex;gap:6px;font-size:10pt;padding:2px 0;line-height:1.3;}
    .box{width:10px;height:10px;border:1.3px solid #6B7280;border-radius:2px;flex-shrink:0;margin-top:2px;}
    .notes{border:1px solid #9CA3AF;border-radius:8px;padding:6px 8px;margin-top:6px;min-height:2.5in;}
    .notes-label{font-size:9pt;font-weight:600;color:#374151;}
    .np{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:8px;}
    .np-label{font-size:9pt;font-weight:700;letter-spacing:.04em;margin-bottom:3px;}
    .np-label.neg{color:#B42318;}
    .np-label.pos{color:#1D4ED8;}
    .rating{display:flex;flex-wrap:wrap;gap:10px;margin-top:4px;}
    .rating span{display:inline-flex;align-items:center;gap:4px;font-size:9.5pt;}
    @page{margin:0.5in;}
  `;

  function buildPrintDocument(autoPrint) {
    const role = ROLE_DATA[selectedRole];
    const interviewer = (document.getElementById("ig-interviewer") || {}).value || "";
    const date = (document.getElementById("ig-date") || {}).value || "";
    const chk = (t) => `<div class="check"><span class="box"></span><div>${t}</div></div>`;
    const fu = (text) => {
      const i = text.indexOf(":");
      return i === -1 ? chk(escapeHtml(text)) : chk(`<b>${escapeHtml(text.slice(0, i + 1))}</b>${escapeHtml(text.slice(i + 1))}`);
    };
    const comps = role.competencies.map(([name, inRole]) => {
      const d = COMPETENCY_DATA[name];
      if (!d) return "";
      return `<section class="page">
        <h3>${escapeHtml(name)}</h3>
        <div class="inrole"><b>In this role:</b> ${escapeHtml(inRole)}</div>
        <div class="label">Interview Questions</div>${d.questions.map(q => chk(escapeHtml(q))).join("")}
        <div class="label">Follow-Up Questions</div>${d.followups.map(fu).join("")}
        <div class="notes"><div class="notes-label">Interview Notes</div></div>
        <div class="np">
          <div><div class="np-label neg">NEGATIVE</div>${d.negative.map(n => chk(escapeHtml(n))).join("")}</div>
          <div><div class="np-label pos">POSITIVE</div>${d.positive.map(p => chk(escapeHtml(p))).join("")}</div>
        </div>
        <div class="label">Rating</div>
        <div class="rating">${d.rating.map(r => `<span><span class="box"></span>${escapeHtml(r)}</span>`).join("")}</div>
      </section>`;
    }).join("");
    // Tag names are split ("<" + "html") so the page publisher never mistakes this string for the page's own skeleton.
    const LT = "<";
    return `${LT}!DOCTYPE html>${LT}html>${LT}head>${LT}meta charset="utf-8">${LT}title>Interview Guide${LT}/title>
      ${LT}link rel="preconnect" href="https://fonts.googleapis.com">
      ${LT}link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap" rel="stylesheet">
      ${LT}style>${PRINT_CSS}${LT}/style>${LT}/head>${LT}body><div class="doc">
      <section class="page cover">
        <div class="eyebrow">Behavioral Interview Guide</div>
        <div class="cover-role">${escapeHtml(selectedRole)}</div>
        <div class="cover-meta">${escapeHtml(role.meta)}</div>
        <div class="cover-field"><div class="cover-field-label">Interviewer</div><div class="cover-value">${escapeHtml(interviewer.trim()) || "&nbsp;"}</div></div>
        <div class="cover-field"><div class="cover-field-label">Interview Date</div><div class="cover-value">${escapeHtml(date.trim()) || "&nbsp;"}</div></div>
      </section>
      <section class="page">
        <h2>Guide Overview</h2>
        <p class="overview-text">This guide provides structured behavioral interview questions for evaluating a candidate against the core competencies for this role. Each competency includes a set of interview questions, follow-up prompts to probe deeper, positive and negative behavioral indicators, and a rating scale to support consistent, objective evaluation.</p>
        <div class="list-title">Competencies Covered</div>
        <ol>${role.competencies.map(([name, , why]) => `<li><div><div class="comp-name">${escapeHtml(name)}</div><div class="comp-why">${escapeHtml(why)}</div></div></li>`).join("")}</ol>
      </section>
      ${comps}
      </div>${autoPrint ? LT + 'script>window.addEventListener("load",function(){setTimeout(function(){window.print();},400);});' + LT + '/script>' : ''}${LT}/body>${LT}/html>`;
  }

  /* Real PDF: cover, overview, then one page per competency (Letter, 0.75in margins). */
  function buildPdf() {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: "pt", format: "letter" });
    const W = 612, H = 792, M = 54, CW = W - 2 * M, BOTTOM = H - 64;
    const C = { ink: [17, 24, 39], soft: [91, 100, 114], accent: [15, 118, 110], accentSoft: [230, 244, 242],
      alt: [243, 244, 246], line: [209, 213, 219], box: [107, 114, 128], err: [180, 35, 24], info: [29, 78, 216] };
    const role = ROLE_DATA[selectedRole];
    const interviewer = ((document.getElementById("ig-interviewer") || {}).value || "").trim();
    const date = ((document.getElementById("ig-date") || {}).value || "").trim();
    let y = M;

    const font = (size, style, color) => { doc.setFont("helvetica", style || "normal"); doc.setFontSize(size); doc.setTextColor(...(color || C.ink)); };
    const lines = (str, size, width, style) => { font(size, style); return doc.splitTextToSize(str, width); };
    const measure = (str, size, width, style, lh = 1.35) => lines(str, size, width, style).length * size * lh;
    function text(str, x, opts = {}) {
      const { size = 10, style = "normal", color = C.ink, width = CW, lh = 1.35, charSpace = 0 } = opts;
      const ls = lines(str, size, width, style);
      font(size, style, color);
      doc.text(ls, x, y, { baseline: "top", lineHeightFactor: lh, charSpace });
      const h = ls.length * size * lh;
      y += h;
      return h;
    }
    function newPage() { doc.addPage(); y = M; }
    function ensure(h) { if (y + h > BOTTOM) newPage(); }
    function box(x, top) { doc.setDrawColor(...C.box); doc.setLineWidth(1); doc.roundedRect(x, top + 1.5, 8.5, 8.5, 1.5, 1.5, "S"); }
    function checkItem(str, x, width, boldLabel) {
      const size = 9.5, tw = width - 15;
      const h = measure((boldLabel || "") + str, size, tw);
      ensure(h + 3);
      box(x, y);
      if (boldLabel) {
        font(size, "bold"); doc.text(boldLabel, x + 15, y, { baseline: "top" });
        const lw = doc.getTextWidth(boldLabel);
        font(size, "normal"); doc.text(str, x + 15 + lw, y, { baseline: "top" });
        y += size * 1.35;
      } else {
        const keep = y;
        y = keep; const saveY = y;
        text(str, x + 15, { size, width: tw });
        y = saveY + h;
      }
      y += 3;
    }
    function itemHeight(str, width) { return measure(str, 9.5, width - 15) + 3; }

    /* Cover */
    doc.setFillColor(...C.accent); doc.rect(M, M, 36, 5, "F");
    y = 250;
    text("BEHAVIORAL INTERVIEW GUIDE", M, { size: 9, style: "bold", color: C.accent, charSpace: 1 });
    y += 10;
    text(selectedRole, M, { size: 34, style: "bold", lh: 1.12 });
    y += 6;
    text(role.meta, M, { size: 11, color: C.soft });
    y += 46;
    [["Interviewer", interviewer], ["Interview Date", date]].forEach(([label, val]) => {
      text(label, M, { size: 9.5, style: "bold", color: C.soft });
      y += 6;
      if (val) text(val, M + 2, { size: 13, width: 300 }); else y += 13 * 1.35;
      y += 4;
      doc.setDrawColor(...C.box); doc.setLineWidth(1.2); doc.line(M, y, M + 300, y);
      y += 30;
    });

    /* Overview */
    newPage();
    text("Guide Overview", M, { size: 18, style: "bold" });
    y += 10;
    text("This guide provides structured behavioral interview questions for evaluating a candidate against the core competencies for this role. Each competency includes a set of interview questions, follow-up prompts to probe deeper, positive and negative behavioral indicators, and a rating scale to support consistent, objective evaluation.", M, { size: 10.5, color: C.soft, width: 440, lh: 1.5 });
    y += 22;
    text("Competencies Covered", M, { size: 10, style: "bold" });
    y += 6;
    role.competencies.forEach(([name, , why], i) => {
      const whyH = measure(why, 9, CW - 38);
      ensure(whyH + 34);
      y += 8;
      const top = y;
      doc.setFillColor(...C.accentSoft); doc.roundedRect(M, top, 24, 17, 4, 4, "F");
      font(8.5, "bold", C.accent); doc.text("0" + (i + 1), M + 12, top + 8.5, { align: "center", baseline: "middle" });
      text(name, M + 36, { size: 11, style: "bold", width: CW - 38 });
      y += 1;
      text(why, M + 36, { size: 9, color: C.soft, width: CW - 38 });
      y += 8;
      doc.setDrawColor(...C.line); doc.setLineWidth(0.75); doc.line(M, y, M + CW, y);
    });

    /* One page per competency */
    role.competencies.forEach(([name, inRole]) => {
      const d = COMPETENCY_DATA[name];
      if (!d) return;
      newPage();
      text(name, M, { size: 17, style: "bold" });
      y += 6;
      const inH = measure(inRole, 9.5, CW - 20);
      doc.setFillColor(...C.alt); doc.roundedRect(M, y, CW, inH + 30, 6, 6, "F");
      y += 9;
      text("In this role:", M + 10, { size: 9.5, style: "bold" });
      text(inRole, M + 10, { size: 9.5, width: CW - 20 });
      y += 13;

      text("Interview Questions", M, { size: 9.5, style: "bold", color: C.accent });
      y += 4;
      d.questions.forEach(q => checkItem(q, M, CW));
      y += 6;
      text("Follow-Up Questions", M, { size: 9.5, style: "bold", color: C.accent });
      y += 4;
      d.followups.forEach(f => {
        const i = f.indexOf(":");
        if (i === -1) checkItem(f, M, CW); else checkItem(f.slice(i + 1), M, CW, f.slice(0, i + 1));
      });

      // Size the notes box to the room left, keeping indicators and rating on this page when possible.
      const colW = (CW - 20) / 2;
      const colH = (arr) => arr.reduce((s, t) => s + itemHeight(t, colW), 0);
      const below = 14 + 16 + Math.max(colH(d.negative), colH(d.positive)) + 14 + 16 + 20;
      const notesH = Math.max(90, Math.min(180, BOTTOM - y - 12 - below));
      y += 10;
      ensure(notesH);
      doc.setDrawColor(...C.box); doc.setLineWidth(0.9); doc.setLineDashPattern([3, 2], 0);
      doc.roundedRect(M, y, CW, notesH, 6, 6, "S");
      doc.setLineDashPattern([], 0);
      const notesTop = y;
      y += 8;
      text("Interview Notes", M + 10, { size: 9, style: "bold", color: C.soft });
      y = notesTop + notesH + 14;

      ensure(16 + Math.max(colH(d.negative), colH(d.positive)));
      const npTop = y;
      text("NEGATIVE", M, { size: 9, style: "bold", color: C.err, charSpace: 0.6 });
      y += 4;
      d.negative.forEach(n => checkItem(n, M, colW));
      const negEnd = y;
      y = npTop;
      text("POSITIVE", M + colW + 20, { size: 9, style: "bold", color: C.info, charSpace: 0.6 });
      y += 4;
      d.positive.forEach(p => checkItem(p, M + colW + 20, colW));
      y = Math.max(y, negEnd) + 10;

      ensure(40);
      text("Rating", M, { size: 9.5, style: "bold", color: C.accent });
      y += 5;
      let x = M;
      font(9.5, "normal");
      d.rating.forEach(r => {
        const w = 14 + doc.getTextWidth(r) + 20;
        if (x + w > M + CW) { x = M; y += 18; }
        box(x, y);
        font(9.5, "normal", C.ink); doc.text(r, x + 14, y, { baseline: "top" });
        x += w;
      });
    });

    /* Footer on every page after the cover */
    const total = doc.getNumberOfPages();
    for (let p = 2; p <= total; p++) {
      doc.setPage(p);
      doc.setDrawColor(...C.line); doc.setLineWidth(0.5); doc.line(M, H - 44, M + CW, H - 44);
      font(8, "normal", C.soft);
      doc.text(`Behavioral Interview Guide · ${selectedRole}`, M, H - 32);
      doc.text(`Page ${p} of ${total}`, M + CW, H - 32, { align: "right" });
    }
    return doc.output("blob");
  }

  function showMsg(slotId, kind, text) {
    const slot = document.getElementById(slotId);
    if (!slot) return;
    slot.className = "msg-slot";
    slot.innerHTML = text ? `<div class="msg ${kind}" role="status">${kind === "error" ? ICON_INFO : ICON_CHECK}<span>${text}</span></div>` : "";
  }

  async function openPrintWindow(slotId) {
    if (!selectedRole) return;
    showMsg(slotId, "", "");
    const safeName = selectedRole.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
    const filename = `interview-guide-${safeName}.pdf`;

    // Normal path: build a real PDF (cover, overview, one page per competency) and download it. No pop-up needed.
    if (window.jspdf && window.jspdf.jsPDF) {
      let blob;
      try { blob = buildPdf(); }
      catch (e) { showMsg(slotId, "error", "The PDF couldn't be built. Reload the page and try again."); return; }

      // Published viewer: save through the viewer's download prompt.
      const dl = await getCapability('downloads');
      if (dl) {
        try {
          await dl.save({ filename, data: blob });
          showMsg(slotId, "info", "PDF saved. The cover, the overview and each competency start on their own page.");
          return;
        } catch (err) {
          const code = err && err.code;
          if (code === "declined") return;
          if (code === "rate_limited") { showMsg(slotId, "error", "A save prompt is already open. Finish it, then try again."); return; }
          showMsg(slotId, "error", "This view can't save files. Open the guide from its published link in your browser and try again.");
          return;
        }
      }

      // Published viewer without downloads: a direct link would silently do nothing here.
      if (hasViewer() && !dl) {
        const perms = await getCapability('permissions');
        let state = 'unavailable';
        try { if (perms) state = await perms.state('downloads'); } catch (e) {}
        if (state === 'denied' && perms) {
          showMsg(slotId, "error", "Downloads are turned off for this page. Select Allow downloads, switch downloads on, then select Print / Save as PDF again.");
          const slot = document.getElementById(slotId);
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "btn btn-secondary";
          btn.style.marginTop = "10px";
          btn.textContent = "Allow downloads";
          btn.onclick = async () => {
            try { await perms.manage(); showMsg(slotId, "", ""); }
            catch (e) { showMsg(slotId, "error", "Open the Permissions menu for this page, switch downloads on, then select Print / Save as PDF again."); }
          };
          slot.appendChild(btn);
        } else {
          showMsg(slotId, "error", "This view can't save files. Open the guide from its link in your browser, then select Print / Save as PDF again.");
        }
        return;
      }

      // Standalone file in a browser: direct download.
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      showMsg(slotId, "info", "PDF downloaded. The cover, the overview and each competency start on their own page.");
      return;
    }

    // Fallback only if the PDF library couldn't load (for example, offline): browser print window.
    let printWin = null;
    try { printWin = window.open("", "_blank"); } catch (e) { printWin = null; }
    if (!printWin) {
      showMsg(slotId, "error", "Your browser blocked the print window. Please allow pop-ups for this page and try again, or use your browser's own Print (Ctrl+P / Cmd+P) command.");
      return;
    }
    printWin.document.open();
    printWin.document.write(buildPrintDocument(false));
    printWin.document.close();
    printWin.focus();
    setTimeout(() => { printWin.print(); }, 400);
  }

  function escapeHtml(str) {
    if (!str) return "";
    return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  render();
})();
</script>
