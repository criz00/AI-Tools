<style>
  :root {
    --bg: #EEF1F4;
    --surface: #FFFFFF;
    --surface-alt: #E4E9EF;
    --ink: #1B2430;
    --ink-soft: #5B6675;
    --ink-faint: #8B96A3;
    --line: #D6DCE3;
    --accent: #176480;
    --accent-hover: #124F65;
    --accent-soft: #E4EFEC;
    --error: #B3432B;
    --font-display: 'Space Grotesk', sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
    --font-body: 'Inter', sans-serif;
  }
  * { box-sizing: border-box; }

  #ig-root {
    background: var(--bg);
    min-height: 100vh;
    font-family: var(--font-body);
    color: var(--ink);
    padding: 48px 20px 60px;
    display: flex;
    justify-content: center;
    border: 1px solid var(--line);
    border-radius: 16px;
    box-shadow: 0 1px 3px rgba(27,36,48,0.06), 0 16px 40px rgba(27,36,48,0.08);
  }
  .ig-wrap { width: 100%; max-width: 760px; }

  .ig-banner {
    background: var(--accent); color: #FFFFFF; font-family: var(--font-mono);
    font-weight: 700; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase;
    text-align: center; padding: 10px 16px; border-radius: 6px; margin-bottom: 24px;
  }
  .ig-eyebrow {
    font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.18em; color: var(--ink);
    text-transform: uppercase; display: flex; align-items: center; gap: 8px;
  }
  .ig-eyebrow::before { content: '+'; font-size: 14px; }
  .ig-title { font-family: var(--font-display); font-weight: 700; font-size: 32px; margin: 6px 0 4px; color: var(--ink); }
  .ig-sub { font-size: 14px; color: var(--ink-soft); line-height: 1.5; max-width: 560px; }

  .ig-card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    padding: 28px; margin-top: 24px; position: relative;
  }

  .ig-field-label { font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-faint); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 6px; display: block; }
  .ig-input {
    width: 100%; background: var(--surface-alt); border: 1px solid var(--line); border-radius: 6px;
    color: var(--ink); font-family: var(--font-display); font-size: 18px; padding: 12px 14px;
  }
  .ig-input:focus { outline: none; border-color: var(--accent); }

  .ig-role-list { font-size: 12.5px; color: var(--ink-soft); margin-top: 10px; line-height: 1.7; }
  .ig-role-list b { color: var(--ink); }
  .ig-role-chip {
    display: inline-block; background: var(--surface-alt); border: 1px solid var(--line); color: var(--ink-soft);
    font-family: var(--font-mono); font-size: 11.5px; padding: 4px 10px; border-radius: 4px; margin: 4px 6px 0 0;
    cursor: pointer;
  }
  .ig-role-chip:hover { border-color: var(--accent); color: var(--ink); background: var(--accent-soft); }

  .ig-btn {
    font-family: var(--font-mono); font-size: 12.5px; letter-spacing: 0.06em; text-transform: uppercase;
    padding: 12px 22px; border-radius: 6px; cursor: pointer; border: 1px solid var(--line);
    background: var(--surface); color: var(--ink-soft); margin-top: 16px;
  }
  .ig-btn:hover { border-color: var(--accent); color: var(--ink); }
  .ig-btn-primary { background: var(--accent); border-color: var(--accent); color: #FFFFFF; font-weight: 600; }
  .ig-btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); color: #FFFFFF; }

  .ig-error { color: var(--error); font-family: var(--font-mono); font-size: 13px; margin-top: 14px; }

  .ig-guide-title { font-family: var(--font-display); font-size: 28px; font-weight: 700; margin: 32px 0 2px; color: var(--ink); }
  .ig-guide-meta { font-family: var(--font-mono); font-size: 12px; color: var(--ink-soft); margin-bottom: 20px; }

  .ig-comp-block { border: 1px solid var(--line); border-radius: 10px; padding: 22px; margin-bottom: 18px; background: var(--surface); }
  .ig-comp-name { font-family: var(--font-display); font-size: 21px; font-weight: 600; color: var(--ink); margin-bottom: 6px; }
  .ig-comp-inrole { font-size: 13px; font-style: italic; color: var(--ink); margin-bottom: 16px; line-height: 1.5; }
  .ig-comp-inrole b { font-style: normal; }

  .ig-section-label { font-family: var(--font-mono); font-size: 11px; color: var(--ink); letter-spacing: 0.08em; text-transform: uppercase; margin: 16px 0 8px; }
  .ig-check-item { display: flex; align-items: flex-start; gap: 8px; font-size: 13.5px; color: var(--ink); padding: 4px 0; line-height: 1.5; }
  .ig-check-item .box { width: 13px; height: 13px; border: 1.5px solid var(--ink-soft); border-radius: 3px; flex-shrink: 0; margin-top: 2px; }
  .ig-followup b { color: var(--ink); }

  .ig-notes-box { border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin-top: 10px; min-height: 130px; background: var(--surface-alt); }
  .ig-notes-label { font-size: 11.5px; font-weight: 600; color: var(--ink-soft); margin-bottom: 4px; }
  .ig-notes-placeholder { font-size: 12px; color: var(--ink-faint); font-style: italic; }

  .ig-np-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 14px; }
  .ig-np-col-label { font-size: 11.5px; font-weight: 700; margin-bottom: 6px; }
  .ig-np-col-label.neg { color: var(--error); }
  .ig-np-col-label.pos { color: var(--accent); }

  .ig-rating-row { display: flex; gap: 14px; margin-top: 16px; flex-wrap: wrap; }
  .ig-rating-item { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--ink-soft); }
  .ig-rating-item .box { width: 12px; height: 12px; border: 1.5px solid var(--ink-soft); border-radius: 3px; }

  .ig-actions { display: flex; gap: 10px; margin-top: 8px; margin-bottom: 30px; }

  @media print {
    #ig-root { border: none; box-shadow: none; background: white; color: black; padding: 0; }
    .ig-banner, .ig-card, .ig-actions, .no-print { display: none !important; }
    .ig-guide-title, .ig-comp-name { color: black; }
    .ig-comp-block {
      background: white; border: 1px solid #999; break-inside: avoid;
      padding: 14px 16px; margin-bottom: 0;
    }
    .ig-comp-name { font-size: 18px; margin-bottom: 2px; }
    .ig-comp-inrole { color: #333; font-size: 11px; margin-bottom: 8px; line-height: 1.3; }
    .ig-check-item, .ig-guide-meta, .ig-rating-item { color: black; }
    .ig-check-item { font-size: 11px; padding: 2px 0; line-height: 1.3; gap: 6px; }
    .ig-check-item .box { width: 10px; height: 10px; margin-top: 1px; }
    .ig-section-label { color: #333; font-size: 9.5px; margin: 8px 0 4px; }
    .ig-notes-box { min-height: 2.5in; border-color: #999; padding: 6px; margin-top: 4px; }
    .ig-notes-label { color: #333; font-size: 10px; margin-bottom: 2px; }
    .ig-notes-placeholder { display: none; }
    .ig-np-grid { gap: 14px; margin-top: 6px; }
    .ig-np-col-label { font-size: 10px; margin-bottom: 3px; }
    .ig-rating-row { gap: 10px; margin-top: 6px; }
    .ig-rating-item { font-size: 10px; gap: 3px; }
    .ig-rating-item .box { width: 10px; height: 10px; }
    .ig-guide-title { font-size: 20px; margin: 0 0 2px; }
    .ig-guide-meta { font-size: 10px; margin-bottom: 10px; }
    .ig-guide-title, .ig-guide-meta { display: none; }
    .ig-comp-block { break-after: page; page-break-after: always; }
    .ig-comp-block:last-of-type { break-after: auto; page-break-after: auto; }
  }

  .ig-cover-page { min-height: 90vh; display: flex; flex-direction: column; justify-content: center; padding: 20px 0; }
  .ig-cover-eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.2em; color: var(--ink); text-transform: uppercase; margin-bottom: 10px; }
  .ig-cover-role { font-family: var(--font-display); font-weight: 700; font-size: 42px; line-height: 1.15; margin-bottom: 8px; color: var(--ink); }
  .ig-cover-meta { font-family: var(--font-mono); font-size: 13px; color: var(--ink-soft); margin-bottom: 48px; }
  .ig-cover-field { margin-bottom: 26px; max-width: 420px; }
  .ig-cover-field-label { font-family: var(--font-mono); font-size: 11px; color: var(--ink-faint); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 6px; }
  .ig-cover-input {
    width: 100%; background: transparent; border: none; border-bottom: 1.5px solid var(--line);
    color: var(--ink); font-family: var(--font-body); font-size: 17px; padding: 6px 2px; border-radius: 0;
  }
  .ig-cover-input:focus { outline: none; border-bottom-color: var(--accent); }

  .ig-overview-page { padding: 12px 0 30px; }
  .ig-overview-title { font-family: var(--font-display); font-size: 24px; font-weight: 700; margin-bottom: 14px; color: var(--ink); }
  .ig-overview-text { font-size: 14px; color: var(--ink-soft); line-height: 1.6; max-width: 560px; margin-bottom: 28px; }
  .ig-comp-list-title { font-family: var(--font-mono); font-size: 12px; color: var(--ink); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 10px; }
  .ig-comp-list { list-style: none; padding: 0; margin: 0; }
  .ig-comp-list li {
    font-family: var(--font-body); padding: 12px 0;
    border-bottom: 1px solid var(--line); display: flex; align-items: flex-start; gap: 10px;
  }
  .ig-comp-list li .num { font-family: var(--font-mono); font-size: 12px; color: var(--ink); margin-top: 3px; flex-shrink: 0; }
  .ig-comp-list li .comp-name { font-family: var(--font-display); font-size: 16px; color: var(--ink); margin-bottom: 2px; }
  .ig-comp-list li .comp-why { font-size: 12.5px; color: var(--ink-soft); line-height: 1.4; }

  .ig-page-break { page-break-after: always; break-after: page; }

  @media print {
    .ig-cover-page { min-height: 9in; justify-content: center; }
    .ig-cover-role, .ig-cover-eyebrow, .ig-cover-meta { color: black; }
    .ig-cover-field-label { color: #333; }
    .ig-cover-input { color: black; border-bottom-color: #333; }
    .ig-overview-title, .ig-overview-text, .ig-comp-list-title { color: black; }
    .ig-comp-list li { border-bottom-color: #999; }
    .ig-comp-list li .num { color: #333; }
    .ig-comp-list li .comp-name { color: black; }
    .ig-comp-list li .comp-why { color: #333; }
  }

  @media (max-width: 480px) {
    .ig-title { font-size: 24px; }
    .ig-np-grid { grid-template-columns: 1fr; }
    .ig-cover-role { font-size: 30px; }
  }
</style>

(function () {
  const app = document.getElementById("ig-app");
  let selectedRole = null;

  function render() {
    if (!selectedRole) return renderPicker();
    return renderGuide(selectedRole);
  }

  function renderPicker() {
    const roleNames = Object.keys(ROLE_DATA);
    app.innerHTML = `
      <div class="ig-banner no-print">Type a role below to generate its interview guide instantly</div>
      <div class="ig-eyebrow">Interview Guide Generator</div>
      <div class="ig-title">Get a role-ready interview guide</div>
      <div class="ig-sub">Type one of the supported role titles below to instantly generate a behavioral interview guide &mdash; questions, follow-ups, and rating scales included.</div>
      <div class="ig-card">
        <label class="ig-field-label">Role title</label>
        <input class="ig-input" id="ig-role-input" list="ig-role-datalist" placeholder="Start typing a role name..." autocomplete="off" />
        <datalist id="ig-role-datalist">
          ${roleNames.map(r => `<option value="${r}"></option>`).join("")}
        </datalist>
        <div class="ig-role-list">
          <b>Supported roles:</b><br>
          ${roleNames.map(r => `<span class="ig-role-chip" data-role="${r}">${r}</span>`).join("")}
        </div>
        <div>
          <button class="ig-btn ig-btn-primary" id="ig-generate-btn">Generate Guide &rarr;</button>
        </div>
        <div id="ig-error-slot"></div>
      </div>
    `;

    function tryGenerate() {
      const val = document.getElementById("ig-role-input").value.trim();
      const match = roleNames.find(r => r.toLowerCase() === val.toLowerCase());
      const errSlot = document.getElementById("ig-error-slot");
      if (match) {
        selectedRole = match;
        render();
      } else {
        errSlot.innerHTML = `<div class="ig-error">"${escapeHtml(val)}" isn't in the supported role list yet. Try one of the roles listed above.</div>`;
      }
    }

    document.getElementById("ig-generate-btn").onclick = tryGenerate;
    document.getElementById("ig-role-input").addEventListener("keydown", (e) => {
      if (e.key === "Enter") tryGenerate();
    });
    document.querySelectorAll(".ig-role-chip").forEach(chip => {
      chip.onclick = () => {
        document.getElementById("ig-role-input").value = chip.dataset.role;
      };
    });
  }

  function renderGuide(roleName) {
    const role = ROLE_DATA[roleName];
    app.innerHTML = `
      <div class="ig-banner no-print">Ready &mdash; scroll down for the full guide, or print it directly</div>
      <div class="ig-eyebrow no-print">Interview Guide Generator</div>
      <div class="ig-actions no-print">
        <button class="ig-btn" id="ig-back-btn">&larr; Choose a different role</button>
        <button class="ig-btn ig-btn-primary" id="ig-print-btn">Print / Save as PDF</button>
      </div>

      <div class="ig-cover-page ig-page-break">
        <div class="ig-cover-eyebrow">Behavioral Interview Guide</div>
        <div class="ig-cover-role">${escapeHtml(roleName)}</div>
        <div class="ig-cover-meta">${escapeHtml(role.meta)}</div>
        <div class="ig-cover-field">
          <div class="ig-cover-field-label">Interviewer</div>
          <input class="ig-cover-input" type="text" placeholder="Enter name">
        </div>
        <div class="ig-cover-field">
          <div class="ig-cover-field-label">Interview Date</div>
          <input class="ig-cover-input" type="text" placeholder="Enter date">
        </div>
      </div>

      <div class="ig-overview-page ig-page-break">
        <div class="ig-overview-title">Guide Overview</div>
        <div class="ig-overview-text">This guide provides structured behavioral interview questions for evaluating a candidate against the core competencies for this role. Each competency includes a set of interview questions, follow-up prompts to probe deeper, positive and negative behavioral indicators, and a rating scale to support consistent, objective evaluation.</div>
        <div class="ig-comp-list-title">Competencies Covered</div>
        <ul class="ig-comp-list">
          ${role.competencies.map(([name, inRole, why], i) => `<li><span class="num">0${i + 1}</span><div><div class="comp-name">${escapeHtml(name)}</div><div class="comp-why">${escapeHtml(why)}</div></div></li>`).join("")}
        </ul>
      </div>

      <div class="ig-guide-title">Interview Guide &mdash; ${escapeHtml(roleName)}</div>
      <div class="ig-guide-meta">${escapeHtml(role.meta)}</div>
      ${role.competencies.map(([name, inRole]) => renderCompetencyBlock(name, inRole)).join("")}
      <div class="ig-actions no-print">
        <button class="ig-btn" id="ig-back-btn-2">&larr; Choose a different role</button>
        <button class="ig-btn ig-btn-primary" id="ig-print-btn-2">Print / Save as PDF</button>
      </div>
    `;
    document.getElementById("ig-back-btn").onclick = () => { selectedRole = null; render(); };
    document.getElementById("ig-back-btn-2").onclick = () => { selectedRole = null; render(); };
    document.getElementById("ig-print-btn").onclick = openPrintWindow;
    document.getElementById("ig-print-btn-2").onclick = openPrintWindow;
  }

  function openPrintWindow() {
    const printableEl = document.querySelector(".ig-cover-page");
    if (!printableEl) return;
    // Collect everything from the cover page through the end of the guide (skip banners/buttons).
    const container = document.createElement("div");
    let node = printableEl;
    while (node) {
      container.appendChild(node.cloneNode(true));
      node = node.nextElementSibling;
    }
    // cloneNode() does NOT carry over live-typed values for <input> fields (only their
    // original default attribute), so replace each cover-page input with static text
    // reflecting what was actually typed before handing this off to the print window.
    const liveInputs = document.querySelectorAll(".ig-cover-input");
    const clonedInputs = container.querySelectorAll(".ig-cover-input");
    clonedInputs.forEach((el, i) => {
      const liveVal = liveInputs[i] ? liveInputs[i].value.trim() : "";
      const replacement = document.createElement("div");
      replacement.className = "ig-cover-input-print";
      replacement.textContent = liveVal || "\u00A0";
      el.replaceWith(replacement);
    });

    const styleContent = document.querySelector("style") ? document.querySelector("style").textContent : "";
    const printWin = window.open("", "_blank");
    if (!printWin) {
      alert("Your browser blocked the print window. Please allow pop-ups for this page and try again, or use your browser's own Print (Ctrl+P / Cmd+P) command.");
      return;
    }
    printWin.document.open();
    printWin.document.write(`<!DOCTYPE html><html><head><meta charset="utf-8"><title>Interview Guide</title>
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
      <style>${styleContent}
        body { margin: 0; background: white; }
        #ig-root { border: none; box-shadow: none; padding: 20px; background: white; }
        .ig-cover-input-print { border-bottom: 1.5px solid var(--blue-line-dim); padding: 6px 2px; font-size: 17px; min-height: 1.4em; }
      </style>
      </head><body><div id="ig-root"><div class="ig-wrap">${container.innerHTML}</div></div></body></html>`);
    printWin.document.close();
    printWin.focus();
    setTimeout(() => {
      printWin.print();
    }, 400);
  }

  function renderCompetencyBlock(name, inRole) {
    const d = COMPETENCY_DATA[name];
    if (!d) return `<div class="ig-comp-block">Missing data for ${escapeHtml(name)}</div>`;
    return `
      <div class="ig-comp-block">
        <div class="ig-comp-name">${escapeHtml(name)}</div>
        <div class="ig-comp-inrole"><b>In this role:</b> ${escapeHtml(inRole)}</div>

        <div class="ig-section-label">Interview Questions</div>
        ${d.questions.map(q => `<div class="ig-check-item"><div class="box"></div><div>${escapeHtml(q)}</div></div>`).join("")}

        <div class="ig-section-label">Follow-Up Questions</div>
        ${d.followups.map(f => renderFollowup(f)).join("")}

        <div class="ig-notes-box">
          <div class="ig-notes-label">Interview Notes</div>
          <div class="ig-notes-placeholder">This space is intentionally left blank for handwritten notes when printed.</div>
        </div>

        <div class="ig-np-grid">
          <div>
            <div class="ig-np-col-label neg">NEGATIVE</div>
            ${d.negative.map(n => `<div class="ig-check-item"><div class="box"></div><div>${escapeHtml(n)}</div></div>`).join("")}
          </div>
          <div>
            <div class="ig-np-col-label pos">POSITIVE</div>
            ${d.positive.map(p => `<div class="ig-check-item"><div class="box"></div><div>${escapeHtml(p)}</div></div>`).join("")}
          </div>
        </div>

        <div class="ig-section-label">Rating</div>
        <div class="ig-rating-row">
          ${d.rating.map(r => `<div class="ig-rating-item"><div class="box"></div>${escapeHtml(r)}</div>`).join("")}
        </div>
      </div>
    `;
  }

  function renderFollowup(text) {
    const idx = text.indexOf(":");
    if (idx === -1) return `<div class="ig-check-item"><div class="box"></div><div>${escapeHtml(text)}</div></div>`;
    const label = text.slice(0, idx + 1);
    const rest = text.slice(idx + 1);
    return `<div class="ig-check-item ig-followup"><div class="box"></div><div><b>${escapeHtml(label)}</b>${escapeHtml(rest)}</div></div>`;
  }

  function escapeHtml(str) {
    if (!str) return "";
    return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  render();
})();
</script>
