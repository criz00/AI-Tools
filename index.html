<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Succession Planning Tool</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EEF1F4;
    --surface:#FFFFFF;
    --surface-alt:#E4E9EF;
    --ink:#1B2430;
    --ink-soft:#5B6675;
    --line:#D6DCE3;
    --accent:#2F6F63;
    --accent-soft:#E4EFEC;
    --error:#B3432B;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{
    font-family:'Source Serif 4', Georgia, serif;
    font-weight:600;
    margin:0;
  }
  .app{
    display:flex;
    min-height:100vh;
  }
  /* ---------- SIDEBAR ---------- */
  .sidebar{
    width:260px;
    flex-shrink:0;
    background:var(--surface);
    border-right:1px solid var(--line);
    padding:32px 20px;
  }
  .brand{
    font-family:'Source Serif 4', serif;
    font-size:19px;
    font-weight:600;
    color:var(--ink);
    margin-bottom:4px;
  }
  .brand-sub{
    font-size:12.5px;
    color:var(--ink-soft);
    margin-bottom:28px;
  }
  .steps{list-style:none;margin:0;padding:0;}
  .step{
    display:flex;
    gap:12px;
    align-items:flex-start;
    padding:11px 8px;
    border-radius:8px;
    cursor:default;
    margin-bottom:2px;
  }
  .step.clickable{cursor:pointer;}
  .step.clickable:hover{background:var(--surface-alt);}
  .step-num{
    width:24px;height:24px;
    border-radius:50%;
    border:1.5px solid var(--line);
    color:var(--ink-soft);
    font-size:12px;
    font-weight:600;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
    background:var(--surface);
  }
  .step.active .step-num{background:var(--accent);border-color:var(--accent);color:#fff;}
  .step.done .step-num{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);}
  .step-label{font-size:13.5px;color:var(--ink-soft);line-height:1.35;padding-top:3px;}
  .step.active .step-label{color:var(--ink);font-weight:600;}
  .step.done .step-label{color:var(--ink);}

  /* ---------- MAIN ---------- */
  .main{flex:1;padding:44px 56px;max-width:920px;}
  .eyebrow{color:var(--accent);font-size:13px;font-weight:600;margin-bottom:6px;}
  .page-title{font-size:28px;margin-bottom:10px;}
  .page-desc{color:var(--ink-soft);font-size:15px;line-height:1.6;max-width:640px;margin-bottom:32px;}

  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:12px;
    padding:28px 30px;
    margin-bottom:20px;
  }
  .card-alt{background:var(--surface-alt);}

  .field{margin-bottom:20px;}
  .field:last-child{margin-bottom:0;}
  .field label{
    display:block;
    font-size:13px;
    font-weight:600;
    color:var(--ink);
    margin-bottom:7px;
  }
  .hint{font-size:12.5px;color:var(--ink-soft);margin-top:5px;}
  input[type=text], input[type=date], select, textarea{
    width:100%;
    font-family:'Inter',sans-serif;
    font-size:14.5px;
    color:var(--ink);
    background:#fff;
    border:1px solid var(--line);
    border-radius:8px;
    padding:11px 13px;
    outline:none;
    transition:border-color .15s;
  }
  input[type=text]:focus, input[type=date]:focus, select:focus, textarea:focus{
    border-color:var(--accent);
  }
  textarea{
    resize:vertical;
    min-height:90px;
    line-height:1.5;
    width:100%;
  }
  select{appearance:none;cursor:pointer;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' stroke='%235B6675' stroke-width='1.6' fill='none' fill-rule='evenodd'/></svg>");
    background-repeat:no-repeat;background-position:right 14px center;padding-right:36px;
  }
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
  .readonly-field{
    background:var(--surface-alt);
    border:1px solid var(--line);
    border-radius:8px;
    padding:11px 13px;
    font-size:14.5px;
    color:var(--ink);
  }
  .readonly-field .rf-label{font-size:11.5px;color:var(--ink-soft);font-weight:600;margin-bottom:3px;text-transform:none;}

  /* buttons */
  .btn{
    font-family:'Inter',sans-serif;
    font-size:14px;
    font-weight:600;
    border-radius:8px;
    padding:11px 20px;
    border:1px solid transparent;
    cursor:pointer;
    transition:opacity .15s, background .15s;
  }
  .btn-primary{background:var(--accent);color:#fff;}
  .btn-primary:hover{opacity:.9;}
  .btn-secondary{background:#fff;color:var(--ink);border-color:var(--line);}
  .btn-secondary:hover{background:var(--surface-alt);}
  .btn-text{background:transparent;color:var(--accent);border:none;padding:8px 4px;}
  .btn-danger{background:transparent;color:var(--error);border:none;font-size:13px;padding:6px;}
  .btn-row{display:flex;gap:12px;margin-top:24px;align-items:center;}
  .btn:disabled{opacity:.45;cursor:not-allowed;}

  /* entry list cards */
  .entry{
    border:1px solid var(--line);
    background:#fff;
    border-radius:10px;
    padding:16px 18px;
    margin-bottom:12px;
  }
  .entry-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .entry-title{font-weight:600;font-size:15px;}
  .entry-sub{color:var(--ink-soft);font-size:13px;margin-top:2px;}
  .entry-actions{display:flex;gap:14px;flex-shrink:0;}
  .entry-actions button{background:none;border:none;color:var(--accent);font-size:13px;font-weight:600;cursor:pointer;padding:2px;}
  .badge{
    display:inline-block;font-size:11.5px;font-weight:600;
    padding:3px 10px;border-radius:20px;
    background:var(--accent-soft);color:var(--accent);
    margin-top:8px;
  }
  .badge.high{background:#F6E3DE;color:var(--error);}
  .badge.medium{background:#F5EFDD;color:#8A6D1D;}
  .badge.low{background:var(--accent-soft);color:var(--accent);}

  .prompt-card{
    border:1.5px dashed var(--accent);
    background:var(--accent-soft);
    border-radius:12px;
    padding:24px 28px;
    text-align:left;
  }
  .prompt-card h3{font-size:17px;margin-bottom:6px;}
  .prompt-card p{color:var(--ink-soft);font-size:14px;margin:0 0 16px 0;}

  .empty-state{
    border:1px dashed var(--line);
    border-radius:10px;
    padding:26px;
    text-align:center;
    color:var(--ink-soft);
    font-size:14px;
    margin-bottom:16px;
  }

  ul.instr{margin:0;padding-left:20px;color:var(--ink);}
  ul.instr li{margin-bottom:10px;line-height:1.55;font-size:14.5px;}

  .group-heading{
    font-size:12.5px;font-weight:700;color:var(--ink-soft);
    text-transform:uppercase;letter-spacing:.04em;
    margin:26px 0 12px 0;
  }
  .group-heading:first-child{margin-top:0;}

  .final-card{
    text-align:center;padding:60px 40px;
  }
  .final-card h2{font-size:24px;margin-bottom:10px;}
  .final-card p{color:var(--ink-soft);margin-bottom:22px;}

  @media print{
    .sidebar, .btn-row, .entry-actions, .no-print{display:none !important;}
    .main{max-width:100%;padding:0;}
    body{background:#fff;}
  }
  @media (max-width:800px){
    .app{flex-direction:column;}
    .sidebar{width:100%;border-right:none;border-bottom:1px solid var(--line);}
    .main{padding:28px 20px;}
    .row2{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<div class="app">
  <div class="sidebar">
    <div class="brand">Succession Planning</div>
    <div class="brand-sub">Talent continuity workspace</div>
    <ul class="steps" id="steps"></ul>
  </div>
  <div class="main" id="main"></div>
</div>

<script>
/* ---------------- STATE ---------------- */
const SECTIONS = [
  {id:'intro', label:'Instructions'},
  {id:1, label:'Identify Key Roles'},
  {id:2, label:'Successor Selection & Readiness'},
  {id:3, label:'Successor Development Plan'},
  {id:4, label:'Knowledge Transfer & Risk Mitigation'},
  {id:5, label:'Progress Monitoring & Review'},
  {id:'done', label:'Summary'}
];

let state = {
  current: 'intro',
  furthest: 0,
  roles: [],       // {id, title, department, holder, criticality, reason}
  successors: [],  // {id, name, currentRole, department, roleId, readiness, strengths, development}
  devPlans: {},    // successorId -> {actions, targetDate, resources, outcome}
  knowledge: {},   // roleId -> {criticalKnowledge, transferPlan, riskLevel, mitigation}
  monitoring: {},  // successorId -> {owner, reviewDate, updates, keyActions}
  ui: {            // transient per-section UI state
    s1: {mode:'form', editingId:null, showPrompt:false},
    s2: {mode:'form', editingId:null, showPrompt:false}
  },
  finished: false
};
let uid = 1;
const newId = () => 'id' + (uid++);

/* ---------------- HELPERS ---------------- */
function autoGrow(el){
  el.style.height = 'auto';
  el.style.height = (el.scrollHeight + 2) + 'px';
}
function attachAutoGrow(root){
  root.querySelectorAll('textarea').forEach(t=>{
    autoGrow(t);
    t.addEventListener('input', ()=>autoGrow(t));
  });
}
function criticalityBadgeClass(v){
  if(v==='High') return 'high';
  if(v==='Medium') return 'medium';
  if(v==='Low') return 'low';
  return '';
}
function roleById(id){ return state.roles.find(r=>r.id===id); }
function successorById(id){ return state.successors.find(s=>s.id===id); }

function render(){
  renderSidebar();
  renderMain();
}

/* ---------------- SIDEBAR ---------------- */
function renderSidebar(){
  const stepsEl = document.getElementById('steps');
  stepsEl.innerHTML = '';
  SECTIONS.forEach((s, idx) => {
    const li = document.createElement('li');
    const isActive = state.current === s.id;
    const isDone = idx < indexOf(state.current) || (state.current==='done');
    const reachable = idx <= state.furthest;
    li.className = 'step' + (isActive?' active':'') + (isDone && !isActive?' done':'') + (reachable?' clickable':'');
    li.innerHTML = `<div class="step-num">${s.id==='intro' ? 'i' : (s.id==='done' ? '✓' : s.id)}</div><div class="step-label">${s.label}</div>`;
    if(reachable){
      li.addEventListener('click', ()=>{ state.current = s.id; render(); window.scrollTo(0,0); });
    }
    stepsEl.appendChild(li);
  });
}
function indexOf(id){ return SECTIONS.findIndex(s=>s.id===id); }
function goTo(id){
  state.current = id;
  const idx = indexOf(id);
  if(idx > state.furthest) state.furthest = idx;
  render();
  window.scrollTo(0,0);
}

/* ---------------- MAIN ROUTER ---------------- */
function renderMain(){
  const el = document.getElementById('main');
  el.innerHTML = '';
  if(state.current === 'intro') return renderIntro(el);
  if(state.current === 1) return renderSection1(el);
  if(state.current === 2) return renderSection2(el);
  if(state.current === 3) return renderSection3(el);
  if(state.current === 4) return renderSection4(el);
  if(state.current === 5) return renderSection5(el);
  if(state.current === 'done') return renderDone(el);
}

/* ---------------- INTRO ---------------- */
function renderIntro(el){
  el.innerHTML = `
    <div class="eyebrow">Get started</div>
    <h1 class="page-title">Succession Planning Tool</h1>
    <p class="page-desc">Work through five short sections to build a complete succession plan for your team — from identifying critical roles to tracking successor progress over time.</p>
    <div class="card">
      <h3 style="margin-bottom:16px;">Instructions</h3>
      <ul class="instr">
        <li>Fill out each section with relevant information. You can go back and edit any entry at any time.</li>
        <li>Use the drop-down menus where they're provided (Criticality Level, Readiness Level, Risk Level).</li>
        <li>Once complete, transfer this information to your HCM/HRIS or dedicated talent management system.</li>
        <li>Update this plan regularly as part of your annual succession planning review.</li>
        <li>Share the finished plan with leadership for visibility and input.</li>
      </ul>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" id="start-btn">Start with Section 1</button>
    </div>
  `;
  el.querySelector('#start-btn').addEventListener('click', ()=>goTo(1));
}

/* ---------------- SECTION 1: Identify Key Roles ---------------- */
function emptyRoleForm(){
  return {id:null, title:'', department:'', holder:'', criticality:'', reason:''};
}
function renderSection1(el){
  const ui = state.ui.s1;
  el.innerHTML = `
    <div class="eyebrow">Section 1 of 5</div>
    <h1 class="page-title">Identify Key Roles</h1>
    <p class="page-desc">List the roles that are critical to your team or organization's continued success, and capture why each one matters.</p>
    <div id="s1-body"></div>
  `;
  const body = el.querySelector('#s1-body');

  if(ui.mode === 'form'){
    const editing = ui.editingId ? roleById(ui.editingId) : emptyRoleForm();
    body.appendChild(roleForm(editing));
    return;
  }

  // list mode
  if(state.roles.length === 0){
    const empty = document.createElement('div');
    empty.className = 'empty-state';
    empty.textContent = "No key roles added yet. Add the first role to get started.";
    body.appendChild(empty);
  } else {
    state.roles.forEach(r=>{
      const card = document.createElement('div');
      card.className = 'entry';
      card.innerHTML = `
        <div class="entry-top">
          <div>
            <div class="entry-title">${escapeHtml(r.title || 'Untitled role')}</div>
            <div class="entry-sub">${escapeHtml(r.department || '—')}${r.holder ? ' · Current holder: '+escapeHtml(r.holder) : ''}</div>
            ${r.criticality ? `<span class="badge ${criticalityBadgeClass(r.criticality)}">${r.criticality} criticality</span>` : ''}
          </div>
          <div class="entry-actions">
            <button data-edit="${r.id}">Edit</button>
            <button data-del="${r.id}" style="color:var(--error);">Remove</button>
          </div>
        </div>
      `;
      body.appendChild(card);
    });
  }

  if(ui.showPrompt){
    body.appendChild(promptCard(
      'Role saved.',
      'Would you like to add another key role?',
      ()=>{ ui.showPrompt=false; ui.mode='form'; ui.editingId=null; render(); },
      ()=>{ ui.showPrompt=false; render(); }
    ));
  } else {
    const btnRow = document.createElement('div');
    btnRow.className = 'btn-row';
    btnRow.innerHTML = `
      <button class="btn btn-secondary" id="add-role">+ Add key role</button>
      <button class="btn btn-primary" id="to-s2" ${state.roles.length===0?'disabled':''}>Continue to Section 2</button>
    `;
    body.appendChild(btnRow);
    body.querySelector('#add-role').addEventListener('click', ()=>{ ui.mode='form'; ui.editingId=null; render(); });
    const nextBtn = body.querySelector('#to-s2');
    if(nextBtn) nextBtn.addEventListener('click', ()=>goTo(2));
  }

  body.querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click', e=>{
    ui.mode='form'; ui.editingId = e.target.getAttribute('data-edit'); render();
  }));
  body.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click', e=>{
    const id = e.target.getAttribute('data-del');
    if(confirm('Remove this role and any linked successor or knowledge-transfer data?')){
      state.roles = state.roles.filter(r=>r.id!==id);
      state.successors = state.successors.filter(s=>s.roleId!==id);
      delete state.knowledge[id];
      render();
    }
  }));
}

function roleForm(data){
  const wrap = document.createElement('div');
  wrap.className = 'card';
  wrap.innerHTML = `
    <div class="row2">
      <div class="field">
        <label>Role title</label>
        <input type="text" id="f-title" value="${attr(data.title)}" placeholder="e.g., Director of Operations">
      </div>
      <div class="field">
        <label>Department</label>
        <input type="text" id="f-department" value="${attr(data.department)}" placeholder="e.g., Operations">
      </div>
    </div>
    <div class="row2">
      <div class="field">
        <label>Current role holder</label>
        <input type="text" id="f-holder" value="${attr(data.holder)}" placeholder="Name of person currently in the role">
      </div>
      <div class="field">
        <label>Criticality level</label>
        <select id="f-criticality">
          <option value="" ${data.criticality===''?'selected':''}>Select level</option>
          <option value="High" ${data.criticality==='High'?'selected':''}>High</option>
          <option value="Medium" ${data.criticality==='Medium'?'selected':''}>Medium</option>
          <option value="Low" ${data.criticality==='Low'?'selected':''}>Low</option>
        </select>
      </div>
    </div>
    <div class="field">
      <label>Reason for criticality</label>
      <textarea id="f-reason" placeholder="Why is this role critical to the business? Consider impact, specialized knowledge, and risk if vacant.">${data.reason||''}</textarea>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" id="save-role">Save role</button>
      <button class="btn btn-text" id="cancel-role">Cancel</button>
    </div>
  `;
  attachAutoGrow(wrap);
  wrap.querySelector('#save-role').addEventListener('click', ()=>{
    const title = wrap.querySelector('#f-title').value.trim();
    if(!title){ alert('Please enter a role title.'); return; }
    const record = {
      id: data.id || newId(),
      title,
      department: wrap.querySelector('#f-department').value.trim(),
      holder: wrap.querySelector('#f-holder').value.trim(),
      criticality: wrap.querySelector('#f-criticality').value,
      reason: wrap.querySelector('#f-reason').value.trim()
    };
    if(data.id){
      const idx = state.roles.findIndex(r=>r.id===data.id);
      state.roles[idx] = record;
    } else {
      state.roles.push(record);
    }
    state.ui.s1.mode = 'list';
    state.ui.s1.showPrompt = true;
    render();
  });
  wrap.querySelector('#cancel-role').addEventListener('click', ()=>{
    state.ui.s1.mode='list'; render();
  });
  return wrap;
}

/* ---------------- SECTION 2: Successor Selection & Readiness ---------------- */
function emptySuccessorForm(){
  return {id:null, name:'', currentRole:'', department:'', roleId:'', readiness:'', strengths:'', development:''};
}
function renderSection2(el){
  const ui = state.ui.s2;
  el.innerHTML = `
    <div class="eyebrow">Section 2 of 5</div>
    <h1 class="page-title">Successor Selection &amp; Readiness Assessment</h1>
    <p class="page-desc">For each key role, identify potential successors and assess how ready they are to step in.</p>
    <div id="s2-body"></div>
  `;
  const body = el.querySelector('#s2-body');

  if(state.roles.length===0){
    body.innerHTML = `<div class="empty-state">Add at least one key role in Section 1 before identifying successors.</div>
      <div class="btn-row"><button class="btn btn-secondary" id="back1">Back to Section 1</button></div>`;
    body.querySelector('#back1').addEventListener('click', ()=>goTo(1));
    return;
  }

  if(ui.mode === 'form'){
    const editing = ui.editingId ? successorById(ui.editingId) : emptySuccessorForm();
    body.appendChild(successorForm(editing));
    return;
  }

  if(state.successors.length === 0){
    const empty = document.createElement('div');
    empty.className = 'empty-state';
    empty.textContent = "No successors added yet. Add the first successor to get started.";
    body.appendChild(empty);
  } else {
    state.successors.forEach(s=>{
      const role = roleById(s.roleId);
      const card = document.createElement('div');
      card.className = 'entry';
      card.innerHTML = `
        <div class="entry-top">
          <div>
            <div class="entry-title">${escapeHtml(s.name || 'Unnamed successor')}</div>
            <div class="entry-sub">For: ${escapeHtml(role ? role.title : '—')} &middot; Currently: ${escapeHtml(s.currentRole || '—')}</div>
            ${s.readiness ? `<span class="badge low">Ready: ${s.readiness}</span>` : ''}
          </div>
          <div class="entry-actions">
            <button data-edit="${s.id}">Edit</button>
            <button data-del="${s.id}" style="color:var(--error);">Remove</button>
          </div>
        </div>
      `;
      body.appendChild(card);
    });
  }

  if(ui.showPrompt){
    body.appendChild(promptCard(
      'Successor saved.',
      'Would you like to add another successor?',
      ()=>{ ui.showPrompt=false; ui.mode='form'; ui.editingId=null; render(); },
      ()=>{ ui.showPrompt=false; render(); }
    ));
  } else {
    const btnRow = document.createElement('div');
    btnRow.className = 'btn-row';
    btnRow.innerHTML = `
      <button class="btn btn-secondary" id="add-succ">+ Add successor</button>
      <button class="btn btn-primary" id="to-s3" ${state.successors.length===0?'disabled':''}>Continue to Section 3</button>
    `;
    body.appendChild(btnRow);
    body.querySelector('#add-succ').addEventListener('click', ()=>{ ui.mode='form'; ui.editingId=null; render(); });
    const nextBtn = body.querySelector('#to-s3');
    if(nextBtn) nextBtn.addEventListener('click', ()=>goTo(3));
  }

  body.querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click', e=>{
    ui.mode='form'; ui.editingId = e.target.getAttribute('data-edit'); render();
  }));
  body.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click', e=>{
    const id = e.target.getAttribute('data-del');
    if(confirm('Remove this successor and any linked development or monitoring data?')){
      state.successors = state.successors.filter(s=>s.id!==id);
      delete state.devPlans[id];
      delete state.monitoring[id];
      render();
    }
  }));
}

function successorForm(data){
  const wrap = document.createElement('div');
  wrap.className = 'card';
  const roleOptions = state.roles.map(r=>`<option value="${r.id}" ${data.roleId===r.id?'selected':''}>${escapeHtml(r.title)}</option>`).join('');
  wrap.innerHTML = `
    <div class="field">
      <label>Key Role</label>
      <select id="f-roleId">
        <option value="">Select a key role</option>
        ${roleOptions}
      </select>
    </div>
    <div class="row2">
      <div class="field">
        <label>Successor name</label>
        <input type="text" id="f-name" value="${attr(data.name)}" placeholder="Full name">
      </div>
      <div class="field">
        <label>Current role</label>
        <input type="text" id="f-currentRole" value="${attr(data.currentRole)}" placeholder="Their role today">
      </div>
    </div>
    <div class="row2">
      <div class="field">
        <label>Department</label>
        <input type="text" id="f-department" value="${attr(data.department)}" placeholder="e.g., Operations">
      </div>
      <div class="field">
        <label>Readiness level</label>
        <select id="f-readiness">
          <option value="" ${data.readiness===''?'selected':''}>Select level</option>
          <option value="Now" ${data.readiness==='Now'?'selected':''}>Now</option>
          <option value="1-2 years" ${data.readiness==='1-2 years'?'selected':''}>1-2 years</option>
          <option value="3+ years" ${data.readiness==='3+ years'?'selected':''}>3+ years</option>
        </select>
      </div>
    </div>
    <div class="field">
      <label>Strengths</label>
      <textarea id="f-strengths" placeholder="What makes this person a strong candidate?">${data.strengths||''}</textarea>
    </div>
    <div class="field">
      <label>Development areas</label>
      <textarea id="f-development" placeholder="What gaps or growth areas should be addressed?">${data.development||''}</textarea>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" id="save-succ">Save successor</button>
      <button class="btn btn-text" id="cancel-succ">Cancel</button>
    </div>
  `;
  attachAutoGrow(wrap);
  wrap.querySelector('#save-succ').addEventListener('click', ()=>{
    const name = wrap.querySelector('#f-name').value.trim();
    if(!name){ alert('Please enter a successor name.'); return; }
    const record = {
      id: data.id || newId(),
      roleId: wrap.querySelector('#f-roleId').value,
      name,
      currentRole: wrap.querySelector('#f-currentRole').value.trim(),
      department: wrap.querySelector('#f-department').value.trim(),
      readiness: wrap.querySelector('#f-readiness').value,
      strengths: wrap.querySelector('#f-strengths').value.trim(),
      development: wrap.querySelector('#f-development').value.trim()
    };
    if(data.id){
      const idx = state.successors.findIndex(s=>s.id===data.id);
      state.successors[idx] = record;
    } else {
      state.successors.push(record);
    }
    state.ui.s2.mode = 'list';
    state.ui.s2.showPrompt = true;
    render();
  });
  wrap.querySelector('#cancel-succ').addEventListener('click', ()=>{
    state.ui.s2.mode='list'; render();
  });
  return wrap;
}

/* ---------------- SUMMARY EXPORT ---------------- */
function downloadSummary(){
  const today = new Date().toLocaleDateString();
  let rolesHtml = state.roles.map(r=>`
    <div class="rcard">
      <h3>${escapeHtml(r.title||'Untitled role')}</h3>
      <p class="meta">${escapeHtml(r.department||'—')}${r.holder?' &middot; Current holder: '+escapeHtml(r.holder):''}${r.criticality?' &middot; Criticality: '+r.criticality:''}</p>
      ${r.reason?`<p><strong>Reason for criticality:</strong> ${escapeHtml(r.reason)}</p>`:''}
    </div>`).join('') || '<p class="empty">No key roles added.</p>';

  let successorsHtml = state.successors.map(s=>{
    const role = roleById(s.roleId);
    const plan = state.devPlans[s.id] || {};
    const k = role ? (state.knowledge[role.id] || {}) : {};
    const m = state.monitoring[s.id] || {};
    return `
    <div class="rcard">
      <h3>${escapeHtml(s.name||'Unnamed successor')}</h3>
      <p class="meta">For: ${escapeHtml(role?role.title:'—')} &middot; Currently: ${escapeHtml(s.currentRole||'—')} &middot; Department: ${escapeHtml(s.department||'—')} &middot; Readiness: ${escapeHtml(s.readiness||'—')}</p>
      ${s.strengths?`<p><strong>Strengths:</strong> ${escapeHtml(s.strengths)}</p>`:''}
      ${s.development?`<p><strong>Development areas:</strong> ${escapeHtml(s.development)}</p>`:''}
      <p class="subhead">Development plan</p>
      ${plan.actions?`<p><strong>Actions:</strong> ${escapeHtml(plan.actions)}</p>`:''}
      ${plan.resources?`<p><strong>Resources needed:</strong> ${escapeHtml(plan.resources)}</p>`:''}
      ${plan.targetDate?`<p><strong>Target completion date:</strong> ${escapeHtml(plan.targetDate)}</p>`:''}
      ${plan.outcome?`<p><strong>Expected outcome:</strong> ${escapeHtml(plan.outcome)}</p>`:''}
      <p class="subhead">Progress monitoring</p>
      <p><strong>Owner:</strong> ${escapeHtml(m.owner||'—')} &middot; <strong>Review date:</strong> ${escapeHtml(m.reviewDate||'—')}</p>
      ${m.updates?`<p><strong>Updates and adjustments:</strong> ${escapeHtml(m.updates)}</p>`:''}
      ${m.keyActions?`<p><strong>Key actions:</strong> ${escapeHtml(m.keyActions)}</p>`:''}
    </div>`;
  }).join('') || '<p class="empty">No successors added.</p>';

  let knowledgeHtml = state.roles.map(r=>{
    const k = state.knowledge[r.id];
    if(!k || (!k.criticalKnowledge && !k.transferPlan && !k.potentialRisks && !k.riskLevel && !k.mitigation)) return '';
    return `
    <div class="rcard">
      <h3>${escapeHtml(r.title)}</h3>
      <p class="meta">${k.riskLevel?'Risk level: '+k.riskLevel:''}</p>
      ${k.criticalKnowledge?`<p><strong>Critical knowledge to transfer:</strong> ${escapeHtml(k.criticalKnowledge)}</p>`:''}
      ${k.transferPlan?`<p><strong>Knowledge transfer plan:</strong> ${escapeHtml(k.transferPlan)}</p>`:''}
      ${k.potentialRisks?`<p><strong>Potential risks:</strong> ${escapeHtml(k.potentialRisks)}</p>`:''}
      ${k.mitigation?`<p><strong>Mitigation actions:</strong> ${escapeHtml(k.mitigation)}</p>`:''}
    </div>`;
  }).join('') || '<p class="empty">No knowledge transfer data added.</p>';

  const doc = `<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Succession Plan Summary</title>
<style>
  body{font-family:Georgia,serif;color:#1B2430;max-width:760px;margin:40px auto;padding:0 20px;line-height:1.55;}
  h1{font-size:26px;margin-bottom:4px;}
  .date{color:#5B6675;font-size:13px;margin-bottom:36px;}
  h2{font-size:19px;border-bottom:2px solid #2F6F63;padding-bottom:8px;margin-top:44px;}
  .rcard{border:1px solid #D6DCE3;border-radius:8px;padding:16px 20px;margin:16px 0;background:#fff;}
  .rcard h3{margin:0 0 4px 0;font-size:16px;}
  .meta{color:#5B6675;font-size:13px;margin:0 0 10px 0;}
  .subhead{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:#2F6F63;font-weight:bold;margin:14px 0 6px 0;}
  .empty{color:#5B6675;font-style:italic;}
  p{margin:6px 0;font-size:14.5px;}
  @media print{ body{margin:0;} }
</style></head>
<body>
  <h1>Succession Planning Summary</h1>
  <div class="date">Generated ${today}</div>
  <h2>Key Roles</h2>
  ${rolesHtml}
  <h2>Successors, Development &amp; Progress</h2>
  ${successorsHtml}
  <h2>Knowledge Transfer &amp; Risk Mitigation</h2>
  ${knowledgeHtml}
</body></html>`;

  const blob = new Blob([doc], {type:'text/html'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'succession-plan-summary.html';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* ---------------- SHARED UI PIECES ---------------- */
function promptCard(title, question, onYes, onNo){
  const div = document.createElement('div');
  div.className = 'prompt-card';
  div.innerHTML = `<h3>${title}</h3><p>${question}</p>`;
  const row = document.createElement('div');
  row.className = 'btn-row';
  row.style.marginTop = '0';
  const yes = document.createElement('button');
  yes.className = 'btn btn-primary'; yes.textContent = 'Yes, add another';
  const no = document.createElement('button');
  no.className = 'btn btn-secondary'; no.textContent = 'No, continue';
  yes.addEventListener('click', onYes);
  no.addEventListener('click', onNo);
  row.appendChild(yes); row.appendChild(no);
  div.appendChild(row);
  return div;
}
function escapeHtml(str){
  return String(str||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function attr(str){ return escapeHtml(str); }

/* ---------------- INIT ---------------- */
render();
</script>
