<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Succession Planning Tool</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap">
<style>
/* ===== Talent Workspace UI (talent-ui.css) ===== */
/* Layout: brand row, then a 280px sticky step rail beside the main column. At 800px and below the rail becomes a sticky section header with a dropdown. */
:root{
  --font-sans:Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:22px;--space-6:28px;--space-7:32px;--space-8:56px;
  --radius-sm:8px;--radius-md:10px;--radius-lg:12px;--radius-xl:14px;--radius-pill:999px;
  --bg:#F7F8FA;--surface:#FFFFFF;--surface-alt:#F1F3F5;--ink:#111827;--ink-soft:#5B6472;--line:#E5E7EB;--line-strong:#8A9099;
  --accent:#0F766E;--accent-hover:#0B5F58;--on-accent:#FFFFFF;--accent-soft:#E6F4F2;--focus-ring:rgba(15,118,110,0.25);
  --info:#1D4ED8;--info-soft:#EEF3FF;--warning:#B54708;--warning-soft:#FEF3E2;--error:#B42318;--error-soft:#FEECEB;
  --shadow-sm:0 1px 2px rgba(16,24,40,0.05);
  --shadow-card:0 1px 2px rgba(16,24,40,0.04), 0 6px 20px -4px rgba(16,24,40,0.07);
  --shadow-lift:0 2px 4px rgba(16,24,40,0.06), 0 10px 28px -6px rgba(16,24,40,0.12);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1113;--surface:#171B1F;--surface-alt:#1F2429;--ink:#ECEEF0;--ink-soft:#9AA3AD;--line:#2A3036;--line-strong:#6B747E;
    --accent:#3CC4B4;--accent-hover:#62D3C6;--on-accent:#04201C;--accent-soft:rgba(60,196,180,0.13);--focus-ring:rgba(60,196,180,0.3);
    --info:#8AB4F8;--info-soft:rgba(138,180,248,0.13);--warning:#F5B45C;--warning-soft:rgba(245,180,92,0.13);--error:#F28B82;--error-soft:rgba(242,139,130,0.13);
    --shadow-sm:0 1px 2px rgba(0,0,0,0.4);
    --shadow-card:0 1px 2px rgba(0,0,0,0.4), 0 8px 24px -6px rgba(0,0,0,0.5);
    --shadow-lift:0 2px 4px rgba(0,0,0,0.45), 0 12px 30px -6px rgba(0,0,0,0.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1113;--surface:#171B1F;--surface-alt:#1F2429;--ink:#ECEEF0;--ink-soft:#9AA3AD;--line:#2A3036;--line-strong:#6B747E;
  --accent:#3CC4B4;--accent-hover:#62D3C6;--on-accent:#04201C;--accent-soft:rgba(60,196,180,0.13);--focus-ring:rgba(60,196,180,0.3);
  --info:#8AB4F8;--info-soft:rgba(138,180,248,0.13);--warning:#F5B45C;--warning-soft:rgba(245,180,92,0.13);--error:#F28B82;--error-soft:rgba(242,139,130,0.13);
  --shadow-sm:0 1px 2px rgba(0,0,0,0.4);
  --shadow-card:0 1px 2px rgba(0,0,0,0.4), 0 8px 24px -6px rgba(0,0,0,0.5);
  --shadow-lift:0 2px 4px rgba(0,0,0,0.45), 0 12px 30px -6px rgba(0,0,0,0.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg)}
body{color:var(--ink);font-family:var(--font-sans);font-size:14.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-weight:650;letter-spacing:-.022em;margin:0;line-height:1.2;text-wrap:balance}
p{margin:0}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:none;box-shadow:0 0 0 4px var(--focus-ring)}

/* Brand row */
.topbar{background:var(--surface);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1280px;margin:0 auto;padding-inline:32px;padding-block:14px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{width:32px;height:32px;border-radius:var(--radius-md);background:var(--accent);color:var(--on-accent);display:grid;place-items:center;flex:none}
.brand-mark svg{width:17px;height:17px}
.brand-name{font-size:15px;font-weight:650;letter-spacing:-.01em;line-height:1.3}
.brand-sub{display:block;font-size:12.5px;color:var(--ink-soft)}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:6px}
.theme-toggle{width:36px;height:36px;border-radius:var(--radius-md);border:none;background:transparent;color:var(--ink-soft);display:flex;align-items:center;justify-content:center;flex:none;cursor:pointer;transition:background .15s,color .15s}
.theme-toggle:hover{background:var(--surface-alt);color:var(--ink)}

/* Shell */
.shell{max-width:1280px;margin:0 auto;padding-inline:32px;padding-block:var(--space-8) 56px;display:grid;grid-template-columns:280px minmax(0,860px);gap:40px;align-items:start;justify-content:center}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 24px);display:flex;flex-direction:column;gap:16px}

/* Progress */
.progress{padding:14px;border-radius:var(--radius-lg);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-sm)}
.progress-top{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:9px}
.progress-top span:first-child{color:var(--ink-soft);font-weight:500}
.progress-top span:last-child{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.progress-track{height:6px;border-radius:var(--radius-pill);background:var(--surface-alt);overflow:hidden}
.progress-fill{height:100%;border-radius:var(--radius-pill);background:var(--accent);transition:width .5s cubic-bezier(.2,.8,.2,1)}

/* Stepper */
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.step{display:flex;gap:12px;align-items:center;width:100%;padding:9px 10px;border-radius:var(--radius-md);border:0;background:transparent;text-align:left;color:var(--ink);transition:background .15s,box-shadow .15s}
.step.clickable{cursor:pointer}
.step.clickable:hover{background:var(--surface-alt)}
.step:disabled{cursor:default}
.step-num{width:24px;height:24px;border-radius:50%;flex-shrink:0;border:1.5px solid var(--line-strong);color:var(--ink-soft);font-size:11.5px;font-weight:600;display:flex;align-items:center;justify-content:center}
.step-num svg{width:12px;height:12px}
.step-label{font-size:13.5px;color:var(--ink-soft);line-height:1.35}
.step.active,.step.active.clickable:hover{background:var(--surface);box-shadow:var(--shadow-sm),inset 0 0 0 1px var(--line)}
.step.active .step-num{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.step.active .step-label{color:var(--ink);font-weight:600}
.step.done .step-num{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.step.done .step-label{color:var(--ink)}

/* Mobile header */
.mobile-head{display:none}
.mobile-toggle{display:flex;align-items:center;gap:12px;width:100%;background:none;border:none;border-radius:var(--radius-md);padding:8px 8px 10px;text-align:left;cursor:pointer;color:var(--ink);font-family:var(--font-sans)}
.mb-text{flex:1;min-width:0;display:flex;flex-direction:column}
.mb-step{font-size:11.5px;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:.06em}
.mb-label{font-size:15px;font-weight:600;letter-spacing:-.01em;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mb-chev{width:34px;height:34px;border-radius:var(--radius-md);flex:none;display:flex;align-items:center;justify-content:center;background:var(--surface-alt);color:var(--ink-soft);transition:transform .2s}
.mobile-toggle[aria-expanded="true"] .mb-chev{transform:rotate(180deg)}
.mb-progress{height:3px;background:var(--surface-alt)}
.mb-fill{height:100%;background:var(--accent);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.mb-menu{position:absolute;left:0;right:0;top:100%;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:var(--shadow-lift);padding:8px 12px 12px;max-height:70vh;overflow-y:auto}
.mb-menu .step.active{background:var(--accent-soft);box-shadow:none}

/* Main */
.main{min-width:0;animation:tw-rise .32s ease both}
@keyframes tw-rise{from{opacity:.001;transform:translateY(6px)}to{opacity:1;transform:none}}
.eyebrow{display:inline-flex;align-items:center;gap:6px;color:var(--accent);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;margin-bottom:12px}
.page-title{font-size:32px;line-height:1.15;margin:0 0 12px}
.page-desc{color:var(--ink-soft);font-size:15.5px;line-height:1.6;max-width:620px;margin:0 0 36px}

/* Card */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-xl);padding:var(--space-7);margin-bottom:20px;box-shadow:var(--shadow-card);color:var(--ink)}
.card h3{font-size:17px}
.group-heading{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:15px;font-weight:650;letter-spacing:-.01em;color:var(--ink);padding-bottom:16px;margin:0 0 22px;border-bottom:1px solid var(--line)}
.group-heading .gh-sub{font-weight:500;color:var(--ink-soft);font-size:13.5px;letter-spacing:0}

/* Fields */
.field{margin-bottom:var(--space-5)}
.field:last-child{margin-bottom:0}
.field label{display:block;font-size:13px;font-weight:600;color:var(--ink);margin-bottom:var(--space-2)}
.hint{font-size:12.5px;color:var(--ink-soft);margin-top:6px}
input[type=text],input[type=date],select,textarea{width:100%;min-height:44px;font:400 14.5px var(--font-sans);color:var(--ink);background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--radius-md);padding:11px 14px;outline:none;transition:border-color .15s,box-shadow .15s}
input:hover,select:hover,textarea:hover{border-color:var(--ink-soft)}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--focus-ring)}
::placeholder{color:var(--ink-soft);opacity:1}
input[type=date]{font-variant-numeric:tabular-nums}
textarea{resize:vertical;min-height:96px;line-height:1.55;overflow:hidden}
select{appearance:none;cursor:pointer;padding-right:40px;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' stroke='%238A9099' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>");
  background-repeat:no-repeat;background-position:right 15px center}
select.placeholder{color:var(--ink-soft)}
select option{color:var(--ink);background:var(--surface)}
.field.invalid input{border-color:var(--error);box-shadow:0 0 0 4px var(--error-soft)}
.err{display:none;align-items:center;gap:5px;font-size:12.5px;color:var(--error);font-weight:600;margin-top:6px}
.err svg{width:14px;height:14px;flex:none}
.field.invalid .err{display:flex}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.row2 > *{min-width:0}
.readonly-field{background:var(--surface-alt);border-radius:var(--radius-md);padding:11px 14px;font-size:14.5px;color:var(--ink);overflow-wrap:anywhere}
.readonly-field .rf-label{font-size:11.5px;color:var(--ink-soft);font-weight:600;margin-bottom:3px}
.ro-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 18px;margin-bottom:22px}
.ro-grid .field{margin:0}

/* Buttons */
.btn{font:600 14px var(--font-sans);border-radius:var(--radius-md);padding:11px 20px;min-height:44px;border:1px solid transparent;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:background .15s,box-shadow .15s,transform .15s,border-color .15s,color .15s}
.btn svg{width:16px;height:16px;flex:none}
.btn-primary{background:var(--accent);color:var(--on-accent);box-shadow:var(--shadow-sm)}
.btn-primary:hover:not(:disabled){background:var(--accent-hover);transform:translateY(-1px);box-shadow:var(--shadow-lift)}
.btn-primary:active:not(:disabled){transform:none}
.btn-secondary{background:var(--surface);color:var(--ink);border-color:var(--line-strong);box-shadow:var(--shadow-sm)}
.btn-secondary:hover:not(:disabled){background:var(--surface-alt)}
.btn-text{background:transparent;color:var(--ink-soft);border:none;padding:8px 10px}
.btn-text:hover{color:var(--ink);background:var(--surface-alt)}
.btn-danger{background:var(--error);color:var(--on-accent)}
.btn-danger:hover{filter:brightness(.93)}
.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.btn:focus-visible{outline:none;box-shadow:0 0 0 4px var(--focus-ring)}
.btn-row{display:flex;gap:var(--space-3);margin-top:var(--space-6);align-items:center;flex-wrap:wrap}
.btn-sm{min-height:34px;padding:6px 12px;font-size:13px}

/* Entries */
.entry{border:1px solid var(--line);background:var(--surface);border-radius:var(--radius-lg);padding:18px 20px;margin-bottom:12px;box-shadow:var(--shadow-sm);transition:box-shadow .2s;color:var(--ink)}
.entry:hover{box-shadow:var(--shadow-card)}
.entry-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.entry-top > div:first-child{min-width:0}
.entry-title{font-weight:600;font-size:15px;letter-spacing:-.01em;overflow-wrap:anywhere}
.entry-sub{color:var(--ink-soft);font-size:13px;margin-top:3px;overflow-wrap:anywhere}
.entry-actions{display:flex;gap:4px;flex-shrink:0}
.entry-actions button{background:none;border:none;border-radius:var(--radius-sm);color:var(--accent);font:600 13px var(--font-sans);cursor:pointer;padding:6px 10px;transition:background .15s,color .15s}
.entry-actions button:hover{background:var(--accent-soft)}
.entry-actions button.remove{color:var(--ink-soft)}
.entry-actions button.remove:hover,.entry-actions button.remove:focus-visible{color:var(--error);background:var(--error-soft)}
.entry.just-saved{animation:tw-saved 2.6s ease-out forwards}
@keyframes tw-saved{0%,35%{box-shadow:0 0 0 2px var(--accent),var(--shadow-card)}100%{box-shadow:0 0 0 0 transparent,var(--shadow-sm)}}
.confirm{margin-top:14px;padding:12px 14px;border-radius:var(--radius-md);background:var(--error-soft);color:var(--error);font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.confirm span{flex:1 1 220px}
.confirm .btn-text{color:var(--ink)}

/* Badges */
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px 3px 8px;border-radius:var(--radius-pill);margin-top:10px;background:var(--surface-alt);color:var(--ink-soft)}
.badge::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
.badge.high{background:var(--error-soft);color:var(--error)}
.badge.medium{background:var(--warning-soft);color:var(--warning)}
.badge.low,.badge.neutral{background:var(--surface-alt);color:var(--ink-soft)}
.badge.info{background:var(--info-soft);color:var(--info)}

/* Confirmation prompt */
.prompt-card{display:flex;gap:16px;align-items:flex-start;border:1px solid var(--line);background:var(--surface);border-radius:var(--radius-xl);padding:22px 24px;box-shadow:var(--shadow-card);color:var(--ink);margin-top:4px}
.prompt-card .check{width:36px;height:36px;border-radius:50%;flex-shrink:0;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center}
.prompt-card .check svg{width:18px;height:18px}
.prompt-card h3{font-size:16px;margin:6px 0 4px}
.prompt-card p{color:var(--ink-soft);font-size:14px;margin:0 0 16px}
.prompt-card .btn-row{margin-top:0}
.prompt-body{flex:1;min-width:0}

/* Empty state */
.empty-state{border:1.5px dashed var(--line);border-radius:var(--radius-xl);padding:36px 26px;text-align:center;color:var(--ink-soft);font-size:14px;margin-bottom:16px}

/* Numbered list */
ul.instr{margin:0;padding:0;list-style:none;counter-reset:i}
ul.instr li{counter-increment:i;position:relative;padding-left:40px;margin-bottom:16px;line-height:1.55;font-size:14.5px;color:var(--ink)}
ul.instr li:last-child{margin-bottom:0}
ul.instr li::before{content:counter(i);position:absolute;left:0;top:-1px;width:26px;height:26px;border-radius:var(--radius-sm);background:var(--accent-soft);color:var(--accent);font-size:12.5px;font-weight:650;display:flex;align-items:center;justify-content:center}

/* Final */
.final-card{text-align:center;padding:56px 40px}
.final-card .done-mark{width:52px;height:52px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;margin:0 auto 18px}
.final-card .done-mark svg{width:24px;height:24px}
.final-card h2{font-size:24px;margin-bottom:10px}
.final-card p{color:var(--ink-soft);max-width:520px;margin:0 auto 4px}
.final-card .btn-row{justify-content:center}
.final-card .dl-note{font-size:13px;color:var(--ink-soft);margin-top:14px;min-height:1em}
.final-card .dl-note.bad{color:var(--error);font-weight:600}

/* Phone */
@media (max-width:1040px){
  .shell{grid-template-columns:240px minmax(0,1fr);gap:28px;padding-inline:24px}
}
@media (max-width:800px){
  .topbar-in{padding-inline:16px;padding-block:10px}
  .brand-sub{display:none}
  .mobile-head{display:block;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:var(--shadow-sm)}
  .mobile-head-in{padding-inline:8px;padding-top:6px}
  .shell{grid-template-columns:minmax(0,1fr);gap:0;padding-inline:16px;padding-block:24px 32px}
  .rail{display:none}
  .page-title{font-size:26px}
  .page-desc{font-size:15px;margin-bottom:24px}
  .row2,.ro-grid{grid-template-columns:1fr;gap:0}
  .ro-grid{gap:10px}
  input[type=text],input[type=date],select,textarea{font-size:16px;min-height:48px}
  textarea{min-height:120px}
  .btn{min-height:48px}
  .btn-sm{min-height:40px}
  .btn-row .btn{flex:1 1 auto}
  .btn-row .btn-text{flex:0 0 auto}
  .card{padding:22px 18px}
  .final-card{padding:40px 20px}
  .entry{padding:16px 14px}
  .entry-top{flex-direction:column}
  .entry-actions{margin-left:-10px}
  .prompt-card{flex-direction:column;gap:12px;padding:20px 18px}
  .step-label{font-size:14px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="2.5"/><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M12 7.5v4M12 11.5l-6 4M12 11.5l6 4"/></svg></div>
      <div><div class="brand-name">Succession Planning</div><span class="brand-sub">Talent continuity workspace</span></div>
    </div>
    <div class="top-actions">
      <button type="button" class="theme-toggle" aria-label="Switch theme"></button>
    </div>
  </div>
</header>

<div class="mobile-head" id="mobileHead">
  <div class="mobile-head-in">
    <button class="mobile-toggle" id="mToggle" type="button" aria-expanded="false" aria-controls="mMenu">
      <span class="mb-text"><span class="mb-step" id="mbStep">Get started</span><span class="mb-label" id="mbLabel">Instructions</span></span>
      <span class="mb-chev" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></span>
    </button>
  </div>
  <div class="mb-progress"><div class="mb-fill" id="mbFill" style="width:0%"></div></div>
  <nav class="mb-menu" id="mMenu" aria-label="Plan sections" hidden><ul class="steps" id="mSteps"></ul></nav>
</div>

<div class="shell">
  <nav class="rail" aria-label="Plan sections">
    <div class="progress">
      <div class="progress-top"><span>Sections complete</span><span id="progText">0 of 5</span></div>
      <div class="progress-track"><div class="progress-fill" id="progFill" style="width:0%"></div></div>
    </div>
    <ul class="steps" id="steps"></ul>
  </nav>
  <main class="main" id="main"></main>
</div>

<script>
/* Theme toggle (Talent Workspace) */
(function(){
  var ICON_SUN = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  var ICON_MOON = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
  function isDark(){
    var t = document.documentElement.getAttribute('data-theme');
    if (t) return t === 'dark';
    return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  }
  function paint(){
    var dark = isDark();
    document.querySelectorAll('.theme-toggle').forEach(function(b){
      b.innerHTML = dark ? ICON_SUN : ICON_MOON;
      b.setAttribute('aria-label', dark ? 'Switch to light mode' : 'Switch to dark mode');
      b.title = b.getAttribute('aria-label');
    });
  }
  document.querySelectorAll('.theme-toggle').forEach(function(b){ b.addEventListener('click', function(){
    document.documentElement.setAttribute('data-theme', isDark() ? 'light' : 'dark');
    paint();
  }); });
  if (window.matchMedia) { try { window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', paint); } catch (e) {} }
  paint();
})();
</script>

<script>
/* ---------------- STATE ---------------- */
const SECTIONS = [
  {id:'intro', label:'Instructions'},
  {id:1, label:'Identify Key Roles'},
  {id:2, label:'Successor Selection & Readiness'},
  {id:3, label:'Successor Development Plan'},
  {id:4, label:'Knowledge Transfer & Risk Mitigation'},
  {id:5, label:'Progress Monitoring & Review'},
  {id:'done', label:'Summary'}
];

let state = {
  current: 'intro',
  furthest: 0,
  roles: [],       // {id, title, department, holder, criticality, reason}
  successors: [],  // {id, name, currentRole, department, roleId, readiness, strengths, development}
  devPlans: {},    // successorId -> {actions, targetDate, resources, outcome}
  knowledge: {},   // roleId -> {criticalKnowledge, transferPlan, riskLevel, mitigation}
  monitoring: {},  // successorId -> {owner, reviewDate, updates, keyActions}
  ui: {            // transient per-section UI state
    s1: {mode:'form', editingId:null, showPrompt:false, confirmId:null, savedId:null},
    s2: {mode:'form', editingId:null, showPrompt:false, confirmId:null, savedId:null}
  },
  finished: false
};
let uid = 1;
const newId = () => 'id' + (uid++);

/* ---------------- ICONS ---------------- */
const I_CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const I_PLUS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>';
const I_NEXT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>';
const I_BACK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>';
const I_DL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>';
const I_ERR = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5v.5"/></svg>';

/* ---------------- HELPERS ---------------- */
function autoGrow(el){
  el.style.height = 'auto';
  el.style.height = (el.scrollHeight + 2) + 'px';
}
function attachAutoGrow(root){
  root.querySelectorAll('textarea').forEach(t=>{
    autoGrow(t);
    t.addEventListener('input', ()=>autoGrow(t));
  });
}
function attachSelectTint(root){
  root.querySelectorAll('select').forEach(s=>{
    const tint = ()=>s.classList.toggle('placeholder', !s.value);
    tint(); s.addEventListener('change', tint);
  });
}
function criticalityBadgeClass(v){
  if(v==='High') return 'high';
  if(v==='Medium') return 'medium';
  if(v==='Low') return 'low';
  return '';
}
function roleById(id){ return state.roles.find(r=>r.id===id); }
function successorById(id){ return state.successors.find(s=>s.id===id); }

function render(){
  renderSidebar();
  renderMain();
}

/* ---------------- SIDEBAR ---------------- */
function stepNum(s, isDone, isActive){
  if(s.id==='intro') return 'i';
  if(s.id==='done') return I_CHECK;
  return (isDone && !isActive) ? I_CHECK : s.id;
}
function renderSidebar(){
  const html = SECTIONS.map((s, idx) => {
    const isActive = state.current === s.id;
    const isDone = idx < indexOf(state.current) || (state.current==='done');
    const reachable = idx <= state.furthest;
    const cls = 'step' + (isActive?' active':'') + (isDone && !isActive?' done':'') + (reachable?' clickable':'');
    return `<li><button type="button" class="${cls}" data-goto="${idx}" ${reachable?'':'disabled'} ${isActive?'aria-current="step"':''}><span class="step-num">${stepNum(s,isDone,isActive)}</span><span class="step-label">${escapeHtml(s.label)}</span></button></li>`;
  }).join('');
  document.getElementById('steps').innerHTML = html;
  document.getElementById('mSteps').innerHTML = html;

  const ci = indexOf(state.current);
  const completed = state.current==='done' ? 5 : Math.max(0, Math.min(5, ci-1));
  const pct = Math.round(completed/5*100);
  document.getElementById('progText').textContent = completed + ' of 5';
  document.getElementById('progFill').style.width = pct + '%';
  document.getElementById('mbFill').style.width = pct + '%';
  const cur = SECTIONS[ci];
  document.getElementById('mbStep').textContent = typeof cur.id==='number' ? 'Section '+cur.id+' of 5' : (cur.id==='intro' ? 'Get started' : 'All sections complete');
  document.getElementById('mbLabel').textContent = cur.label;
  setMenu(false);
}
document.addEventListener('click', e=>{
  const menu = document.getElementById('mMenu');
  if(!menu.hidden && !e.target.closest('#mobileHead')) setMenu(false);
  if(e.target.closest('#mToggle')){ setMenu(menu.hidden); return; }
  const b = e.target.closest('[data-goto]');
  if(b && !b.disabled){ state.current = SECTIONS[+b.dataset.goto].id; render(); window.scrollTo(0,0); }
});
document.addEventListener('keydown', e=>{
  if(e.key==='Escape' && !document.getElementById('mMenu').hidden){ setMenu(false); document.getElementById('mToggle').focus(); }
});
function setMenu(open){
  document.getElementById('mMenu').hidden = !open;
  document.getElementById('mToggle').setAttribute('aria-expanded', String(open));
}
function indexOf(id){ return SECTIONS.findIndex(s=>s.id===id); }
function goTo(id){
  state.current = id;
  const idx = indexOf(id);
  if(idx > state.furthest) state.furthest = idx;
  render();
  window.scrollTo(0,0);
}

/* ---------------- MAIN ROUTER ---------------- */
function renderMain(){
  const el = document.getElementById('main');
  el.innerHTML = '';
  el.style.animation = 'none'; void el.offsetWidth; el.style.animation = '';
  if(state.current === 'intro') return renderIntro(el);
  if(state.current === 1) return renderSection1(el);
  if(state.current === 2) return renderSection2(el);
  if(state.current === 3) return renderSection3(el);
  if(state.current === 4) return renderSection4(el);
  if(state.current === 5) return renderSection5(el);
  if(state.current === 'done') return renderDone(el);
}

/* ---------------- INTRO ---------------- */
function renderIntro(el){
  el.innerHTML = `
    <div class="eyebrow">Get started</div>
    <h1 class="page-title">Succession Planning Tool</h1>
    <p class="page-desc">Work through five short sections to build a complete succession plan for your team — from identifying critical roles to tracking successor progress over time.</p>
    <div class="card">
      <div class="group-heading">Instructions</div>
      <ul class="instr">
        <li>Fill out each section with relevant information. You can go back and edit any entry at any time.</li>
        <li>Use the drop-down menus where they're provided (Criticality Level, Readiness Level, Risk Level).</li>
        <li>Once complete, transfer this information to your HCM/HRIS or dedicated talent management system.</li>
        <li>Update this plan regularly as part of your annual succession planning review.</li>
        <li>Share the finished plan with leadership for visibility and input.</li>
      </ul>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" id="start-btn">Start with Section 1${I_NEXT}</button>
    </div>
  `;
  el.querySelector('#start-btn').addEventListener('click', ()=>goTo(1));
}

/* ---------------- SHARED LIST RENDERING ---------------- */
function entryCard(id, titleHtml, subHtml, badgeHtml, ui, confirmText, onRemove){
  const card = document.createElement('div');
  card.className = 'entry' + (ui.savedId===id ? ' just-saved' : '');
  const confirming = ui.confirmId === id;
  card.innerHTML = `
    <div class="entry-top">
      <div>
        <div class="entry-title">${titleHtml}</div>
        <div class="entry-sub">${subHtml}</div>
        ${badgeHtml}
      </div>
      <div class="entry-actions">
        <button type="button" data-edit="${id}">Edit</button>
        <button type="button" class="remove" data-del="${id}">Remove</button>
      </div>
    </div>
    ${confirming ? `<div class="confirm" role="alert"><span>${confirmText}</span><button type="button" class="btn btn-danger btn-sm" data-yes>Remove</button><button type="button" class="btn btn-text btn-sm" data-no>Keep</button></div>` : ''}
  `;
  if(confirming){
    card.querySelector('[data-yes]').addEventListener('click', ()=>{ ui.confirmId=null; onRemove(); render(); });
    card.querySelector('[data-no]').addEventListener('click', ()=>{ ui.confirmId=null; render(); });
    setTimeout(()=>{ const n=card.querySelector('[data-no]'); n && n.focus(); },0);
  }
  return card;
}

/* ---------------- SECTION 1: Identify Key Roles ---------------- */
function emptyRoleForm(){
  return {id:null, title:'', department:'', holder:'', criticality:'', reason:''};
}
function renderSection1(el){
  const ui = state.ui.s1;
  el.innerHTML = `
    <div class="eyebrow">Section 1 of 5</div>
    <h1 class="page-title">Identify Key Roles</h1>
    <p class="page-desc">List the roles that are critical to your team or organization's continued success, and capture why each one matters.</p>
    <div id="s1-body"></div>
  `;
  const body = el.querySelector('#s1-body');

  if(ui.mode === 'form'){
    const editing = ui.editingId ? roleById(ui.editingId) : emptyRoleForm();
    body.appendChild(roleForm(editing));
    return;
  }

  // list mode
  if(state.roles.length === 0){
    const empty = document.createElement('div');
    empty.className = 'empty-state';
    empty.textContent = "No key roles added yet. Add the first role to get started.";
    body.appendChild(empty);
  } else {
    state.roles.forEach(r=>{
      body.appendChild(entryCard(
        r.id,
        escapeHtml(r.title || 'Untitled role'),
        `${escapeHtml(r.department || '—')}${r.holder ? ' · Current holder: '+escapeHtml(r.holder) : ''}`,
        r.criticality ? `<span class="badge ${criticalityBadgeClass(r.criticality)}">${r.criticality} criticality</span>` : '',
        ui,
        'Remove this role and any linked successor or knowledge-transfer data?',
        ()=>{
          state.roles = state.roles.filter(x=>x.id!==r.id);
          state.successors = state.successors.filter(s=>s.roleId!==r.id);
          delete state.knowledge[r.id];
        }
      ));
    });
  }
  ui.savedId = null;

  if(ui.showPrompt){
    body.appendChild(promptCard(
      'Role saved.',
      'Would you like to add another key role?',
      ()=>{ ui.showPrompt=false; ui.mode='form'; ui.editingId=null; render(); },
      ()=>{ ui.showPrompt=false; render(); }
    ));
  } else {
    const btnRow = document.createElement('div');
    btnRow.className = 'btn-row';
    btnRow.innerHTML = `
      <button class="btn btn-secondary" id="add-role">${I_PLUS}Add key role</button>
      <button class="btn btn-primary" id="to-s2" ${state.roles.length===0?'disabled':''}>Continue to Section 2${I_NEXT}</button>
    `;
    body.appendChild(btnRow);
    body.querySelector('#add-role').addEventListener('click', ()=>{ ui.mode='form'; ui.editingId=null; render(); });
    const nextBtn = body.querySelector('#to-s2');
    if(nextBtn) nextBtn.addEventListener('click', ()=>goTo(2));
  }

  body.querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click', e=>{
    ui.mode='form'; ui.confirmId=null; ui.showPrompt=false; ui.editingId = e.currentTarget.getAttribute('data-edit'); render();
  }));
  body.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click', e=>{
    ui.confirmId = e.currentTarget.getAttribute('data-del'); render();
  }));
}

function roleForm(data){
  const wrap = document.createElement('div');
  wrap.className = 'card';
  wrap.innerHTML = `
    <div class="row2">
      <div class="field" id="fw-title">
        <label for="f-title">Role title</label>
        <input type="text" id="f-title" value="${attr(data.title)}" placeholder="e.g., Director of Operations">
        <span class="err">${I_ERR}Please enter a role title.</span>
      </div>
      <div class="field">
        <label for="f-department">Department</label>
        <input type="text" id="f-department" value="${attr(data.department)}" placeholder="e.g., Operations">
      </div>
    </div>
    <div class="row2">
      <div class="field">
        <label for="f-holder">Current role holder</label>
        <input type="text" id="f-holder" value="${attr(data.holder)}" placeholder="Name of person currently in the role">
      </div>
      <div class="field">
        <label for="f-criticality">Criticality level</label>
        <select id="f-criticality">
          <option value="" ${data.criticality===''?'selected':''}>Select level</option>
          <option value="High" ${data.criticality==='High'?'selected':''}>High</option>
          <option value="Medium" ${data.criticality==='Medium'?'selected':''}>Medium</option>
          <option value="Low" ${data.criticality==='Low'?'selected':''}>Low</option>
        </select>
      </div>
    </div>
    <div class="field">
      <label for="f-reason">Reason for criticality</label>
      <textarea id="f-reason" placeholder="Why is this role critical to the business? Consider impact, specialized knowledge, and risk if vacant.">${escapeHtml(data.reason||'')}</textarea>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" id="save-role">Save role</button>
      <button class="btn btn-text" id="cancel-role">Cancel</button>
    </div>
  `;
  attachAutoGrow(wrap);
  attachSelectTint(wrap);
  const titleIn = wrap.querySelector('#f-title');
  titleIn.addEventListener('input', ()=>{ if(titleIn.value.trim()) wrap.querySelector('#fw-title').classList.remove('invalid'); });
  wrap.querySelector('#save-role').addEventListener('click', ()=>{
    const title = titleIn.value.trim();
    if(!title){ wrap.querySelector('#fw-title').classList.add('invalid'); titleIn.focus(); return; }
    const record = {
      id: data.id || newId(),
      title,
      department: wrap.querySelector('#f-department').value.trim(),
      holder: wrap.querySelector('#f-holder').value.trim(),
      criticality: wrap.querySelector('#f-criticality').value,
      reason: wrap.querySelector('#f-reason').value.trim()
    };
    if(data.id){
      const idx = state.roles.findIndex(r=>r.id===data.id);
      state.roles[idx] = record;
    } else {
      state.roles.push(record);
    }
    state.ui.s1.mode = 'list';
    state.ui.s1.showPrompt = true;
    state.ui.s1.savedId = record.id;
    render();
  });
  wrap.querySelector('#cancel-role').addEventListener('click', ()=>{
    state.ui.s1.mode='list'; render();
  });
  setTimeout(()=>titleIn.focus({preventScroll:true}),0);
  return wrap;
}

/* ---------------- SECTION 2: Successor Selection & Readiness ---------------- */
function emptySuccessorForm(){
  return {id:null, name:'', currentRole:'', department:'', roleId:'', readiness:'', strengths:'', development:''};
}
function renderSection2(el){
  const ui = state.ui.s2;
  el.innerHTML = `
    <div class="eyebrow">Section 2 of 5</div>
    <h1 class="page-title">Successor Selection &amp; Readiness Assessment</h1>
    <p class="page-desc">For each key role, identify potential successors and assess how ready they are to step in.</p>
    <div id="s2-body"></div>
  `;
  const body = el.querySelector('#s2-body');

  if(state.roles.length===0){
    body.innerHTML = `<div class="empty-state">Add at least one key role in Section 1 before identifying successors.</div>
      <div class="btn-row"><button class="btn btn-secondary" id="back1">${I_BACK}Back to Section 1</button></div>`;
    body.querySelector('#back1').addEventListener('click', ()=>goTo(1));
    return;
  }

  if(ui.mode === 'form'){
    const editing = ui.editingId ? successorById(ui.editingId) : emptySuccessorForm();
    body.appendChild(successorForm(editing));
    return;
  }

  if(state.successors.length === 0){
    const empty = document.createElement('div');
    empty.className = 'empty-state';
    empty.textContent = "No successors added yet. Add the first successor to get started.";
    body.appendChild(empty);
  } else {
    state.successors.forEach(s=>{
      const role = roleById(s.roleId);
      body.appendChild(entryCard(
        s.id,
        escapeHtml(s.name || 'Unnamed successor'),
        `For: ${escapeHtml(role ? role.title : '—')} &middot; Currently: ${escapeHtml(s.currentRole || '—')}`,
        s.readiness ? `<span class="badge info">Ready: ${escapeHtml(s.readiness)}</span>` : '',
        ui,
        'Remove this successor and any linked development or monitoring data?',
        ()=>{
          state.successors = state.successors.filter(x=>x.id!==s.id);
          delete state.devPlans[s.id];
          delete state.monitoring[s.id];
        }
      ));
    });
  }
  ui.savedId = null;

  if(ui.showPrompt){
    body.appendChild(promptCard(
      'Successor saved.',
      'Would you like to add another successor?',
      ()=>{ ui.showPrompt=false; ui.mode='form'; ui.editingId=null; render(); },
      ()=>{ ui.showPrompt=false; render(); }
    ));
  } else {
    const btnRow = document.createElement('div');
    btnRow.className = 'btn-row';
    btnRow.innerHTML = `
      <button class="btn btn-secondary" id="add-succ">${I_PLUS}Add successor</button>
      <button class="btn btn-primary" id="to-s3" ${state.successors.length===0?'disabled':''}>Continue to Section 3${I_NEXT}</button>
    `;
    body.appendChild(btnRow);
    body.querySelector('#add-succ').addEventListener('click', ()=>{ ui.mode='form'; ui.editingId=null; render(); });
    const nextBtn = body.querySelector('#to-s3');
    if(nextBtn) nextBtn.addEventListener('click', ()=>goTo(3));
  }

  body.querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click', e=>{
    ui.mode='form'; ui.confirmId=null; ui.showPrompt=false; ui.editingId = e.currentTarget.getAttribute('data-edit'); render();
  }));
  body.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click', e=>{
    ui.confirmId = e.currentTarget.getAttribute('data-del'); render();
  }));
}

function successorForm(data){
  const wrap = document.createElement('div');
  wrap.className = 'card';
  const roleOptions = state.roles.map(r=>`<option value="${r.id}" ${data.roleId===r.id?'selected':''}>${escapeHtml(r.title)}</option>`).join('');
  wrap.innerHTML = `
    <div class="field">
      <label for="f-roleId">Key Role</label>
      <select id="f-roleId">
        <option value="">Select a key role</option>
        ${roleOptions}
      </select>
    </div>
    <div class="row2">
      <div class="field" id="fw-name">
        <label for="f-name">Successor name</label>
        <input type="text" id="f-name" value="${attr(data.name)}" placeholder="Full name">
        <span class="err">${I_ERR}Please enter a successor name.</span>
      </div>
      <div class="field">
        <label for="f-currentRole">Current role</label>
        <input type="text" id="f-currentRole" value="${attr(data.currentRole)}" placeholder="Their role today">
      </div>
    </div>
    <div class="row2">
      <div class="field">
        <label for="f-department">Department</label>
        <input type="text" id="f-department" value="${attr(data.department)}" placeholder="e.g., Operations">
      </div>
      <div class="field">
        <label for="f-readiness">Readiness level</label>
        <select id="f-readiness">
          <option value="" ${data.readiness===''?'selected':''}>Select level</option>
          <option value="Now" ${data.readiness==='Now'?'selected':''}>Now</option>
          <option value="1-2 years" ${data.readiness==='1-2 years'?'selected':''}>1-2 years</option>
          <option value="3+ years" ${data.readiness==='3+ years'?'selected':''}>3+ years</option>
        </select>
      </div>
    </div>
    <div class="field">
      <label for="f-strengths">Strengths</label>
      <textarea id="f-strengths" placeholder="What makes this person a strong candidate?">${escapeHtml(data.strengths||'')}</textarea>
    </div>
    <div class="field">
      <label for="f-development">Development areas</label>
      <textarea id="f-development" placeholder="What gaps or growth areas should be addressed?">${escapeHtml(data.development||'')}</textarea>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" id="save-succ">Save successor</button>
      <button class="btn btn-text" id="cancel-succ">Cancel</button>
    </div>
  `;
  attachAutoGrow(wrap);
  attachSelectTint(wrap);
  const nameIn = wrap.querySelector('#f-name');
  nameIn.addEventListener('input', ()=>{ if(nameIn.value.trim()) wrap.querySelector('#fw-name').classList.remove('invalid'); });
  wrap.querySelector('#save-succ').addEventListener('click', ()=>{
    const name = nameIn.value.trim();
    if(!name){ wrap.querySelector('#fw-name').classList.add('invalid'); nameIn.focus(); return; }
    const record = {
      id: data.id || newId(),
      roleId: wrap.querySelector('#f-roleId').value,
      name,
      currentRole: wrap.querySelector('#f-currentRole').value.trim(),
      department: wrap.querySelector('#f-department').value.trim(),
      readiness: wrap.querySelector('#f-readiness').value,
      strengths: wrap.querySelector('#f-strengths').value.trim(),
      development: wrap.querySelector('#f-development').value.trim()
    };
    if(data.id){
      const idx = state.successors.findIndex(s=>s.id===data.id);
      state.successors[idx] = record;
    } else {
      state.successors.push(record);
    }
    state.ui.s2.mode = 'list';
    state.ui.s2.showPrompt = true;
    state.ui.s2.savedId = record.id;
    render();
  });
  wrap.querySelector('#cancel-succ').addEventListener('click', ()=>{
    state.ui.s2.mode='list'; render();
  });
  return wrap;
}

/* ---------------- SECTION 3: Successor Development Plan ---------------- */
function renderSection3(el){
  el.innerHTML = `
    <div class="eyebrow">Section 3 of 5</div>
    <h1 class="page-title">Successor Development Plan</h1>
    <p class="page-desc">Outline the actions each successor needs to take to close their readiness gap, and what success looks like.</p>
    <div id="s3-body"></div>
  `;
  const body = el.querySelector('#s3-body');

  if(state.successors.length===0){
    body.innerHTML = `<div class="empty-state">Add successors in Section 2 first.</div>

/* ---------------- SUMMARY EXPORT ---------------- */
let dlPromise = null;
function getDownloads(){
  if(!dlPromise){
    dlPromise = (window.claude && typeof window.claude.use==='function')
      ? Promise.resolve(window.claude.use('downloads')).catch(()=>null)
      : Promise.resolve(null);
  }
  return dlPromise;
}
function buildSummary(){
  const today = new Date().toLocaleDateString();
  let rolesHtml = state.roles.map(r=>`
    <div class="rcard">
      <h3>${escapeHtml(r.title||'Untitled role')}</h3>
      <p class="meta">${escapeHtml(r.department||'—')}${r.holder?' &middot; Current holder: '+escapeHtml(r.holder):''}${r.criticality?' &middot; Criticality: '+r.criticality:''}</p>
      ${r.reason?`<p><strong>Reason for criticality:</strong> ${escapeHtml(r.reason)}</p>`:''}
    </div>`).join('') || '<p class="empty">No key roles added.</p>';

  let successorsHtml = state.successors.map(s=>{
    const role = roleById(s.roleId);
    const plan = state.devPlans[s.id] || {};
    const m = state.monitoring[s.id] || {};
    return `
    <div class="rcard">
      <h3>${escapeHtml(s.name||'Unnamed successor')}</h3>
      <p class="meta">For: ${escapeHtml(role?role.title:'—')} &middot; Currently: ${escapeHtml(s.currentRole||'—')} &middot; Department: ${escapeHtml(s.department||'—')} &middot; Readiness: ${escapeHtml(s.readiness||'—')}</p>
      ${s.strengths?`<p><strong>Strengths:</strong> ${escapeHtml(s.strengths)}</p>`:''}
      ${s.development?`<p><strong>Development areas:</strong> ${escapeHtml(s.development)}</p>`:''}
      <p class="subhead">Development plan</p>
      ${plan.actions?`<p><strong>Actions:</strong> ${escapeHtml(plan.actions)}</p>`:''}
      ${plan.resources?`<p><strong>Resources needed:</strong> ${escapeHtml(plan.resources)}</p>`:''}
      ${plan.targetDate?`<p><strong>Target completion date:</strong> ${escapeHtml(plan.targetDate)}</p>`:''}
      ${plan.outcome?`<p><strong>Expected outcome:</strong> ${escapeHtml(plan.outcome)}</p>`:''}
      <p class="subhead">Progress monitoring</p>
      <p><strong>Owner:</strong> ${escapeHtml(m.owner||'—')} &middot; <strong>Review date:</strong> ${escapeHtml(m.reviewDate||'—')}</p>
      ${m.updates?`<p><strong>Updates and adjustments:</strong> ${escapeHtml(m.updates)}</p>`:''}
      ${m.keyActions?`<p><strong>Key actions:</strong> ${escapeHtml(m.keyActions)}</p>`:''}
    </div>`;
  }).join('') || '<p class="empty">No successors added.</p>';

  let knowledgeHtml = state.roles.map(r=>{
    const k = state.knowledge[r.id];
    if(!k || (!k.criticalKnowledge && !k.transferPlan && !k.potentialRisks && !k.riskLevel && !k.mitigation)) return '';
    return `
    <div class="rcard">
      <h3>${escapeHtml(r.title)}</h3>
      <p class="meta">${k.riskLevel?'Risk level: '+k.riskLevel:''}</p>
      ${k.criticalKnowledge?`<p><strong>Critical knowledge to transfer:</strong> ${escapeHtml(k.criticalKnowledge)}</p>`:''}
      ${k.transferPlan?`<p><strong>Knowledge transfer plan:</strong> ${escapeHtml(k.transferPlan)}</p>`:''}
      ${k.potentialRisks?`<p><strong>Potential risks:</strong> ${escapeHtml(k.potentialRisks)}</p>`:''}
      ${k.mitigation?`<p><strong>Mitigation actions:</strong> ${escapeHtml(k.mitigation)}</p>`:''}
    </div>`;
  }).join('') || '<p class="empty">No knowledge transfer data added.</p>';

  return `<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Succession Plan Summary</title>
<style>
  body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#111827;background:#F7F8FA;max-width:760px;margin:40px auto;padding:0 20px;line-height:1.55;}
  h1{font-size:26px;margin-bottom:4px;letter-spacing:-.02em;}
  .date{color:#5B6472;font-size:13px;margin-bottom:36px;}

  .meta{color:#5B6472;font-size:13px;margin:0 0 10px 0;}

</style></head>
<body>
  <h1>Succession Planning Summary</h1>

  ${rolesHtml}

  ${successorsHtml}
  <h2>Knowledge Transfer &amp; Risk Mitigation</h2>
  ${knowledgeHtml}
</body></html>`;
}
async function downloadSummary(){
  const btn = document.getElementById('download-btn');
  const note = document.getElementById('dl-note');
  note.className = 'dl-note'; note.textContent = '';
  const doc = buildSummary();
  const filename = 'succession-plan-summary.html';
  const dl = await getDownloads();
  if(!dl){
    // Outside the artifact viewer: plain browser download
    const blob = new Blob([doc], {type:'text/html'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
    return;
  }
  btn.disabled = true;
  try{
    const res = await dl.save({filename, data: new Blob([doc], {type:'text/html'})});
    if(res && res.status==='saved') note.textContent = 'Downloaded ' + filename;
  }catch(err){
    const c = err && err.code;
    if(c==='declined') note.textContent = 'Download cancelled.';
    else if(c==='rate_limited'){ note.className='dl-note bad'; note.textContent = 'A download prompt is already open. Finish that one first.'; }
    else { note.className='dl-note bad'; note.textContent = "Couldn't create the file. Try again."; }
  }finally{ btn.disabled = false; }
}

/* ---------------- SHARED UI PIECES ---------------- */
function promptCard(title, question, onYes, onNo){
  const div = document.createElement('div');
  div.className = 'prompt-card';
  div.setAttribute('role','status');
  div.innerHTML = `<div class="check">${I_CHECK}</div><div class="prompt-body"><h3>${title}</h3><p>${question}</p><div class="btn-row"></div></div>`;
  const row = div.querySelector('.btn-row');
  const yes = document.createElement('button');
  yes.className = 'btn btn-primary'; yes.textContent = 'Yes, add another';
  const no = document.createElement('button');
  no.className = 'btn btn-secondary'; no.textContent = 'No, continue';
  yes.addEventListener('click', onYes);
  no.addEventListener('click', onNo);
  row.appendChild(yes); row.appendChild(no);
  return div;
}
function escapeHtml(str){
  return String(str||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function attr(str){ return escapeHtml(str); }
