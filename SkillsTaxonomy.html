<style>
/* ===== Talent Workspace UI (talent-ui.css), mapped onto SkillGraph Console ===== */
/* Layout: 248px sticky section rail beside a 1180px working column. At 800px and below the rail becomes a sticky top bar with scrolling section tabs. */
:root{
  --font-sans:Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:22px;--space-6:28px;--space-7:32px;--space-8:56px;
  --radius-sm:8px;--radius-md:10px;--radius-lg:12px;--radius-xl:14px;--radius-pill:999px;
  --bg:#F7F8FA;--surface:#FFFFFF;--surface-alt:#F1F3F5;--ink:#111827;--ink-soft:#5B6472;--line:#E5E7EB;--line-strong:#8A9099;
  --accent:#0F766E;--accent-hover:#0B5F58;--on-accent:#FFFFFF;--accent-soft:#E6F4F2;--focus-ring:rgba(15,118,110,0.25);
  --info:#1D4ED8;--info-soft:#EEF3FF;--warning:#B54708;--warning-soft:#FEF3E2;--error:#B42318;--error-soft:#FEECEB;
  --shadow-sm:0 1px 2px rgba(16,24,40,0.05);
  --shadow-card:0 1px 2px rgba(16,24,40,0.04), 0 6px 20px -4px rgba(16,24,40,0.07);
  --shadow-lift:0 2px 4px rgba(16,24,40,0.06), 0 10px 28px -6px rgba(16,24,40,0.12);
  --scrim:rgba(17,24,39,0.28);
  /* names the console's script still uses inline */
  --green:var(--accent);--red:var(--error);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1113;--surface:#171B1F;--surface-alt:#1F2429;--ink:#ECEEF0;--ink-soft:#9AA3AD;--line:#2A3036;--line-strong:#6B747E;
    --accent:#3CC4B4;--accent-hover:#62D3C6;--on-accent:#04201C;--accent-soft:rgba(60,196,180,0.13);--focus-ring:rgba(60,196,180,0.3);
    --info:#8AB4F8;--info-soft:rgba(138,180,248,0.13);--warning:#F5B45C;--warning-soft:rgba(245,180,92,0.13);--error:#F28B82;--error-soft:rgba(242,139,130,0.13);
    --shadow-sm:0 1px 2px rgba(0,0,0,0.4);
    --shadow-card:0 1px 2px rgba(0,0,0,0.4), 0 8px 24px -6px rgba(0,0,0,0.5);
    --shadow-lift:0 2px 4px rgba(0,0,0,0.45), 0 12px 30px -6px rgba(0,0,0,0.6);
    --scrim:rgba(0,0,0,0.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1113;--surface:#171B1F;--surface-alt:#1F2429;--ink:#ECEEF0;--ink-soft:#9AA3AD;--line:#2A3036;--line-strong:#6B747E;
  --accent:#3CC4B4;--accent-hover:#62D3C6;--on-accent:#04201C;--accent-soft:rgba(60,196,180,0.13);--focus-ring:rgba(60,196,180,0.3);
  --info:#8AB4F8;--info-soft:rgba(138,180,248,0.13);--warning:#F5B45C;--warning-soft:rgba(245,180,92,0.13);--error:#F28B82;--error-soft:rgba(242,139,130,0.13);
  --shadow-sm:0 1px 2px rgba(0,0,0,0.4);
  --shadow-card:0 1px 2px rgba(0,0,0,0.4), 0 8px 24px -6px rgba(0,0,0,0.5);
  --shadow-lift:0 2px 4px rgba(0,0,0,0.45), 0 12px 30px -6px rgba(0,0,0,0.6);
  --scrim:rgba(0,0,0,0.5);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg)}
body{color:var(--ink);font-family:var(--font-sans);font-size:14.5px;line-height:1.55;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
a{color:var(--accent)}
h1,h2,h3{font-weight:650;letter-spacing:-.022em;line-height:1.2;text-wrap:balance}
:focus-visible{outline:none;box-shadow:0 0 0 4px var(--focus-ring)}

/* Buttons (default = secondary) */
button{font:600 14px var(--font-sans);cursor:pointer;border-radius:var(--radius-md);border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);padding:9px 18px;min-height:40px;display:inline-flex;align-items:center;justify-content:center;gap:8px;box-shadow:var(--shadow-sm);transition:background .15s,box-shadow .15s,transform .15s,border-color .15s,color .15s}
button:hover:not(:disabled){background:var(--surface-alt)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
button.primary:hover:not(:disabled){background:var(--accent-hover);border-color:var(--accent-hover);transform:translateY(-1px);box-shadow:var(--shadow-lift)}
button.ok{border-color:var(--accent);color:var(--accent)}
button.ok:hover:not(:disabled){background:var(--accent-soft)}
button.no{border-color:var(--line-strong);color:var(--ink-soft)}
button.no:hover:not(:disabled){border-color:var(--error);color:var(--error);background:var(--error-soft)}
button:disabled{opacity:.45;cursor:wait;box-shadow:none;transform:none}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:none}
button:focus-visible{box-shadow:0 0 0 4px var(--focus-ring)}
button.link{border:0;background:none;padding:0;min-height:0;box-shadow:none;color:var(--accent);font-family:var(--font-sans);font-weight:600;font-size:inherit;line-height:inherit;text-decoration:underline;text-underline-offset:3px;display:inline}
button.link:hover:not(:disabled){background:none;color:var(--accent-hover)}

/* Segmented filters: review tabs and example loaders */
.row[role=tablist] button,.row[role=group] button{min-height:36px;padding:6px 14px;font-size:13.5px;border-color:var(--line);color:var(--ink-soft);box-shadow:none;border-radius:var(--radius-pill)}
.row[role=tablist] button[aria-selected=true],.row[role=group] button[aria-pressed=true]{background:var(--accent-soft);border-color:transparent;color:var(--accent);transform:none;box-shadow:none}

/* Fields */
input,textarea,select{width:100%;min-height:44px;font:400 14.5px var(--font-sans);color:var(--ink);background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--radius-md);padding:11px 14px;transition:border-color .15s,box-shadow .15s}
input:hover,textarea:hover,select:hover{border-color:var(--ink-soft)}
input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--focus-ring)}
::placeholder{color:var(--ink-soft);opacity:1}
textarea{min-height:150px;resize:vertical;line-height:1.55}

/* Shell */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
nav{border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;background:var(--surface);display:flex;flex-direction:column;gap:0}
.nav-head{display:flex;align-items:center;gap:10px;padding:0 4px;margin-bottom:6px}
.brand-mark{width:32px;height:32px;border-radius:var(--radius-md);background:var(--accent);color:var(--on-accent);display:grid;place-items:center;flex:none}
.brand-mark svg{width:17px;height:17px}
nav .brand{font-size:16px;font-weight:650;letter-spacing:-.015em;flex:1;min-width:0}
nav .sub{color:var(--ink-soft);font-size:12.5px;line-height:1.45;margin:0 4px 20px}
nav .theme-toggle{width:36px;height:36px;min-height:36px;padding:0;border:none;background:transparent;box-shadow:none;color:var(--ink-soft);border-radius:var(--radius-md);flex:none;margin:0}
nav .theme-toggle:hover:not(:disabled){background:var(--surface-alt);color:var(--ink)}
.nav-list{display:flex;flex-direction:column;gap:2px}
.nav-list button{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;border:0;box-shadow:none;text-align:left;padding:9px 10px;min-height:38px;background:none;color:var(--ink-soft);font-weight:500;font-size:13.5px;border-radius:var(--radius-md)}
.nav-list button:hover:not(:disabled){background:var(--surface-alt);color:var(--ink)}
.nav-list button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
nav .count{font-size:11.5px;font-weight:650;background:var(--warning-soft);color:var(--warning);border-radius:var(--radius-pill);padding:1px 8px;min-width:22px;text-align:center}
nav .foot{margin-top:auto;padding:14px 4px 0;border-top:1px solid var(--line);font-size:12px;line-height:1.5;color:var(--ink-soft)}

main{padding:var(--space-8) 48px 64px;max-width:1180px;width:100%;min-width:0;animation:tw-rise .32s ease both}
@keyframes tw-rise{from{opacity:.001;transform:translateY(6px)}to{opacity:1;transform:none}}

/* Type */
h1{font-size:30px;line-height:1.18;margin:0 0 12px;max-width:32ch}
h2{font-size:17px;margin:36px 0 12px;font-weight:650;letter-spacing:-.012em}
h3{font-size:14.5px;margin:0 0 8px;font-weight:650;letter-spacing:-.01em}
.lede{color:var(--ink-soft);font-size:15.5px;line-height:1.6;max-width:68ch;margin:0 0 24px}
.lede.small{font-size:13.5px;margin-bottom:14px}
.muted{color:var(--ink-soft)} .small{font-size:13px}
p{margin:0 0 10px}

/* How it works */
.guide{max-width:70ch}
.guide h2{margin:34px 0 8px;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px}
.guide p,.guide li{line-height:1.65}
.guide ul{padding-left:20px;margin:6px 0 10px}
.guide li{margin-bottom:4px}
.guide .page{font-weight:500;color:var(--ink-soft);font-size:13.5px;letter-spacing:0}
.guide .oneline{background:var(--accent-soft);color:var(--ink);border-radius:var(--radius-lg);padding:16px 18px;margin:20px 0 8px;line-height:1.6}
.guide .oneline b{color:var(--accent)}

/* Layout helpers */
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.grid2>*{min-width:0}

/* KPI tiles */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:28px 0 8px}
.stats div{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-xl);padding:18px 20px;box-shadow:var(--shadow-card);display:flex;flex-direction:column;gap:6px}
.stats b{display:block;font-size:28px;font-weight:650;letter-spacing:-.025em;line-height:1.1;color:var(--ink)}
.stats span{color:var(--ink-soft);font-size:13px;line-height:1.4}
.stats div:first-child b{color:var(--accent)}

/* Cards */
.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-xl);padding:20px 22px;box-shadow:var(--shadow-card);min-width:0}
.box h3{padding-bottom:10px;margin-bottom:12px;border-bottom:1px solid var(--line)}
.box .small{padding:3px 0}

/* Tables */
table{width:100%;border-collapse:separate;border-spacing:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);overflow:hidden}
th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:top;font-size:14px}
tr:last-child>td{border-bottom:0}
th{white-space:nowrap;font-weight:600;color:var(--ink-soft);font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;background:var(--surface-alt);padding-block:9px}
tr.click{cursor:pointer;transition:background .15s}
tr.click:hover{background:var(--surface-alt)}
tr.click:hover td:first-child{color:var(--accent)}

/* Status pills */
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;border-radius:var(--radius-pill);padding:2px 10px;background:var(--surface-alt);color:var(--ink-soft);white-space:nowrap;line-height:1.6}
.tag[class*="t-"]::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.tag.t-x::before{display:none}
.t-proposed,.t-pending,.t-medium{background:var(--warning-soft);color:var(--warning)}
.t-active,.t-emerging,.t-approved,.t-low{background:var(--accent-soft);color:var(--accent)}
.t-deprecated,.t-declining,.t-rejected,.t-high,.t-merged{background:var(--error-soft);color:var(--error)}
.t-auto_applied{background:var(--info-soft);color:var(--info)}

/* Proposals */
.prop{border:1px solid var(--line);border-radius:var(--radius-lg);background:var(--surface);padding:18px 20px;margin-bottom:12px;box-shadow:var(--shadow-sm);transition:box-shadow .2s}
.prop:hover{box-shadow:var(--shadow-card)}
.prop .what{font-weight:500;font-size:15px;letter-spacing:-.01em;margin:10px 0 4px}
.prop .what b{font-weight:650}
.prop .why{color:var(--ink-soft);font-size:14px;max-width:90ch;line-height:1.55}
.prop .why .tag{margin:2px 0}

/* Coverage bar */
.bar{height:6px;background:var(--surface-alt);border-radius:var(--radius-pill);overflow:hidden;min-width:80px;margin-top:7px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:var(--radius-pill)}

/* Category tree */
.tree{font-size:14px;padding:12px}
.tree summary{cursor:pointer;padding:7px 8px;border-radius:var(--radius-sm);font-weight:600;font-size:13.5px}
.tree summary:hover{background:var(--surface-alt)}
.tree details details summary{font-weight:500;padding-left:18px}
.tree .leaf{display:flex;justify-content:space-between;gap:8px;padding:6px 8px 6px 22px;border-radius:var(--radius-sm);cursor:pointer;color:var(--ink);transition:background .15s}
.tree .leaf:hover{background:var(--surface-alt)}
.tree .leaf.sel{background:var(--accent-soft);color:var(--accent);font-weight:600}
.tree .leaf.sel .muted{color:var(--accent)}

/* Detail drawer */
.panel{position:fixed;top:0;right:0;width:min(540px,100vw);height:100vh;overflow:auto;background:var(--surface);border-left:1px solid var(--line);padding:calc(env(safe-area-inset-top,0px) + 28px) 28px calc(env(safe-area-inset-bottom,0px) + 32px);box-shadow:var(--shadow-lift);transform:translateX(105%);transition:transform .25s cubic-bezier(.2,.8,.2,1);z-index:40;visibility:hidden}
.panel.open{transform:none;visibility:visible}
.panel .close{position:absolute;top:calc(env(safe-area-inset-top,0px) + 16px);right:16px;min-height:34px;padding:6px 12px;font-size:13px;border:none;box-shadow:none;background:transparent;color:var(--ink-soft)}
.panel .close:hover:not(:disabled){background:var(--surface-alt);color:var(--ink)}
.panel > div > h2:first-child,.md h2{margin-top:0;font-size:22px;padding-right:70px}
.panel table{box-shadow:none;margin:8px 0}
.md p{line-height:1.6}
.md table{margin:10px 0}
.md i{color:var(--ink-soft)}

/* Run log timeline */
.runlog{list-style:none;margin:18px 0 22px 6px;padding:0 0 0 20px;border-left:2px solid var(--line);display:grid;gap:18px}
.runlog li{position:relative;font-size:14px;line-height:1.6}
.runlog li::before{content:"";position:absolute;left:-28px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--accent)}
.runlog h3{font-size:14px;margin:0 0 3px}
.runlog ul{margin:6px 0 0;padding-left:18px}

/* Extraction highlights, code, toast */
#raw-data{margin-top:12px;max-height:none}
mark{background:var(--accent-soft);color:var(--accent);border-radius:4px;padding:0 3px;font-weight:600}
mark.cand{background:var(--warning-soft);color:var(--warning)}
pre{background:var(--surface-alt);border:1px solid var(--line);border-radius:var(--radius-md);padding:12px 14px;overflow:auto;font-size:12.5px;max-height:360px}
.spark{vertical-align:middle}
.toast{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);left:50%;transform:translate(-50%,8px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:var(--radius-md);font-size:14px;font-weight:500;box-shadow:var(--shadow-lift);opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:50;max-width:calc(100vw - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.hidden{display:none}

.demo-note{margin:0 4px 18px;padding:10px 12px;border-radius:var(--radius-md);background:var(--warning-soft);color:var(--ink);font-size:12.5px;line-height:1.45}
.demo-note b{color:var(--warning);font-weight:600}
.demo-note button{margin-top:8px;padding:3px 10px;min-height:30px;font-size:12.5px}

/* Tablet */
@media (max-width:1040px){
  main{padding:40px 28px 56px}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
}
/* Phone */
@media (max-width:800px){
  .app{grid-template-columns:minmax(0,1fr)}
  nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;height:auto;padding:10px 0 0;border-right:0;border-bottom:1px solid var(--line);box-shadow:var(--shadow-sm)}
  .nav-head{padding:0 12px 0 16px;margin-bottom:4px}
  nav .sub,nav .foot{display:none}
  .nav-list{flex-direction:row;overflow-x:auto;gap:4px;padding:6px 16px 10px;scrollbar-width:none;scroll-snap-type:x proximity}
  .nav-list::-webkit-scrollbar{display:none}
  .nav-list button{width:auto;flex:none;white-space:nowrap;min-height:40px;padding:8px 14px;border-radius:var(--radius-pill);scroll-snap-align:start}
  main{padding:24px 16px 40px}
  h1{font-size:24px}
  .lede{font-size:15px}
  .grid2{grid-template-columns:1fr!important}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .stats div{padding:14px 16px}
  .stats b{font-size:24px}
  table{display:block;overflow-x:auto;max-width:100%}
  main td{min-width:96px}
  main td.small{min-width:150px}
  input,textarea,select{font-size:16px;min-height:48px}
  button{min-height:44px}
  .row > input{max-width:none!important}
  .prop{padding:16px 14px}
  .prop .row button{flex:1 1 auto}
  .panel{padding-inline:18px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>

<script>
// In-browser stand-in for the SkillGraph API. It serves a snapshot of the real
// service (seeded data + one recorded agent cycle) and re-implements the
// interactive parts (governance decisions, extraction, resolution, matching,
// releases, subscriptions) so the console runs with no server.
const clone = o => JSON.parse(JSON.stringify(o));
let S, seq, cycleStage;
function resetDemo(){ S = clone(SNAP.state); seq = S.head_seq; cycleStage = 0; }
resetDemo();

const nowIso = () => new Date().toISOString().slice(0, 19) + "+00:00";
const uid = p => p + "_" + Math.random().toString(16).slice(2, 12);

// ---------------------------------------------------------------- text utils
function norm(t){
  return String(t).toLowerCase().trim().replace(/[‐-―]/g, "-")
    .replace(/(?<=[a-z0-9])[./\-_](?=[a-z0-9])/g, " ").replace(/[^a-z0-9+# ]/g, " ").replace(/\s+/g, " ").trim();
}
function grams(s){ const t = " " + norm(s) + " "; const g = new Set(); for (let i = 0; i < t.length - 2; i++) g.add(t.slice(i, i + 3)); return g; }
function sim(a, b){ const A = grams(a), B = grams(b); let n = 0; A.forEach(x => B.has(x) && n++); return n / Math.max(1, A.size + B.size - n); }
const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
const sentences = text => text.split(/(?<=[.!?\n])\s+|\n+/).map(s => s.trim()).filter(Boolean);
function contextFor(text, surface){ const l = surface.toLowerCase(); return (sentences(text).find(s => s.toLowerCase().includes(l)) || "").slice(0, 280); }

const skillById = id => S.skills.find(s => s.id === id);
const live = () => S.skills.filter(s => s.status === "active" || s.status === "proposed");
function canonical(id){ let s = skillById(id), n = 0; while (s && s.status === "merged" && s.merged_into && n++ < 10) s = skillById(s.merged_into); return s ? s.id : id; }
function lexicon(){
  const lex = new Map(), labels = [];
  for (const s of live()) for (const l of [s.name, ...s.aliases]){ const k = norm(l); if (!k) continue; if (!lex.has(k)) lex.set(k, s.id); labels.push([l, s.id]); }
  return {lex, labels};
}
function nearest(term, k = 3){
  const best = new Map();
  for (const [label, id] of lexicon().labels){ const sc = sim(term, label); if (!best.has(id) || sc > best.get(id)[1]) best.set(id, [label, sc]); }
  return [...best.entries()].sort((a, b) => b[1][1] - a[1][1]).slice(0, k).map(([id, [label, sc]]) => ({id, label, score: Math.round(sc * 1000) / 1000}));
}

// ------------------------------------------------------- resolve & extract
const VENDORS = new Set(["microsoft","ms","amazon","google","apache","aws","azure","ibm","oracle","hashicorp"]);
function resolveTerm(term){
  const {lex} = lexicon(); let id = lex.get(norm(term));
  const out = (id, conf, method) => { const s = skillById(canonical(id)); return {term, skill_id: s.id, name: s.name, status: s.status, confidence: conf, method}; };
  if (id) return out(id, 1.0, "lexicon");
  const parts = norm(term).split(" ");
  if (parts.length > 1 && VENDORS.has(parts[0]) && (id = lex.get(parts.slice(1).join(" ")))) return out(id, 0.9, "lexicon-vendor");
  return {term, skill_id: null, confidence: 0, method: "unresolved", suggestions: nearest(term).map(n => ({skill_id: n.id, name: skillById(n.id).name, score: n.score}))};
}

const CUES = ["experience with","experience in","proficiency in","proficient in","proficient with","knowledge of","familiarity with","familiar with",
  "expertise in","skilled in","hands-on with","background in","fluency in","understanding of","nice to have:","tech stack:","stack:","covers",
  "built with","adopted","introduced","migrated to","skills:","requirements:","deep dive into","practice in"];
const CUE_RE = new RegExp("\\b(" + CUES.map(reEsc).join("|") + ")\\s*", "gi");
const CUE_START = new RegExp("^(" + CUES.map(reEsc).join("|") + ")\\s*", "i");
const JUNK = new Set(["a","the","similar","etc","others","related tools","modern tooling","teams","it","production","the team","large scale","best practices","tools","our stack"]);
function mentionCandidates(text){
  const out = new Map();
  for (const sent of sentences(text)){
    for (const m of sent.matchAll(CUE_RE)){
      let tail = sent.slice(m.index + m[0].length);
      tail = tail.split(/[.!?:]\s|\(|\bto\b|\bfor\b|\bthat\b|\bwhich\b|\bacross\b|\bwhile\b/)[0];
      for (let item of tail.split(/\s*(?:,|;|\band\b|\bor\b|\bplus\b|\bas well as\b)\s*/i)){
        item = item.trim().replace(CUE_START, "");
        item = item.replace(/^[\s\-*•]+|[\s\-*•]+$/g, "").replace(/^(the|modern|strong|solid|deep|good|some|using|with)\s+/i, "");
        item = item.replace(/\s+(frameworks?|tooling|tools|platforms?|concepts|principles)$/i, "").replace(/^[\s.;:]+|[\s.;:]+$/g, "");
        const n = norm(item);
        if (!n || JUNK.has(n) || n.length < 2 || n.split(" ").length > 5) continue;
        if (["a","an","we","you","our","your","their","this"].includes(n.split(" ")[0])) continue;
        if (!out.has(n)) out.set(n, {surface: item, context: sent.slice(0, 280), confidence: 0.62});
      }
    }
  }
  return [...out.values()];
}
function extract(text){
  const {lex, labels} = lexicon(); const found = new Map();
  const add = (id, surface, conf, method, ctx) => {
    id = canonical(id); const s = skillById(id); if (!s) return; const cur = found.get(id);
    if (!cur || conf > cur.confidence) found.set(id, {skill_id: id, name: s.name, status: s.status, surface, confidence: conf, method, context: ctx || cur?.context || ""});
  };
  const longs = [...lex.keys()].filter(k => k.replace(/ /g, "").length > 3).sort((a, b) => b.length - a.length);
  const ntext = norm(text);
  if (longs.length){
    const re = new RegExp("(?<![a-z0-9+#])(" + longs.map(reEsc).join("|") + ")(?![a-z0-9+#])", "g");
    for (const m of ntext.matchAll(re)){
      const id = lex.get(m[1]); const label = (labels.find(([l, i]) => i === id && norm(l) === m[1]) || [m[1]])[0];
      const exact = norm(skillById(id).name) === m[1];
      add(id, label, exact ? 0.95 : 0.9, exact ? "exact" : "alias", contextFor(text, label));
    }
  }
  for (const [label, id] of labels){
    if (norm(label).replace(/ /g, "").length > 3) continue;
    if (new RegExp("(?<![\\w.+#])" + reEsc(label) + "(?![\\w+#])").test(text)) add(id, label, 0.85, "alias", contextFor(text, label));
  }
  const candidates = new Map();
  for (const m of mentionCandidates(text)){
    const key = norm(m.surface); const id = lex.get(key);
    if (id){ add(id, m.surface, Math.max(0.85, m.confidence), "llm-exact", m.context); continue; }
    if ([...found.values()].some(f => norm(f.surface).includes(key) || key.includes(norm(f.surface)))) continue;
    const near = nearest(m.surface, 1)[0];
    if (!candidates.has(key)) candidates.set(key, {surface: m.surface, normalized: key, context: m.context, confidence: m.confidence,
      nearest: near ? {skill_id: near.id, label: near.label, score: near.score} : null});
  }
  return {matches: [...found.values()].sort((a, b) => b.confidence - a.confidence), candidates: [...candidates.values()], llm_provider: "heuristic"};
}

// ------------------------------------------------------------ fit & search
function personFit(have, requires){
  let met = [], partial = [], missing = [], score = 0, tot = 0;
  for (const r of requires){
    tot += r.weight ?? 1; const lv = have[r.skill_id]; const name = skillById(r.skill_id)?.name ?? r.skill_id;
    if (lv >= r.level){ met.push(name); score += r.weight ?? 1; }
    else if (lv){ partial.push({skill: name, have: lv, need: r.level}); score += (r.weight ?? 1) * lv / r.level; }
    else missing.push({skill: name, need: r.level});
  }
  return {fit: tot ? Math.round(score / tot * 1000) / 1000 : 0, met, partial, missing};
}
function search(q, limit){
  const nq = norm(q);
  return live().map(s => {
    let sc = Math.max(...[s.name, ...s.aliases].map(l => sim(q, l))) * 0.8;
    if (norm(s.name).includes(nq)) sc += 1; else if (s.aliases.some(a => norm(a).includes(nq))) sc += 0.9;
    if (nq.split(" ").every(w => w.length > 2 && norm(s.description).includes(w))) sc += 0.25;
    return {...s, score: Math.round(sc * 1000) / 1000};
  }).filter(s => s.score > 0.2).sort((a, b) => b.score - a.score).slice(0, limit);
}

// --------------------------------------------------------------- mutation
function emit(type, obj, actor, pid){
  seq++;
  const ev = {seq, ts: nowIso(), type, kind: type.split(".")[0], entity_id: obj.id, actor, proposal_id: pid, after: {name: obj.name, title: obj.title}};
  S.events.push(ev);
  for (const sub of S.subs){
    if (sub.event_types.some(p => new RegExp("^" + p.split("*").map(reEsc).join(".*") + "$").test(type)))
      S.outbox.unshift({id: uid("dl"), subscription_id: sub.id, event_seq: seq, status: "pending", created_at: ev.ts,
        payload: {event: type, seq, entity: {kind: ev.kind, id: obj.id}, actor, proposal_id: pid, data: obj}});
  }
}
function touch(s){ s.version = (s.version || 1) + 1; s.updated_at = nowIso(); }
function applyProposal(p, actor){
  const pl = p.payload;
  if (p.type === "add_skill"){ const s = skillById(pl.skill.id); s.status = "active"; touch(s); emit("skill.activated", s, actor, p.id); }
  else if (p.type === "add_alias"){ const s = skillById(pl.skill_id); if (!s.aliases.some(a => norm(a) === norm(pl.alias))){ s.aliases.push(pl.alias); touch(s); emit("skill.alias_added", s, actor, p.id); } }
  else if (p.type === "update_description"){ const s = skillById(pl.skill_id); s.description = pl.description; if (pl.kind) s.kind = pl.kind; touch(s); emit("skill.described", s, actor, p.id); }
  else if (p.type === "add_relation"){ const a = skillById(pl.skill_id), b = skillById(pl.related_id); for (const [x, y] of [[a, b], [b, a]]) if (!x.related.includes(y.id)){ x.related.push(y.id); emit("skill.related", x, actor, p.id); } }
  else if (p.type === "recategorize"){ const s = skillById(pl.skill_id); s.category_id = pl.to_category_id; touch(s); emit("skill.recategorized", s, actor, p.id); }
  else if (p.type === "deprecate"){ const s = skillById(pl.skill_id); s.status = "deprecated"; if (pl.replacement_id) s.related = [...new Set([pl.replacement_id, ...s.related])]; touch(s); emit("skill.deprecated", s, actor, p.id); }
  else if (p.type === "new_category"){
    const c = {...pl.category, created_at: nowIso(), updated_at: nowIso()}; S.categories.push(c); emit("category.created", c, actor, p.id);
    for (const id of pl.move_skill_ids){ const s = skillById(id); if (s){ s.category_id = c.id; emit("skill.recategorized", s, actor, p.id); } }
  }
  else if (p.type === "merge"){
    const src = skillById(pl.source_id), tgt = skillById(pl.target_id);
    for (const a of [src.name, ...src.aliases]) if (![tgt.name, ...tgt.aliases].some(x => norm(x) === norm(a))) tgt.aliases.push(a);
    tgt.related = [...new Set([...tgt.related, ...src.related])].filter(r => r !== src.id && r !== tgt.id);
    touch(tgt); src.status = "merged"; src.merged_into = tgt.id;
    emit("skill.merged_into", tgt, actor, p.id); emit("skill.merged", src, actor, p.id);
    for (const [kind, list] of [["capability", S.capabilities], ["role", S.roles]]) for (const o of list){
      if (!o.requires.some(r => r.skill_id === src.id)) continue;
      const m = new Map();
      for (const r of o.requires){ if (r.skill_id === src.id) r.skill_id = tgt.id; const prev = m.get(r.skill_id); if (!prev || r.level > prev.level) m.set(r.skill_id, r); }
      o.requires = [...m.values()]; emit(kind + ".remapped", o, actor, p.id);
    }
    for (const o of S.skills) if (o.related.includes(src.id) && o.id !== tgt.id) o.related = [...new Set(o.related.map(r => r === src.id ? tgt.id : r))].filter(r => r !== o.id);
  }
}
function decide(id, approve, body){
  const p = S.proposals.find(x => x.id === id);
  if (!p) return [404, {detail: "proposal not found"}];
  if (p.status !== "pending") return [409, {detail: `proposal is already ${p.status}`}];
  const reviewer = body?.reviewer || "steward";
  if (approve){ applyProposal(p, "human:" + reviewer); p.status = "approved"; }
  else {
    if (p.type === "add_skill"){ const s = skillById(p.payload.skill.id); if (s?.status === "proposed"){ s.status = "deprecated"; s.source = "rejected-proposal"; emit("skill.rejected", s, "human:" + reviewer, p.id); } }
    p.status = "rejected";
  }
  Object.assign(p, {decided_by: reviewer, decided_at: nowIso(), decision_note: body?.note || ""});
  return [200, p];
}
function runCycle(){
  const sc = SNAP.scenario;
  if (cycleStage === 0){
    const shift = seq - (sc.events[0]?.seq ?? seq + 1) + 1;
    S.skills.push(...clone(sc.skills)); S.proposals.unshift(...clone(sc.proposals));
    S.runs.unshift(...clone(sc.runs)); Object.assign(S.run_details, clone(sc.run_details));
    for (const e of clone(sc.events)){ e.seq += shift; seq = e.seq; S.events.push(e); }
    S.drift = clone(sc.drift); S.gaps = clone(sc.gaps); S.holders = clone(sc.holders); S.evidence_count += sc.documents.length;
    cycleStage = 1; return S.run_details[sc.cycle_id];
  }
  const idRun = uid("run"), map = {};
  for (const r of clone(sc.idle_runs)){ map[r.id] = uid("run"); }
  for (const r of clone(sc.idle_runs)){ const d = clone(sc.idle_details[r.id]); r.id = d.id = map[r.id]; r.started_at = d.started_at = nowIso(); S.run_details[r.id] = d; S.runs.unshift(r); }
  cycleStage++; return S.run_details[map[sc.idle_id]] || {status: "succeeded", stats: {actions: []}, id: idRun};
}

// ------------------------------------------------------------- read models
function catPath(id){ const parts = []; let c = S.categories.find(x => x.id === id); while (c){ parts.unshift(c.name); c = S.categories.find(x => x.id === c.parent_id); } return parts.join(" > "); }
function skillPack(id){
  id = canonical(id); const s = skillById(id); if (!s) return null;
  const req = [];
  for (const [kind, list] of [["capability", S.capabilities], ["role", S.roles]]) for (const o of list) for (const r of o.requires) if (r.skill_id === id) req.push(`${o.name || o.title} (${kind}, L${r.level})`);
  const tr = S.drift.demand.find(d => d.skill_id === id); const h = S.holders[id] || [0, 0];
  const md = [`## Skill: ${s.name}`, `*${catPath(s.category_id)}* · ${s.kind} · status: ${s.status}`, "", s.description || "_No definition yet._"];
  if (s.aliases.length) md.push(`\n**Also known as:** ${s.aliases.join(", ")}`);
  const rel = s.related.map(r => skillById(r)?.name).filter(Boolean); if (rel.length) md.push(`**Related:** ${rel.join(", ")}`);
  if (req.length) md.push(`**Required by:** ${req.join("; ")}`);
  if (tr) md.push(`**Demand:** ${tr.trend} (${Math.round(tr.baseline_share * 100)}% → ${Math.round(tr.recent_share * 100)}% of job postings)`);
  md.push(`**Internal supply:** ${h[0]} people, ${h[1]} at L3+`);
  return md.join("\n");
}
function categoriesTree(){
  const counts = {}; for (const s of live()) counts[s.category_id] = (counts[s.category_id] || 0) + 1;
  const node = c => ({...c, skills: counts[c.id] || 0, children: S.categories.filter(x => x.parent_id === c.id).map(node)});
  return S.categories.filter(c => !c.parent_id).map(node);
}
function snapshotNow(){ return {skill: clone(S.skills), category: clone(S.categories), capability: clone(S.capabilities), role: clone(S.roles)}; }
function diffSnap(A, B){
  const out = {}, summary = {};
  for (const kind of ["skill", "category", "capability", "role"]){
    const a = Object.fromEntries((A[kind] || []).map(x => [x.id, x])), b = Object.fromEntries((B[kind] || []).map(x => [x.id, x]));
    const added = Object.keys(b).filter(k => !a[k]), removed = Object.keys(a).filter(k => !b[k]);
    const changed = Object.keys(b).filter(k => a[k] && Object.keys({...a[k], ...b[k]}).some(f => !["updated_at", "version"].includes(f) && JSON.stringify(a[k][f]) !== JSON.stringify(b[k][f])));
    out[kind] = {added: added.map(k => b[k]), removed: removed.map(k => a[k]), changed: changed.map(k => ({id: k, name: b[k].name || b[k].title}))};
    summary[kind] = {added: added.length, removed: removed.length, changed: changed.length};
  }
  return {summary, changes: out};
}

// ------------------------------------------------------------------- router
function route(method, url, body){
  const p = url.pathname, q = url.searchParams;
  let m;
  if (p === "/v1/meta"){
    const rel = S.releases.at(-1);
    return {llm_provider: "heuristic", llm_model: null, counts: {skill: S.skills.length, evidence: S.evidence_count, proposal: S.proposals.length, run: S.runs.length},
      active_skills: S.skills.filter(s => s.status === "active").length, proposed_skills: S.skills.filter(s => s.status === "proposed").length,
      pending_proposals: S.proposals.filter(x => x.status === "pending").length, release: rel.tag, head_seq: seq, unreleased_changes: seq - rel.seq};
  }
  if (p === "/v1/skills"){
    const limit = +(q.get("limit") || 200), cat = q.get("category"), st = q.get("status");
    let hits = q.get("q") ? search(q.get("q"), limit) : clone(S.skills);
    const cats = cat ? new Set([cat, ...S.categories.filter(c => c.parent_id === cat).map(c => c.id)]) : null;
    return hits.filter(h => (!st || h.status === st) && (!cats || cats.has(h.category_id))).slice(0, limit);
  }
  if ((m = p.match(/^\/v1\/skills\/([^/]+)$/))){
    const s = skillById(m[1]); if (!s) return [404, {detail: "skill not found"}];
    return {...s, history: S.events.filter(e => e.entity_id === m[1]).map(e => ({seq: e.seq, ts: e.ts, type: e.type, actor: e.actor, proposal_id: e.proposal_id}))};
  }
  if (p === "/v1/categories") return categoriesTree();
  if (p === "/v1/resolve" && method === "POST") return body.terms.map(resolveTerm);
  if (p === "/v1/extract" && method === "POST") return extract(body.text);
  if (p === "/v1/match/roles" && method === "POST"){
    const have = {};
    for (const s of body.skills){ const id = skillById(s.skill) ? canonical(s.skill) : resolveTerm(s.skill).skill_id; if (!id) return [422, {detail: `could not resolve skill '${s.skill}'`}]; have[id] = s.level; }
    return S.roles.map(r => ({...personFit(have, r.requires), role_id: r.id, title: r.title})).sort((a, b) => b.fit - a.fit).slice(0, body.top || 5);
  }
  if (p === "/v1/capabilities") return S.capabilities.map(c => ({...c, coverage: S.gaps.capabilities.find(x => x.capability_id === c.id)?.coverage ?? 0}));
  if (p === "/v1/roles") return clone(S.roles);
  if ((m = p.match(/^\/v1\/context\/(\w+)\/([^/]+)$/))){
    const md = m[1] === "skill" ? skillPack(m[2]) : S.packs[`${m[1]}:${m[2]}`];
    if (!md) return [404, {detail: `${m[1]} not found`}];
    return {kind: m[1], id: m[2], release: S.releases.at(-1).tag, head_seq: seq, markdown: md};
  }
  if (p === "/v1/proposals"){
    const st = q.get("status") || "pending", ty = q.get("type");
    return S.proposals.filter(x => (st === "all" || x.status === st) && (!ty || x.type === ty));
  }
  if ((m = p.match(/^\/v1\/proposals\/([^/]+)\/(approve|reject)$/))) return decide(m[1], m[2] === "approve", body);
  if (p === "/v1/runs") return S.runs.slice(0, +(q.get("limit") || 20));
  if ((m = p.match(/^\/v1\/runs\/([^/]+)$/))) return S.run_details[m[1]] || [404, {detail: "run not found"}];
  if (p === "/v1/pipelines/cycle/run") return runCycle();
  if (p === "/v1/insights/drift") return S.drift;
  if (p === "/v1/insights/gaps") return S.gaps;
  if (p === "/v1/releases" && method === "POST"){
    const tag = (body.tag || "").trim(); if (!tag) return [422, {detail: "Enter a release tag, such as v1.1."}];
    if (S.releases.some(r => r.tag === tag)) return [409, {detail: `release '${tag}' already exists`}];
    S.releases.push({tag, seq, notes: body.notes || "", created_at: nowIso(), snapshot: snapshotNow()}); return {tag, seq, notes: body.notes};
  }
  if (p === "/v1/releases") return S.releases.map(r => ({tag: r.tag, seq: r.seq, notes: r.notes, created_at: r.created_at,
    counts: Object.fromEntries(Object.entries(r.snapshot).map(([k, v]) => [k, v.length]))}));
  if (p === "/v1/releases/diff"){
    const a = S.releases.find(r => r.tag === q.get("from")); if (!a) return [404, {detail: "unknown release"}];
    const to = q.get("to") || "HEAD"; const b = to === "HEAD" ? snapshotNow() : S.releases.find(r => r.tag === to)?.snapshot;
    return {from: a.tag, to, ...diffSnap(a.snapshot, b)};
  }
  if (p === "/v1/events"){ const since = +(q.get("since") || 0); return S.events.filter(e => e.seq > since).slice(0, +(q.get("limit") || 200)); }
  if (p === "/v1/subscriptions" && method === "POST"){ const s = {id: uid("sub"), ...body, created_at: nowIso()}; S.subs.push(s); return s; }
  if (p === "/v1/subscriptions") return S.subs;
  if (p === "/v1/outbox") return S.outbox.slice(0, +(q.get("limit") || 100));
  return [404, {detail: `${p} is not part of this demo`}];
}

window.fetch = async (path, opts = {}) => {
  const url = new URL(path, "https://demo.skillgraph");
  const method = (opts.method || "GET").toUpperCase();
  let res = route(method, url, opts.body ? JSON.parse(opts.body) : null);
  let status = 200;
  if (Array.isArray(res) && res.length === 2 && typeof res[0] === "number"){ [status, res] = res; }
  await new Promise(r => setTimeout(r, method === "POST" && url.pathname.includes("pipelines") ? 650 : 40));
  return new Response(JSON.stringify(clone(res)), {status, headers: {"content-type": "application/json"}});
};

let SKILLS = {}, CATS = {};
async function loadRefs(){
  (await api("/v1/skills")).forEach(s => SKILLS[s.id] = s);
  const walk = n => { CATS[n.id] = n; n.children.forEach(walk); };

}
const sname = id => SKILLS[id]?.name ?? id;
const cname = id => CATS[id]?.name ?? id ?? "–";

function md(text){
  const lines = text.split("\n"); let out = "", inTable = false;
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/\*(.+?)\*/g,"<i>$1</i>").replace(/_(.+?)_/g,"<i>$1</i>");
  for (const l of lines){
    if (l.startsWith("|")){
      if (/^\|[-| ]+\|$/.test(l)) continue;
      const cells = l.split("|").slice(1,-1).map(c=>inline(c.trim()));
      out += (inTable ? "" : "<table>") + "<tr>" + cells.map(c=>`<td>${c}</td>`).join("") + "</tr>"; inTable = true; continue;
    }
    if (inTable){ out += "</table>"; inTable = false; }
    if (l.startsWith("## ")) out += `<h2>${inline(l.slice(3))}</h2>`;
    else if (l.trim()) out += `<p>${inline(l)}</p>`;
  }
  return `<div class="md">${out}${inTable ? "</table>" : ""}</div>`;
}

function spark(vals){
  if (!vals?.length) return "";
  const w=90,h=22,m=Math.max(...vals,0.001);
  const pts = vals.map((v,i)=>`${(i/(vals.length-1||1))*w},${h-2-(v/m)*(h-4)}`).join(" ");
  return `<svg class="spark" width="${w}" height="${h}" aria-hidden="true"><polyline fill="none" stroke="currentColor" stroke-width="1.5" points="${pts}"/></svg>`;
}

function describeProposal(p){
  const pl = p.payload;
  switch (p.type){
    case "add_skill": return `Add skill <b>${esc(pl.skill.name)}</b> to ${esc(cname(pl.skill.category_id))}` + (pl.skill.aliases?.length ? ` <span class="muted">(aka ${esc(pl.skill.aliases.join(", "))})</span>` : "");
    case "add_alias": return `Add alias <b>${esc(pl.alias)}</b> to ${esc(sname(pl.skill_id))}`;
    case "merge": return `Merge <b>${esc(sname(pl.source_id))}</b> into <b>${esc(sname(pl.target_id))}</b>`;
    case "recategorize": return `Move <b>${esc(sname(pl.skill_id))}</b> from ${esc(cname(pl.from_category_id))} to ${esc(cname(pl.to_category_id))}`;

}

      const sug = only([[st.new_skill_proposals, "new skill"], [st.alias_proposals, "nickname"]], "");
      return `Read ${num(st.documents, "document")} and recognised ${num(st.mentions_resolved, "skill mention")}. `
        + (sug ? `Suggested ${sug}.` : "Nothing new to suggest.") + (st.inferred_holdings ? ` Linked ${num(st.inferred_holdings, "skill")} to people.` : "");
    }
    case "enrich": { const x = only([[st.definitions, "definition"], [st.relations, "link between related skills", "links between related skills"]], "");
      return x ? `Added ${x}.` : "Nothing needed filling in."; }
    case "curate": { const x = only([[st.merges, "merge"], [st.recategorisations, "folder move"], [st.new_categories, "new folder"]], "");
      return x ? `Suggested ${x}.` : "The list looked tidy; no changes suggested."; }
    case "detect": { const x = only([[st.deprecations, "retirement"], [st.redefinitions, "definition update"]], "");
      return `Found ${num(st.emerging, "skill")} rising and ${st.declining ?? 0} falling in demand. Business needs are ${pct(st.gap_weighted_capability_coverage)} covered. `
        + (x ? `Suggested ${x}.` : "No new retirements or definition updates were needed."); }
  }
  return "";
}

function stepSentence(s, run){
  const o = s.observations || {}, P = o.proposals || [];
  if (s.name.startsWith("plan#")){
    const st = o.state || {};
    const seen = `Looked at the current state: ${num(st.unprocessed_evidence, "new document")} to read, ${num(st.skills_missing_description, "skill")} without a definition, and ${num(st.pending_proposals, "suggestion")} already waiting for review.`;
    if (!o.plan?.length) return `${seen} Nothing needed doing, so it stopped here.`;
    const why = r => { r = String(r || "").trim().replace(/\.$/, ""); return r ? r[0].toUpperCase() + r.slice(1) + "." : ""; };
    return `${seen} It decided to:<ul>${o.plan.map(p => `<li><b>${esc(JOB[p.action] || p.action)}.</b> ${esc(why(p.reason))}</li>`).join("")}</ul>`;
  }
  if (JOB[s.name] && o.run_id){
    const failed = o.status && o.status !== "succeeded";
    return `${failed ? "<b>This job failed.</b> " : ""}${esc(jobSummary(s.name, o))} <button class="link" data-run="${esc(o.run_id)}">See this job's steps</button>`;
  }
  switch (s.name){
    case "observe": return o.documents ? `Found ${num(o.documents, "new document")} to read.` : "There were no new documents to read.";
    case "extract": return `Read them using ${providerName(o.provider)} and recognised ${num(o.mentions_resolved, "mention")} of skills already on the list.`;
    case "propose_taxonomy_changes": {
      const out = [];
      const ns = o.new_skill_proposals || [], al = o.alias_proposals || [], wl = o.watchlist || [];
      out.push(ns.length ? `Suggested ${num(ns.length, "new skill")}: ${esc(listOf(ns.map(n => `${n.name} (seen in ${n.support} documents)`)))}. These are waiting for review.`
                         : "Found no new skills to suggest.");
      if (al.length) out.push(`Matched ${num(al.length, "nickname")} to existing skills: ${esc(listOf(al.map(a => `“${a.alias}” is ${a.skill}`)))}${fates(al)}.`);
      if (wl.length) out.push(`Is keeping an eye on ${num(wl.length, "word")} seen too rarely to suggest yet: ${esc(listOf(wl.map(w => `${w.term} (${num(w.documents, "document")})`)))}.`);
      if (o.mentions_backfilled) out.push(`Re-checked older documents and matched ${num(o.mentions_backfilled, "more mention")}.`);
      return out.join(" ");
    }
    case "infer_people_skills": return o.new_inferred_holdings ? `Linked ${num(o.new_inferred_holdings, "skill")} to people, based on documents they wrote. These are marked as inferred so people can check them.` : "Didn't find any new skills to link to people.";
    case "define": return P.length ? `Drafted definitions for ${num(P.length, "skill")} that had none: ${esc(listOf(P.map(p => p.skill)))}${fates(P)}.` : "Every skill already has a definition.";
    case "relate": return P.length ? `Linked ${num(P.length, "pair")} of skills that often appear together: ${esc(listOf(P.map(p => `${p.a} and ${p.b}`), 4))}${fates(P)}.` : "Found no new links between skills.";
    case "deduplicate": return P.length ? `Compared ${num(o.pairs_considered, "likely pair")} and suggested ${num(P.length, "merge")}: ${esc(listOf(P.map(p => `${p.merge} into ${p.into}`)))}. These are waiting for review.`
                                        : `Compared ${num(o.pairs_considered, "likely pair")} and found no duplicates.`;
    case "placement": return P.length ? `Suggested moving ${num(P.length, "skill")}: ${esc(listOf(P.map(p => `${p.skill} from ${cname(p.from)} to ${cname(p.to)}`)))}. These are waiting for review.` : "Every skill looks like it's in the right folder.";
    case "structure": return P.length ? `${num(o.weakly_placed, "new skill")} didn't fit their folders well. Suggested ${P.map(p => `a new folder, “${esc(p.name)}”, for ${esc(listOf(p.skills))}`).join("; ")}.`
                                      : o.weakly_placed ? `${num(o.weakly_placed, "new skill")} didn't fit their folders well, but not enough to need a new folder.` : "No new folders are needed.";
    case "drift": return `${num(o.emerging, "skill is", "skills are")} rising in demand and ${num(o.declining, "is", "are")} falling. ${num(o.semantic_drift, "skill is", "skills are")} being used in a new way.` + (o.taxonomy_lag_terms ? ` ${num(o.taxonomy_lag_terms, "trending word")} isn't on the list yet.` : "");
    case "gaps": return `Business needs are ${pct(o.weighted_capability_coverage)} covered by current staff. There are ${num(o.shortfalls, "skill shortfall")}, ${num(o.bus_factor_risks, "important skill")} held by only one person, and ${num(o.emerging_skill_gaps, "rising skill")} with fewer than 3 experts.`;
    case "lifecycle": return P.length ? `Suggested retiring ${num(P.length, "skill")}: ${esc(listOf(P.map(p => p.skill + (p.replacement ? ` (replace with ${p.replacement})` : ""))))}. These are waiting for review.` : "No skills need retiring.";
    case "redefine": return P.length ? `Suggested updated definitions for ${num(P.length, "skill")} whose meaning has shifted: ${esc(listOf(P.map(p => p.skill)))}${fates(P)}.` : "No definitions need updating.";
    case "error": return "The job stopped before finishing. The raw data has the technical details.";
  }
  return esc(s.reason || s.name);
}

function triggerText(r){
  if (r.trigger === "bootstrap") return "Ran during first setup";
  if (r.trigger === "api") return "Started by someone pressing Run";
  if (r.trigger?.startsWith("cycle:")) return `Part of a <button class="link" data-run="${esc(r.trigger.slice(6))}">maintenance cycle</button>`;
  return esc(r.trigger);
}

  $("#main").innerHTML = `<p class="muted">Loading…</p>`;
  try { $("#main").innerHTML = await views[view](); } catch(e){ $("#main").innerHTML = `<p>Couldn't load this view: ${esc(e.message)}</p>`; }
  if (view === "taxonomy") renderSkillList();
  refreshMeta();
}
async function refreshMeta(){
  const m = await api("/v1/meta");
  $("#nav-pending").textContent = m.pending_proposals;
  $("#foot").innerHTML = `Release ${esc(m.release)} · ${esc(m.llm_provider)}<br>Offline snapshot`;
}

document.addEventListener("click", async e => {
  const t = e.target.closest("button, tr, .leaf"); if (!t) return;
  const d = t.dataset;
  if (t.id === "raw-toggle"){ const pre = document.getElementById("raw-data"); pre.hidden = !pre.hidden;
    t.setAttribute("aria-expanded", String(!pre.hidden)); t.textContent = pre.hidden ? "See raw data" : "Hide raw data"; return; }
  if (d.sample){ sample = d.sample; await show("playground"); for (const id of ["ex-run", "rs-run", "mt-run"]) document.getElementById(id)?.click(); return; }
  if (d.view) return show(d.view);
  if (d.goto) return show(d.goto);
  if (d.run) return showRun(d.run);
  if (d.skill) return showSkill(d.skill);
  if (d.cap) return showPack("capability", d.cap);
  if (d.role) return showPack("role", d.role);
  if (d.cat){ selCat = selCat === d.cat ? null : d.cat; document.querySelectorAll(".leaf").forEach(l => l.classList.toggle("sel", l.dataset.cat === selCat)); return renderSkillList(); }
  if (d.filter){ reviewFilter = d.filter; return show("review"); }
  if (d.approve || d.reject){
    t.disabled = true;
    try { await post(`/v1/proposals/${d.approve || d.reject}/${d.approve ? "approve" : "reject"}`, {reviewer:"steward"});
      await loadRefs(); toast(d.approve ? "Approved and applied" : "Rejected"); document.getElementById(d.approve || d.reject).remove(); refreshMeta();
    } catch(err){ toast(err.message); t.disabled = false; }
    return;
  }
  if (t.id === "demo-reset"){ resetDemo(); SKILLS = {}; CATS = {}; reviewFilter = "pending"; selCat = null; closePanel(); await loadRefs(); toast("Demo reset"); return show(current === "guide" ? "guide" : "overview"); }
  if (t.id === "run-cycle"){
    t.disabled = true; t.textContent = "Running…";
    const r = await post("/v1/pipelines/cycle/run"); await loadRefs();
    toast(r.status === "succeeded" ? ((r.stats.actions || []).length ? `Maintenance cycle finished: ${listOf(r.stats.actions.map(a => (JOB[a] || a).toLowerCase()))}` : "Maintenance cycle finished: nothing needed doing") : "Maintenance cycle failed. Open it below to see why."); return show("overview");
  }
  if (t.id === "ex-run"){
    const text = $("#ex-text").value; const r = await post("/v1/extract", {text});
    let html = esc(text);
    const marks = [...r.matches.map(m => [m.surface, "", `${m.name} · ${m.method}`]), ...r.candidates.map(c => [c.surface, "cand", "not in taxonomy"])]
      .sort((a,b) => b[0].length - a[0].length);
    for (const [s, cls, title] of marks){
      const re = new RegExp(`(?<![\\w>])(${esc(s).replace(/[.*+?^${}()|[\]\\]/g,"\\$&")})(?![\\w<])`, "i");
      html = html.replace(re, `<mark class="${cls}" title="${esc(title)}">$1</mark>`);
    }
    $("#ex-out").innerHTML = `<div class="box small">${html}</div><table style="margin-top:10px"><tr><th>Found</th><th>Skill</th><th>How</th><th>Confidence</th></tr>
      ${r.matches.map(m => `<tr><td>${esc(m.surface)}</td><td>${esc(m.name)} ${m.status !== "active" ? tag(m.status) : ""}</td><td class="small">${esc(m.method)}</td><td>${pct(m.confidence)}</td></tr>`).join("")}
      ${r.candidates.map(c => `<tr><td>${esc(c.surface)}</td><td class="muted">not in taxonomy${c.nearest && c.nearest.score >= 0.35 ? ` (nearest: ${esc(c.nearest.label)})` : ""}</td><td class="small">candidate</td><td>${pct(c.confidence)}</td></tr>`).join("")}</table>`;
  }
  if (t.id === "rs-run"){
    const terms = $("#rs-terms").value.split(",").map(s=>s.trim()).filter(Boolean);
    const r = await post("/v1/resolve", {terms});
    $("#rs-out").innerHTML = `<table><tr><th>Term</th><th>Canonical skill</th><th>How</th></tr>${r.map(x => `<tr><td>${esc(x.term)}</td>
      <td>${x.skill_id ? esc(x.name) + " " + (x.status !== "active" ? tag(x.status) : "") : `<span class="muted">unresolved${x.suggestions?.length ? "; closest " + esc(x.suggestions[0].name) : ""}</span>`}</td><td class="small">${esc(x.method)} ${x.confidence ? pct(x.confidence) : ""}</td></tr>`).join("")}</table>`;
  }
  if (t.id === "mt-run"){
    const skills = $("#mt-skills").value.split(",").map(s => s.trim()).filter(Boolean).map(s => { const [k, l] = s.split(":"); return {skill:k.trim(), level:+(l||3)}; });
    try { const r = await post("/v1/match/roles", {skills, top:4});
      $("#mt-out").innerHTML = `<table><tr><th>Role</th><th>Fit</th><th>Missing</th></tr>${r.map(x => `<tr><td>${esc(x.title)}</td><td>${pct(x.fit)}</td>
        <td class="small">${[...x.missing.map(m=>`${esc(m.skill)} L${m.need}`), ...x.partial.map(m=>`${esc(m.skill)} L${m.have}→${m.need}`)].join(", ")}</td></tr>`).join("")}</table>`;
    } catch(err){ $("#mt-out").innerHTML = `<p>${esc(err.message)}</p>`; }
  }
  if (t.id === "rel-make"){
    try { await post("/v1/releases", {tag: $("#rel-tag").value.trim(), notes: $("#rel-notes").value}); toast("Release cut"); show("changes"); }
    catch(err){ toast(err.message); }
  }
  if (t.id === "sub-make"){
    await post("/v1/subscriptions", {consumer: $("#sub-name").value || "demo-consumer", url: $("#sub-url").value || "https://example.internal/hook", event_types: $("#sub-types").value.split(",").map(s=>s.trim())});
    toast("Subscribed"); show("changes");
  }
});
document.addEventListener("input", e => { if (e.target.id === "skill-q"){ clearTimeout(window._q); window._q = setTimeout(renderSkillList, 180); } });

loadRefs().then(() => show("overview"));
</script>

<script>
/* Theme toggle (Talent Workspace) */
(function(){
  var ICON_SUN='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  var ICON_MOON='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
  function isDark(){ var t=document.documentElement.getAttribute('data-theme'); if(t) return t==='dark'; return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches; }
  function paint(){ var d=isDark(); document.querySelectorAll('.theme-toggle').forEach(function(b){ b.innerHTML=d?ICON_SUN:ICON_MOON; b.setAttribute('aria-label', d?'Switch to light mode':'Switch to dark mode'); b.title=b.getAttribute('aria-label'); b.removeAttribute('aria-current'); }); }
  document.querySelectorAll('.theme-toggle').forEach(function(b){ b.addEventListener('click', function(){ document.documentElement.setAttribute('data-theme', isDark()?'light':'dark'); paint(); }); });
  if(window.matchMedia){ try{ window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', paint); }catch(e){} }
  /* keep the current section tab in view on phones */
  new MutationObserver(function(){ var b=document.querySelector('.nav-list button[aria-current="page"]'); if(b && b.scrollIntoView) b.scrollIntoView({block:'nearest',inline:'nearest'}); paint(); })
    .observe(document.querySelector('.nav-list'), {attributes:true, subtree:true, attributeFilter:['aria-current']});
  paint();
})();
</script>
